dth="0.004858695652175259"/><circle data-type="circle" data-label="" data-x="1.4899999999987583" data-y="12.329999999999984" cx="177.89709172255624" cy="480.44742729307154" r="24.697986577174365" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004858695652175259"/><circle data-type="circle" data-label="" data-x="3.9899999999987585" data-y="12.829999999999984" cx="692.4384787470223" cy="377.5391498881786" r="24.697986577174365" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004858695652175259"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="12.829999999999984" cx="589.5302013421291" cy="377.5391498881786" r="24.697986577174365" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004858695652175259"/><circle data-type="circle" data-label="" data-x="2.9899999999987585" data-y="12.829999999999984" cx="486.6219239372358" cy="377.5391498881786" r="24.697986577174365" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004858695652175259"/><text data-type="text" data-label="iCE/Pi BALL_A5: 0/1 accepted" data-x="1" data-y="13.899999999999999" x="77.04697986601644" y="157.315436241704" fill="#0f172a" font-size="37.04697986576155" font-family="sans-serif" text-anchor="start" dominant-baseline="central">iCE/Pi BALL_A5: 0/1 accepted</text><text data-type="text" data-label="Default direction: left; target touches bottom boundary" data-x="1" data-y="13.6" x="77.04697986601644" y="219.06040268463994" fill="#475569" font-size="26.756152125272234" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Default direction: left; target touches bottom boundary</text><text data-type="text" data-label="No accepted route" data-x="1" data-y="13.35" x="77.04697986601644" y="270.5145413870864" fill="#475569" font-size="26.756152125272234" font-family="sans-serif" text-anchor="start" dominant-baseline="central">No accepted route</text><g><circle data-type="point" data-label="breakout:pcb_breakout_point_0
