top" data-x="2.489999999998758" data-y="11.329999999999984" cx="383.7136465323425" cy="686.2639821028579" r="3" fill="hsl(0, 100%, 50%)"/></g><g><circle data-type="point" data-label="breakout:pcb_breakout_point_0
