name: Audit boundary policy applicability to frozen inputs
on:
  push:
    branches: [codex/ddr2427-frozen-policy-audit]
permissions:
  contents: read
  actions: read
jobs:
  policy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 3b3511a83410437ab6cc09c995a971bf365b5fa4
          path: before
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: d92cf7dc60300e61d402fc699ff566408dc57b98
          path: after
      - uses: actions/download-artifact@v4
        with:
          name: guard-0
          run-id: 44415945774
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: published2427-*
          run-id: 44519377875
          github-token: ${{ github.token }}
          path: captured
          merge-multiple: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install source dependencies
        run: |
          for revision in before after; do
            (cd "$revision" && bun install --frozen-lockfile --ignore-scripts)
          done
      - name: Verify cleanup preserves all prepared fields for72frozen and6native inputs
        run: bun experiments/full-board-priority-analysis/audit-boundary-policy.ts "$PWD/before" "$PWD/after" "$PWD/frozen/inputs" "$PWD/captured"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-policy-audit-2427
          path: prepared-bus-policy-audit.json
