name: Pair native clearance searches and complete OrangeCrab phases
on:
  push:
    branches: [codex/ddr2410-connectivity]
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: d88899c9ac79cf48491a402b5e3643b3efabe373
          path: before
      - uses: actions/checkout@v4
        with:
          ref: e62071afed73548d412c70cd1676262065a9cab4
          path: after
      - uses: actions/download-artifact@v4
        with:
          name: orange-2410-complete-phase-profile
          run-id: 44261032419
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install both frozen runtimes
        run: |
          for variant in before after; do
            (cd "$variant" && bun install --ignore-scripts)
            cp experiments/full-board-priority-analysis/check-phase-output.ts "$variant/check-phase-output.ts"
          done
          mkdir -p results
          cp captured/fresh-input/phase-1-input.srj.json results/input.srj.json
      - name: Alternate repeated native searches on the same worker
        run: bun experiments/full-board-priority-analysis/benchmark-clearance-connectivity.ts "$GITHUB_WORKSPACE/before" "$GITHUB_WORKSPACE/after" "$GITHUB_WORKSPACE/results/input.srj.json" results/kernel.json
      - name: Complete both unchanged native phases in both orders
        run: |
          for round in 0 1; do
            variants="before after"
            if [ "$round" = 1 ]; then variants="after before"; fi
            for variant in $variants; do
              (cd "$variant" && bun check-phase-output.ts "$GITHUB_WORKSPACE/results/input.srj.json" "$GITHUB_WORKSPACE/results/$round-$variant")
            done
          done
      - name: Export paired phases and assert copper equivalence
        run: |
          python3 - <<'PYREPORT'
          import json
          from pathlib import Path
          rows=[{'round':r,'variant':v,**json.loads((Path('results')/f'{r}-{v}'/'report.json').read_text())} for r in [0,1] for v in ['before','after']]
          assert len({r['inputSha256'] for r in rows})==1
          assert len({r['tracesSha256'] for r in rows})==1
          assert all(r['solved'] and r['traceCount']==430 for r in rows)
          Path('results/paired-phases.json').write_text(json.dumps(rows,indent=2))
          print('CONNECTIVITY2410_PHASE_RESULTS',json.dumps(rows,separators=(',',':')))
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectivity2410-paired-native
          path: results
          retention-days: 14
