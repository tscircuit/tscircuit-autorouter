name: Diagnose remaining controller fixed copper conflict
on:
  push:
    branches: [analysis/e2e-controller16-fixed-conflicts-20261120]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [after]
        sample: ["tests/repros/repro-fanout-routed-layer-impact.test.tsx"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: ${{ matrix.variant == 'before' && 'a4d0ac47a1643250c016f8e964f6b2b4ce61517a' || 'abbbebc103a22bad1c0bbc2bd685b6acadc66b35' }}
          path: core
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: f9c08dcd41bfd84beb0b17bdf8b75215a4701ac6
          path: router
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install unchanged pinned dependencies and compile candidate router
        run: |
          for project in core router; do
            for attempt in 1 2 3; do
              if (cd "$project" && bun install --ignore-scripts); then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          done
          bun build router/lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts --target bun --packages external --outfile router/benchmark-runtime/pipeline9.js
          echo "E2E_ROUTER_MODULE=$GITHUB_WORKSPACE/router/benchmark-runtime/pipeline9.js" >> "$GITHUB_ENV"
      - name: Validate production formatting and declarations
        if: matrix.sample == 'tests/repros/repro-fanout-copper-preserved-before-global-routing.test.tsx'
        run: |
          cd core
          bunx biome format lib/utils/autorouting/FanoutAutorouter.ts lib/utils/autorouting/SimpleRouteJson.ts tests/repros/repro-fanout-copper-preserved-before-global-routing.test.tsx
          bunx tsc --noEmit
      - name: Capture final native circuits without changing routing
        run: |
          python3 - <<'PYCAPTURE'
          from pathlib import Path
          import shutil
          experiment=Path('experiments/e2e-samples-20261120')
          for name in ['connectivity.ts','audit-preserve-regressions.ts']:shutil.copyfile(experiment/name,Path('core')/name)
          native=Path('core/tests/repros/repro-fanout-copper-preserved-before-global-routing.test.tsx')
          body=native.read_text()
          if 'expect(circuit.db.pcb_autorouting_error.list()).toEqual([])' not in body:
              body=body.replace('  const circuitJson = circuit.getCircuitJson()', '  expect(circuit.db.pcb_autorouting_error.list()).toEqual([])\n  expect(circuit.db.pcb_trace.list()).toHaveLength(12)\n  const circuitJson = circuit.getCircuitJson()')
              native.write_text(body)
          p=Path('core/tests/fixtures/get-test-fixture.ts')
          s=p.read_text();s='import { SOLVERS } from "lib/solvers"\nObject.assign(SOLVERS, await import(process.env.E2E_ROUTER_MODULE!))\nimport { mkdirSync, writeFileSync } from "node:fs"\nlet capturedCircuitCount = 0\n'+s
          needle='  const circuit = new RootCircuit({ platform })'
          replacement=needle+"\n  circuit.on(\"autorouting:start\", (event) => { if (event.solverName === \"AutoroutingPipelineSolver9_PreloadedTraceGraph\") writeFileSync(\"../router/controller16-global.json.gz\", Bun.gzipSync(JSON.stringify(event.simpleRouteJson))) })\n  const captureIndex = capturedCircuitCount++\n  const originalRenderUntilSettled = circuit.renderUntilSettled.bind(circuit)\n  circuit.renderUntilSettled = async (...args) => {\n    const result = await originalRenderUntilSettled(...args)\n    mkdirSync('regression-captures', { recursive: true })\n    writeFileSync(`regression-captures/circuit-${captureIndex}.json.gz`, Bun.gzipSync(JSON.stringify(circuit.getCircuitJson())))\n    return result\n  }"
          assert needle in s;p.write_text(s.replace(needle,replacement))
          PYCAPTURE
      - name: Run affected test and generate its natural snapshots
        env:
          TEST_FILE: ${{ matrix.sample }}
        run: cd core && BUN_UPDATE_SNAPSHOTS=1 bun test "$TEST_FILE" --timeout 9999999
      - name: Profile exact failing copper pairs
        if: always()
        env:
          FIX_PRELOADED_TRACES: 1
          CAPTURE_FIXED_CONFLICTS: 1
        run: |
          export ROUTER_ROOT="$GITHUB_WORKSPACE/router"
          cd router
          bun --tsconfig-override tsconfig.json ../experiments/e2e-samples-20261120/profile-fixed-conflicts.ts controller16-global.json.gz "$GITHUB_WORKSPACE/profile-output"
      - name: Export exact controller geometry
        if: always()
        run: |
          python3 - <<'PYPROFILE'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in Path('profile-output').glob('*'):
                  if p.is_file():z.writestr(p.name,p.read_bytes())
              p=Path('router/controller16-global.json.gz')
              if p.exists():z.writestr(p.name,p.read_bytes())
          print('HANDOFF_STAGE_PROFILE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('HANDOFF_STAGE_PROFILE_END')
          PYPROFILE
      - name: Audit emitted copper
        if: always()
        run: cd core && bun audit-preserve-regressions.ts regression-captures
      - name: Export changed snapshots and physical assessment
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
          SAMPLE: ${{ matrix.sample }}
        run: |
          python3 - <<'PYEXPORT'
          from pathlib import Path
          import base64,io,json,os,subprocess,zipfile
          root=Path('core')
          paths=subprocess.run(['git','diff','--name-only','--','*.svg'],cwd=root,text=True,check=True,capture_output=True).stdout.splitlines()
          assessment=root/'regression-captures/assessment.json'
          manifest={'variant':os.environ['VARIANT'],'sample':os.environ['SAMPLE'],'snapshots':paths,'assessment':json.loads(assessment.read_text()) if assessment.exists() else None}
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.writestr('manifest.json',json.dumps(manifest,indent=2))
              for p in paths:z.writestr(p,(root/p).read_bytes())
          assert len(stream.getvalue())<4000000
          Path('preserve-regression.zip').write_bytes(stream.getvalue())
          print('PRESERVE_REGRESSION_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('PRESERVE_REGRESSION_END')
          PYEXPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserve-regression-${{ matrix.variant }}-${{ strategy.job-index }}
          path: |
            core/regression-captures
            preserve-regression.zip
