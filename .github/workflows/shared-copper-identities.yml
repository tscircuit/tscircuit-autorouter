name: Verify repaired native copper routes
on:
  push:
    branches: [analysis/native-shared-copper-identity]
    paths: [.github/workflows/shared-copper-identities.yml]
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/native-shared-copper-identity
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Run unchanged connectivity, DRC, and tuning checks
        id: passing
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repro/pipeline9-h616-staged-regional-clearance.test.ts tests/repro/pipeline9-h616-preload-reachability.test.ts tests/features/pipeline9-srj33-sample37-pair-repair.test.ts tests/repro/pipeline10-artix7-ddr-bus-length-matching.test.ts
      - name: Check types
        if: always()
        run: bunx tsc --noEmit
      - name: Save snapshots from passing original tests
        if: success() && steps.passing.outcome == 'success'
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate verified native-copper and DDR tuning snapshots"
          git push origin HEAD:analysis/native-shared-copper-identity
