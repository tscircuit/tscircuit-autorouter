name: Apply and verify issue 2106 fix

on:
  push:
    branches:
      - fix/2106-map-entry-browser-compat

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[issue-2106 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2106-map-entry-browser-compat

      - uses: oven-sh/setup-bun@v2

      - name: Apply fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          solver_path = Path("lib/solvers/HighDensitySolver/IntraNodeSolver.ts")
          source = solver_path.read_text()
          old = '''    this.unsolvedConnections = Array.from(
              unsolvedConnectionsMap.entries().map(([connectionName, points]) => ({
                connectionName,
                rootConnectionName:
                  this.rootConnectionNameByConnectionName.get(connectionName),
                points: dedupeConnectionPoints(points),
              })),
            )'''
          new = '''    this.unsolvedConnections = Array.from(
              unsolvedConnectionsMap.entries(),
            ).map(([connectionName, points]) => ({
              connectionName,
              rootConnectionName:
                this.rootConnectionNameByConnectionName.get(connectionName),
              points: dedupeConnectionPoints(points),
            }))'''
          if old not in source:
              raise SystemExit("Expected issue 2106 code path was not found")
          solver_path.write_text(source.replace(old, new, 1))

          test_path = Path("tests/bugs/issue2106-map-iterator-compat.test.ts")
          test_path.write_text('''import { expect, test } from "bun:test"
          import { IntraNodeRouteSolver } from "../../lib/solvers/HighDensitySolver/IntraNodeSolver"

          test("constructs connections when Map iterators lack helper methods", () => {
            const nativeEntries = Map.prototype.entries

            Object.defineProperty(Map.prototype, "entries", {
              configurable: true,
              value(this: Map<unknown, unknown>) {
                const iterator = nativeEntries.call(this)
                return {
                  next: () => iterator.next(),
                  [Symbol.iterator]() {
                    return this
                  },
                }
              },
            })

            try {
              const solver = new IntraNodeRouteSolver({
                nodeWithPortPoints: {
                  capacityMeshNodeId: "node-1",
                  center: { x: 0, y: 0 },
                  width: 4,
                  height: 4,
                  portPoints: [
                    { connectionName: "net-a", x: -1, y: 0, z: 0 },
                    { connectionName: "net-a", x: 1, y: 0, z: 0 },
                  ],
                },
              })

              expect(solver.unsolvedConnections).toEqual([
                {
                  connectionName: "net-a",
                  rootConnectionName: undefined,
                  points: [
                    { x: -1, y: 0, z: 0 },
                    { x: 1, y: 0, z: 0 },
                  ],
                },
              ])
            } finally {
              Object.defineProperty(Map.prototype, "entries", {
                configurable: true,
                writable: true,
                value: nativeEntries,
              })
            }
          })
          ''')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused regression test
        run: bun test tests/bugs/issue2106-map-iterator-compat.test.ts --timeout 9999999

      - name: Build package
        run: bun run build

      - name: Commit verified change
        run: |
          git config user.name "obmakesomething"
          git config user.email "107823004+obmakesomething@users.noreply.github.com"
          git add lib/solvers/HighDensitySolver/IntraNodeSolver.ts tests/bugs/issue2106-map-iterator-compat.test.ts
          git commit -m "fix: support Map iterators without helper methods [issue-2106 applied]"
          git push origin HEAD:fix/2106-map-entry-browser-compat
