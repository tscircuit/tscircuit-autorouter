name: Verify identical full-circuit inputs and physical copper in every capture
on:
  push:
    branches: [analysis/e2e-failed-prefix-validation-20261120]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for every candidate capture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch 44826988004 -R tscircuit/tscircuit-autorouter 
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 780b91845a73f2b1990d33170a99ab035d208532
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: cd core && bun install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          run-id: 44819438953
          pattern: full-circuit-interception-*
          path: core/e2e-runtime/before
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44826988004
          pattern: full-circuit-interception-*
          path: core/e2e-runtime/after
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check original pads and exact captured fanout inputs
        run: |
          cp experiments/e2e-samples-20261120/check-failed-prefix-cache-results.ts experiments/e2e-samples-20261120/inputs.json core/e2e-runtime/
          cd core/e2e-runtime
          bun check-failed-prefix-cache-results.ts "$GITHUB_WORKSPACE/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefix-cache-physical-results
          path: results
      - name: Export machine-readable findings
        if: always()
        run: |
          python3 - <<'PY'
          import base64,gzip,io,zipfile
          from pathlib import Path
          p=Path('results/prefix-cache-final-statistics.json')
          if p.exists():
              print('PREFIX_CACHE_RESULTS_BEGIN')
              encoded=base64.b64encode(gzip.compress(p.read_bytes(),mtime=0)).decode()
              for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
              print('PREFIX_CACHE_RESULTS_END')
          buffer=io.BytesIO()
          with zipfile.ZipFile(buffer,'w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('results').glob('*.svg'):z.writestr(p.name,p.read_bytes())
          print('PREFIX_CACHE_SVGS_BEGIN')
          encoded=base64.b64encode(buffer.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('PREFIX_CACHE_SVGS_END')
          PY
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 08cd66e8c9128ce347e9c2fd8baba7217acf1596
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests/repro-imx6-impossible-layer-assignments.test.ts --timeout 9999999
