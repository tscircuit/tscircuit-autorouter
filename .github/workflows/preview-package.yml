name: Preview package

on:
  push:
    branches:
      - preview/lm251-shared-root-terminal-stitch

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --ignore-scripts
      - run: bun run build
      - run: bunx pkg-pr-new publish --compact --comment=off
