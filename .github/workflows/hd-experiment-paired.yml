name: HD input contract two-source confirmation datasets18 and24

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: hd-legal-input-v5-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  multiarm-benchmark:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/hd-exp-3-physical-legalization'
    name: Pipeline9 two-source input contract confirmation on datasets18 and24
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HD_WORKTREE_ROOT: ${{ github.workspace }}/hd-legal-input-v5-worktrees
      HD_RESULTS: ${{ github.workspace }}/hd-legal-input-v5-results
      HD_DEPS: ${{ github.workspace }}/hd-legal-input-v5-dependencies
      HD_CONFIG: ${{ github.workspace }}/hd-legal-input-v5-config.json

    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: 637b6c581128238f6c61227a1c15be423d24baca
          path: hd-legal-input-v5-worktrees/control
          persist-credentials: false

      - name: Checkout exact input-materialization candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: hd-legal-input-v5-worktrees/refined-full
          persist-credentials: false

      - name: Setup Bun1.4.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Bind comparison to exact candidate source
        shell: bash
        run: |
          python3 "$HD_WORKTREE_ROOT/refined-full/experiments/hd-refinements/input-20261029/bind_refinement.py" \
            --harness "$HD_WORKTREE_ROOT/refined-full/experiments/hd-refinements/harness" \
            --head-sha "$HD_HEAD_SHA" --profile full --out "$HD_CONFIG"

      - name: Measure all84 fresh source-arm samples with global admission
        shell: bash
        run: |
          python3 "$HD_WORKTREE_ROOT/refined-full/experiments/hd-refinements/harness/multiarm_ci.py" \
            --root "$HD_WORKTREE_ROOT" --out "$HD_RESULTS" \
            --deps "$HD_DEPS" --config "$HD_CONFIG"

      - name: Archive source-binding templates and analysis helpers
        if: always()
        shell: bash
        run: |
          mkdir -p "$HD_RESULTS"
          cp -R "$HD_WORKTREE_ROOT/refined-full/experiments/hd-refinements/input-20261029" "$HD_RESULTS/source-binding"

      - name: Upload frozen protocol, dependency lock and every raw record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd-legal-input-v5-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: hd-legal-input-v5-results
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 9
          retention-days: 30
