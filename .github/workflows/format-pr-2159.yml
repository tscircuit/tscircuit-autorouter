name: Format PR 2159

on:
  push:
    branches:
      - fix/2106-map-entry-browser-compat

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[pr-2159 formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2106-map-entry-browser-compat

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - run: bun install

      - name: Format changed files
        run: bunx biome format --write lib/solvers/HighDensitySolver/IntraNodeSolver.ts tests/bugs/issue2106-map-iterator-compat.test.ts

      - name: Commit format changes
        run: |
          git config user.name "obmakesomething"
          git config user.email "107823004+obmakesomething@users.noreply.github.com"
          git add lib/solvers/HighDensitySolver/IntraNodeSolver.ts tests/bugs/issue2106-map-iterator-compat.test.ts
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: confirm PR 2159 formatting [pr-2159 formatted]"
          else
            git commit -m "chore: format PR 2159 files [pr-2159 formatted]"
          fi
          git push origin HEAD:fix/2106-map-entry-browser-compat
