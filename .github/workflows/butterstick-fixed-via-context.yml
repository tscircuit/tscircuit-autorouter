name: Benchmark fixed-via-aware clamping on ButterStick
on:
  push:
    branches: [analysis/butterstick-fixed-via-context]
    paths: [.github/workflows/butterstick-fixed-via-context.yml]
permissions:
  contents: write
jobs:
  replay:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [context]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies and exact native fixture
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("package.json");m=json.loads(p.read_text())
          m["overrides"]={**m.get("overrides",{}),"csstype":"3.1.3"}
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install
          mkdir -p published-runtime
          echo '{"private":true,"type":"module","dependencies":{"@tscircuit/capacity-autorouter":"0.0.1130"}}' > published-runtime/package.json
          (cd published-runtime && bun install --ignore-scripts)
          curl -fsSL https://raw.githubusercontent.com/tscircuit/core/c9d16246d7aa025026320d585578a551e3c32778/repros/butterstick-fixed-via/butterstick-native-arm-repro.json.gz -o native-fixture.json.gz
      - name: Use the exact upstream endpoint-via candidate
        run: |
          force_source_path=$(bun -e 'console.log(Bun.resolveSync("high-density-repair01/lib/HighDensityForceImproveSolver",process.cwd()))')
          curl -fsSL https://raw.githubusercontent.com/tscircuit/high-density-repair01/c729e682f12603118bbe0a11c3703c6059efb032/lib/HighDensityForceImproveSolver.ts -o "$force_source_path.private"
          mv "$force_source_path.private" "$force_source_path"
      - name: Compare native physical checks with SRJ evaluation
        env:
          MODE: ${{ matrix.mode }}
        run: |
          cat > native-parity.private.ts <<'TS'
          import {readFileSync,writeFileSync,mkdirSync} from "node:fs"
          import {gunzipSync,gzipSync} from "node:zlib"
          import {createHash} from "node:crypto"
          import * as checks from "@tscircuit/checks"
          import {convertCircuitJsonToPcbSvg} from "circuit-to-svg"
          import {AutoroutingPipelineSolver9_PreloadedTraceGraph} from "./lib"
          import {evaluateRelaxedDrc} from "./lib/testing/evaluate-relaxed-drc"
          import {replaceNativePcbTraces} from "./tests/fixtures/replaceNativePcbTraces"
          const fixture=JSON.parse(gunzipSync(readFileSync("native-fixture.json.gz")).toString())
          const input=fixture.input
          const cls=process.env.MODE==="published"?(await import("./published-runtime/node_modules/@tscircuit/capacity-autorouter/dist/index.js")).AutoroutingPipelineSolver9_PreloadedTraceGraph:AutoroutingPipelineSolver9_PreloadedTraceGraph
          const solver=new cls(input,fixture.options)
          solver.solve()
          if(!solver.solved)throw Error(solver.error??"Replay incomplete")
          const traces=solver.getOutputSimplifiedPcbTraces()
          const native=replaceNativePcbTraces({circuitJson:fixture.circuitJson,srj:input,traces})
          const gap={minClearance:input.minTraceToPadEdgeClearance}
          const functions={trace_overlap:checks.checkEachPcbTraceNonOverlapping,pad_trace:checks.checkPadTraceClearance,via_trace:checks.checkViaTraceClearance,via_pad:checks.checkViaPadClearance,via_spacing:checks.checkDifferentNetViaSpacing,via_in_pad:checks.checkViasInPads}
          const count=(circuit,options)=>Object.fromEntries(Object.entries(functions).map(([name,fn])=>[name,fn(circuit,options).length]))
          const srj=evaluateRelaxedDrc({inputSrj:input,srjWithPointPairs:solver.srjWithPointPairs!,routedTraces:traces,includeBoardClearance:true,drcOptions:{traceClearance:input.minTraceToPadEdgeClearance,viaToPadClearance:input.minViaEdgeToPadEdgeClearance}})
          console.log("NATIVE_PARITY="+JSON.stringify({mode:process.env.MODE,srj:srj.errors.length,native:count(native,gap),zeroClearance:count(native,{minClearance:0}),before:count(fixture.circuitJson,gap),newVias:traces.reduce((n,t)=>n+t.route.filter(p=>p.route_type==="via").length,0),digest:createHash("sha256").update(JSON.stringify(traces)).digest("hex"),widths:[...new Set(traces.flatMap(t=>t.route.filter(p=>p.route_type==="wire").map(p=>p.width)))]}))
          mkdirSync("analysis-artifacts",{recursive:true})
          writeFileSync("analysis-artifacts/butterstick-native.svg",convertCircuitJsonToPcbSvg(native,{width:1400,height:1000,backgroundColor:"white",includeVersion:false,renderSolderMask:false,shouldDrawRatsNest:false}))
          writeFileSync("analysis-artifacts/butterstick-native.json.gz",gzipSync(JSON.stringify({fixture,traces,circuitJson:native,srjCircuitJson:srj.circuitJson})))
          TS
          bun native-parity.private.ts
          git config user.name "tscircuit bot"
          git config user.email "githubbot@tscircuit.com"
          git add analysis-artifacts
          git commit -m "Retain exact native ButterStick replay and SVG"
          git push origin HEAD:analysis/butterstick-fixed-via-context-${{ matrix.mode }}
