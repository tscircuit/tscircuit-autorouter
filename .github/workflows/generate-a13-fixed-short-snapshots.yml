# The user explicitly requested solver-generated SVG repros and before/after PR snapshots.
# Update only that existing public repro's SVG, plus its visual-review PNG on this isolated branch.
# Do not print raw board data or error records in logs.
name: Generate the requested A13 repro snapshot
on:
  push:
    branches: [artifacts/a13-fixed-short-snapshots]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Generate the existing real-board SVG repro
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/repro/pipeline9-a13-regional-repair-shorts.test.ts --timeout 9999999 > snapshot.private.log 2>&1
      - name: Render the SVG for visual review
        run: |
          cat > render-preview.private.ts <<'TS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs'
          import {Resvg} from '@resvg/resvg-js'
          const path='tests/repro/__snapshots__/pipeline9-a13-regional-repair-shorts.snap.svg'
          const svg=readFileSync(path,'utf8')
          const png=new Resvg(svg,{fitTo:{mode:'width',value:950}}).render().asPng()
          mkdirSync('.github/artifacts',{recursive:true})
          writeFileSync('.github/artifacts/a13-fixed-short-preview.png',png)
          TS
          bun render-preview.private.ts
      - name: Save only the requested repro images on this isolated artifact branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/repro/__snapshots__/pipeline9-a13-regional-repair-shorts.snap.svg
          git add -f .github/artifacts/a13-fixed-short-preview.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate requested A13 fixed-short repro snapshots'
            git push origin HEAD:artifacts/a13-fixed-short-snapshots
          fi
