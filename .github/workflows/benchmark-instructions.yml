name: Benchmark Instructions

on:
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  post-instructions:
    name: Post benchmark instructions
    if: github.event_name != 'pull_request_target' || !startsWith(github.event.pull_request.head.ref, 'version-bumps/')
    runs-on: ubuntu-latest
    steps:
      - name: Comment benchmark usage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          script: |
            const body = [
              "## Benchmark This PR",
              "",
              "Run benchmarks by commenting on this PR:",
              "",
              "```",
              "/benchmark",
              "```",
              "",
              "Comment exactly `/benchmark` to start separate workflow runs and result comments for the default dataset plus srj18, srj19, srj20, srj21, and srj23.",
              "",
              "This runs `./benchmark.sh --dataset <dataset>` for each dataset using the default benchmark solver and all scenarios.",
              "",
              "Use `/update-snapshots` (or `/us`) to run `BUN_UPDATE_SNAPSHOTS=1 bun test --timeout 120_000` on the PR branch and auto-commit snapshot updates.",
              "Use `/usf` to read recent failed test files, run `BUN_UPDATE_SNAPSHOTS=1 bun test --timeout 120_000 <files>`, auto-commit snapshot updates, then verify with `bun test <files>`.",
              "",
              "Any PR whose title contains `[BENCHMARK TEST]` will automatically run one default-dataset benchmark on PR updates; it does not use the `/benchmark` fan-out or post PR result comments.",
            ].join("\n")

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            })
