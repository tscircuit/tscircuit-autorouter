name: Check clean native ownership types
on:
  push:
    branches: [analysis/native-copper-stage-diagnostics]
    paths: [.github/workflows/native-clean-types.yml]
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8de0179cba49c0cda1424e42ec84237bcead6b87
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun run build
