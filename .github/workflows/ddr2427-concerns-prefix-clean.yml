name: Validate reviewed fanout source
on:
  push:
    branches: [codex/ddr2427-concerns-prefix-clean]
permissions:
  contents: read
jobs:
  source-check:
    strategy:
      fail-fast: false
      matrix:
        revision: ["ae13569eb35dccc74e99708794cb2135a5c3ddc0", "e4edfc8122093bf7c6d67677f4cdc3344ef3983e", "66b1f5ec09731837a991ddee489cb7ce3949a964", "2280363a17aec48409653b8abd0ce4d22a70ef7b", "ff2f931affb820e21517c471d5670f67d1112ced"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - if: always()
        run: bun run typecheck
