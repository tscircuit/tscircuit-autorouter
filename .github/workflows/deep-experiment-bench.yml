name: Pinned deep autorouter experiments

on:
  push:
    branches: [codex/deep-experiment-bench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Validate explicitly requested immutable experiments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve requested experiment matrix
        id: plan
        run: python3 scripts/experiment-audit/plan-pinned-matrix.py --manifest scripts/experiment-audit/pinned-manifest.json
  experiment:
    name: PR ${{ matrix.pr }} / ${{ matrix.dataset }}
    needs: plan
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BENCHMARK_HEARTBEAT_INTERVAL_MS: '30000'
      BENCHMARK_TERMINATE_TIMEOUT_MS: '1000'
    steps:
      - name: Checkout experiment controller
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Validate exact comparison refs
        id: refs
        run: python3 controller/scripts/experiment-audit/select-pinned-experiment.py --manifest controller/scripts/experiment-audit/pinned-manifest.json --pr '${{ matrix.pr }}' --dataset '${{ matrix.dataset }}'
      - name: Checkout pristine pinned harness
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.baseline_sha }}
          path: pinned-harness
          persist-credentials: false
      - name: Checkout baseline algorithm
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.baseline_sha }}
          path: baseline
          persist-credentials: false
      - name: Checkout candidate algorithm
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install exact-source baseline dependencies and record registry resolutions
        run: python3 controller/scripts/experiment-audit/install-pinned-dependencies.py baseline
      - name: Install exact-source candidate dependencies and record registry resolutions
        run: python3 controller/scripts/experiment-audit/install-pinned-dependencies.py candidate
      - name: Build baseline artifacts
        working-directory: baseline
        run: bun run build
      - name: Build candidate artifacts
        working-directory: candidate
        run: bun run build
      - name: Install identical auditable harness adapters
        run: |
          python3 controller/scripts/experiment-audit/prepare-pinned-harness.py --controller pinned-harness --target baseline --expected-sha '${{ steps.refs.outputs.baseline_sha }}'
          python3 controller/scripts/experiment-audit/prepare-pinned-harness.py --controller pinned-harness --target candidate --expected-sha '${{ steps.refs.outputs.candidate_sha }}'
      - name: Run complete matched AB population, then optional BA replication
        run: python3 controller/scripts/experiment-audit/run-pinned-experiment.py --manifest controller/scripts/experiment-audit/pinned-manifest.json --pr '${{ matrix.pr }}' --dataset '${{ matrix.dataset }}' --baseline baseline --candidate candidate --output 'results/pr-${{ matrix.pr }}-${{ matrix.dataset }}'
      - name: Retain provenance, raw copper, official reports and supplemental checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-experiment-${{ matrix.pr }}-${{ matrix.dataset }}
          path: results
          if-no-files-found: warn
          retention-days: 30
