name: Validate native partial fanout copper before and after
on:
  push:
    branches: [codex/ddr2410-plane-quality]
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: before
            sha: 8c699afbd643652c4923b15b63a56d82eb794833
          - revision: after
            sha: 65439fb38d1d86af15495553588cfe21b28a197a
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.sha }}
          path: fanout
      - uses: actions/download-artifact@v4
        with:
          name: fanout-bus-first-icepi
          run-id: 44296522072
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Replay unchanged native iCEPi input
        run: |
          (cd fanout && bun install --frozen-lockfile --ignore-scripts)
          cp experiments/full-board-priority-analysis/replay-native-plane-drop.ts fanout/replay-native-plane-drop.ts
          mkdir -p native
          cd fanout
          bun replay-native-plane-drop.ts "$GITHUB_WORKSPACE/captured/icepi/fanout-1-input.json.gz" "$GITHUB_WORKSPACE/native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plane-drop-quality-${{ matrix.revision }}
          path: native
      - name: Export native routing evidence
        if: always()
        run: |
          python3 - <<'PYNATIVE'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('native').glob('*'):
                  if path.is_file(): archive.writestr(path.name,path.read_bytes())
          print('NATIVE_PLANE_DROP_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('NATIVE_PLANE_DROP_EVIDENCE_END')
          PYNATIVE
