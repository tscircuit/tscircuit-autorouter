name: Validate far-via clearance bounds on ten native full circuits
on:
  push:
    branches: [analysis/e2e-far-via-bounds-validation-2451]
concurrency:
  group: e2e-uploaded-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sample: ["butterstick-original", "butterstick-spaced", "glider-original", "glider-spaced", "h616-original", "h616-spaced", "icepi-original", "icepi-spaced", "imx6-original", "imx6-spaced"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: f2f498a1abe544e74d7ebde135c386179ee41c25
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pinned latest core dependencies
        run: |
          python3 - <<'PYSETUP'
          from pathlib import Path
          config=Path('core/bunfig.toml');config.write_text(config.read_text().replace('save = false','save = true'))
          PYSETUP
          for attempt in 1 2 3; do
            if bun install --ignore-scripts; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            if (cd core && bun install --ignore-scripts); then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: e676a568f91156a0afba3c24f6f4f7df19a55c1c
          path: fanout-fix
      - name: Apply hash-checked via clearance bounds
        run: |
          python3 - <<'PYPATCH'
          from pathlib import Path
          import hashlib,shutil
          hashes={
            'plan-static-clearance.ts':('a73f5a162268f9ae89945a3754ba1df0e12a54c3eaae20ef938c2782eb45913f','fed1e87871ba97babfe96d117746ea92cce082e566e82cfcab777aebbe741a35'),
            'plan-mutual-clearance.ts':('081466c8152372354fe46c3f9968b85b2f2d84897fa8660a0e1e29c65c28776f','7b3a150c2f329964f61eac3456fe8e4cff8141596479c7bc061fe5e97029c8a6'),
          }
          for name,(before,after) in hashes.items():
              target=Path('core/node_modules/@tscircuit/fanout-solver/lib/route-bus')/name
              source=Path('fanout-fix/lib/route-bus')/name
              assert hashlib.sha256(target.read_bytes()).hexdigest()==before,name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==after,name
              target.unlink()
              shutil.copyfile(source,target)
          PYPATCH
      - name: Prepare exact uploaded sources and record dependency revisions
        run: |
          python3 - <<'PYSAMPLES'
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          source=Path('experiments/e2e-samples-20261120');runtime=Path('core/e2e-runtime');runtime.mkdir()
          for name in ['worker-deep.tsx','run-deep.py','assess.ts','correct-workflow.tsx','connectivity.ts','intercept-internals.ts']:shutil.copyfile(source/name,runtime/name)
          import gzip
          (runtime/'expected-circuits.json').write_bytes(gzip.decompress((source/'expected-circuits.json.gz').read_bytes()))
          manifest=json.loads((source/'inputs.json').read_text())
          assert hashlib.sha256((source/'samples.zip').read_bytes()).hexdigest()==manifest['archiveSha256']
          with zipfile.ZipFile(source/'samples.zip') as z:
              for entry in manifest['samples']:
                  content=z.read(entry['name'])
                  assert hashlib.sha256(content).hexdigest()==entry['sha256']
                  target=runtime/'samples'/entry['name'];target.parent.mkdir(exist_ok=True);target.write_bytes(content)
          revisions={'tscircuit':'0.0.3272','core':'f2f498a1abe544e74d7ebde135c386179ee41c25','router':'native-installed-package','winding':'08d8da9d8dbb037eba332e7bfd685063f8805ed4','sampleMode':'fanout_first','archiveSha256':manifest['archiveSha256'],'coreLockSha256':hashlib.sha256(Path('core/bun.lock').read_bytes()).hexdigest()}
          for package in ['@tscircuit/fanout-solver','@tscircuit/winding-breakout-point-solver','@tscircuit/capacity-autorouter','@tscircuit/props','@tscircuit/bus-lanes-solver','@tscircuit/checks','circuit-to-svg','react']:
              revisions[package]=json.loads((Path('core/node_modules')/package/'package.json').read_text())['version']
          assert revisions['@tscircuit/fanout-solver']=='0.0.100'
          assert revisions['@tscircuit/capacity-autorouter']=='0.0.1147'
          plane=Path('core/node_modules/@tscircuit/fanout-solver/lib/route-bus/route-plane-terminated-bus.ts').read_bytes()
          assert b'initialBlockingBusCounts' in plane
          solver=Path('core/node_modules/@tscircuit/fanout-solver/lib/fanout-solver.ts').read_bytes()
          assert b'get outputSrj()' in solver
          revisions['fanoutSolverSourceSha256']=hashlib.sha256(solver).hexdigest()
          revisions['fanoutPlaneSourceSha256']=hashlib.sha256(plane).hexdigest()
          winding=Path('core/node_modules/@tscircuit/winding-breakout-point-solver/lib/layer-assignment/assign-connection-layers.ts').read_bytes()
          assert b'toReversed()' in winding
          revisions['windingAssignmentSha256']=hashlib.sha256(winding).hexdigest()
          assert revisions['windingAssignmentSha256']=='50b2a4a8955f04cf68caf2614d03e5ce40c39b0ad24ea7fde68f05f1400f7311'
          revisions['interception']='read-only winding stages and original fanout clearance rejections'
          analytic=Path('core/node_modules/@tscircuit/fanout-solver/lib/route-bus/route-analytic-boundary-alternatives.ts').read_bytes()
          revisions['fanoutAnalyticSourceSha256']=hashlib.sha256(analytic).hexdigest()
          assert revisions['fanoutAnalyticSourceSha256']=='3534047f85164d8327323fbe90a8af84d3f70b42d00bd12f5611b5bb7aa3bb58'
          mutual=Path('core/node_modules/@tscircuit/fanout-solver/lib/route-bus/plan-mutual-clearance.ts').read_bytes()
          revisions['fanoutMutualSourceSha256']=hashlib.sha256(mutual).hexdigest()
          assert revisions['fanoutMutualSourceSha256']=='7b3a150c2f329964f61eac3456fe8e4cff8141596479c7bc061fe5e97029c8a6'
          copper=Path('core/node_modules/@tscircuit/fanout-solver/lib/route-bus/plan-copper.ts').read_bytes()
          revisions['fanoutCopperSourceSha256']=hashlib.sha256(copper).hexdigest()
          assert revisions['fanoutCopperSourceSha256']=='cf90ab51337e2f9f65f0304e4e8acedd0f0dbf664b2389cab1e761d5166cde7b'
          static=Path('core/node_modules/@tscircuit/fanout-solver/lib/route-bus/plan-static-clearance.ts').read_bytes()
          revisions['fanoutStaticSourceSha256']=hashlib.sha256(static).hexdigest()
          assert revisions['fanoutStaticSourceSha256']=='fed1e87871ba97babfe96d117746ea92cce082e566e82cfcab777aebbe741a35'
          revisions['fanoutPatchCommit']='e676a568f91156a0afba3c24f6f4f7df19a55c1c'
          revisions['corePatchApplied']=False
          (runtime/'revisions.json').write_text(json.dumps(revisions,indent=2)+'\n')
          print(json.dumps(revisions))
          PYSAMPLES
      - name: Route unmodified Core and intercept internal failure decisions
        env:
          E2E_SAMPLE: ${{ matrix.sample }}
          E2E_WORKFLOW: fanout_first
        run: |
          cd core/e2e-runtime
          python3 run-deep.py "$E2E_SAMPLE" "$GITHUB_WORKSPACE/results/$E2E_SAMPLE"
          bun assess.ts "$E2E_SAMPLE" "$GITHUB_WORKSPACE/results/$E2E_SAMPLE"
          cd "$GITHUB_WORKSPACE"
          bun experiments/e2e-samples-20261120/audit-diagnostics.ts "results/$E2E_SAMPLE"
      - name: Publish complete stage captures and PCB SVG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-circuit-interception-${{ matrix.sample }}
          path: results
          if-no-files-found: error
      - name: Export captured evidence
        if: always()
        env:
          E2E_SAMPLE: ${{ matrix.sample }}
        run: |
          python3 - <<'PYEXPORT'
          import base64,io,os,zipfile
          from pathlib import Path
          root=Path('results')
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in root.rglob('*'):
                  if p.name in ['report.json','process.json','assessment.json','diagnostics.json','pipeline-internals.json']:z.writestr(str(p.relative_to(root)),p.read_bytes())
          print('E2E_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('E2E_EVIDENCE_END')
          PYEXPORT
