name: Published3216 H616 regional cut feasibility

on:
  push:
    branches: [bench/h616-regional-cut-screen-3216]

permissions:
  contents: read
  actions: read

jobs:
  route:
    name: Native regional control and four-node cut
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { board: h616, experiment: published, cohorts: "spaced" }
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      BOARD: ${{ matrix.board }}
      FULL_BOARD_COHORTS: ${{ matrix.cohorts }}
      FULL_BOARD_EXPERIMENT: ${{ matrix.experiment }}
      FULL_BOARD_FAILURE_WITNESS: "1"

    steps:
      - name: Checkout benchmark controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-failure-witness-3216.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Checkout immutable helper source
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: b7951b41ff87c16f0bd0880e7b9c6a989ada244d
          path: .full-board-run/helper-source
          persist-credentials: false
          sparse-checkout: |
            lib
            types
            scripts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare verified package runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authenticated unchanged source helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 experiments/full-board-ten/h616-source-helpers/prepare.py
          "$FULL_BOARD_ROOT" "$FULL_BOARD_ROOT/helper-source"

      - name: Prepare authenticated native H616 capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/full-board-ten/prepare-h616-regional-cut.py "$FULL_BOARD_ROOT"

      - name: Require exact native original regional control
        id: control
        run: bun experiments/full-board-ten/run-h616-regional-cut.ts "$FULL_BOARD_ROOT" control

      - name: Screen one compact four-node repair
        id: candidate
        run: bun experiments/full-board-ten/run-h616-regional-cut.ts "$FULL_BOARD_ROOT" candidate

      - name: Compress authenticated helper evidence
        if: always()
        run: |
          if test -f "$FULL_BOARD_ROOT/h616-source-helpers/index.js"; then gzip -k "$FULL_BOARD_ROOT/h616-source-helpers/index.js"; fi
          if test -f "$FULL_BOARD_ROOT/h616-source-helpers/index.js.map"; then gzip -k "$FULL_BOARD_ROOT/h616-source-helpers/index.js.map"; fi

      - name: Preserve bounded regional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: h616-regional-cut-${{ github.run_attempt }}
          path: |
            .full-board-run/h616-regional-cut-results
            .full-board-run/h616-regional-cut-input/input-proof.json
            .full-board-run/h616-source-helpers/index.js.gz
            .full-board-run/h616-source-helpers/index.js.map.gz
            .full-board-run/h616-source-helpers/helper-proof.json
            .full-board-run/h616-source-helpers/source-body-audit.json
            .full-board-run/h616-source-helpers/compiler.json
            .full-board-run/runtime-manifest.json
            experiments/full-board-ten/h616-regional-cut-plan.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Require completed control and diagnostic
        if: always()
        run: test "${{ steps.control.outcome }}" = success -a "${{ steps.candidate.outcome }}" = success
