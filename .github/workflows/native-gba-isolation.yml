name: Verify pad-aware native routing in physical coordinates
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-gba-isolation.yml]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native-width
            source: 0477e6f5d46e0f43910ec285e16871ba8ad0296f
          - variant: parent-width
            source: 0477e6f5d46e0f43910ec285e16871ba8ad0296f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Apply general pad clearance to newly created fallback vias
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9RegionalFallbackSolver.ts")
          s=p.read_text().replace("hasPreloadedViaToBoardObstacleConflict","hasViaToBoardObstacleConflict")
          s=s.replace("  viaToPadClearance,\n  allowBlindAndBuriedVias,","  viaToPadClearance,\n  defaultViaToPadClearance,\n  allowBlindAndBuriedVias,",1)
          s=s.replace("  viaToPadClearance: number\n  allowBlindAndBuriedVias?","  viaToPadClearance?: number\n  defaultViaToPadClearance: number\n  allowBlindAndBuriedVias?",1)
          s=s.replace("    if (!movablePreloadedConnectionNames.has(route.connectionName)) {","    if (movablePreloadedConnectionNames.has(route.connectionName) && viaToPadClearance === undefined) {",1)
          s=s.replace("getPointToObstacleDistance(via, obstacle) < viaToPadClearance","getPointToObstacleDistance(via, obstacle) < (viaToPadClearance ?? defaultViaToPadClearance)")
          # Radius is subtracted by the existing helper's comparison.
          s=s.replace("    if (\n      !boardObstacles ||\n      !movablePreloadedConnectionNames ||\n      viaToPadClearance === undefined\n    ) {","    if (!boardObstacles || !movablePreloadedConnectionNames) {",1)
          marker="      viaToPadClearance,\n    })"
          assert s.count(marker)==1
          s=s.replace(marker,"      viaToPadClearance,\n      defaultViaToPadClearance: this.params.minClearance ?? this.params.obstacleMargin,\n    })")
          # This helper compares edge distance after subtracting via radius.
          s=s.replace("< viaToPadClearance\n", "< (viaToPadClearance ?? defaultViaToPadClearance)\n")
          assert "via.diameter / 2 + viaToPadClearance" in s
          s=s.replace("via.diameter / 2 + viaToPadClearance","via.diameter / 2 + (viaToPadClearance ?? defaultViaToPadClearance)",1)
          p.write_text(s)
          if os.environ["VARIANT"] in ["native-width","parent-width"]:
              p=Path("lib/solvers/HighDensityRepairSolver/Pipeline4HighDensityRepairSolver.ts")
              s=p.read_text()
              old="""    const repairRoutes = contextRoutes.map((route) =>
                toRepairRoute({
                  route,
                  connMap: params.connMap,
                  minimumTraceWidth: params.minimumTraceWidth,
                  viaLayerSpan,
                }),
              )"""
              new="""    const repairRoutes = contextRoutes.map((route, index) => {
                let minimumTraceWidth = params.minimumTraceWidth
                if (index >= params.hdRoutes.length) minimumTraceWidth = undefined
                return toRepairRoute({route, connMap: params.connMap, minimumTraceWidth, viaLayerSpan})
              })"""
              assert s.count(old)==1
              p.write_text(s.replace(old,new))
          PY
      - name: Use a physical frame for all native-copper context
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          prefix="lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/"
          p=Path(prefix+"Pipeline9HighDensitySolver.ts")
          s=p.read_text()
          old="    const hasImmutablePreload = this.fixedHdRoutes.some(\n      (route) => route.isFixed === true,\n    )"
          assert s.count(old)==1
          p.write_text(s.replace(old,"    const hasImmutablePreload = fixedHdRoutes.length > 0"))
          if os.environ["VARIANT"]=="parent-width":
              p=Path(prefix+"AutoroutingPipelineSolver9_PreloadedTraceGraph.ts")
              s=p.read_text()
              old="          fixedHdRoutes: cms.highDensityRouteSolver!\n            .getUpdatedFixedHdRoutes(),\n"
              assert s.count(old)==1
              p.write_text(s.replace(old,""))
              p=Path(prefix+"Pipeline9RegionalFallbackSolver.ts")
              s=p.read_text().replace("      fixedHdRoutes: this.params.fixedHdRoutes,\n      preserveTopologyPortAnchors:", "      preserveTopologyPortAnchors:",1)
              p.write_text(s)
          PY
      - run: bun install
      - name: Keep the original Game Boy routing and clearance assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts
      - name: Check native integration types
        if: always()
        run: bunx tsc --noEmit
