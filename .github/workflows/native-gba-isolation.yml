name: Isolate remaining Game Boy regression
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-gba-isolation.yml]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [canonical-force, saved-width, both]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75a6381c6985cd48f91b30516a828f6a771cfce0
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Isolate changes without changing the fixture or assertions
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          variant=os.environ["VARIANT"]
          if variant in ["canonical-force","both"]:
              p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts")
              s=p.read_text()
              old="materializePipeline9HdRouteVias(cms.highDensityRouteSolver!.routes),\n          ),"
              new="""materializePipeline9HdRouteVias(cms.highDensityRouteSolver!.routes),
                        ).map((route) => ({
                          ...route,
                          rootConnectionName:
                            cms.connMap.getNetConnectedToId(route.rootConnectionName ?? route.connectionName) ??
                            route.rootConnectionName ??
                            route.connectionName,
                        })),"""
              assert s.count(old)==1
              p.write_text(s.replace(old,new))
          if variant in ["saved-width","both"]:
              p=Path("lib/solvers/HighDensityRepairSolver/Pipeline4HighDensityRepairSolver.ts")
              s=p.read_text()
              old="""    const repairRoutes = contextRoutes.map((route) =>
                toRepairRoute({
                  route,
                  connMap: params.connMap,
                  minimumTraceWidth: params.minimumTraceWidth,
                  viaLayerSpan,
                }),
              )"""
              new="""    const repairRoutes = contextRoutes.map((route, index) => {
                let minimumTraceWidth = params.minimumTraceWidth
                if (index >= params.hdRoutes.length) minimumTraceWidth = undefined
                return toRepairRoute({
                  route,
                  connMap: params.connMap,
                  minimumTraceWidth,
                  viaLayerSpan,
                })
              })"""
              assert s.count(old)==1
              p.write_text(s.replace(old,new))
          PY
      - run: bun install
      - name: Run original full-board routing and clearance assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts
