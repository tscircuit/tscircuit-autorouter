name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pushes to the same PR currently run to completion; three of the
# recent PRs burned 2-3 full Bun Test runs each. Keep main runs un-cancelled.
concurrency:
  group: bun-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'version-bumps/')
    runs-on: ubuntu-latest
    # Balanced plans target roughly ten minutes of test work; leave room for
    # checkout, dependency installation, and runner variance.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3, 4, 5, 6, 7, 8, 9]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install

      - name: Run focused copper-preserving path tests
        if: matrix.node == 1
        run: >-
          bun test tests/stitch-solver/endpoint-path*.test.ts
          tests/stitch-solver/single-stitch-retains-moved-via-transition.test.ts
          tests/stitch-solver/single-stitch-explicitly-allowed-layer-transition.test.ts
          tests/stitch-solver/single-stitch-rejects-unowned-layer-transition.test.ts
          tests/stitch-solver/single-stitch-consumes-shared-point-before-continuation.test.ts
          tests/stitch-solver/single-high-density-route-stitch-gap-bridge.test.ts
          tests/stitch-solver/single-high-density-route-stitch-large-gap.test.ts
          tests/stitch-solver/single-high-density-route-stitch-terminal-gap.test.ts
          tests/stitch-solver/single-high-density-route-stitch-fanout-tags.test.ts
          tests/solvers/simplified-path-original-advance*.test.ts
          tests/solvers/simplified-path-actual-*.test.ts
          tests/solvers/simplified-path-thick-peer-query.test.ts
          tests/solvers/simplified-path-requested-pad-clearance.test.ts
          tests/solvers/single-simplified-path-exact-generated-duplicates.test.ts
          tests/features/trace-simplification-plated-hole-departure-identity.test.ts
          tests/features/pipeline9-preload-attachment-*.test.ts
          tests/features/pipeline9-assignable-preload-attachment-*.test.ts
          tests/features/pipeline9-physical-node-cut-*.test.ts
          tests/features/pipeline9-pad-area-terminal-*.test.ts
          tests/diagnostics/tiny-static-certificate-*.test.ts
          tests/solvers/multi-head-polyline-trace-width.test.ts
          tests/solvers/portfolio-multi-head-trace-width.test.ts
          tests/solvers/portfolio-trace-width-cache-schema.test.ts
          tests/solvers/fixed-copper-clearance-*.test.ts
          tests/solvers/fixed-copper-portal-sites-*.test.ts
          tests/solvers/available-physical-cut-*.test.ts
          tests/solvers/physical-node-cut-*.test.ts
          tests/solvers/single-high-density-physical-*.test.ts
          tests/caching/fixed-copper-clearance-fingerprint.test.ts
          tests/caching/cached-intra-physical-clearance-*.test.ts
          tests/caching/cached-portfolio-physical-clearance-*.test.ts
          tests/solvers/grow-shrink-physical-transform.test.ts
          tests/solvers/high-density-physical-board-layer-count.test.ts
          tests/solvers/intra-node-physical-via-span.test.ts
          tests/solvers/intra-node-physical-pairs-*.test.ts
          tests/solvers/intra-node-peer-clearance-*.test.ts
          tests/solvers/hd-peer-*.test.ts
          tests/caching/physical-pair-*.test.ts
          tests/solvers/physical-length-*.test.ts
          tests/solvers/ordered-port-placement-*.test.ts
          tests/solvers/pipeline9-canonical-port-net-ids.test.ts
          tests/solvers/pipeline9-fixed-pad-clearance-*.test.ts
          tests/solvers/pipeline9-fixed-pad-selection-invalid-sizes.test.ts
          tests/solvers/pipeline9-networked-fixed-pad-*.test.ts
          tests/features/pipeline9-networked-fixed-pad-routing-parity.test.ts
          tests/solvers/pipeline9-physical-*.test.ts
          tests/solvers/portfolio-physical-clearance-*.test.ts
          tests/solvers/representable-fixed-copper-channel-*.test.ts
          tests/solvers/tinygraph-fixed-copper-*.test.ts
          tests/solvers/tinygraph-physical-duplicate-capacity-*.test.ts
          tests/solvers/tinygraph-physical-cut-*.test.ts
          tests/solvers/tinygraph-wrapper-physical-*.test.ts
          tests/solvers/uniform-physical-clearance-*.test.ts
          --timeout 300000

      # Replaces `npm install -g @tscircuit/bun-test-plan && bun-test-plan`.
      # Distributes by recorded runtime instead of alphabetical round-robin,
      # and drops a global npm install from every shard.
      - name: Generate balanced test plans
        run: bun scripts/generate-balanced-test-plan.ts
        env:
          NODE_COUNT: 9

      - name: Run tests for node ${{ matrix.node }}
        run: |
          test_plan=".bun-test-plan/testplans/testplan${{ matrix.node }}.txt"
          if [ ! -f "$test_plan" ]; then
            echo "Test plan not found: $test_plan"
            exit 1
          fi

          mapfile -t test_files < "$test_plan"
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test files found in: $test_plan"
            exit 1
          fi

          echo "Running ${#test_files[@]} test files from $test_plan"
          bun test "${test_files[@]}" --timeout 300000

      - name: Upload diff PNG and SVG snapshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-png-and-snap-svg-artifacts-node${{ matrix.node }}
          path: |
            **/*.diff.png
            **/*.received.svg
            **/*.snap.svg
