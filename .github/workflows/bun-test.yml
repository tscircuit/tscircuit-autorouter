name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pushes to the same PR currently run to completion; three of the
# recent PRs burned 2-3 full Bun Test runs each. Keep main runs un-cancelled.
concurrency:
  group: bun-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'version-bumps/')
    runs-on: ubuntu-latest
    # Balanced plans target roughly ten minutes of test work; leave room for
    # checkout, dependency installation, and runner variance.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3, 4, 5, 6, 7, 8, 9]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install

      - name: Prepare embedded WASM
        uses: ./.github/actions/prepare-bindings

      - name: Run Rust solver tests
        if: matrix.node == 1
        run: cargo test --manifest-path rust/capacity-autorouter/Cargo.toml --locked
        env:
          CARGO_TARGET_DIR: rust/capacity-autorouter-bindings/target

      # Replaces `npm install -g @tscircuit/bun-test-plan && bun-test-plan`.
      # Distributes by recorded runtime instead of alphabetical round-robin,
      # and drops a global npm install from every shard.
      - name: Generate balanced test plans
        run: bun scripts/generate-balanced-test-plan.ts
        env:
          NODE_COUNT: 9

      - name: Run tests for node ${{ matrix.node }}
        run: |
          test_plan=".bun-test-plan/testplans/testplan${{ matrix.node }}.txt"
          if [ ! -f "$test_plan" ]; then
            echo "Test plan not found: $test_plan"
            exit 1
          fi

          mapfile -t test_files < "$test_plan"
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test files found in: $test_plan"
            exit 1
          fi

          echo "Running ${#test_files[@]} test files from $test_plan"
          # This full-board regression takes just over five minutes even on
          # successful main runs. Keep its assertions, but allow runner variance.
          slow_test="tests/features/pipeline9-srj18-sample2-bounded-regional-drc.test.ts"
          regular_tests=()
          has_slow_test=false
          for test_file in "${test_files[@]}"; do
            if [ "$test_file" = "$slow_test" ]; then
              has_slow_test=true
            else
              regular_tests+=("$test_file")
            fi
          done
          if [ "${#regular_tests[@]}" -gt 0 ]; then
            bun test "${regular_tests[@]}" --timeout 300000
          fi
          if [ "$has_slow_test" = true ]; then
            bun test "$slow_test" --timeout 600000
          fi

      - name: Upload diff PNG and SVG snapshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-png-and-snap-svg-artifacts-node${{ matrix.node }}
          path: |
            **/*.diff.png
            **/*.received.svg
            **/*.snap.svg
