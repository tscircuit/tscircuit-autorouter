# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Install bun-test-plan
        run: npm install -g @tscircuit/bun-test-plan

      - name: Generate test plans
        run: bun-test-plan

      - name: Run tests for node ${{ matrix.node }}
        run: bash .bun-test-plan/scripts/run-tests-node${{ matrix.node }}.sh

      - name: Upload diff PNG and SVG snapshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-png-and-snap-svg-artifacts-node${{ matrix.node }}
          path: |
            **/*.diff.png
            **/*.snap.svg
