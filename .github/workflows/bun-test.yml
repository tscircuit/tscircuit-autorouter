# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'version-bumps/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install

      - name: Install bun-test-plan
        run: npm install -g @tscircuit/bun-test-plan

      - name: Generate test plans
        run: bun-test-plan

      - name: Run tests for node ${{ matrix.node }}
        run: |
          test_plan=".bun-test-plan/testplans/testplan${{ matrix.node }}.txt"
          if [ ! -f "$test_plan" ]; then
            echo "Test plan not found: $test_plan"
            exit 1
          fi

          mapfile -t test_files < "$test_plan"
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test files found in: $test_plan"
            exit 1
          fi

          echo "Running ${#test_files[@]} test files from $test_plan"
          bun test "${test_files[@]}" --timeout 300000
      - name: Upload diff PNG and SVG snapshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-png-and-snap-svg-artifacts-node${{ matrix.node }}
          path: |
            **/*.diff.png
            **/*.received.svg
            **/*.snap.svg
