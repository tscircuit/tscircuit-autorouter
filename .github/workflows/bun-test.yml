name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pushes to the same PR currently run to completion; three of the
# recent PRs burned 2-3 full Bun Test runs each. Keep main runs un-cancelled.
concurrency:
  group: bun-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inherited-copper-and-stitching:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'version-bumps/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install

      # Keep the focused ownership and shared-stitch contracts observable even
      # when an unrelated large-board test consumes a balanced shard's budget.
      - name: Run inherited copper and stitching regressions
        run: |
          bun test \
            tests/features/pipeline9-joint-drc-*.test.ts \
            tests/features/pipeline9-inherited-drc-*.test.ts \
            tests/features/pipeline9-minimal-preloaded-trace-graph.test.ts \
            tests/features/pipeline7-dataset01-circuit143-trace-clearance.test.ts \
            tests/features/pipeline9-srj23-sample49-inherited-copper-repair.test.ts \
            tests/features/pipeline9-srj23-sample26-stitch-plated-hole.test.ts \
            tests/features/pipeline9-srj23-sample45-stitch-completion.test.ts \
            tests/features/pipeline7-srj20-sample169-multi-crossing-drc.test.ts \
            tests/features/pipeline9-srj23-sample21-regional-b01-repair.test.ts \
            tests/features/pipeline9-srj18-sample13-bounded-post-exact-precision.test.ts \
            tests/features/pipeline4-dataset01-circuit011-visual.test.ts \
            tests/bugs/bugreport59-82431e.test.ts \
            tests/bugs/bugreport88-9a86ed.test.ts \
            tests/stitch-solver \
            --timeout 300000

  test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'version-bumps/')
    runs-on: ubuntu-latest
    # Balanced plans target roughly ten minutes of test work; leave room for
    # checkout, dependency installation, and runner variance.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3, 4, 5, 6, 7, 8, 9]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install

      # Replaces `npm install -g @tscircuit/bun-test-plan && bun-test-plan`.
      # Distributes by recorded runtime instead of alphabetical round-robin,
      # and drops a global npm install from every shard.
      - name: Generate balanced test plans
        run: bun scripts/generate-balanced-test-plan.ts
        env:
          NODE_COUNT: 9

      - name: Run tests for node ${{ matrix.node }}
        run: |
          test_plan=".bun-test-plan/testplans/testplan${{ matrix.node }}.txt"
          if [ ! -f "$test_plan" ]; then
            echo "Test plan not found: $test_plan"
            exit 1
          fi

          mapfile -t test_files < "$test_plan"
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test files found in: $test_plan"
            exit 1
          fi

          echo "Running ${#test_files[@]} test files from $test_plan"
          bun test "${test_files[@]}" --timeout 300000

      - name: Upload diff PNG and SVG snapshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-png-and-snap-svg-artifacts-node${{ matrix.node }}
          path: |
            **/*.diff.png
            **/*.received.svg
            **/*.snap.svg
