name: Generate bugreport107 Linux snapshot

on:
  pull_request:
    paths:
      - .github/workflows/bugreport107-snapshot.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8
      - run: bun install
      - run: bun test tests/bugs/bugreport107-board-1726.test.ts --timeout 9999999
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bugreport107-linux-snapshot
          path: tests/bugs/__snapshots__/bugreport107-board-1726.snap.svg
          if-no-files-found: error
