name: Topology streaming comparison
on:
  pull_request:
  workflow_dispatch:
jobs:
  cramped_port_search:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      BUN_JSC_forceRAMSize: "2147483648"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
      - name: Compare exact candidate paths and bounded adjacency work
        run: |
          mkdir -p results base/scripts/benchmarks base/tests/fixtures
          cp head/scripts/benchmarks/measure-cramped-port-search.ts base/scripts/benchmarks/
          cp head/tests/fixtures/createWideCrampedPortGraph.ts base/tests/fixtures/
          for count in 64 4096 16384; do
            (cd base && bun scripts/benchmarks/measure-cramped-port-search.ts "$count") > "results/base-$count.json"
            (cd head && bun scripts/benchmarks/measure-cramped-port-search.ts "$count") > "results/head-$count.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for count in [64,4096,16384]:
            a=json.loads(Path(f'results/base-{count}.json').read_text());b=json.loads(Path(f'results/head-{count}.json').read_text())
            assert a['solved'] and b['solved'] and a['inputUnchanged'] and b['inputUnchanged']
            assert a['inputSha256']==b['inputSha256'] and a['outputSha256']==b['outputSha256']
            assert b['adjacencyListReads']<=13 and b['adjacencyEntriesRead']<=4*count+16
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cramped-port-search-comparison
          path: results/
  pathing_effort:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
      - name: Compare identical native controls and requested pathing budgets
        run: |
          mkdir -p results base/scripts/benchmarks
          cp head/scripts/benchmarks/measure-explicit-pathing-effort.ts base/scripts/benchmarks/
          (cd base && bun scripts/benchmarks/measure-explicit-pathing-effort.ts) > results/base.json
          (cd head && bun scripts/benchmarks/measure-explicit-pathing-effort.ts) > results/head.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('results/base.json').read_text());b=json.loads(Path('results/head.json').read_text())
          assert len(a)==len(b)==3
          for old,new in zip(a,b):
            assert old['solved'] and new['solved'] and old['drcErrorCount']==new['drcErrorCount']==0
            assert old['inputSha256']==new['inputSha256'] and old['outputSha256']==new['outputSha256']
            assert new['observedPathingEffort']==(new['requestedPathingEffort'] or 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explicit-pathing-effort-comparison
          path: results/
  stages:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 75
    env:
      BUN_JSC_forceRAMSize: "4294967296"
      BUN_JSC_miniVMHeapGrowthFactor: "1.05"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
      - name: Identical stage inputs and budgets
        run: |
          mkdir -p results
          bun head/scripts/benchmarks/measure-topology-streaming.ts base results/base-striped.json 160 > results/base-striped.log 2>&1
          bun head/scripts/benchmarks/measure-topology-streaming.ts head results/head-striped.json 160 > results/head-striped.log 2>&1
          bun head/scripts/benchmarks/measure-topology-streaming.ts base results/base-large.json 640 > results/base-large.log 2>&1
          bun head/scripts/benchmarks/measure-topology-streaming.ts head results/head-large.json 640 > results/head-large.log 2>&1
      - name: Require exact small-case output and completed large head case
        run: |
          bun -e 'const b=await Bun.file("results/base-striped.json").json(), h=await Bun.file("results/head-striped.json").json(), large=await Bun.file("results/head-large.json").json(), bl=await Bun.file("results/base-large.json").json(); if(!h.solved||!large.solved||!bl.solved||h.inputSha256!==b.inputSha256||h.outputSha256!==b.outputSha256||large.inputSha256!==bl.inputSha256||large.outputSha256!==bl.outputSha256||h.peakRetainedRegions>h.inputNodes*8)throw Error("Topology comparison did not meet completion, preservation, and memory criteria")'
      - name: Require bounded cached layer topology work
        run: |
          bun -e 'for (const size of ["striped", "large"]) { const h=await Bun.file(`results/head-${size}.json`).json(); if (!(h.stats.layerTopologyReuses>0) || !(h.stats.layerTopologyComputations<h.stats.atomicRegionCount/4) || h.stats.peakLayerTopologyCacheEntries>h.inputNodes*4) throw Error("Coverage cache cost or retention regressed") }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-streaming-stage-comparison
          path: results/
  canonical:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      BUN_JSC_forceRAMSize: "2147483648"
      BUN_JSC_miniVMHeapGrowthFactor: "1.05"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
      - name: Full fresh base and head routing benchmark
        run: |
          mkdir -p results
          (cd base && bash ./benchmark.sh --dataset dataset01 --pipeline 9 --concurrency 4 --effort 1 --sample-timeout 120s) > results/base.log 2>&1
          cp base/benchmark-result.json results/base.json
          (cd head && bash ./benchmark.sh --dataset dataset01 --pipeline 9 --concurrency 4 --effort 1 --sample-timeout 120s) > results/head.log 2>&1
          cp head/benchmark-result.json results/head.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-streaming-canonical-comparison
          path: results/

  validation:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
      - name: Compare disjoint validation without changing nodes
        run: |
          mkdir -p results
          for count in 4096 16384; do
            bun head/scripts/benchmarks/measure-topology-validation.ts base results/base-$count.json $count
            bun head/scripts/benchmarks/measure-topology-validation.ts head results/head-$count.json $count
          done
          bun -e 'for(const count of [4096,16384]) { const b=await Bun.file(`results/base-${count}.json`).json(), h=await Bun.file(`results/head-${count}.json`).json(); if(!b.validated||!h.validated||!b.outputUnchanged||!h.outputUnchanged||b.inputSha256!==h.inputSha256||h.geometryReads>count*20) throw Error("Validation behavior or geometry-work regression") }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-validation-comparison
          path: results/

  partial_targets:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
      - name: Compare partial target restoration on identical generated inputs
        run: |
          mkdir -p results
          for count in 1 128; do
            bun head/scripts/benchmarks/measure-partial-target-restoration.ts base results/base-$count.json $count
            bun head/scripts/benchmarks/measure-partial-target-restoration.ts head results/head-$count.json $count
          done
          bun -e 'for(const count of [1,128]) {const b=await Bun.file(`results/base-${count}.json`).json(),h=await Bun.file(`results/head-${count}.json`).json(); if(!h.solved||h.failed||!h.inputUnchanged||h.inputSha256!==b.inputSha256||Math.abs(h.padArea-count*0.1575)>1e-8)throw Error("Target restoration geometry regression")}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-target-restoration-comparison
          path: results/

  target_edges:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
      - name: Compare identical target graphs and require exact ordered edges
        run: |
          mkdir -p results
          for count in 4096 16384; do
            bun head/scripts/benchmarks/measure-target-edge-completion.ts base results/base-$count.json $count
            bun head/scripts/benchmarks/measure-target-edge-completion.ts head results/head-$count.json $count
          done
          bun -e 'for(const count of [4096,16384]) {const b=await Bun.file(`results/base-${count}.json`).json(),h=await Bun.file(`results/head-${count}.json`).json(); if(!b.solved||!h.solved||b.failed||h.failed||!b.inputUnchanged||!h.inputUnchanged||b.inputSha256!==h.inputSha256||b.outputSha256!==h.outputSha256||h.edges!==count)throw Error("Native target edge completion or ordered geometry changed")}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-edge-completion-comparison
          path: results/

  owned_target_access:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
      - name: Compare owned target access with identical graph geometry
        run: |
          mkdir -p results
          for count in 1 128; do
            bun head/scripts/benchmarks/measure-owned-target-routing-access.ts base results/base-$count.json $count
            bun head/scripts/benchmarks/measure-owned-target-routing-access.ts head results/head-$count.json $count
          done
          bun -e 'for(const count of [1,128]) {const b=await Bun.file(`results/base-${count}.json`).json(),h=await Bun.file(`results/head-${count}.json`).json(); if(!h.solved||h.failed||!b.inputUnchanged||!h.inputUnchanged||b.inputSha256!==h.inputSha256||b.orderedEdgeSha256!==h.orderedEdgeSha256||h.edges!==count*3)throw Error("Owned target validation or graph geometry regression")}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-target-access-comparison
          path: results/
