name: Autorouting Benchmark

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      solver_name:
        description: 'Solver name to benchmark (optional, default: AutoroutingPipelineSolver9_PreloadedTraceGraph; use "all" for all solvers)'
        required: false
        type: string
      scenario_limit:
        description: Number of scenarios to run (optional)
        required: false
        type: string
      effort:
        description: Effort multiplier to apply to each scenario (optional)
        required: false
        type: string
      concurrency:
        description: Number of workers per solver (or "auto")
        required: false
        default: "auto"
        type: string
      include_assignable:
        description: Include assignable pipelines
        required: false
        default: false
        type: boolean
      dataset_name:
        description: "Dataset to benchmark (optional: dataset01, zdwiel, srj05, srj11, srj12, srj13, srj14, srj15, srj16, srj18, srj19, srj20, srj21, srj23, srj24, srj27, srj28, srj29, or srj33)"
        required: false
        type: string
      profile_solvers:
        description: Show profile-solvers output for the benchmark scenarios
        required: false
        default: false
        type: boolean
      ref:
        description: Git ref (branch, tag, or SHA) to benchmark
        required: false
        type: string
      pr_number:
        description: Pull request number where this benchmark posts its result
        required: false
        type: string
      benchmark_args_json:
        description: JSON argument array forwarded from an authorized PR comment
        required: false
        type: string
      long_benchmark:
        description: Run on 8 vCPUs with an eight-hour timeout
        required: false
        default: false
        type: boolean
      same_machine_compare:
        description: Run current main and the PR head sequentially on one Blacksmith runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    name: Run benchmark
    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.same_machine_compare != true
      ) || (
        github.event_name == 'push' &&
        github.ref_name == 'main'
      ) || (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.title, '[BENCHMARK TEST]')
      )
    runs-on: ${{ inputs.long_benchmark && 'blacksmith-8vcpu-ubuntu-2404-arm' || vars.BENCHMARK_RUNNER || 'blacksmith-32vcpu-ubuntu-2404-arm' }}
    timeout-minutes: ${{ inputs.long_benchmark && 480 || 120 }}

    steps:
      - name: Parse benchmark command
        id: parse
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          script: |
            const allSolversAliases = new Set(['all', '_'])
            const usesNetworkedPipeline9 = (args) => args.some(
              (arg, index) =>
                arg === '--pipeline' &&
                String(args[index + 1] || '').toLowerCase() === '9net',
            )

            let benchmarkArgs = []
            let benchmarkConcurrency = ''
            let profileSolvers = false
            let ref = context.sha
            let statusCommentId = ''

            const buildProfileSolversArgs = (args) => {
              const profileArgs = []
              const positionals = []

              for (let i = 0; i < args.length; i += 1) {
                const arg = args[i]
                if (
                  [
                    '--scenario-limit',
                    '--limit',
                    '--dataset',
                    '--effort',
                    '--concurrency',
                    '--sample-timeout',
                  ].includes(arg)
                ) {
                  const value = args[i + 1]
                  if (value && !value.startsWith('-')) {
                    profileArgs.push(
                      arg === '--limit' ? '--scenario-limit' : arg,
                      value,
                    )
                    i += 1
                  }
                  continue
                }

                if (!arg.startsWith('-')) {
                  positionals.push(arg)
                  continue
                }

                if (
                  [
                    '--solver',
                    '--pipeline',
                  ].includes(arg)
                ) {
                  i += 1
                }
              }

              if (
                !profileArgs.includes('--scenario-limit') &&
                positionals.length >= 2 &&
                /^\d+$/.test(positionals[1])
              ) {
                profileArgs.push('--scenario-limit', positionals[1])
              }

              return profileArgs
            }

            if (context.eventName === 'workflow_dispatch') {
              const inputs = context.payload.inputs || {}
              const forwardedArgsJson = (inputs.benchmark_args_json || '').trim()
              const datasetName = (inputs.dataset_name || '').trim()

              if (forwardedArgsJson) {
                const forwardedArgs = JSON.parse(forwardedArgsJson)
                if (
                  !Array.isArray(forwardedArgs) ||
                  forwardedArgs.some((arg) => typeof arg !== 'string')
                ) {
                  throw new Error('benchmark_args_json must be a JSON array of strings')
                }
                benchmarkArgs.push(...forwardedArgs)
              } else {
                const requestedSolver = (inputs.solver_name || '').trim()
                if (requestedSolver) {
                  if (allSolversAliases.has(requestedSolver.toLowerCase())) {
                    benchmarkArgs.push('all')
                  } else {
                    benchmarkArgs.push('--solver', requestedSolver)
                  }
                }

                const scenarioLimit = (inputs.scenario_limit || '').trim()
                const effort = (inputs.effort || '').trim()
                const concurrency = (inputs.concurrency || '').trim()
                const includeAssignable = inputs.include_assignable === true || inputs.include_assignable === 'true'
                if (scenarioLimit) {
                  benchmarkArgs.push('--scenario-limit', scenarioLimit)
                }
                if (effort) {
                  benchmarkArgs.push('--effort', effort)
                }
                if (includeAssignable) {
                  benchmarkArgs.push('--include-assignable')
                }
                if (concurrency && concurrency.toLowerCase() !== 'auto') {
                  benchmarkConcurrency = concurrency
                  benchmarkArgs.push('--concurrency', concurrency)
                }

                if (datasetName) {
                  benchmarkArgs.push('--dataset', datasetName)
                }
              }
              profileSolvers = inputs.profile_solvers === true || inputs.profile_solvers === 'true'
              ref = (inputs.ref || '').trim() || ref
              const prNumber = (inputs.pr_number || '').trim()
              if (prNumber) {
                const issueNumber = Number(prNumber)
                if (!Number.isInteger(issueNumber) || issueNumber < 1) {
                  throw new Error(`Invalid pull request number: ${prNumber}`)
                }
                const benchmarkLabel = datasetName === 'dataset01' ? 'Default Benchmark' : datasetName
                const statusComment = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `## ${benchmarkLabel}\n\nQueued on \`${ref.slice(0, 7)}\`.\n\nWorkflow: [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
                })
                statusCommentId = String(statusComment.data.id)
              }
            }

            if (context.eventName === 'pull_request') {
              ref = context.payload.pull_request.head.sha
            }

            core.setOutput('benchmark_args_json', JSON.stringify(benchmarkArgs))
            core.setOutput('benchmark_concurrency', benchmarkConcurrency)
            core.setOutput('profile_solvers', profileSolvers ? 'true' : 'false')
            core.setOutput('profile_solvers_args_json', JSON.stringify(buildProfileSolversArgs(benchmarkArgs)))
            core.setOutput('pipeline9_networked', usesNetworkedPipeline9(benchmarkArgs) ? 'true' : 'false')
            core.setOutput('ref', ref)
            core.setOutput('status_comment_id', statusCommentId)

      - name: Create Pipeline9 network cache benchmark namespace
        id: networked-cache
        if: steps.parse.outputs.pipeline9_networked == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { randomUUID } = require('node:crypto')
            const repositoryId = String(context.payload.repository.id)
            const runId = String(process.env.GITHUB_RUN_ID)
            const runAttempt = String(process.env.GITHUB_RUN_ATTEMPT)
            if (![repositoryId, runId, runAttempt].every((value) => /^\d+$/.test(value))) {
              throw new Error('GitHub repository/run identifiers are unavailable')
            }
            const cacheVersion = `benchmark-${repositoryId}-${runId}-${runAttempt}-${randomUUID()}`
            core.setOutput('cache_version', cacheVersion)

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.ref }}
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify production Pipeline9 network cache support
        if: steps.parse.outputs.pipeline9_networked == 'true'
        env:
          HD_CACHE2_SERVER_URL: https://hd-cache2.tscircuit.com
          HD_CACHE2_CACHE_VERSION: ${{ steps.networked-cache.outputs.cache_version }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs')

          const run = async () => {
            const autorouterVersion = JSON.parse(readFileSync('package.json', 'utf8')).version
            const cacheVersion = process.env.HD_CACHE2_CACHE_VERSION
            const response = await fetch(`${process.env.HD_CACHE2_SERVER_URL}/health`, {
              headers: { accept: 'application/json' },
            })
            const responseText = await response.text()
            let body
            try {
              body = responseText ? JSON.parse(responseText) : null
            } catch {
              throw new Error(`hd-cache2 preflight returned invalid JSON (${response.status})`)
            }
            if (
              !response.ok ||
              body?.ok !== true ||
              body.autorouterVersion !== autorouterVersion ||
              body.benchmarkCacheVersionSupported !== true ||
              body.benchmarkCacheVersionAccess !== 'open'
            ) {
              throw new Error(`hd-cache2 preflight failed (${response.status}): ${body?.message || 'invalid response'}`)
            }
            console.log(`hd-cache2 supports autorouter ${autorouterVersion}; using fresh benchmark namespace ${cacheVersion}`)
          }

          run().catch((error) => {
            console.error(error.message)
            process.exit(1)
          })
          NODE

      - name: Load main branch benchmark datasets
        id: main-datasets
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          DATASETS_JSON="$(bun --eval 'import { getMainBranchBenchmarkDatasets } from "./scripts/benchmark/main-branch-datasets"; console.log(JSON.stringify(getMainBranchBenchmarkDatasets()))')"
          echo "datasets_json=${DATASETS_JSON}" >> "$GITHUB_OUTPUT"
          echo "Main branch benchmark datasets: ${DATASETS_JSON}"

      - name: Download previous best via counts
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/benchmark.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo "")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo '{"version":1,"kind":"benchmark-best-vias","records":[]}' > benchmark-best-vias-previous.json
            exit 0
          fi
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name benchmark-result --dir ./previous-main-artifact 2>/dev/null || true
          if [ -f ./previous-main-artifact/benchmark-best-vias.json ]; then
            cp ./previous-main-artifact/benchmark-best-vias.json benchmark-best-vias-previous.json
          else
            echo '{"version":1,"kind":"benchmark-best-vias","records":[]}' > benchmark-best-vias-previous.json
          fi

      - name: Run benchmark
        env:
          BENCHMARK_ARGS_JSON: ${{ steps.parse.outputs.benchmark_args_json }}
          BENCHMARK_CONCURRENCY: ${{ steps.parse.outputs.benchmark_concurrency }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MAIN_BRANCH_BENCHMARK_DATASETS_JSON: ${{ steps.main-datasets.outputs.datasets_json }}
          BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: ${{ vars.BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS || vars.BENCHMARK_TASK_TIMEOUT_MS || '60000' }}
          BENCHMARK_HEARTBEAT_INTERVAL_MS: ${{ vars.BENCHMARK_HEARTBEAT_INTERVAL_MS || '30000' }}
          BENCHMARK_TERMINATE_TIMEOUT_MS: ${{ vars.BENCHMARK_TERMINATE_TIMEOUT_MS || '1000' }}
          BENCHMARK_NETWORKED_CACHE_PROPAGATION_DELAY_MS: '65000'
          HD_CACHE2_SERVER_URL: https://hd-cache2.tscircuit.com
          HD_CACHE2_CACHE_VERSION: ${{ steps.networked-cache.outputs.cache_version }}
        run: |
          chmod +x ./benchmark.sh
          node <<'NODE'
          const fs = require('node:fs')
          const { spawnSync } = require('node:child_process')

          const args = JSON.parse(process.env.BENCHMARK_ARGS_JSON || '[]')
          const mainBranchDatasets = JSON.parse(process.env.MAIN_BRANCH_BENCHMARK_DATASETS_JSON || '[]')
          const isMainPush = process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF_NAME === 'main'

          const withDataset = (baseArgs, datasetName) => {
            const nextArgs = []
            for (let i = 0; i < baseArgs.length; i += 1) {
              const arg = baseArgs[i]
              if (arg === '--dataset') {
                i += 1
                continue
              }
              nextArgs.push(arg)
            }
            nextArgs.push('--dataset', datasetName)
            return nextArgs
          }

          const withMainBranchDatasetArgs = (baseArgs, datasetName) => {
            const nextArgs = withDataset(baseArgs, datasetName)
            if (datasetName === 'srj18') {
              nextArgs.push('--pipeline', '7')
            }
            return nextArgs
          }

          const runBenchmark = (benchmarkArgs) => {
            const renderedArgs = benchmarkArgs.map((arg) => JSON.stringify(arg)).join(' ')
            console.log(`Running benchmark command: ./benchmark.sh${renderedArgs ? ` ${renderedArgs}` : ''}`)

            const result = spawnSync('./benchmark.sh', benchmarkArgs, {
              stdio: 'inherit',
              env: process.env,
            })

            if (result.error) {
              throw result.error
            }

            if ((result.status ?? 1) !== 0) {
              process.exit(result.status ?? 1)
            }
          }

          if (isMainPush && mainBranchDatasets.length > 0) {
            const reports = []
            const textReports = []

            for (const datasetName of mainBranchDatasets) {
              runBenchmark(withMainBranchDatasetArgs(args, datasetName))

              const report = JSON.parse(fs.readFileSync('benchmark-result.json', 'utf8'))
              const text = fs.readFileSync('benchmark-result.txt', 'utf8').trim()
              reports.push(report)
              textReports.push(`## Dataset: ${report.datasetName || datasetName}\n\n${text}`)
            }

            fs.writeFileSync(
              'benchmark-result.json',
              JSON.stringify(
                {
                  version: 2,
                  kind: 'benchmark-report-collection',
                  generatedFor: 'main',
                  reports,
                },
                null,
                2,
              ),
            )
            fs.writeFileSync('benchmark-result.txt', `${textReports.join('\n\n---\n\n')}\n`)
            process.exit(0)
          }

          const renderedArgs = args.map((arg) => JSON.stringify(arg)).join(' ')
          console.log(`Running benchmark command: ./benchmark.sh${renderedArgs ? ` ${renderedArgs}` : ''}`)

          const result = spawnSync('./benchmark.sh', args, {
            stdio: 'inherit',
            env: process.env,
          })

          if (result.error) {
            throw result.error
          }

          process.exit(result.status ?? 1)
          NODE
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            bun scripts/benchmark/best-via-counts.ts merge --previous benchmark-best-vias-previous.json --current benchmark-result.json --out benchmark-best-vias.json
          else
            bun scripts/benchmark/best-via-counts.ts write-from-report --report benchmark-result.json --out benchmark-best-vias.json
          fi
          cp benchmark-result.txt benchmark-result-pr.txt
          cp benchmark-result.json benchmark-result-pr.json

      - name: Write raw benchmark execution metadata
        env:
          BENCHMARK_ARGS_JSON: ${{ steps.parse.outputs.benchmark_args_json }}
          BENCHMARK_RUNNER_NAME: ${{ runner.name }}
          BENCHMARK_RUNNER_OS: ${{ runner.os }}
          BENCHMARK_RUNNER_ARCH: ${{ runner.arch }}
          BENCHMARK_SAMPLE_TIMEOUT_BASE_MS: ${{ vars.BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS || vars.BENCHMARK_TASK_TIMEOUT_MS || '60000' }}
          BENCHMARK_HEARTBEAT_INTERVAL_MS: ${{ vars.BENCHMARK_HEARTBEAT_INTERVAL_MS || '30000' }}
          BENCHMARK_TERMINATE_TIMEOUT_MS: ${{ vars.BENCHMARK_TERMINATE_TIMEOUT_MS || '1000' }}
          BENCHMARK_MAIN_DATASETS: ${{ steps.main-datasets.outputs.datasets_json || '[]' }}
          BENCHMARK_REPOSITORY: ${{ github.repository }}
          BENCHMARK_WORKFLOW_NAME: ${{ github.workflow }}
          BENCHMARK_EVENT_NAME: ${{ github.event_name }}
          BENCHMARK_REF_NAME: ${{ github.ref_name }}
          BENCHMARK_RUN_ID: ${{ github.run_id }}
          BENCHMARK_RUN_ATTEMPT: ${{ github.run_attempt }}
          BENCHMARK_COMMIT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const readRequiredEnv = (name) => {
            const value = process.env[name]
            if (typeof value !== 'string' || value.trim() === '') {
              throw new Error(`Missing required environment variable ${name}`)
            }
            return value
          }
          const parseStringArrayEnv = (name) => {
            const rawValue = readRequiredEnv(name)
            let value
            try {
              value = JSON.parse(rawValue)
            } catch (error) {
              throw new Error(`Invalid JSON in ${name}: ${error.message}`)
            }
            if (!Array.isArray(value) || !value.every((item) => typeof item === 'string')) {
              throw new Error(`${name} must be a JSON array of strings`)
            }
            return value
          }
          const parsePositiveIntegerEnv = (name) => {
            const value = Number(readRequiredEnv(name))
            if (!Number.isInteger(value) || value < 1) {
              throw new Error(`${name} must be a positive integer`)
            }
            return value
          }
          const metadata = {
            repository: readRequiredEnv('BENCHMARK_REPOSITORY'),
            workflowName: readRequiredEnv('BENCHMARK_WORKFLOW_NAME'),
            eventName: readRequiredEnv('BENCHMARK_EVENT_NAME'),
            refName: readRequiredEnv('BENCHMARK_REF_NAME'),
            workflowRunId: readRequiredEnv('BENCHMARK_RUN_ID'),
            workflowRunAttempt: parsePositiveIntegerEnv('BENCHMARK_RUN_ATTEMPT'),
            commitSha: readRequiredEnv('BENCHMARK_COMMIT_SHA'),
            createdAt: new Date().toISOString(),
            runner: {
              name: readRequiredEnv('BENCHMARK_RUNNER_NAME'),
              os: readRequiredEnv('BENCHMARK_RUNNER_OS'),
              arch: readRequiredEnv('BENCHMARK_RUNNER_ARCH'),
            },
            benchmarkArgs: parseStringArrayEnv('BENCHMARK_ARGS_JSON'),
            mainBranchDatasets: parseStringArrayEnv('BENCHMARK_MAIN_DATASETS'),
            timeoutConfiguration: {
              perEffortMs: parsePositiveIntegerEnv('BENCHMARK_SAMPLE_TIMEOUT_BASE_MS'),
              heartbeatIntervalMs: parsePositiveIntegerEnv('BENCHMARK_HEARTBEAT_INTERVAL_MS'),
              terminateTimeoutMs: parsePositiveIntegerEnv('BENCHMARK_TERMINATE_TIMEOUT_MS'),
            },
          }
          fs.writeFileSync('benchmark-run-metadata.json', JSON.stringify(metadata, null, 2))
          NODE

      - name: Download main branch benchmark result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/benchmark.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo "")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "(no main branch benchmark result available)" > benchmark-result-main.txt
            echo "" > benchmark-result-main.json
            echo "" > benchmark-best-vias-main.json
            bun scripts/benchmark/best-via-counts.ts write-cells --best-vias benchmark-best-vias-main.json --report benchmark-result-pr.json --out benchmark-via-cells.json
            exit 0
          fi
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name benchmark-result --dir ./main-artifact 2>/dev/null || true
          if [ -f ./main-artifact/benchmark-result.txt ]; then
            cp ./main-artifact/benchmark-result.txt benchmark-result-main.txt
          else
            echo "(no main branch benchmark result available)" > benchmark-result-main.txt
          fi
          if [ -f ./main-artifact/benchmark-result.json ]; then
            cp ./main-artifact/benchmark-result.json benchmark-result-main.json
          else
            echo "" > benchmark-result-main.json
          fi
          if [ -f ./main-artifact/benchmark-best-vias.json ]; then
            cp ./main-artifact/benchmark-best-vias.json benchmark-best-vias-main.json
          else
            echo "" > benchmark-best-vias-main.json
          fi
          bun scripts/benchmark/best-via-counts.ts write-cells --best-vias benchmark-best-vias-main.json --report benchmark-result-pr.json --out benchmark-via-cells.json

      - name: Post benchmark result comment before profile-solvers
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && steps.parse.outputs.status_comment_id != ''
        uses: actions/github-script@v7
        env:
          STATUS_COMMENT_ID: ${{ steps.parse.outputs.status_comment_id }}
          BENCHMARK_DATASET: ${{ inputs.dataset_name }}
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs')
            const { pathToFileURL } = require('node:url')
            const comparisonUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/benchmark/benchmark-comment-comparison.js`,
            ).href
            const comparisonModule = await import(comparisonUrl)
            const { renderBenchmarkComparison } = comparisonModule
            const isNetworkedColdHotReport =
              typeof comparisonModule.isNetworkedColdHotReport === 'function'
                ? comparisonModule.isNetworkedColdHotReport
                : (report) => {
                    if (!Array.isArray(report?.summary)) return false
                    const names = new Set(report.summary.map((row) => row.solverName))
                    return names.has('Pipeline9_Networked Cold') && names.has('Pipeline9_Networked Hot')
                  }
            const maxLength = 60000
            const truncate = (s, max) => s.length > max ? `${s.slice(0, max)}\n\n...truncated...` : s
            const formatTime = (timeMs) => {
              if (typeof timeMs !== 'number' || !Number.isFinite(timeMs)) {
                return 'n/a'
              }
              return timeMs < 1000 ? `${Math.round(timeMs)}ms` : `${(timeMs / 1000).toFixed(1)}s`
            }
            const formatAverage = (value) => {
              if (typeof value !== 'number' || !Number.isFinite(value)) {
                return 'n/a'
              }
              return value.toFixed(2)
            }
            const getStatus = (test) => {
              if (test.didTimeout) return 'Timeout'
              if (test.didSolve) return 'Solved'
              return 'Failed'
            }
            const getDrc = (test) => {
              if (!test.didSolve) return 'Failed'
              return test.relaxedDrcPassed ? 'Passed' : 'Failed'
            }
            const escapeHtml = (value) =>
              String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/\|/g, '&#124;')
            const formatSolverName = (solverName) =>
              String(solverName ?? '').replace(/^AutoroutingPipelineSolver(\d+).*$/, 'Pipeline$1')
            const formatEffortSuffix = (effortLabel) => {
              const label = String(effortLabel ?? '')
              const match = label.match(/^(\d+)x effort$/)
              if (!match) return label === 'mixed effort' ? '(mixed)' : ''
              const effort = Number.parseInt(match[1], 10)
              return Number.isFinite(effort) && effort > 1 ? `(${effort}x)` : ''
            }
            const formatSolverDisplayName = (solverName, effortLabel) =>
              `${formatSolverName(solverName)}${formatEffortSuffix(effortLabel)}`
            const getSampleLabel = (test) => {
              if (typeof test?.sampleNumber === 'number' && Number.isFinite(test.sampleNumber)) {
                return String(test.sampleNumber)
              }
              const match = String(test?.scenarioName ?? '').match(/\d+/)
              return match ? String(Number.parseInt(match[0], 10)) : String(test?.scenarioName ?? '')
            }
            const getErrorCell = (test) => {
              if (!test?.error) return ''
              const label = test.errorSolverName || test.errorPhaseName || (test.didTimeout ? 'Timeout' : 'Error')
              const detailLines = [
                test.errorPhaseName && test.errorSolverName && test.errorPhaseName !== test.errorSolverName
                  ? `Phase: ${test.errorPhaseName}`
                  : '',
                test.error,
              ].filter(Boolean)
              const details = escapeHtml(detailLines.join('\n')).replace(/\r?\n/g, '<br>')
              return `<details><summary>${escapeHtml(label)}</summary><code>${details}</code></details>`
            }
            const renderSummary = (report) => {
              if (!Array.isArray(report?.summary) || report.summary.length === 0) {
                return []
              }
              return [
                `Dataset: ${report.datasetName}`,
                `Scenarios: ${report.scenarioCount}`,
                `Effort: ${report.effortLabel}`,
                '',
                '| Solver | Completed % | Relaxed DRC Pass % | Timed Out | P50 Time | P95 Time | Avg Via |',
                '| --- | --- | --- | --- | --- | --- | --- |',
                ...report.summary.map((row) =>
                  `| ${formatSolverDisplayName(row.solverName, report.effortLabel)} | ${row.completedRateLabel} | ${row.relaxedDrcRateLabel} | ${row.timedOutLabel} | ${formatTime(row.p50TimeMs)} | ${formatTime(row.p95TimeMs)} | ${formatAverage(row.avgVia)} |`,
                ),
              ]
            }
            const getOutcomeScore = (test) => {
              if (!test?.didSolve) return 0
              if (test.relaxedDrcPassed) return 2
              return 1
            }
            const buildMainIndex = (report) => {
              if (!Array.isArray(report?.tests)) return new Map()
              return new Map(
                report.tests.map((test) => [
                  `${test.solverName}::${test.scenarioName}`,
                  test,
                ]),
              )
            }
            const buildViaCellIndex = (report) => {
              if (!Array.isArray(report?.cells)) return new Map()
              return new Map(
                report.cells.map((cell) => [
                  `${cell.datasetName}::${cell.solverName}::${cell.scenarioName}`,
                  cell.label,
                ]),
              )
            }
            const getDelta = (test, mainIndex) => {
              if (!mainIndex) return ''
              const key = `${test.solverName}::${test.scenarioName}`
              const mainTest = mainIndex.get(key)
              if (!mainTest) return ''
              const prScore = getOutcomeScore(test)
              const mainScore = getOutcomeScore(mainTest)
              if (prScore > mainScore) return 'Improved'
              if (prScore < mainScore) return 'Regressed'
              return ''
            }
            const getViaCell = (test, viaCellIndex, datasetName) => {
              const key = `${datasetName}::${test.solverName}::${test.scenarioName}`
              const viaCell = viaCellIndex?.get(key)
              if (viaCell) return viaCell
              return typeof test?.viaCount === 'number' ? String(test.viaCount) : ''
            }
            const isUnchangedPassingTest = (test, mainIndex) => {
              if (!mainIndex) return false
              const key = `${test.solverName}::${test.scenarioName}`
              const mainTest = mainIndex.get(key)
              const sameSolverViaUnchanged =
                typeof test.viaCount === 'number' ||
                typeof mainTest?.viaCount === 'number'
                  ? test.viaCount === mainTest?.viaCount
                  : true
              return (
                Boolean(mainTest) &&
                test.didSolve &&
                test.relaxedDrcPassed &&
                mainTest.didSolve &&
                mainTest.relaxedDrcPassed &&
                sameSolverViaUnchanged
              )
            }
            const renderTests = (report, options = {}) => {
              const includeDelta = Boolean(options.includeDelta)
              const mainIndex = options.mainIndex
              const viaCellIndex = options.viaCellIndex
              if (!Array.isArray(report?.tests) || report.tests.length === 0) {
                return ['Per-test results unavailable.']
              }
              const omitUnchangedPassingSamples = Boolean(options.omitUnchangedPassingSamples)
              const tests =
                includeDelta && omitUnchangedPassingSamples
                  ? report.tests.filter((test) => !isUnchangedPassingTest(test, mainIndex))
                  : report.tests
              const omittedCount = report.tests.length - tests.length
              const header = includeDelta
                ? [
                    '| Solver | Sample | Status | Via | Time | Relaxed DRC | Error | Delta |',
                    '| --- | --- | --- | ---: | --- | --- | --- | --- |',
                  ]
                : [
                    '| Solver | Sample | Status | Via | Time | Relaxed DRC | Error |',
                    '| --- | --- | --- | ---: | --- | --- | --- |',
                  ]
              return [
                ...(omittedCount > 0
                  ? [`_${omittedCount} unchanged passing sample${omittedCount === 1 ? '' : 's'} omitted to keep the PR comment under GitHub's size limit._`, '']
                  : []),
                ...header,
                ...tests.map((test) =>
                  includeDelta
                    ? `| ${formatSolverName(test.solverName)} | ${getSampleLabel(test)} | ${getStatus(test)} | ${getViaCell(test, viaCellIndex, report.datasetName)} | ${formatTime(test.elapsedTimeMs)} | ${getDrc(test)} | ${getErrorCell(test)} | ${getDelta(test, mainIndex)} |`
                    : `| ${formatSolverName(test.solverName)} | ${getSampleLabel(test)} | ${getStatus(test)} | ${getViaCell(test, viaCellIndex, report.datasetName)} | ${formatTime(test.elapsedTimeMs)} | ${getDrc(test)} | ${getErrorCell(test)} |`,
                ),
              ]
            }
            const renderReport = (report, fallbackText, options = {}) => {
              if (!report) {
                if (options.omitSummary) return []
                return ['```', truncate(fallbackText, maxLength), '```']
              }
              return [
                ...(options.omitSummary ? [] : renderSummary(report)),
                ...(options.omitDetails
                  ? []
                  : [
                      '',
                      '<details>',
                      `<summary>${options.detailsLabel ?? 'Details'}</summary>`,
                      '',
                      ...renderTests(report, options),
                      '</details>',
                    ]),
              ]
            }
            const getBenchmarkReports = (report) => {
              if (Array.isArray(report?.reports)) {
                return report.reports.filter(Boolean)
              }
              return report ? [report] : []
            }
            const getMainReportForDataset = (mainReport, datasetName) => {
              if (!datasetName) return null
              return getBenchmarkReports(mainReport).find((report) => report?.datasetName === datasetName) ?? null
            }
            const renderPreviousMainSummary = (report, datasetName) => {
              if (report) {
                return renderReport(report, '', { omitDetails: true })
              }
              const datasetLabel = datasetName ? ` for \`${escapeHtml(datasetName)}\`` : ''
              return [`_No previous main run is available${datasetLabel}._`]
            }
            const readJson = (path) => {
              if (!fs.existsSync(path)) return null
              const raw = fs.readFileSync(path, 'utf8').trim()
              if (!raw) return null
              try {
                return JSON.parse(raw)
              } catch {
                return null
              }
            }
            const readText = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : null

            const prText = readText('benchmark-result-pr.txt') ?? readText('benchmark-result.txt')
            const prReport = readJson('benchmark-result-pr.json') ?? readJson('benchmark-result.json')
            const mainReport = readJson('benchmark-result-main.json')
            const viaCellReport = readJson('benchmark-via-cells.json')
            const benchmarkDatasetName = prReport?.datasetName ?? process.env.BENCHMARK_DATASET
            const mainDatasetReport = getMainReportForDataset(mainReport, benchmarkDatasetName)
            const mainIndex = buildMainIndex(mainDatasetReport)
            const viaCellIndex = buildViaCellIndex(viaCellReport)
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            const profileEnabled = '${{ steps.parse.outputs.profile_solvers }}' === 'true'
            const benchmarkLabel = process.env.BENCHMARK_DATASET === 'dataset01' ? 'Default Benchmark' : (process.env.BENCHMARK_DATASET || 'Benchmark')
            const networkedColdHot = isNetworkedColdHotReport(prReport)

            const renderBody = (options = {}) => [
              `## ${benchmarkLabel} Results`,
              '',
              ...(profileEnabled
                ? [
                    '**Profile Solvers:** running. Benchmark results are ready; profile comparison tables will be added when profiling finishes.',
                    '',
                  ]
                : []),
              networkedColdHot
                ? '### Pipeline9_Networked Cold vs Hot'
                : '### Main vs PR',
              '',
              ...renderBenchmarkComparison({
                mainReport: mainDatasetReport,
                prReport,
                fallbackText: prText ?? '(benchmark results were not produced)',
                maxLength,
              }),
              '',
              ...(networkedColdHot
                ? []
                : renderReport(mainDatasetReport, '', {
                    detailsLabel: 'Previous main run details',
                    omitSummary: true,
                  })),
              '',
              ...renderReport(prReport, prText ?? '(benchmark results were not produced)', {
                detailsLabel: networkedColdHot ? 'Cold/hot run details' : 'PR run details',
                omitSummary: true,
                includeDelta: !networkedColdHot,
                mainIndex,
                viaCellIndex,
                omitUnchangedPassingSamples: Boolean(options.omitUnchangedPassingSamples),
              }),
              ...(profileEnabled
                ? [
                    '',
                    'Profile solver comparison is still running.',
                  ]
                : []),
              '',
              `Workflow: [View run](${runUrl})`,
              `Artifact: ${runUrl}`,
            ].join('\n')
            const fullBody = renderBody()
            const filteredBody =
              fullBody.length > maxLength
                ? renderBody({ omitUnchangedPassingSamples: true })
                : fullBody

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.STATUS_COMMENT_ID),
              body: filteredBody,
            })

      - name: Run profile-solvers (PR)
        if: steps.parse.outputs.profile_solvers == 'true'
        env:
          PROFILE_SOLVERS_ARGS_JSON: ${{ steps.parse.outputs.profile_solvers_args_json }}
          PROFILE_SOLVERS_HEARTBEAT_INTERVAL_MS: ${{ vars.PROFILE_SOLVERS_HEARTBEAT_INTERVAL_MS || '40000' }}
          PROFILE_SOLVERS_TIMEOUT_MS: ${{ vars.PROFILE_SOLVERS_TIMEOUT_MS || '700000' }}
        run: |
          node <<'NODE'
          const { copyFileSync, createWriteStream, existsSync } = require('node:fs')
          const { spawn } = require('node:child_process')

          const getProfileSolversTimeoutMs = () => {
            const timeoutMs = Number.parseInt(process.env.PROFILE_SOLVERS_TIMEOUT_MS || '', 10)
            if (!Number.isFinite(timeoutMs) || timeoutMs < 1) {
              return 700000
            }
            return timeoutMs
          }

          const run = async () => {
            const args = JSON.parse(process.env.PROFILE_SOLVERS_ARGS_JSON || '[]')
            const command = ['bun', 'scripts/profile-solvers.ts', ...args]
            const profileSolversTimeoutMs = getProfileSolversTimeoutMs()
            console.log(`Running profile-solvers command: ${command.map((arg) => JSON.stringify(arg)).join(' ')}`)
            console.log(`Profile-solvers timeout: ${Math.round(profileSolversTimeoutMs / 1000)}s`)

            const output = createWriteStream('profile-solvers-pr.txt')
            const child = spawn(command[0], command.slice(1), {
              env: process.env,
              stdio: ['ignore', 'pipe', 'pipe'],
            })
            let didTimeout = false
            let childClosed = false
            const timeout = setTimeout(() => {
              didTimeout = true
              const message = `\n[profile-solvers] timed out after ${Math.round(profileSolversTimeoutMs / 1000)}s; continuing benchmark workflow without PR profile JSON\n`
              process.stderr.write(message)
              output.write(message)
              child.kill('SIGTERM')
              setTimeout(() => {
                if (!childClosed) {
                  child.kill('SIGKILL')
                }
              }, 5000)
            }, profileSolversTimeoutMs)

            child.stdout.on('data', (chunk) => {
              process.stdout.write(chunk)
              output.write(chunk)
            })
            child.stderr.on('data', (chunk) => {
              process.stderr.write(chunk)
              output.write(chunk)
            })

            const exitCode = await new Promise((resolve, reject) => {
              child.on('error', reject)
              child.on('close', (code) => {
                childClosed = true
                resolve(code)
              })
            })
            clearTimeout(timeout)
            await new Promise((resolve) => output.end(resolve))

            if (existsSync('profile-solvers.json')) {
              copyFileSync('profile-solvers.json', 'profile-solvers-pr.json')
            }

            process.exit(didTimeout ? 0 : (exitCode ?? 1))
          }

          run().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Checkout main for profile-solvers
        if: steps.parse.outputs.profile_solvers == 'true' && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-profile

      - name: Copy profile-solvers runner into main checkout
        if: steps.parse.outputs.profile_solvers == 'true' && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        run: |
          cp scripts/profile-solvers.ts main-profile/scripts/profile-solvers.ts
          cp scripts/benchmark/scenarios.ts main-profile/scripts/benchmark/scenarios.ts

      - name: Install main dependencies for profile-solvers
        if: steps.parse.outputs.profile_solvers == 'true' && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        working-directory: main-profile
        run: bun install

      - name: Run profile-solvers (main)
        if: steps.parse.outputs.profile_solvers == 'true' && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          PROFILE_SOLVERS_ARGS_JSON: ${{ steps.parse.outputs.profile_solvers_args_json }}
          PROFILE_SOLVERS_HEARTBEAT_INTERVAL_MS: ${{ vars.PROFILE_SOLVERS_HEARTBEAT_INTERVAL_MS || '30000' }}
          PROFILE_SOLVERS_TIMEOUT_MS: ${{ vars.PROFILE_SOLVERS_TIMEOUT_MS || '600000' }}
        working-directory: main-profile
        run: |
          node <<'NODE'
          const { copyFileSync, createWriteStream, existsSync } = require('node:fs')
          const { spawn } = require('node:child_process')

          const getProfileSolversTimeoutMs = () => {
            const timeoutMs = Number.parseInt(process.env.PROFILE_SOLVERS_TIMEOUT_MS || '', 10)
            if (!Number.isFinite(timeoutMs) || timeoutMs < 1) {
              return 600000
            }
            return timeoutMs
          }

          const run = async () => {
            const args = JSON.parse(process.env.PROFILE_SOLVERS_ARGS_JSON || '[]')
            const command = ['bun', 'scripts/profile-solvers.ts', ...args]
            const profileSolversTimeoutMs = getProfileSolversTimeoutMs()
            console.log(`Running main profile-solvers command: ${command.map((arg) => JSON.stringify(arg)).join(' ')}`)
            console.log(`Main profile-solvers timeout: ${Math.round(profileSolversTimeoutMs / 1000)}s`)

            const output = createWriteStream('../profile-solvers-main.txt')
            const child = spawn(command[0], command.slice(1), {
              env: process.env,
              stdio: ['ignore', 'pipe', 'pipe'],
            })
            let didTimeout = false
            let childClosed = false
            const timeout = setTimeout(() => {
              didTimeout = true
              const message = `\n[profile-solvers] timed out after ${Math.round(profileSolversTimeoutMs / 1000)}s; continuing benchmark workflow without main profile JSON\n`
              process.stderr.write(message)
              output.write(message)
              child.kill('SIGTERM')
              setTimeout(() => {
                if (!childClosed) {
                  child.kill('SIGKILL')
                }
              }, 5000)
            }, profileSolversTimeoutMs)

            child.stdout.on('data', (chunk) => {
              process.stdout.write(chunk)
              output.write(chunk)
            })
            child.stderr.on('data', (chunk) => {
              process.stderr.write(chunk)
              output.write(chunk)
            })

            const exitCode = await new Promise((resolve, reject) => {
              child.on('error', reject)
              child.on('close', (code) => {
                childClosed = true
                resolve(code)
              })
            })
            clearTimeout(timeout)
            await new Promise((resolve) => output.end(resolve))

            if (existsSync('profile-solvers.json')) {
              copyFileSync('profile-solvers.json', '../profile-solvers-main.json')
            }

            process.exit(didTimeout ? 0 : (exitCode ?? 1))
          }

          run().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: |
            ./benchmark-result.txt
            ./benchmark-result.json
            ./benchmark-best-vias.json
            ./benchmark-snapshots.html
            ./benchmark-result-pr.txt
            ./benchmark-result-pr.json
            ./benchmark-result-main.txt
            ./benchmark-result-main.json
            ./benchmark-best-vias-main.json
            ./benchmark-via-cells.json
            ./benchmark-run-metadata.json
            ./profile-solvers-pr.txt
            ./profile-solvers-pr.json
            ./profile-solvers-main.txt
            ./profile-solvers-main.json
          overwrite: true

      - name: Post benchmark result comment
        if: always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && steps.parse.outputs.status_comment_id != ''
        uses: actions/github-script@v7
        env:
          STATUS_COMMENT_ID: ${{ steps.parse.outputs.status_comment_id }}
          BENCHMARK_DATASET: ${{ inputs.dataset_name }}
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs')
            const { pathToFileURL } = require('node:url')
            const comparisonUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/benchmark/benchmark-comment-comparison.js`,
            ).href
            const comparisonModule = await import(comparisonUrl)
            const { renderBenchmarkComparison } = comparisonModule
            const isNetworkedColdHotReport =
              typeof comparisonModule.isNetworkedColdHotReport === 'function'
                ? comparisonModule.isNetworkedColdHotReport
                : (report) => {
                    if (!Array.isArray(report?.summary)) return false
                    const names = new Set(report.summary.map((row) => row.solverName))
                    return names.has('Pipeline9_Networked Cold') && names.has('Pipeline9_Networked Hot')
                  }
            const maxLength = 60000
            const truncate = (s, max) => s.length > max ? `${s.slice(0, max)}\n\n...truncated...` : s
            const formatTime = (timeMs) => {
              if (typeof timeMs !== 'number' || !Number.isFinite(timeMs)) {
                return 'n/a'
              }
              return timeMs < 1000 ? `${Math.round(timeMs)}ms` : `${(timeMs / 1000).toFixed(1)}s`
            }
            const formatAverage = (value) => {
              if (typeof value !== 'number' || !Number.isFinite(value)) {
                return 'n/a'
              }
              return value.toFixed(2)
            }
            const getStatus = (test) => {
              if (test.didTimeout) return 'Timeout'
              if (test.didSolve) return 'Solved'
              return 'Failed'
            }
            const getDrc = (test) => {
              if (!test.didSolve) return 'Failed'
              return test.relaxedDrcPassed ? 'Passed' : 'Failed'
            }
            const escapeHtml = (value) =>
              String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/\|/g, '&#124;')
            const formatSolverName = (solverName) =>
              String(solverName ?? '').replace(/^AutoroutingPipelineSolver(\d+).*$/, 'Pipeline$1')
            const formatEffortSuffix = (effortLabel) => {
              const label = String(effortLabel ?? '')
              const match = label.match(/^(\d+)x effort$/)
              if (!match) return label === 'mixed effort' ? '(mixed)' : ''
              const effort = Number.parseInt(match[1], 10)
              return Number.isFinite(effort) && effort > 1 ? `(${effort}x)` : ''
            }
            const formatSolverDisplayName = (solverName, effortLabel) =>
              `${formatSolverName(solverName)}${formatEffortSuffix(effortLabel)}`
            const getSampleLabel = (test) => {
              if (typeof test?.sampleNumber === 'number' && Number.isFinite(test.sampleNumber)) {
                return String(test.sampleNumber)
              }
              const match = String(test?.scenarioName ?? '').match(/\d+/)
              return match ? String(Number.parseInt(match[0], 10)) : String(test?.scenarioName ?? '')
            }
            const getErrorCell = (test) => {
              if (!test?.error) return ''
              const label = test.errorSolverName || test.errorPhaseName || (test.didTimeout ? 'Timeout' : 'Error')
              const detailLines = [
                test.errorPhaseName && test.errorSolverName && test.errorPhaseName !== test.errorSolverName
                  ? `Phase: ${test.errorPhaseName}`
                  : '',
                test.error,
              ].filter(Boolean)
              const details = escapeHtml(detailLines.join('\n')).replace(/\r?\n/g, '<br>')
              return `<details><summary>${escapeHtml(label)}</summary><code>${details}</code></details>`
            }
            const renderSummary = (report) => {
              if (!Array.isArray(report?.summary) || report.summary.length === 0) {
                return []
              }
              return [
                `Dataset: ${report.datasetName}`,
                `Scenarios: ${report.scenarioCount}`,
                `Effort: ${report.effortLabel}`,
                '',
                '| Solver | Completed % | Relaxed DRC Pass % | Timed Out | P50 Time | P95 Time | Avg Via |',
                '| --- | --- | --- | --- | --- | --- | --- |',
                ...report.summary.map((row) =>
                  `| ${formatSolverDisplayName(row.solverName, report.effortLabel)} | ${row.completedRateLabel} | ${row.relaxedDrcRateLabel} | ${row.timedOutLabel} | ${formatTime(row.p50TimeMs)} | ${formatTime(row.p95TimeMs)} | ${formatAverage(row.avgVia)} |`,
                ),
              ]
            }
            const getOutcomeScore = (test) => {
              if (!test?.didSolve) return 0
              if (test.relaxedDrcPassed) return 2
              return 1
            }
            const buildMainIndex = (report) => {
              if (!Array.isArray(report?.tests)) return new Map()
              return new Map(
                report.tests.map((test) => [
                  `${test.solverName}::${test.scenarioName}`,
                  test,
                ]),
              )
            }
            const buildViaCellIndex = (report) => {
              if (!Array.isArray(report?.cells)) return new Map()
              return new Map(
                report.cells.map((cell) => [
                  `${cell.datasetName}::${cell.solverName}::${cell.scenarioName}`,
                  cell.label,
                ]),
              )
            }
            const getDelta = (test, mainIndex) => {
              if (!mainIndex) return ''
              const key = `${test.solverName}::${test.scenarioName}`
              const mainTest = mainIndex.get(key)
              if (!mainTest) return ''
              const prScore = getOutcomeScore(test)
              const mainScore = getOutcomeScore(mainTest)
              if (prScore > mainScore) return 'Improved'
              if (prScore < mainScore) return 'Regressed'
              return ''
            }
            const getViaCell = (test, viaCellIndex, datasetName) => {
              const key = `${datasetName}::${test.solverName}::${test.scenarioName}`
              const viaCell = viaCellIndex?.get(key)
              if (viaCell) return viaCell
              return typeof test?.viaCount === 'number' ? String(test.viaCount) : ''
            }
            const isUnchangedPassingTest = (test, mainIndex) => {
              if (!mainIndex) return false
              const key = `${test.solverName}::${test.scenarioName}`
              const mainTest = mainIndex.get(key)
              const sameSolverViaUnchanged =
                typeof test.viaCount === 'number' ||
                typeof mainTest?.viaCount === 'number'
                  ? test.viaCount === mainTest?.viaCount
                  : true
              return (
                Boolean(mainTest) &&
                test.didSolve &&
                test.relaxedDrcPassed &&
                mainTest.didSolve &&
                mainTest.relaxedDrcPassed &&
                sameSolverViaUnchanged
              )
            }
            const renderTests = (report, options = {}) => {
              const includeDelta = Boolean(options.includeDelta)
              const mainIndex = options.mainIndex
              const viaCellIndex = options.viaCellIndex
              if (!Array.isArray(report?.tests) || report.tests.length === 0) {
                return ['Per-test results unavailable.']
              }
              const omitUnchangedPassingSamples = Boolean(options.omitUnchangedPassingSamples)
              const tests =
                includeDelta && omitUnchangedPassingSamples
                  ? report.tests.filter((test) => !isUnchangedPassingTest(test, mainIndex))
                  : report.tests
              const omittedCount = report.tests.length - tests.length
              const header = includeDelta
                ? [
                    '| Solver | Sample | Status | Via | Time | Relaxed DRC | Error | Delta |',
                    '| --- | --- | --- | ---: | --- | --- | --- | --- |',
                  ]
                : [
                    '| Solver | Sample | Status | Via | Time | Relaxed DRC | Error |',
                    '| --- | --- | --- | ---: | --- | --- | --- |',
                  ]
              return [
                ...(omittedCount > 0
                  ? [`_${omittedCount} unchanged passing sample${omittedCount === 1 ? '' : 's'} omitted to keep the PR comment under GitHub's size limit._`, '']
                  : []),
                ...header,
                ...tests.map((test) =>
                  includeDelta
                    ? `| ${formatSolverName(test.solverName)} | ${getSampleLabel(test)} | ${getStatus(test)} | ${getViaCell(test, viaCellIndex, report.datasetName)} | ${formatTime(test.elapsedTimeMs)} | ${getDrc(test)} | ${getErrorCell(test)} | ${getDelta(test, mainIndex)} |`
                    : `| ${formatSolverName(test.solverName)} | ${getSampleLabel(test)} | ${getStatus(test)} | ${getViaCell(test, viaCellIndex, report.datasetName)} | ${formatTime(test.elapsedTimeMs)} | ${getDrc(test)} | ${getErrorCell(test)} |`,
                ),
              ]
            }
            const renderReport = (report, fallbackText, options = {}) => {
              if (!report) {
                if (options.omitSummary) return []
                return ['```', truncate(fallbackText, maxLength), '```']
              }

              return [
                ...(options.omitSummary ? [] : renderSummary(report)),
                ...(options.omitDetails
                  ? []
                  : [
                      '',
                      '<details>',
                      `<summary>${options.detailsLabel ?? 'Details'}</summary>`,
                      '',
                      ...renderTests(report, options),
                      '</details>',
                    ]),
              ]
            }
            const getBenchmarkReports = (report) => {
              if (Array.isArray(report?.reports)) {
                return report.reports.filter(Boolean)
              }
              return report ? [report] : []
            }
            const getMainReportForDataset = (mainReport, datasetName) => {
              if (!datasetName) return null
              return getBenchmarkReports(mainReport).find((report) => report?.datasetName === datasetName) ?? null
            }
            const renderPreviousMainSummary = (report, datasetName) => {
              if (report) {
                return renderReport(report, '', { omitDetails: true })
              }
              const datasetLabel = datasetName ? ` for \`${escapeHtml(datasetName)}\`` : ''
              return [`_No previous main run is available${datasetLabel}._`]
            }
            const readJson = (path) => {
              if (!fs.existsSync(path)) return null
              const raw = fs.readFileSync(path, 'utf8').trim()
              if (!raw) return null
              try {
                return JSON.parse(raw)
              } catch {
                return null
              }
            }

            const readText = (path) => {
              if (!fs.existsSync(path)) return null
              return fs.readFileSync(path, 'utf8').trim()
            }
            const formatNumber = (value) => {
              if (typeof value !== 'number' || !Number.isFinite(value)) {
                return 'n/a'
              }
              return Math.round(value).toLocaleString('en-US')
            }
            const formatPercent = (value) => {
              if (typeof value !== 'number' || !Number.isFinite(value)) {
                return 'n/a'
              }
              return `${value.toFixed(0)}%`
            }
            const buildProfileIndex = (report) => {
              if (!Array.isArray(report?.rows)) return new Map()
              return new Map(report.rows.map((row) => [row.solverName, row]))
            }
            const getSuccessDelta = (mainRow, prRow) => {
              if (!mainRow || !prRow) return 'n/a'
              const delta = prRow.scenarioSuccessRate - mainRow.scenarioSuccessRate
              if (!Number.isFinite(delta)) return 'n/a'
              const label = `${delta > 0 ? '+' : ''}${delta.toFixed(0)}%`
              if (delta > 0) return `${label} (improved)`
              if (delta < 0) return `${label} (regressed)`
              return label
            }
            const renderProfileRunSummary = (report) => {
              if (!report) return []
              const solved = formatNumber(report.solved)
              const scenarioCount = formatNumber(report.scenarioCount)
              const failed = formatNumber(report.failed)
              const totalTime =
                typeof report.totalTimeMs === 'number' && Number.isFinite(report.totalTimeMs)
                  ? ` in ${formatTime(report.totalTimeMs)}`
                  : ''
              return [`${solved}/${scenarioCount} scenarios solved (${failed} failed)${totalTime}`, '']
            }
            const renderProfileUnavailable = (message) => [
              message,
            ]
            const renderMainProfileSolvers = (report) => {
              if (!Array.isArray(report?.rows) || report.rows.length === 0) {
                return [
                  ...renderProfileRunSummary(report),
                  ...renderProfileUnavailable('(main profile-solvers JSON was not produced; see the workflow artifact for logs)'),
                ]
              }

              return [
                ...renderProfileRunSummary(report),
                '| Solver | Scenarios | Success | Iterations | Total Time |',
                '| --- | ---: | ---: | ---: | ---: |',
                ...report.rows.map((row) =>
                  `| ${row.solverName} | ${formatNumber(row.scenarioCount)} | ${formatPercent(row.scenarioSuccessRate)} | ${formatNumber(row.totalIterations)} | ${formatTime(row.totalTimeMs)} |`,
                ),
              ]
            }
            const renderProfileComparison = (mainReport, prReport) => {
              if (!Array.isArray(prReport?.rows) || prReport.rows.length === 0) {
                return [
                  ...renderProfileRunSummary(prReport),
                  ...renderProfileUnavailable('(PR profile-solvers JSON was not produced; see the workflow artifact for logs)'),
                ]
              }

              const mainIndex = buildProfileIndex(mainReport)
              const prIndex = buildProfileIndex(prReport)
              const solverNames = [...new Set([...mainIndex.keys(), ...prIndex.keys()])].sort((a, b) => {
                const aPr = prIndex.get(a)
                const bPr = prIndex.get(b)
                const aTime = aPr?.totalTimeMs ?? mainIndex.get(a)?.totalTimeMs ?? 0
                const bTime = bPr?.totalTimeMs ?? mainIndex.get(b)?.totalTimeMs ?? 0
                if (aTime !== bTime) return bTime - aTime
                return a.localeCompare(b)
              })

              return [
                ...renderProfileRunSummary(prReport),
                '| Solver | Main Scenarios | PR Scenarios | Main Success | PR Success | Main Iterations | PR Iterations | Main Total Time | PR Total Time | Success Delta |',
                '| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |',
                ...solverNames.map((solverName) => {
                  const mainRow = mainIndex.get(solverName)
                  const prRow = prIndex.get(solverName)
                  return `| ${solverName} | ${formatNumber(mainRow?.scenarioCount)} | ${formatNumber(prRow?.scenarioCount)} | ${formatPercent(mainRow?.scenarioSuccessRate)} | ${formatPercent(prRow?.scenarioSuccessRate)} | ${formatNumber(mainRow?.totalIterations)} | ${formatNumber(prRow?.totalIterations)} | ${formatTime(mainRow?.totalTimeMs)} | ${formatTime(prRow?.totalTimeMs)} | ${getSuccessDelta(mainRow, prRow)} |`
                }),
              ]
            }
            const renderProfileSolversDetails = (label, lines) => [
              '',
              '<details>',
              `<summary>${label}</summary>`,
              '',
              ...lines,
              '</details>',
            ]

            const prText = readText('benchmark-result-pr.txt') ?? readText('benchmark-result.txt')
            const prProfileSolversText = readText('profile-solvers-pr.txt')
            const mainProfileSolversText = readText('profile-solvers-main.txt')
            const prProfileSolversReport = readJson('profile-solvers-pr.json')
            const mainProfileSolversReport = readJson('profile-solvers-main.json')
            const prReport = readJson('benchmark-result-pr.json') ?? readJson('benchmark-result.json')
            const mainReport = readJson('benchmark-result-main.json')
            const viaCellReport = readJson('benchmark-via-cells.json')
            const benchmarkDatasetName = prReport?.datasetName ?? process.env.BENCHMARK_DATASET
            const mainDatasetReport = getMainReportForDataset(mainReport, benchmarkDatasetName)
            const mainIndex = buildMainIndex(mainDatasetReport)
            const viaCellIndex = buildViaCellIndex(viaCellReport)
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            const jobStatus = '${{ job.status }}'
            const benchmarkFailed = jobStatus !== 'success'
            const profileEnabled = '${{ steps.parse.outputs.profile_solvers }}' === 'true'
            const hasProfileSolvers = Boolean(
              mainProfileSolversText ||
                mainProfileSolversReport ||
                prProfileSolversText ||
                prProfileSolversReport,
            )
            const benchmarkLabel = process.env.BENCHMARK_DATASET === 'dataset01' ? 'Default Benchmark' : (process.env.BENCHMARK_DATASET || 'Benchmark')
            const networkedColdHot = isNetworkedColdHotReport(prReport)

            const renderBody = (options = {}) => [
              benchmarkFailed ? `## ${benchmarkLabel} Failed` : `## ${benchmarkLabel} Results`,
              '',
              ...(profileEnabled
                ? [
                    hasProfileSolvers
                      ? '**Profile Solvers:** completed. Comparison tables are included below.'
                      : '**Profile Solvers:** requested, but profile output was not produced.',
                    '',
                  ]
                : []),
              ...(benchmarkFailed
                ? [
                    `Benchmark workflow ended with **${jobStatus}** before completion.`,
                    '',
                    'This can happen during setup, dependency installation, or benchmark execution.',
                    '',
                  ]
                : []),
              networkedColdHot
                ? '### Pipeline9_Networked Cold vs Hot'
                : '### Main vs PR',
              '',
              ...renderBenchmarkComparison({
                mainReport: mainDatasetReport,
                prReport,
                fallbackText: prText ?? '(benchmark results were not produced)',
                maxLength,
              }),
              '',
              ...(networkedColdHot
                ? []
                : renderReport(mainDatasetReport, '', {
                    detailsLabel: 'Previous main run details',
                    omitSummary: true,
                  })),
              ...(hasProfileSolvers
                ? renderProfileSolversDetails(
                    'Previous main profile details',
                    renderMainProfileSolvers(mainProfileSolversReport),
                  )
                : []),
              '',
              ...renderReport(prReport, prText ?? '(benchmark results were not produced)', {
                detailsLabel: networkedColdHot ? 'Cold/hot run details' : 'PR run details',
                omitSummary: true,
                includeDelta: !networkedColdHot,
                mainIndex,
                viaCellIndex,
                omitUnchangedPassingSamples: Boolean(options.omitUnchangedPassingSamples),
              }),
              ...(hasProfileSolvers
                ? renderProfileSolversDetails(
                    'PR profile comparison',
                    renderProfileComparison(
                      mainProfileSolversReport,
                      prProfileSolversReport,
                    ),
                  )
                : []),
              '',
              `Workflow: [View run](${runUrl})`,
              `Artifact: ${runUrl}`,
            ].join('\n')

            const fullBody = renderBody()
            const filteredBody =
              fullBody.length > maxLength
                ? renderBody({ omitUnchangedPassingSamples: true })
                : fullBody
            const finalBody = filteredBody

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.STATUS_COMMENT_ID),
              body: finalBody,
            })

  same-machine-benchmark:
    name: Same machine benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.same_machine_compare == true
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 180
    env:
      BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: ${{ vars.BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS || vars.BENCHMARK_TASK_TIMEOUT_MS || '60000' }}
      BENCHMARK_HEARTBEAT_INTERVAL_MS: ${{ vars.BENCHMARK_HEARTBEAT_INTERVAL_MS || '30000' }}
      BENCHMARK_TERMINATE_TIMEOUT_MS: ${{ vars.BENCHMARK_TERMINATE_TIMEOUT_MS || '1000' }}

    steps:
      - name: Resolve comparison refs
        id: refs
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          DATASET_NAME: ${{ inputs.dataset_name }}
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          script: |
            const prNumber = Number.parseInt(process.env.PR_NUMBER || '', 10)
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              throw new Error('same_machine_compare requires a valid pr_number')
            }

            const dataset = (process.env.DATASET_NAME || '').trim() || 'srj18'
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })
            const base = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: pr.data.base.ref,
            })
            const mainSha = base.data.commit.sha
            const prSha = pr.data.head.sha
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            const statusComment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                '## Same Machine Benchmark Results',
                '',
                `Queued \`${dataset}\` on current main \`${mainSha.slice(0, 7)}\` and PR head \`${prSha.slice(0, 7)}\`.`,
                '',
                'Both solvers will run sequentially in one Blacksmith job, using the PR benchmark harness and DRC for both outputs.',
                '',
                `Workflow: [View run](${runUrl})`,
              ].join('\n'),
            })

            core.setOutput('dataset', dataset)
            core.setOutput('main_sha', mainSha)
            core.setOutput('pr_sha', prSha)
            core.setOutput('status_comment_id', String(statusComment.data.id))

      - name: Checkout benchmark controller
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.pr_sha }}
          path: same-machine-controller
          persist-credentials: false

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.main_sha }}
          path: same-machine-main
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.pr_sha }}
          path: same-machine-pr
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install main dependencies
        working-directory: same-machine-main
        run: bun install

      - name: Install PR dependencies
        working-directory: same-machine-pr
        run: bun install

      - name: Install common harness dependencies
        working-directory: same-machine-controller
        run: bun install

      - name: Prepare comparison artifacts
        run: mkdir -p same-machine-results/main same-machine-results/pr

      - name: Benchmark current main
        working-directory: same-machine-controller
        env:
          BENCHMARK_ARGS_JSON: ${{ inputs.benchmark_args_json }}
          BENCHMARK_DATASET: ${{ steps.refs.outputs.dataset }}
          BENCHMARK_SOLVER_ROOT: ${{ github.workspace }}/same-machine-main
          BENCHMARK_SOLVER_REVISION: ${{ steps.refs.outputs.main_sha }}
          BENCHMARK_DRC_REVISION: ${{ steps.refs.outputs.pr_sha }}
          BENCHMARK_ROUTED_OUTPUT_DIR: ${{ github.workspace }}/same-machine-results/main/routed-outputs
        run: |
          chmod +x ./benchmark.sh
          node <<'NODE'
          const { spawnSync } = require('node:child_process')
          const args = JSON.parse(process.env.BENCHMARK_ARGS_JSON || '[]')
          if (!Array.isArray(args) || args.some((arg) => typeof arg !== 'string')) {
            throw new Error('benchmark_args_json must be a JSON array of strings')
          }
          if (!args.includes('--dataset')) {
            args.push('--dataset', process.env.BENCHMARK_DATASET)
          }
          const result = spawnSync('./benchmark.sh', args, { stdio: 'inherit' })
          if (result.error) throw result.error
          process.exit(result.status ?? 1)
          NODE
          cp benchmark-result.json ../same-machine-results/main/benchmark-result.json
          cp benchmark-result.txt ../same-machine-results/main/benchmark-result.txt
          cp benchmark-snapshots.html ../same-machine-results/main/benchmark-snapshots.html

      - name: Benchmark PR head
        working-directory: same-machine-controller
        env:
          BENCHMARK_ARGS_JSON: ${{ inputs.benchmark_args_json }}
          BENCHMARK_DATASET: ${{ steps.refs.outputs.dataset }}
          BENCHMARK_SOLVER_ROOT: ${{ github.workspace }}/same-machine-pr
          BENCHMARK_SOLVER_REVISION: ${{ steps.refs.outputs.pr_sha }}
          BENCHMARK_DRC_REVISION: ${{ steps.refs.outputs.pr_sha }}
          BENCHMARK_ROUTED_OUTPUT_DIR: ${{ github.workspace }}/same-machine-results/pr/routed-outputs
        run: |
          chmod +x ./benchmark.sh
          node <<'NODE'
          const { spawnSync } = require('node:child_process')
          const args = JSON.parse(process.env.BENCHMARK_ARGS_JSON || '[]')
          if (!Array.isArray(args) || args.some((arg) => typeof arg !== 'string')) {
            throw new Error('benchmark_args_json must be a JSON array of strings')
          }
          if (!args.includes('--dataset')) {
            args.push('--dataset', process.env.BENCHMARK_DATASET)
          }
          const result = spawnSync('./benchmark.sh', args, { stdio: 'inherit' })
          if (result.error) throw result.error
          process.exit(result.status ?? 1)
          NODE
          cp benchmark-result.json ../same-machine-results/pr/benchmark-result.json
          cp benchmark-result.txt ../same-machine-results/pr/benchmark-result.txt
          cp benchmark-snapshots.html ../same-machine-results/pr/benchmark-snapshots.html

      - name: Render same-machine comparison
        working-directory: same-machine-controller
        env:
          MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          PR_SHA: ${{ steps.refs.outputs.pr_sha }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          bun scripts/benchmark/same-machine-results.ts \
            --main-report ../same-machine-results/main/benchmark-result.json \
            --pr-report ../same-machine-results/pr/benchmark-result.json \
            --main-sha "$MAIN_SHA" \
            --pr-sha "$PR_SHA" \
            --repository "${{ github.repository }}" \
            --runner-name "$RUNNER_NAME" \
            --output ../same-machine-results/comment.md

      - name: Upload same-machine benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: same-machine-benchmark-${{ steps.refs.outputs.dataset }}
          path: same-machine-results
          if-no-files-found: warn

      - name: Post same-machine benchmark comment
        if: always() && steps.refs.outputs.status_comment_id != ''
        uses: actions/github-script@v7
        env:
          STATUS_COMMENT_ID: ${{ steps.refs.outputs.status_comment_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs')
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            const resultPath = 'same-machine-results/comment.md'
            const resultBody = fs.existsSync(resultPath)
              ? fs.readFileSync(resultPath, 'utf8').trim()
              : [
                  '## Same Machine Benchmark Results',
                  '',
                  `The paired benchmark ended with **${process.env.JOB_STATUS}** before both reports were produced.`,
                ].join('\n')
            const body = [
              resultBody,
              '',
              `Workflow: [View run](${runUrl})`,
              `Artifact: [Download raw reports](${runUrl})`,
            ].join('\n')

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.STATUS_COMMENT_ID),
              body,
            })

  benchmark-history:
    name: Build benchmark history dashboard
    needs: benchmark
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: benchmark-history
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout benchmarked code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.pr_sha }}
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download benchmark result
        uses: actions/download-artifact@v4
        with:
          name: benchmark-result
          path: ./benchmark-artifact

      - name: Checkout or create benchmark history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          set +e
          git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" benchmark-history >/dev/null
          ls_remote_status=$?
          set -e
          if [ "$ls_remote_status" -eq 0 ]; then
            git clone --depth 1 --branch benchmark-history "https://github.com/${GITHUB_REPOSITORY}.git" .benchmark-history
          elif [ "$ls_remote_status" -eq 2 ]; then
            git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .benchmark-history
            git -C .benchmark-history checkout --orphan benchmark-history
            git -C .benchmark-history rm -rf .
            git -C .benchmark-history config user.name "github-actions[bot]"
            git -C .benchmark-history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C .benchmark-history commit --allow-empty -m "Initialize benchmark history"
          else
            echo "Failed to check for the benchmark-history branch (git exit $ls_remote_status)." >&2
            exit "$ls_remote_status"
          fi

      - name: Record full benchmark history and build dashboard
        run: |
          bun scripts/benchmark/benchmark-history.ts record \
            --report ./benchmark-artifact/benchmark-result.json \
            --history-dir ./.benchmark-history/history \
            --out-dir benchmark-dashboard \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --metadata ./benchmark-artifact/benchmark-run-metadata.json

      - name: Persist full benchmark history
        run: |
          set -euo pipefail

          git -C .benchmark-history config user.name "github-actions[bot]"
          git -C .benchmark-history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .benchmark-history add history
          if git -C .benchmark-history diff --cached --quiet; then
            echo "Benchmark workflow ${{ github.run_id }} is already recorded."
          else
            git -C .benchmark-history commit -m "Record benchmark workflow ${{ github.run_id }}"
            git -C .benchmark-history push origin HEAD:benchmark-history
          fi

      - name: Clear benchmark history credential rewrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf

      - name: Checkout benchmark dashboard
        uses: actions/checkout@v4
        with:
          repository: tscircuit/autorouter-benchmark-dashboard
          ref: main
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          path: .benchmark-dashboard

      - name: Publish benchmark history dashboard
        run: |
          set -euo pipefail

          rm -rf .benchmark-dashboard/data
          cp benchmark-dashboard/index.html .benchmark-dashboard/index.html
          cp benchmark-dashboard/index.css .benchmark-dashboard/index.css
          cp benchmark-dashboard/index.js .benchmark-dashboard/index.js
          cp -R benchmark-dashboard/data .benchmark-dashboard/data
          git -C .benchmark-dashboard config user.name "github-actions[bot]"
          git -C .benchmark-dashboard config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .benchmark-dashboard add -A -- index.html index.css index.js data
          if git -C .benchmark-dashboard diff --cached --quiet; then
            echo "Benchmark dashboard is unchanged."
          else
            git -C .benchmark-dashboard commit -m "Update benchmark dashboard for workflow ${{ github.run_id }}"
            git -C .benchmark-dashboard push origin HEAD:main
          fi
