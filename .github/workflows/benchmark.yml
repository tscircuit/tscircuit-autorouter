name: Autorouting Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Audit additional SRJ33 bug reports
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install and capture runtime dependencies
        run: |
          sed -i 's/save = false/save = true/' bunfig.toml
          bun install --save-text-lockfile
      - name: Route candidates and capture DRC evidence
        run: python3 candidate-audit/run.py
      - name: Preserve runtime lock
        if: always()
        run: |
          mkdir -p candidate-results
          cp bun.lock candidate-results/runtime.bun.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srj33-additional-candidate-results
          path: candidate-results/
          retention-days: 30
