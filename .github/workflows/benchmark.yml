name: Autorouting Benchmark
on:
  workflow_dispatch:
jobs:
  benchmark-diagnostics:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Capture Linux sample 14 joint repair input
        run: bun scripts/diagnose-pr3148.ts capture
      - name: Upload reproducible input
        uses: actions/upload-artifact@v4
        with:
          name: pr3148-linux-input
          path: diagnostics/linux-joint-input.json.gz
      - name: Profile joint repair
        run: timeout 1800s bun --cpu-prof --cpu-prof-md --cpu-prof-dir diagnostics scripts/diagnose-pr3148.ts repair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3148-linux-diagnostics
          path: diagnostics
