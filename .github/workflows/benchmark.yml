name: Audit DDR benchmark artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: same-machine-benchmark-srj18
          run-id: 43878701360
          github-token: ${{ github.token }}
          path: results
      - name: Compare saved metrics and board SVGs
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          r = pathlib.Path('results')
          a = json.loads((r/'base/benchmark-result.json').read_text())
          b = json.loads((r/'pr/benchmark-result.json').read_text())
          assert a['runtime'] == b['runtime']
          assert len(a['tests']) == len(b['tests']) == 16
          before = re.findall(r'<svg\b.*?</svg>', (r/'base/benchmark-snapshots.html').read_text(), re.S)
          after = re.findall(r'<svg\b.*?</svg>', (r/'pr/benchmark-snapshots.html').read_text(), re.S)
          rows = []
          for x, y in zip(a['tests'], b['tests']):
              assert x['scenarioName'] == y['scenarioName']
              rows.append({'sample': x['scenarioName'], 'beforeSeconds': x['elapsedTimeMs']/1000, 'afterSeconds': y['elapsedTimeMs']/1000, 'beforeSolved': x['didSolve'], 'afterSolved': y['didSolve'], 'beforeClean': x['relaxedDrcPassed'], 'afterClean': y['relaxedDrcPassed'], 'viasEqual': x['viaCount'] == y['viaCount'], 'styleEqual': x.get('traceLintIssueCounts') == y.get('traceLintIssueCounts')})
          report = {'runtime': a['runtime'], 'svgCount': len(before), 'allSvgIdentical': before == after, 'baseSeconds': sum(x['elapsedTimeMs'] for x in a['tests'])/1000, 'headSeconds': sum(x['elapsedTimeMs'] for x in b['tests'])/1000, 'baseSummary': a['summary'], 'headSummary': b['summary'], 'cases': rows}
          print('AUDIT_JSON=' + json.dumps(report, separators=(',', ':')))
          PY
