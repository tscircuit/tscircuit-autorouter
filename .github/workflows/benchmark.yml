name: Compare reusable grid collision work
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/power-trace-expander
          ref: perf/boolean-clearance-predicates
          path: base
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/power-trace-expander
          ref: perf/reuse-grid-collision-results
          path: candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
        working-directory: base
      - run: bun install
        working-directory: candidate
      - name: Compare ABBA
        run: |
          mkdir results
          gzip -dc fixtures/bug-reports/bugreport110-motherboard-power-phase/expansion-input.benchmark.json.gz > input.json
          for label in base1 candidate1 candidate2 base2; do
            variant="${label%?}"
            EXPANDER_MODULE="$PWD/$variant/src/PowerTraceExpanderSolver.ts" bun fixtures/bug-reports/bugreport110-motherboard-power-phase/benchmark-expansion.ts input.json > "results/$label.json"
          done
          cat results/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: grid-collision-comparison
          path: results
