name: Repair03 via-exit controlled datasets
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: JSON array of dataset names
        default: '["dataset01","srj18","srj24"]'
        required: true
        type: string
permissions:
  contents: read
jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(inputs.datasets) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          sed -i "s/save = false/save = true/" bunfig.toml
          bun install
      - name: Capture environment and shared dependency graph
        run: |
          mkdir -p diagnostic-results
          cp bun.lock diagnostic-results/bun.lock
          uname -a > diagnostic-results/environment.txt
          lscpu >> diagnostic-results/environment.txt
          free -m >> diagnostic-results/environment.txt
          bun --version >> diagnostic-results/environment.txt
          git clone --filter=blob:none https://github.com/tscircuit/high-density-repair03.git .repair03-source
      - name: Compare production, current pin, and one-line candidate
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          set -euo pipefail
          refs=(79c9b022a678b1f0289059962bf49f253310a5dc 963153b26f94d800c058f7e32098461dc2911329 121aca69eec19ee7d14fe519dd04c9c0ae69970d)
          labels=(production current via-exit)
          for i in "${!refs[@]}"; do
            label="${labels[$i]}"
            git -C .repair03-source fetch origin "${refs[$i]}"
            rm -rf node_modules/high-density-repair03/lib
            git -C .repair03-source archive "${refs[$i]}" lib | tar -x -C node_modules/high-density-repair03
            mkdir -p "diagnostic-results/$label"
            printf '%s %s\n' "$label" "${refs[$i]}" >> diagnostic-results/revisions.txt
            ./benchmark.sh --pipeline 9 --dataset "$DATASET" --effort 1 --concurrency 3 --sample-timeout 360s | tee "diagnostic-results/$label/run.log"
            cp benchmark-result.json benchmark-result.txt "diagnostic-results/$label/"
            sha256sum bun.lock >> diagnostic-results/lock-hashes.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair03-via-exit-${{ matrix.dataset }}
          path: diagnostic-results
