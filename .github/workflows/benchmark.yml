name: Repair03 final runtime diagnostics
on:
  workflow_dispatch:
    inputs:
      cases:
        description: JSON array of full06, full15, memory04, memory24, concurrent
        default: '["full06","full15","memory04","memory24"]'
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.cases) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          sed -i "s/save = false/save = true/" bunfig.toml
          bun install
      - name: Capture environment and shared dependency lock
        run: |
          mkdir -p diagnostic-results
          cp bun.lock diagnostic-results/bun.lock
          uname -a > diagnostic-results/environment.txt
          lscpu >> diagnostic-results/environment.txt
          free -m >> diagnostic-results/environment.txt
          bun --version >> diagnostic-results/environment.txt
          git clone --filter=blob:none https://github.com/tscircuit/high-density-repair03.git .repair03-source
      - name: Run variants with one installed dependency graph
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          refs=(79c9b022a678b1f0289059962bf49f253310a5dc 963153b26f94d800c058f7e32098461dc2911329 963153b26f94d800c058f7e32098461dc2911329 79c9b022a678b1f0289059962bf49f253310a5dc)
          labels=(production final final-repeat production-repeat)
          for i in "${!refs[@]}"; do
            git -C .repair03-source fetch origin "${refs[$i]}"
            rm -rf node_modules/high-density-repair03/lib
            git -C .repair03-source archive "${refs[$i]}" lib | tar -x -C node_modules/high-density-repair03
            printf '%s %s\n' "${labels[$i]}" "${refs[$i]}" >> diagnostic-results/revisions.txt
            if [ "$CASE" = concurrent ]; then
              bash ./benchmark.sh --pipeline 9 --dataset srj18 --sample-numbers 6,14,15 --concurrency 3 --effort 1 --sample-timeout 360s | tee "diagnostic-results/${labels[$i]}.log"
              cp benchmark-result.json "diagnostic-results/${labels[$i]}-benchmark-result.json"
              bun scripts/repair03-diagnostics/print-concurrent-result.ts "${labels[$i]}"
            else
              bun scripts/repair03-diagnostics/run.ts "$CASE" "${labels[$i]}" | tee "diagnostic-results/${labels[$i]}.log"
            fi
            sha256sum bun.lock >> diagnostic-results/lock-hashes.txt
          done
      - name: Print shared lock and revision identities
        if: always()
        run: |
          cat diagnostic-results/revisions.txt
          cat diagnostic-results/lock-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair03-diagnostic-${{ matrix.case }}
          path: diagnostic-results
