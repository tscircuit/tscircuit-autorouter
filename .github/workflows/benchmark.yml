name: Dataset18 baseline CPU diagnostic

on:
  workflow_dispatch:
    inputs:
      sample:
        description: One dataset18 controlling sample to profile
        required: true
        default: "4"
        type: choice
        options: ["4", "16"]

permissions:
  contents: read

jobs:
  baseline-cpu-profile:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostic controller
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Checkout exact original baseline
        uses: actions/checkout@v4
        with:
          ref: d010db4155513fad6e1cef325180d99a28d6201f
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install unmodified baseline dependencies
        working-directory: source
        run: bun install
      - name: Record source and runtime provenance
        shell: bash
        run: |
          mkdir -p profile-results
          git -C source rev-parse HEAD > profile-results/source.sha
          git -C source rev-parse HEAD^{tree} > profile-results/source.tree
          cp source/package.json profile-results/package.json
          bun --version > profile-results/bun-version.txt
          lscpu > profile-results/cpu.txt
          (
            cd source
            bun -e '
              const packages = []
              for await (const path of new Bun.Glob("**/package.json").scan({ cwd: "node_modules", followSymlinks: true })) {
                const manifest = await Bun.file(`node_modules/${path}`).json()
                packages.push({ path, name: manifest.name, version: manifest.version })
              }
              if (packages.length === 0) throw new Error("No installed package manifests found")
              packages.sort((a, b) => a.path.localeCompare(b.path))
              console.log(JSON.stringify(packages, null, 2))
            '
          ) > profile-results/installed-packages.json
          git -C source diff --exit-code
          git -C source diff --cached --exit-code
          cp controller/scripts/diagnostic-dataset18-cpu-profile.ts source/scripts/diagnostic-dataset18-cpu-profile.ts
      - name: Profile one native benchmark task
        working-directory: source
        shell: bash
        env:
          PROFILE_SAMPLE: ${{ inputs.sample }}
        run: |
          case "$PROFILE_SAMPLE" in 4|16) ;; *) exit 2 ;; esac
          output="$GITHUB_WORKSPACE/profile-results/sample-$PROFILE_SAMPLE"
          mkdir -p "$output"
          set +e
          timeout --signal=INT --kill-after=15s 360s \
            bun --cpu-prof --cpu-prof-name=cpu.cpuprofile \
              --cpu-prof-dir="$output" --cpu-prof-interval=1000 \
              scripts/diagnostic-dataset18-cpu-profile.ts "$PROFILE_SAMPLE" "$output" \
              > "$output/run.log" 2>&1
          profile_status=$?
          printf '%s\n' "$profile_status" > "$output/exit-status.txt"
          cat "$output/run.log"
          if [ "$profile_status" -eq 0 ]; then test -s "$output/cpu.cpuprofile" || exit 2; fi
          exit "$profile_status"
      - name: Upload immutable diagnostic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset18-d010-cpu-profile-sample-${{ inputs.sample }}
          path: profile-results
          if-no-files-found: error
