name: Repair03 controlled diagnostics
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate repair03 commit (optional third variant)
        required: false
        type: string
      cases:
        description: JSON array of joint14, memory04, memory24
        default: '["joint14","memory04","memory24"]'
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.cases) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          sed -i "s/save = false/save = true/" bunfig.toml
          bun install
      - name: Capture environment and shared dependency lock
        run: |
          mkdir -p diagnostic-results
          cp bun.lock diagnostic-results/bun.lock
          uname -a > diagnostic-results/environment.txt
          lscpu >> diagnostic-results/environment.txt
          free -m >> diagnostic-results/environment.txt
          bun --version >> diagnostic-results/environment.txt
          git clone --filter=blob:none https://github.com/tscircuit/high-density-repair03.git .repair03-source
      - name: Run variants with one installed dependency graph
        env:
          CASE: ${{ matrix.case }}
          CANDIDATE: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          refs=(79c9b022a678b1f0289059962bf49f253310a5dc 2a2f39c40d492810cb504d71a8a935f8776d775b)
          labels=(production current)
          if [ -n "$CANDIDATE" ]; then
            refs+=("$CANDIDATE")
            labels+=(candidate)
          fi
          if [ "$CASE" != joint14 ]; then
            refs+=(2a2f39c40d492810cb504d71a8a935f8776d775b 79c9b022a678b1f0289059962bf49f253310a5dc)
            labels+=(current-repeat production-repeat)
          fi
          for i in "${!refs[@]}"; do
            git -C .repair03-source fetch origin "${refs[$i]}"
            rm -rf node_modules/high-density-repair03/lib
            git -C .repair03-source archive "${refs[$i]}" lib | tar -x -C node_modules/high-density-repair03
            printf '%s %s\n' "${labels[$i]}" "${refs[$i]}" >> diagnostic-results/revisions.txt
            bun scripts/repair03-diagnostics/run.ts "$CASE" "${labels[$i]}" > "diagnostic-results/${labels[$i]}.log" 2>&1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair03-diagnostic-${{ matrix.case }}
          path: diagnostic-results
