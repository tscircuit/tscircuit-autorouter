name: Diagnose SRJ18 memory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b5a12b9934a6138c1c7c95b3f3b8615b13e3a25
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Prepare same-dependency ablations and phase memory recording
        run: |
          set -euo pipefail
          mkdir -p work/source-base work/results
          curl --fail --location --retry 3 https://codeload.github.com/tscircuit/high-density-repair03/tar.gz/cbdd8facbee04699b7ac8347e57f601f28046496 -o work/base.tar.gz
          tar -xzf work/base.tar.gz --strip-components=1 -C work/source-base
          mv node_modules/high-density-repair03 work/repair-fix
          cp -a work/repair-fix work/repair-base
          rm -rf work/repair-base/lib
          cp -a work/source-base/lib work/repair-base/lib
          cp -a work/repair-fix work/repair-no-resume
          cp -a work/repair-fix work/repair-no-dedup
          python3 <<'PY'
          from pathlib import Path
          import json
          relative='lib/solvers/GlobalDrcForceImproveSolver/GlobalDrcForceImproveSolver.ts'
          p=Path('work/repair-no-resume')/relative
          s=p.read_text()
          start=s.index('      const runBroadCandidate = this.drcEvaluator')
          end=s.index('      for (const passMultiplier',start)
          s=s[:start]+'      const runBroadCandidate = undefined\n'+s[end:]
          p.write_text(s)
          p=Path('work/repair-no-dedup')/relative
          s=p.read_text()
          needle='previousRejectedForceCandidate = materializedCandidateRoutes'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,'previousRejectedForceCandidate = undefined'))
          p=Path('scripts/benchmark/benchmark.child.ts')
          s=p.read_text().replace('import * as readline', 'import { appendFileSync } from "node:fs"\nimport * as readline')
          needle='peakRssBytes = process.resourceUsage().maxRSS * 1024\n        const payload'
          assert s.count(needle)==1
          s=s.replace(needle,'peakRssBytes = process.resourceUsage().maxRSS * 1024\n        appendFileSync(process.env.MEMORY_TRACE_PATH!, JSON.stringify({ phase: progress.phaseName, ms: progress.elapsedTimeMs, peakRssBytes, rss: process.memoryUsage().rss }) + "\\n")\n        const payload')
          p.write_text(s)
          Path('work/results/provenance.json').write_text(json.dumps({'consumer':'9b5a12b9934a6138c1c7c95b3f3b8615b13e3a25','repairBase':'cbdd8facbee04699b7ac8347e57f601f28046496','repairFix':'483187739f20e4268ce4feabb2aada8976304c73','bun':'1.4.2','sample':14,'dataset':'srj18','transitiveDependencies':'one copied installation','rounds':[['base','fix','no-resume','no-dedup'],['no-dedup','no-resume','fix','base']]},indent=2))
          PY
      - name: Run predefined forward and reverse ablations
        run: |
          set -euo pipefail
          for round in 1 2; do
            if [ "$round" = 1 ]; then variants=(base fix no-resume no-dedup); else variants=(no-dedup no-resume fix base); fi
            for variant in "${variants[@]}"; do
              ln -sfn "$PWD/work/repair-$variant" node_modules/high-density-repair03
              export MEMORY_TRACE_PATH="$PWD/work/results/r$round-$variant-phases.jsonl"
              ./benchmark.sh --pipeline 9 --dataset 18 --sample-numbers 14 --concurrency 1 --threads 1 --effort 1 --sample-timeout 360s 2>&1 | tee "work/results/r$round-$variant.log"
              cp benchmark-result.json "work/results/r$round-$variant.json"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srj18-memory-diagnosis
          path: work/results
