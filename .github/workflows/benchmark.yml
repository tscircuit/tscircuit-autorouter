name: Motherboard combined optimization comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67497a16129f5d4b69d7cfe1ed54a719d5e597b5
          path: base
      - uses: actions/checkout@v4
        with:
          ref: 211dffe363d86072d8fa23f54d614a35b9679373
          path: candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install baseline dependencies
        working-directory: base
        run: bun install
      - name: Install candidate dependencies
        working-directory: candidate
        run: bun install
      - name: Retain DRC category records
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          for root in ['base', 'candidate']:
            p=Path(root)/'fixtures/bug-reports/bugreport110-motherboard-power-phase/profile-full-route.ts'
            s=p.read_text().replace('const drc = validationInput ? evaluateRelaxedDrc(validationInput) : null', 'const drc = validationInput ? evaluateRelaxedDrc(validationInput) : null\nif (drc) writeFileSync(resolve(outputDirectory, `${label}.drc.json`), JSON.stringify(drc))')
            p.write_text(s)
          PY2
      - name: Compare complete routes in ABBA order
        env:
          ROUTE_OUTPUT_DIR: ${{ github.workspace }}/results
        run: |
          mkdir -p "$ROUTE_OUTPUT_DIR"
          for pass in base1 candidate1 candidate2 base2; do
            revision="${pass%?}"
            (cd "$revision" && ROUTE_LABEL="$pass" bun fixtures/bug-reports/bugreport110-motherboard-power-phase/profile-full-route.ts) > "$ROUTE_OUTPUT_DIR/$pass.log" 2>&1
          done
      - name: Summarize timings and compare route quality
        run: |
          python3 - <<'PY'
          import json, pathlib, statistics
          root = pathlib.Path('results')
          runs = [json.loads((root / (name + '.summary.json')).read_text()) for name in ['base1', 'candidate1', 'candidate2', 'base2']]
          assert all(r['solved'] and not r['failed'] for r in runs)
          assert runs[0]['outputHash'] == runs[3]['outputHash']
          assert runs[1]['outputHash'] == runs[2]['outputHash']
          from collections import Counter
          counts = [Counter(e['type'] for e in json.loads((root / (r['label'] + '.drc.json')).read_text())['errors']) for r in runs]
          assert all(counts[1][k] <= counts[0][k] for k in counts[1]), counts
          base = [r for r in runs if r['label'].startswith('base')]
          candidate = [r for r in runs if r['label'].startswith('candidate')]
          base_mean = statistics.mean(r['elapsedMs'] for r in base)
          candidate_mean = statistics.mean(r['elapsedMs'] for r in candidate)
          result = {'baseCommit': '67497a16129f5d4b69d7cfe1ed54a719d5e597b5', 'candidateCommit': '211dffe363d86072d8fa23f54d614a35b9679373', 'baseMeanMs': base_mean, 'candidateMeanMs': candidate_mean, 'improvementPercent': (1 - candidate_mean / base_mean) * 100, 'runs': runs}
          (root / 'comparison.json').write_text(json.dumps(result, indent=2))
          print(json.dumps({k: v for k, v in result.items() if k != 'runs'}, indent=2))
          PY
      - name: Upload raw routes, SVG snapshots, timings, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motherboard-end-to-end-comparison
          path: results
