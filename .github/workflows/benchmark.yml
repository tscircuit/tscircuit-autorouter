name: Motherboard grid budget comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scale: [0.5, 0.25, 0.125]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0197334e37644348c5e9307be8fc09ed8402c8d5
          path: base
      - uses: actions/checkout@v4
        with:
          ref: 0197334e37644348c5e9307be8fc09ed8402c8d5
          path: candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
        working-directory: base
      - run: bun install
        working-directory: candidate
      - name: Retain DRC records and choose experimental search weight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for root in ['base', 'candidate']:
            p=Path(root)/'fixtures/bug-reports/bugreport110-motherboard-power-phase/profile-full-route.ts'
            s=p.read_text().replace('const drc = validationInput ? evaluateRelaxedDrc(validationInput) : null', 'const drc = validationInput ? evaluateRelaxedDrc(validationInput) : null\nif (drc) writeFileSync(resolve(outputDirectory, `${label}.drc.json`), JSON.stringify(drc))')
            p.write_text(s)
          PY
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('candidate/lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensitySolver.ts')
          p.write_text(p.read_text().replace('gridSearchWorkScale: layerCount > 2 ? 0.25 : 1', 'gridSearchWorkScale: layerCount > 2 ? ${{ matrix.scale }} : 1'))
          p=Path('candidate/lib/solvers/HyperHighDensitySolver/PortfolioSingleIntraNodeSolver.ts')
          p.write_text(p.read_text().replace('const budgetScale = layerCount > 2 ? this.gridSearchWorkScale : 1', 'const budgetScale = this.gridSearchWorkScale'))
          PY2
      - name: Baseline and candidate on the same machine
        env:
          ROUTE_OUTPUT_DIR: ${{ github.workspace }}/results
        run: |
          mkdir results
          (cd base && ROUTE_LABEL=base bun fixtures/bug-reports/bugreport110-motherboard-power-phase/profile-full-route.ts) > results/base.log 2>&1
          (cd candidate && ROUTE_LABEL=candidate bun fixtures/bug-reports/bugreport110-motherboard-power-phase/profile-full-route.ts) > results/candidate.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-budget-${{ matrix.scale }}
          path: results
