name: Motherboard search policy comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        greedy: [1.5, 2, 2.5, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67497a16129f5d4b69d7cfe1ed54a719d5e597b5
          path: base
      - uses: actions/checkout@v4
        with:
          ref: 36959e935a1d8a85006e409ad117086ef3fe69a5
          path: candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
        working-directory: base
      - run: bun install
        working-directory: candidate
      - name: Retain DRC records and choose experimental search weight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for root in ['base', 'candidate']:
            p=Path(root)/'fixtures/bug-reports/bugreport110-motherboard-power-phase/profile-full-route.ts'
            s=p.read_text().replace('const drc = validationInput ? evaluateRelaxedDrc(validationInput) : null', 'const drc = validationInput ? evaluateRelaxedDrc(validationInput) : null\nif (drc) writeFileSync(resolve(outputDirectory, `${label}.drc.json`), JSON.stringify(drc))')
            p.write_text(s)
          PY
          cat > candidate/search-weight.ts <<'SCRIPT'
          import { HighDensitySolverA01 } from "@tscircuit/high-density-a01"
          const setup = HighDensitySolverA01.prototype._setup
          HighDensitySolverA01.prototype._setup = function () {
            this.hyperParameters.greedyMultiplier = Number(process.env.SEARCH_WEIGHT)
            return setup.call(this)
          }
          SCRIPT
      - name: Baseline and candidate on the same machine
        env:
          ROUTE_OUTPUT_DIR: ${{ github.workspace }}/results
          SEARCH_WEIGHT: ${{ matrix.greedy }}
        run: |
          mkdir results
          (cd base && ROUTE_LABEL=base bun fixtures/bug-reports/bugreport110-motherboard-power-phase/profile-full-route.ts) > results/base.log 2>&1
          (cd candidate && ROUTE_LABEL=candidate bun --preload ./search-weight.ts fixtures/bug-reports/bugreport110-motherboard-power-phase/profile-full-route.ts) > results/candidate.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-policy-${{ matrix.greedy }}
          path: results
