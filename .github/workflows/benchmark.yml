name: Controlled repair performance benchmark
on:
  workflow_dispatch:
    inputs:
      repair_fix:
        description: Exact repair commit to test
        required: true
        type: string
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: dataset01
            samples: ""
            rounds: 3
            label: dataset01-repeats-with-control
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6d24fa9d61abc2526f677883c88bef62f4e88c41
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Prepare identical dependency trees
        env:
          REPAIR_FIX: ${{ inputs.repair_fix }}
        run: |
          set -euo pipefail
          [[ "$REPAIR_FIX" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p work/repair-fix-source work/results
          curl --fail --location --retry 3 "https://codeload.github.com/tscircuit/high-density-repair03/tar.gz/$REPAIR_FIX" -o work/repair-fix.tar.gz
          tar -xzf work/repair-fix.tar.gz --strip-components=1 -C work/repair-fix-source
          mv node_modules/high-density-repair03 work/repair-base
          cp -a work/repair-base work/repair-fix
          node <<'NODE'
          const fs = require('node:fs')
          const base = JSON.parse(fs.readFileSync('work/repair-base/package.json'))
          const fix = JSON.parse(fs.readFileSync('work/repair-fix-source/package.json'))
          if (JSON.stringify(base.dependencies) !== JSON.stringify(fix.dependencies)) throw new Error('Repair dependencies differ')
          fs.writeFileSync('work/results/provenance.json', JSON.stringify({ consumer: '6d24fa9d61abc2526f677883c88bef62f4e88c41', repairBase: 'ea62b9ab6355cdbc2a603b779edc44940d81f5d0', repairFix: process.env.REPAIR_FIX, bun: '1.4.2', concurrency: 3, threads: 1, effort: 1, sampleTimeoutSeconds: 360, transitiveDependencies: 'identical copied installation' }, null, 2))
          NODE
          rm -rf work/repair-fix/lib
          cp -a work/repair-fix-source/lib work/repair-fix/lib
      - name: Run alternating paired comparisons
        env:
          BENCH_DATASET: ${{ matrix.dataset }}
          BENCH_SAMPLES: ${{ matrix.samples }}
          BENCH_ROUNDS: ${{ matrix.rounds }}
        run: |
          set -euo pipefail
          args=(--pipeline 9 --dataset "$BENCH_DATASET" --concurrency 3 --threads 1 --effort 1 --sample-timeout 360s)
          if [ -n "$BENCH_SAMPLES" ]; then args+=(--sample-numbers "$BENCH_SAMPLES"); fi
          for round in $(seq 1 "$BENCH_ROUNDS"); do
            case "$round" in
              1) variants=(base fix control) ;;
              2) variants=(control fix base) ;;
              3) variants=(fix base control) ;;
            esac
            for variant in "${variants[@]}"; do
              source_variant="$variant"
              if [ "$variant" = control ]; then source_variant=base; fi
              ln -sfn "$PWD/work/repair-$source_variant" node_modules/high-density-repair03
              ./benchmark.sh "${args[@]}" 2>&1 | tee "work/results/round$round-$variant.log"
              cp benchmark-result.json "work/results/round$round-$variant.json"
              cp benchmark-result.txt "work/results/round$round-$variant.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-repair-${{ matrix.label }}
          path: work/results
