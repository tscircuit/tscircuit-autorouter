name: SRJ18 dependency identity probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout-control:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare two identical checkouts as in ordinary PR workflow
        run: |
          python3 scripts/srj18-investigation/prepare-variants.py
          git worktree add --detach ../same-machine-base 73f2a0c8a05a06d85e0ddf126cb903e3949523d6
          git worktree add --detach ../same-machine-pr 73f2a0c8a05a06d85e0ddf126cb903e3949523d6
          sed -i 's/save = false/save = true/' ../same-machine-base/bunfig.toml ../same-machine-pr/bunfig.toml
          (cd ../same-machine-base && bun install --save-text-lockfile)
          (cd ../same-machine-pr && bun install --save-text-lockfile)
          mkdir -p checkout-results
          cp ../same-machine-base/bun.lock checkout-results/base.bun.lock
          cp ../same-machine-pr/bun.lock checkout-results/pr.bun.lock
          diff -u ../same-machine-base/bun.lock ../same-machine-pr/bun.lock > checkout-results/dependency-lock.diff || test "$?" -eq 1
          cat checkout-results/dependency-lock.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-controls
          path: checkout-results
