name: Check iCE Pi fanout before reachability pruning is reached
on:
  push:
    branches: [codex/ddr1110-icepi-fanout-check]
permissions:
  contents: read
jobs:
  boards:
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fixed]
        include:
          - variant: base
            router: 1c99b22209414cb9a79601f9e877df253e3cf34d
          - variant: fixed
            router: f4bea030d74ac3899097c98e50a1cdedb4106010
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.router }}
          path: router
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: e24a47d4bb880bf4066b8440cfa1693157576f03
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pinned sources and build the selected runtime
        run: |
          for folder in router core; do (cd "$folder" && bun install --ignore-scripts); done
          python3 - <<'PYINSTRUMENT'
          from pathlib import Path
          p=Path('router/lib/solvers/NecessaryCrampedPortPointSolver/MultiTargetNecessaryCrampedPortPointSolver.ts')
          s=p.read_text().replace('    this._setup()', '    console.log("REACHABILITY_PRUNING_CONSTRUCTED", input.capacityMeshNodes.length)\n    this._setup()', 1)
          p.write_text(s)
          PYINSTRUMENT
          (cd router && bun build lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts --target bun --packages external --outfile benchmark-runtime/pipeline9.js)
          cd experiments/full-board-priority-analysis
          bun install --frozen-lockfile --ignore-scripts
          bun build-core.ts ../../core
      - name: Reroute the original DDR control and both full-board modes
        env:
          BOARD_ID: icepi
          FULL_BOARD_CASE_IDS: icepi
        working-directory: experiments/full-board-priority-analysis
        run: |
          export FULL_BOARD_CORE_SOURCE="$GITHUB_WORKSPACE/core"
          export FULL_BOARD_ROUTER_MODULE="$GITHUB_WORKSPACE/router/benchmark-runtime/pipeline9.js"
          export FULL_BOARD_ROUTER_COMMIT="$(git -C ../../router rev-parse HEAD)"
          FULL_BOARD_VARIANT=${{ matrix.variant }} bun plane-suite.ts ../../results/${{ matrix.variant }}/full fanout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icepi-fanout-${{ matrix.variant }}
          path: results
          retention-days: 14
      - name: Export native results and phase inputs for analysis
        if: always()
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          names={'environment.json','summary.json','progress.json','assessment.json','diagnostics.json','process.json','results.json','pcb.svg','worker.log','audit.log'}
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file() and (path.name in names or path.name.endswith('.srj.json')):
                      archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('FANOUT_RECHECK_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('FANOUT_RECHECK_EVIDENCE_END')
          PY
