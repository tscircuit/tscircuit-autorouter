name: Benchmark pruning equivalent failed fanout layer assignments
on:
  push:
    branches: [analysis/e2e-prune-impossible-layer-combinations-20261120]
concurrency:
  group: e2e-uploaded-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sample: ["butterstick-original", "butterstick-spaced", "glider-original", "glider-spaced", "h616-original", "h616-spaced", "icepi-original", "icepi-spaced", "imx6-original", "imx6-spaced"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 780b91845a73f2b1990d33170a99ab035d208532
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pinned latest core dependencies
        run: |
          python3 - <<'PYSETUP'
          from pathlib import Path
          config=Path('core/bunfig.toml');config.write_text(config.read_text().replace('save = false','save = true'))
          PYSETUP
          for attempt in 1 2 3; do
            if bun install --ignore-scripts; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            if (cd core && bun install --ignore-scripts); then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Apply only the blocked-layer search change
        run: |
          curl --fail --location --silent https://raw.githubusercontent.com/tscircuit/fanout-solver/63d26ed/lib/fanout-solver.ts -o fanout-solver.ts
          curl --fail --location --silent https://raw.githubusercontent.com/tscircuit/fanout-solver/63d26ed/lib/route-bus/route-bus-alternatives.ts -o route-bus-alternatives.ts
          python3 - <<'PYPATCH'
          import hashlib,json
          from pathlib import Path
          patch=[]
          for target,source in [('fanout-solver.ts','fanout-solver.ts'),('route-bus/route-bus-alternatives.ts','route-bus-alternatives.ts')]:
              path=Path('core/node_modules/@tscircuit/fanout-solver/lib')/target
              before=path.read_bytes();after=Path(source).read_bytes()
              patch.append({'file':target,'beforeSha256':hashlib.sha256(before).hexdigest(),'afterSha256':hashlib.sha256(after).hexdigest()})
              path.write_bytes(after)
          Path('fanout-source-patch.json').write_text(json.dumps(patch,indent=2))
          PYPATCH
      - name: Prepare exact uploaded sources and record dependency revisions
        run: |
          python3 - <<'PYSAMPLES'
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          source=Path('experiments/e2e-samples-20261120');runtime=Path('core/e2e-runtime');runtime.mkdir()
          for name in ['worker-deep.tsx','run-deep.py','assess.ts','correct-workflow.tsx','connectivity.ts','intercept-internals.ts']:shutil.copyfile(source/name,runtime/name)
          import gzip
          (runtime/'expected-circuits.json').write_bytes(gzip.decompress((source/'expected-circuits.json.gz').read_bytes()))
          manifest=json.loads((source/'inputs.json').read_text())
          assert hashlib.sha256((source/'samples.zip').read_bytes()).hexdigest()==manifest['archiveSha256']
          with zipfile.ZipFile(source/'samples.zip') as z:
              for entry in manifest['samples']:
                  content=z.read(entry['name'])
                  assert hashlib.sha256(content).hexdigest()==entry['sha256']
                  target=runtime/'samples'/entry['name'];target.parent.mkdir(exist_ok=True);target.write_bytes(content)
          revisions={'tscircuit':'0.0.3257','core':'780b91845a73f2b1990d33170a99ab035d208532','router':'native-installed-package','winding':'202dbe9eb0088633b6fa094120dba6f2f41f8803','sampleMode':'fanout_first','archiveSha256':manifest['archiveSha256'],'coreLockSha256':hashlib.sha256(Path('core/bun.lock').read_bytes()).hexdigest()}
          for package in ['@tscircuit/fanout-solver','@tscircuit/winding-breakout-point-solver','@tscircuit/capacity-autorouter','@tscircuit/props','@tscircuit/bus-lanes-solver','@tscircuit/checks','circuit-to-svg','react']:
              revisions[package]=json.loads((Path('core/node_modules')/package/'package.json').read_text())['version']
          assert revisions['@tscircuit/fanout-solver']=='0.0.94'
          assert revisions['@tscircuit/capacity-autorouter']=='0.0.1139'
          revisions['interception']='read-only winding stages and original fanout clearance rejections'
          revisions['corePatchApplied']=False
          revisions['fanoutSourcePatch']=json.loads(Path('fanout-source-patch.json').read_text())
          (runtime/'revisions.json').write_text(json.dumps(revisions,indent=2)+'\n')
          print(json.dumps(revisions))
          PYSAMPLES
      - name: Route unmodified Core and intercept internal failure decisions
        env:
          E2E_SAMPLE: ${{ matrix.sample }}
          E2E_WORKFLOW: fanout_first
        run: |
          cd core/e2e-runtime
          python3 run-deep.py "$E2E_SAMPLE" "$GITHUB_WORKSPACE/results/$E2E_SAMPLE"
          bun assess.ts "$E2E_SAMPLE" "$GITHUB_WORKSPACE/results/$E2E_SAMPLE"
          cd "$GITHUB_WORKSPACE"
          bun experiments/e2e-samples-20261120/audit-diagnostics.ts "results/$E2E_SAMPLE"
      - name: Publish complete stage captures and PCB SVG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-circuit-interception-${{ matrix.sample }}
          path: results
          if-no-files-found: error
      - name: Export captured evidence
        if: always()
        env:
          E2E_SAMPLE: ${{ matrix.sample }}
        run: |
          python3 - <<'PYEXPORT'
          import base64,io,os,zipfile
          from pathlib import Path
          root=Path('results')
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in root.rglob('*'):
                  if p.name in ['report.json','process.json','assessment.json','diagnostics.json','pipeline-internals.json']:z.writestr(str(p.relative_to(root)),p.read_bytes())
          print('E2E_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('E2E_EVIDENCE_END')
          PYEXPORT
