name: Witness relative repair retained production stage trial
on:
  push:
    branches: [codex/witness-relative-stage-trial-20261029]
    paths: [scripts/experiment-audit/witness-relative-stage-trial-20261029.json]
permissions:
  contents: read
  actions: read
jobs:
  retained_stage:
    name: witness-relative-stage-trial / srj24 / 8 / production-stage-only
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Verify sealed production stage source and exact retained inputs
        run: python3 controller/scripts/experiment-audit/run-witness-relative-stage-trial.py --mode plan
      - uses: actions/checkout@v4
        with:
          ref: c9fd3d90b17fcb9dffe7a3b634823b982506f474
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install exact pinned source dependencies
        run: python3 controller/scripts/experiment-audit/install-pinned-dependencies.py source
      - name: Execute production stage solve and independently replay relative proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 controller/scripts/experiment-audit/run-witness-relative-stage-trial.py --mode run --source source --output results
      - name: Retain complete production stage proof without board or speed credit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-relative-production-stage-only-srj24-8
          path: results
          if-no-files-found: warn
          retention-days: 30
