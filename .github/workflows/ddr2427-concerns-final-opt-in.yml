name: Qualify minimal fixes with existing plane direction preferences
on:
  push:
    branches: [codex/ddr2427-concerns-final-opt-in]
permissions:
  contents: read
  actions: read
jobs:
  native-experiment:
    strategy:
      fail-fast: false
      matrix:
        board: [icepi, imx6, glider]
        variant: [ordinary, inference]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 3258e97a80f0239c0c92de072c4cba5d559935ce
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: published2427-${{ matrix.board }}
          run-id: 44519377875
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare immutable source variants with identical dependencies
        run: |
          (cd source && bun install --frozen-lockfile --ignore-scripts)
          python3 - <<'PYVARIANTS'
          import json,subprocess
          from pathlib import Path
          root=Path.cwd()
          variants=json.loads(Path('experiments/full-board-priority-analysis/concerns-opt-in-variants.json').read_text())
          for name,revision in variants.items():
              if name != '${{ matrix.variant }}': continue
              subprocess.run(['git','fetch','--no-tags','origin',revision],cwd='source',check=True)
              folder=root/'variants'/name
              subprocess.run(['git','worktree','add','--detach',str(folder),revision],cwd='source',check=True)
              (folder/'node_modules').symlink_to(root/'source/node_modules',target_is_directory=True)
              (folder/'replay-stack-native.ts').write_bytes(Path('experiments/full-board-priority-analysis/replay-stack-native.ts').read_bytes())
              (folder/'validate-native-request-constraints.ts').write_bytes(Path('experiments/full-board-priority-analysis/validate-native-request-constraints.ts').read_bytes())
          PYVARIANTS
      - name: Replay every subset with the same180second budget
        env:
          BOARD_ID: ${{ matrix.board }}
          SELECTED_VARIANT: ${{ matrix.variant }}
          NATIVE_FANOUT_BUDGET_MS: '900000'
        run: |
          python3 - <<'PYREPLAY'
          import json,os,subprocess
          from pathlib import Path
          root=Path.cwd()
          variants=json.loads(Path('experiments/full-board-priority-analysis/concerns-opt-in-variants.json').read_text())
          for name,revision in variants.items():
              if name != os.environ['SELECTED_VARIANT']: continue
              output=root/'results'/name
              completed=subprocess.run(['bun','replay-stack-native.ts',str(root/'captured'/os.environ['BOARD_ID']/'fanout-1-input.json.gz'),str(output)],cwd=root/'variants'/name)
              print('STACK_VARIANT_EXIT',json.dumps({'variant':name,'revision':revision,'exitCode':completed.returncode}),flush=True)
          PYREPLAY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concerns-preferences-${{ matrix.board }}-${{ matrix.variant }}
          path: results
          retention-days: 14
      - name: Export native metrics and actual copper
        if: always()
        run: |
          python3 - <<'PYEXPORT'
          import base64,hashlib,io,json,zipfile
          from pathlib import Path
          rows=[]
          for path in sorted(Path('results').glob('*/report.json')):
              report=json.loads(path.read_text())
              rows.append({'variant':path.parent.name,**report,'copperSha256':hashlib.sha256((path.parent/'best-traces.json').read_bytes()).hexdigest()})
          print('STACK_NATIVE_SUBSETS_REPORT',json.dumps(rows,separators=(',',':')))
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file():archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('STACK_NATIVE_SUBSETS_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('STACK_NATIVE_SUBSETS_EVIDENCE_END')
          assert len(rows)==1
          assert all(row['copperDrc']['valid'] and row['requestConstraints']['valid'] for row in rows)
          PYEXPORT


  matched-frozen:
    strategy:
      fail-fast: false
      matrix:
        pair: [inference]
        include:
          - pair: inference
            before: 5e417426368e7d267e3cef930df5a505951a2b1c
            after: 260446a9aebf51832a3f704c11f654253e45eef0
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.before }}
          path: original
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.after }}
          path: cleanup
      - uses: actions/download-artifact@v4
        with:
          name: guard-0
          run-id: 44415945774
          github-token: ${{ github.token }}
          path: frozen
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: |
          for revision in original cleanup; do
            (cd "$revision" && bun install --frozen-lockfile --ignore-scripts)
            cp experiments/full-board-priority-analysis/replay-frozen-fanout31.ts "$revision/replay-frozen-fanout31.ts"
          done
          python3 experiments/full-board-priority-analysis/add-frozen-physical-audit.py original cleanup
      - name: Run all frozen cases before and after the cleanup on the same worker
        run: |
          for revision in original cleanup; do
            (cd "$revision" && bun replay-frozen-fanout31.ts "$GITHUB_WORKSPACE/frozen/inputs" "$GITHUB_WORKSPACE/matched/$revision" 16)
          done
      - name: Export reports and routed SVG hashes
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          for folder in [*Path('matched').glob('*'),*Path('probes').glob('*/*')]:
              report=folder/'benchmark.json'
              if not report.exists():continue
              print('MATCHED_FANOUT31_RESULT',json.dumps({'cohort':str(folder),'report':json.loads(report.read_text()),'svgs':{path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in folder.glob('*.svg')}},separators=(',',':')))
          print('FROZEN_INPUT_HASHES',json.dumps({path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in Path('frozen/inputs').glob('*.json')},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-stack-frozen-${{ matrix.pair }}
          path: |
            matched
            probes


  boards:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: a4a8f3a71dd66c2cae01d6a7ade426efad833ff6
          path: router
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 75ab017cd6852dbe50516ee1f4ca9d1108c29985
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build the frozen stack with the selected fanout revision
        run: |
          python3 - <<'PYFANOUT'
          import json
          from pathlib import Path
          path=Path('core/package.json');package=json.loads(path.read_text())
          assert package['devDependencies']['@tscircuit/fanout-solver']=='0.0.91'
          package['devDependencies']['@tscircuit/fanout-solver']='https://codeload.github.com/tscircuit/fanout-solver/tar.gz/260446a9aebf51832a3f704c11f654253e45eef0'
          path.write_text(json.dumps(package,indent=2)+'\n')
          PYFANOUT
          for folder in router core; do (cd "$folder" && bun install --ignore-scripts); done
          (cd router && bun build lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts --target bun --packages external --outfile benchmark-runtime/pipeline9.js)
          cd experiments/full-board-priority-analysis
          python3 - <<'PYDEPS'
          import json
          from pathlib import Path
          path=Path('package.json');package=json.loads(path.read_text());package['dependencies']['tscircuit']='0.0.3245';path.write_text(json.dumps(package,indent=2)+'\n')
          PYDEPS
          bun install --ignore-scripts
          bun build-core.ts ../../core
      - name: Verify fanout then buses then remaining nets, and route fresh
        working-directory: experiments/full-board-priority-analysis
        env:
          BOARD_ID: ${{ matrix.board }}
          FULL_BOARD_CAPTURE_STAGE_INPUTS: "1"
          FULL_BOARD_FANOUT_VERSION: "0.0.91+260446a9aebf51832a3f704c11f654253e45eef0"
        run: |
          export FULL_BOARD_CORE_SOURCE="$GITHUB_WORKSPACE/core"
          export FULL_BOARD_CORE_MODULE="$PWD/patched-core/index.js"
          export FULL_BOARD_COPPER_MODULE="$PWD/patched-core/find-floating-copper.js"
          export FULL_BOARD_ROUTER_MODULE="$GITHUB_WORKSPACE/router/benchmark-runtime/pipeline9.js"
          export FULL_BOARD_ROUTER_COMMIT="a4a8f3a71dd66c2cae01d6a7ade426efad833ff6"
          mkdir -p "$GITHUB_WORKSPACE/results/$BOARD_ID"
          cp patched-core/build.json "$GITHUB_WORKSPACE/results/$BOARD_ID/core-build.json"
          cp "$GITHUB_WORKSPACE/core/package.json" "$GITHUB_WORKSPACE/results/$BOARD_ID/core-package.json"
          cp package.json "$GITHUB_WORKSPACE/results/$BOARD_ID/runtime-package.json"
          cp bun.lock "$GITHUB_WORKSPACE/results/$BOARD_ID/runtime-bun.lock"
          python3 - <<'PYPLAN'
          import hashlib,json,os
          from pathlib import Path
          board=os.environ['BOARD_ID']
          plan=json.loads(Path(f'verified-plans/{board}.json').read_text())
          source=Path(f'{board}/source.json').read_bytes()
          assert plan['sourceSha256']==hashlib.sha256(source).hexdigest()
          assert plan['initialCopperElements']==0
          plan['provenance']={'kind':'original_verified_schedule','coreSource':'75ab017cd6852dbe50516ee1f4ca9d1108c29985','reason':'Core, board source and scheduling inputs are frozen; route the board directly in the timed worker.'}
          output=Path(os.environ['GITHUB_WORKSPACE'])/'results'/board/'plan.json'
          output.write_text(json.dumps(plan,indent=2)+'\n')
          PYPLAN
          bun run-fanout-bus-first.ts "$BOARD_ID" "$GITHUB_WORKSPACE/results/$BOARD_ID"
      - name: Independently audit actual partial copper
        if: always()
        env:
          BOARD_ID: ${{ matrix.board }}
        run: |
          python3 - <<'PYAUDIT'
          import os,subprocess
          from pathlib import Path
          root=Path.cwd()
          source=(root/'core/node_modules/@tscircuit/fanout-solver').resolve()
          scripts=root/'experiments/full-board-priority-analysis'
          for name in ['audit-stack-captured.ts','validate-native-request-constraints.ts']:
              (source/name).write_bytes((scripts/name).read_bytes())
          output=root/'results'/os.environ['BOARD_ID']
          subprocess.run(['bun','audit-stack-captured.ts',str(output/'fanout-1-input.json.gz'),str(output/'fanout-best-output.srj.json.gz'),str(output/'request-audit.json')],cwd=source,check=True)
          PYAUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-stack-board-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export native PCB output and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          for captured in Path('results').rglob('fanout-1-input.json.gz'):
              output=captured.parent/'fanout-best-output.srj.json.gz'
              if not output.exists(): continue
              inputs=json.loads(gzip.decompress(captured.read_bytes()))
              routed=json.loads(gzip.decompress(output.read_bytes()))
              original=inputs['solverParams']['obstacles']
              assert routed['obstacles'][:len(original)]==original
              routed['obstacles']=routed['obstacles'][len(original):]
              patch={'inputSha256':hashlib.sha256(captured.read_bytes()).hexdigest(),'retainedInputObstacleCount':len(original),'outputWithAppendedObstaclesOnly':routed,'originalCompressedOutputSha256':hashlib.sha256(output.read_bytes()).hexdigest()}
              (captured.parent/'fanout-output-patch.json.gz').write_bytes(gzip.compress(json.dumps(patch,separators=(',',':')).encode(),mtime=0))
          names={'core-build.json','core-package.json','plan.json','progress.json','assessment.json','diagnostics.json','process.json','circuit.json','pcb.svg','worker.log','runtime-package.json','runtime-bun.lock','request-audit.json'}
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file() and (path.name in names or path.name=='fanout-output-patch.json.gz'):
                      archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('FANOUT_BUS_FIRST_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('FANOUT_BUS_FIRST_EVIDENCE_END')
          PY


