name: Measure native OrangeCrab clearance connectivity
on:
  push:
    branches: [codex/ddr2410-connectivity]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orange-2410-complete-phase-profile
          run-id: 44261032419
          github-token: ${{ github.token }}
          path: captured
      - name: Export native input and routed output
        run: |
          python3 - <<'PYEXPORT'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('captured').rglob('*'):
                  if path.name in {'phase-1-input.srj.json','traces.json','report.json'}:
                      archive.writestr(path.name,path.read_bytes())
          print('CONNECTIVITY2410_NATIVE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('CONNECTIVITY2410_NATIVE_END')
          PYEXPORT
