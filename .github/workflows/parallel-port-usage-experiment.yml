name: Parallel port usage experiment
on:
  push:
    branches: [codex/parallel-port-duplication]
    paths:
      - .github/workflows/parallel-port-usage-experiment.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun test tests/solvers/parallel-port-usage.test.ts tests/features/pipeline9-parallel-port-point.test.ts tests/features/pipeline9-srj18-sample01-thread-parity.test.ts --timeout 9999999
  benchmark:
    needs: validate
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bash benchmark.sh --dataset 18 --threads 4
      - name: Report routing phase timing
        run: |
          python3 - <<'PY'
          import json
          x = json.load(open("benchmark-result.json"))
          for t in x["tests"]:
            m = t["routingMetrics"].get("tinyHypergraph", {})
            print(t["scenarioName"], "total", t["elapsedTimeMs"], "pathing", t["routingMetrics"]["phaseTimeMs"].get("portPointPathingSolver"), "search", m.get("timeMs"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-port-usage-result
          path: |
            benchmark-result.json
            benchmark-result.txt

# Worker results use numeric port IDs; metadata stays on the host.
