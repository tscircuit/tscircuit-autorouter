name: Check the minimal restart stack
on:
  push:
    branches: [codex/ddr2427-restart-clean-checks]
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        revision:
          - a0e49159c220e0ce93a0a51ad7247571b122f29d
          - 883e1f4c9de615fc46384d7c6b864d50611df5c1
          - b5c615b6c107b38631826afaa1eb4ad384f5848f
          - 4e2c6d210d2ff15246d372f2f5e4f84e55fddf3e
          - 4df7709ede6833f7fb4fc8ec98d6707eadf6f8b3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - if: always()
        run: bun run typecheck
