name: Verify fanout PR concerns independently
on:
  push:
    branches: [codex/ddr2427-concerns-initial]
permissions:
  contents: read
  actions: read
jobs:
  native-isolated:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 3258e97a80f0239c0c92de072c4cba5d559935ce
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: published2427-${{ matrix.board }}
          run-id: 44519377875
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare immutable stages with identical dependencies
        run: |
          (cd source && bun install --frozen-lockfile --ignore-scripts)
          python3 - <<'PYSETUP'
          import json,subprocess
          from pathlib import Path
          root=Path.cwd()
          revisions={'before':'5e417426368e7d267e3cef930df5a505951a2b1c','after':'03b408f3094180b917735890c1eb257001fe960c'}
          for name,revision in revisions.items():
              subprocess.run(['git','fetch','--no-tags','origin',revision],cwd='source',check=True)
              folder=root/'variants'/name
              subprocess.run(['git','worktree','add','--detach',str(folder),revision],cwd='source',check=True)
              (folder/'node_modules').symlink_to(root/'source/node_modules',target_is_directory=True)
              for script in ['isolated-stack-boundaries.ts','validate-native-request-constraints.ts']:
                  (folder/script).write_bytes((root/'experiments/full-board-priority-analysis'/script).read_bytes())
          PYSETUP
      - name: Route the same original requests separately with every original obstacle
        env:
          BOARD_ID: ${{ matrix.board }}
        run: |
          for revision in before after; do
            mkdir -p "$GITHUB_WORKSPACE/results/$revision/boundaries"
            (cd "variants/$revision" && bun isolated-stack-boundaries.ts "$GITHUB_WORKSPACE/captured/$BOARD_ID/fanout-1-input.json.gz" "$GITHUB_WORKSPACE/results/$revision/boundaries")
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concerns-boundary-${{ matrix.board }}
          path: results
      - name: Export exact isolated results and accepted copper
        if: always()
        run: |
          python3 - <<'PYEXPORT'
          import base64,io,json,zipfile
          from pathlib import Path
          for path in sorted(Path('results').glob('*/*/report.json')):
              print('MINIMAL_STACK_ISOLATED_REPORT',json.dumps({'revision':path.parent.parent.name,'kind':path.parent.name,'rows':json.loads(path.read_text())},separators=(',',':')))
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file():archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('MINIMAL_STACK_ISOLATED_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('MINIMAL_STACK_ISOLATED_EVIDENCE_END')
          PYEXPORT

  native-width:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 3258e97a80f0239c0c92de072c4cba5d559935ce
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: published2427-${{ matrix.board }}
          run-id: 44519377875
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare immutable source variants with identical dependencies
        run: |
          (cd source && bun install --frozen-lockfile --ignore-scripts)
          python3 - <<'PYVARIANTS'
          import json,subprocess
          from pathlib import Path
          root=Path.cwd()
          variants=json.loads(Path('experiments/full-board-priority-analysis/concerns-width-variants.json').read_text())
          for name,revision in variants.items():
              subprocess.run(['git','fetch','--no-tags','origin',revision],cwd='source',check=True)
              folder=root/'variants'/name
              subprocess.run(['git','worktree','add','--detach',str(folder),revision],cwd='source',check=True)
              (folder/'node_modules').symlink_to(root/'source/node_modules',target_is_directory=True)
              (folder/'replay-stack-native.ts').write_bytes(Path('experiments/full-board-priority-analysis/replay-stack-native.ts').read_bytes())
              (folder/'validate-native-request-constraints.ts').write_bytes(Path('experiments/full-board-priority-analysis/validate-native-request-constraints.ts').read_bytes())
          PYVARIANTS
      - name: Replay every subset with the same180second budget
        env:
          BOARD_ID: ${{ matrix.board }}
          NATIVE_FANOUT_BUDGET_MS: '900000'
        run: |
          python3 - <<'PYREPLAY'
          import json,os,subprocess
          from pathlib import Path
          root=Path.cwd()
          variants=json.loads(Path('experiments/full-board-priority-analysis/concerns-width-variants.json').read_text())
          for name,revision in variants.items():
              output=root/'results'/name
              completed=subprocess.run(['bun','replay-stack-native.ts',str(root/'captured'/os.environ['BOARD_ID']/'fanout-1-input.json.gz'),str(output)],cwd=root/'variants'/name)
              print('STACK_VARIANT_EXIT',json.dumps({'variant':name,'revision':revision,'exitCode':completed.returncode}),flush=True)
          PYREPLAY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concerns-width-native-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export native metrics and actual copper
        if: always()
        run: |
          python3 - <<'PYEXPORT'
          import base64,hashlib,io,json,zipfile
          from pathlib import Path
          rows=[]
          for path in sorted(Path('results').glob('*/report.json')):
              report=json.loads(path.read_text())
              rows.append({'variant':path.parent.name,**report,'copperSha256':hashlib.sha256((path.parent/'best-traces.json').read_bytes()).hexdigest()})
          print('STACK_NATIVE_SUBSETS_REPORT',json.dumps(rows,separators=(',',':')))
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file():archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('STACK_NATIVE_SUBSETS_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('STACK_NATIVE_SUBSETS_EVIDENCE_END')
          assert len(rows)==2
          assert all(row['copperDrc']['valid'] and row['requestConstraints']['valid'] for row in rows)
          PYEXPORT

  matched-frozen:
    strategy:
      fail-fast: false
      matrix:
        pair: [width, boundary]
        include:
          - pair: width
            before: 6acee28dcce9a61912625f3c5c0a189431ae42e6
            after: b59ba59f62fa498f5bfe83daae42f711246aef34
          - pair: boundary
            before: 5e417426368e7d267e3cef930df5a505951a2b1c
            after: 03b408f3094180b917735890c1eb257001fe960c
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.before }}
          path: original
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.after }}
          path: cleanup
      - uses: actions/download-artifact@v4
        with:
          name: guard-0
          run-id: 44415945774
          github-token: ${{ github.token }}
          path: frozen
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: |
          for revision in original cleanup; do
            (cd "$revision" && bun install --frozen-lockfile --ignore-scripts)
            cp experiments/full-board-priority-analysis/replay-frozen-fanout31.ts "$revision/replay-frozen-fanout31.ts"
          done
      - name: Run all frozen cases before and after the cleanup on the same worker
        run: |
          for revision in original cleanup; do
            (cd "$revision" && bun replay-frozen-fanout31.ts "$GITHUB_WORKSPACE/frozen/inputs" "$GITHUB_WORKSPACE/matched/$revision" 16)
          done
      - name: Export reports and routed SVG hashes
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          for folder in [*Path('matched').glob('*'),*Path('probes').glob('*/*')]:
              report=folder/'benchmark.json'
              if not report.exists():continue
              print('MATCHED_FANOUT31_RESULT',json.dumps({'cohort':str(folder),'report':json.loads(report.read_text()),'svgs':{path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in folder.glob('*.svg')}},separators=(',',':')))
          print('FROZEN_INPUT_HASHES',json.dumps({path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in Path('frozen/inputs').glob('*.json')},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concerns-frozen-${{ matrix.pair }}
          path: |
            matched
            probes

