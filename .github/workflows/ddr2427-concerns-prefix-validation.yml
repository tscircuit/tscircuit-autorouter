name: Check coordinated DRAM routing around the ordinary repair changes
on:
  push:
    branches: [codex/ddr2427-concerns-prefix-validation]
permissions:
  contents: read
jobs:
  dram:
    strategy:
      fail-fast: false
      matrix:
        revision:
          - 652407c1ad9d246ca16ecf64044cf83eec2e1db3
          - 6d7d5c6bc3bb08d3ad592df5ec7d61697d88ce96
          - 3b2f58037d4bf284f389c7359f6a0e228a9f5e61
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the unchanged143-connection DRAM test in a separate process
        run: timeout 360s bun test tests/am62l-core-progressive-dram.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-dram-${{ matrix.revision }}
          path: |
            tests/**/__snapshots__/*.actual.svg
            tests/**/__snapshots__/*.diff.png
          if-no-files-found: ignore

  matched-frozen:
    strategy:
      fail-fast: false
      matrix:
        pair: [inference]
        include:
          - pair: inference
            before: 5e417426368e7d267e3cef930df5a505951a2b1c
            after: 3b2f58037d4bf284f389c7359f6a0e228a9f5e61
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.before }}
          path: original
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.after }}
          path: cleanup
      - uses: actions/download-artifact@v4
        with:
          name: guard-0
          run-id: 44415945774
          github-token: ${{ github.token }}
          path: frozen
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: |
          for revision in original cleanup; do
            (cd "$revision" && bun install --frozen-lockfile --ignore-scripts)
            cp experiments/full-board-priority-analysis/replay-frozen-fanout31.ts "$revision/replay-frozen-fanout31.ts"
          done
          python3 experiments/full-board-priority-analysis/add-frozen-physical-audit.py original cleanup
      - name: Run all frozen cases before and after the cleanup on the same worker
        run: |
          for revision in original cleanup; do
            (cd "$revision" && bun replay-frozen-fanout31.ts "$GITHUB_WORKSPACE/frozen/inputs" "$GITHUB_WORKSPACE/matched/$revision" 16)
          done
      - name: Export reports and routed SVG hashes
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          for folder in [*Path('matched').glob('*'),*Path('probes').glob('*/*')]:
              report=folder/'benchmark.json'
              if not report.exists():continue
              print('MATCHED_FANOUT31_RESULT',json.dumps({'cohort':str(folder),'report':json.loads(report.read_text()),'svgs':{path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in folder.glob('*.svg')}},separators=(',',':')))
          print('FROZEN_INPUT_HASHES',json.dumps({path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in Path('frozen/inputs').glob('*.json')},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-stack-frozen-${{ matrix.pair }}
          path: |
            matched
            probes

