name: Qualify pad-aware boundary shortcuts
on:
  push:
    branches: [artifacts/a13-cpu-pad-contact-snapshots]
    paths: [.github/workflows/a13-cpu-contact-snapshots.yml]
permissions:
  contents: write
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ff49717f5e5bd37740c6c010bf233358a2d43fcf
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install declared dependencies and renderer
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('package.json')
          data=json.loads(p.read_text())
          data['overrides']={**data.get('overrides',{}),'csstype':'3.1.3'}
          data['trustedDependencies']=list(dict.fromkeys([*data.get('trustedDependencies',[]),'sharp']))
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          bun install
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun scripts/check-solver-runtime-packaging.ts
      - name: Verify unchanged small-board connectivity and DRC
        run: |
          cat > .qualify-boundary.ts <<'TS'
          import { AutoroutingPipelineSolver7_MultiGraph } from "./lib/autorouter-pipelines/AutoroutingPipeline7_MultiGraph/AutoroutingPipelineSolver7_MultiGraph"
          import { evaluateRelaxedDrc } from "./lib/testing/evaluate-relaxed-drc"
          for(const entry of [
            {name:"bugreport47-8ee80e-esp32-breakout",routes:29},
            {name:"bugreport62-0f6ca4",routes:12},
          ]) {
            const report = await Bun.file("./fixtures/bug-reports/"+entry.name+"/"+entry.name+".json").json()
            const input = report.simple_route_json
            const solver = new AutoroutingPipelineSolver7_MultiGraph(input)
            solver.solve()
            const traces = solver.getOutputSimplifiedPcbTraces()
            const {errors} = evaluateRelaxedDrc({inputSrj:input,srjWithPointPairs:solver.srjWithPointPairs!,routedTraces:traces})
            const metrics = {board:entry.name,solved:solver.solved,routes:traces.length,drc:errors.length}
            console.log("QUALIFIED_SMALL_BOARD="+JSON.stringify(metrics))
            if(!solver.solved||traces.length!==entry.routes||errors.length!==0) throw Error("Small-board quality changed: "+JSON.stringify(metrics))
          }
          TS
          bun .qualify-boundary.ts
          rm .qualify-boundary.ts
      - name: Generate the existing board snapshots with the corrected fix
        env:
          BUN_UPDATE_SNAPSHOTS: 1
        run: bun test ./tests/repro/pipeline9-a13-regional-repair-shorts.test.ts ./tests/repro/pipeline9-a13-declared-trace-clearance.test.ts ./tests/repro/pipeline9-a13-fixed-copper-checks.test.ts --timeout 9999999
      - name: Record only generated SVGs on the experiment branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const branch = "experiments/a13-physical-shortcut"
            for(const path of [
              "tests/repro/__snapshots__/pipeline9-a13-declared-trace-clearance.snap.svg",
              "tests/repro/__snapshots__/pipeline9-a13-declared-trace-clearance-close-trace-pairs.snap.svg",
              "tests/repro/__snapshots__/pipeline9-a13-fixed-copper-checks.snap.svg",
              "tests/repro/__snapshots__/pipeline9-a13-regional-repair-shorts.snap.svg",
              "tests/repro/__snapshots__/pipeline9-a13-regional-repair-shorts-copper-contacts.snap.svg",
            ]) {
              const svg=fs.readFileSync(path,"utf8")
              const content=Buffer.from(svg).toString("base64")
              const {data}=await github.rest.repos.getContent({...context.repo,path,ref:branch})
              if(data.content.replace(/\s/g,"")===content) continue
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,branch,path,content,sha:data.sha,
                message:"Record verified boundary-port snapshot "+path
              })
              console.log("RECORDED_SVG="+path)
            }
