name: Check A13 boundary guard build and types
on:
  push:
    branches: [artifacts/a13-cpu-pad-contact-snapshots]
    paths: [.github/workflows/a13-cpu-contact-snapshots.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ca3a5c958f7abbcd8fbfb152dfad31b67d025bf
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install declared dependencies
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('package.json')
          data=json.loads(p.read_text())
          data['overrides']={**data.get('overrides',{}),'csstype':'3.1.3'}
          data['trustedDependencies']=list(dict.fromkeys([*data.get('trustedDependencies',[]),'sharp']))
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          bun install
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun scripts/check-solver-runtime-packaging.ts
