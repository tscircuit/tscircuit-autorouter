name: Review received routing snapshots
on:
  push:
    branches: [artifacts/a13-cpu-pad-contact-snapshots]
    paths: [.github/workflows/a13-cpu-contact-snapshots.yml]
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 44196740694
          github-token: ${{ github.token }}
          pattern: diff-png-and-snap-svg-artifacts-node*
          path: received
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const branch = "artifacts/a13-cpu-pad-contact-snapshots"
            for (const [source, path] of [
              ["tests/repro/__snapshots__/pipeline9-srj18-sample9-layer-tie-break.received.svg", "review/srj18-sample9.received.svg"],
              ["tests/bugs/__snapshots__/bugreport107-board-1726-linux.received.svg", "review/bugreport107-board-1726-linux.received.svg"]
            ]) {
              const sourcePath = "received/" + source
              const svg = fs.readFileSync(sourcePath, "utf8")
              let sha
              try {
                const { data } = await github.rest.repos.getContent({...context.repo,path,ref:branch})
                if(data.content.replace(/\s/g,"")===Buffer.from(svg).toString("base64")) continue
                sha=data.sha
              } catch(error) {
                if(error.status!==404) throw error
              }
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,branch,path,sha,
                content:Buffer.from(svg).toString("base64"),
                message:"Preserve the CI-rendered " + path
              })
              console.log(path + ": " + svg.match(/Relaxed DRC errors: (\d+)/)?.[1])
            }
