name: Native A13 CPU contact snapshots
on:
  push:
    branches: [artifacts/a13-cpu-pad-contact-snapshots]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e0409768859dc9c3d461ed53d3f48b864c18913
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the declared routing dependencies
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('package.json')
          data=json.loads(p.read_text())
          data['overrides']={**data.get('overrides',{}),'csstype':'3.1.3'}
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          bun install
          bun pm trust sharp
      - name: Generate both views from the unchanged real board
        env:
          BUN_UPDATE_SNAPSHOTS: 1
        run: bun test tests/repro/pipeline9-a13-regional-repair-shorts.test.ts --timeout 9999999
      - name: Commit the generated SVGs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const branch = "repro/a13-cpu-pad-contact"
            for (const name of [
              "pipeline9-a13-regional-repair-shorts.snap.svg",
              "pipeline9-a13-regional-repair-shorts-copper-contacts.snap.svg"
            ]) {
              const path = "tests/repro/__snapshots__/" + name
              const content = fs.readFileSync(path).toString("base64")
              let sha
              try {
                const { data } = await github.rest.repos.getContent({
                  ...context.repo, path, ref: branch
                })
                if (data.content.replace(/\s/g, "") === content) continue
                sha = data.sha
              } catch (error) {
                if (error.status !== 404) throw error
              }
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, branch, path, content, sha,
                message: "Record native A13 " + name
              })
              const count = fs.readFileSync(path, "utf8").match(/Relaxed DRC errors: (\d+)/)
              console.log(name + " findings=" + count[1])
            }
