name: Verify changed shortcut routing snapshots
on:
  push:
    branches: [artifacts/a13-cpu-pad-contact-snapshots]
    paths: [.github/workflows/a13-cpu-contact-snapshots.yml]
permissions:
  contents: write
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 4
            tests: ./tests/ordered-usb-pair-length-matching2.test.ts ./tests/bugs/bugreport99-nrf52810-drc-identity-swap.test.ts
          - group: 6
            tests: ./tests/bugs/bugreport64-be7d8f.test.ts
          - group: 8
            tests: ./tests/ordered-usb-pair-length-matching1.test.ts ./tests/bugs/bugreport94-56fa2e.test.ts ./tests/bugs/bugreport109-book-reading-clip-lamp.test.ts
          - group: 9
            tests: ./tests/bugs/bugreport85-pico-usb-differential-pair-visual.test.ts ./tests/bugs/nema-23-stepper-controller.test.ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 888fd8bff6ec100c65d77f655188667c4ac18d15
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install declared dependencies and renderer
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('package.json')
          data=json.loads(p.read_text())
          data['overrides']={**data.get('overrides',{}),'csstype':'3.1.3'}
          data['trustedDependencies']=list(dict.fromkeys([*data.get('trustedDependencies',[]),'sharp']))
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          bun install
      - name: Regenerate only CI-failing tests with unchanged electrical assertions
        env:
          BUN_UPDATE_SNAPSHOTS: 1
        run: bun test ${{ matrix.tests }} --timeout 9999999
      - name: Compare DRC counts for legacy snapshots without a DRC badge
        if: matrix.group == 6
        run: |
          cat > review-legacy-drc.private.ts <<'TS'
          import { AutoroutingPipelineSolver7_MultiGraph } from "./lib"
          import { evaluateRelaxedDrc } from "./lib/testing/evaluate-relaxed-drc"
          import type { SimpleRouteJson } from "./lib/types"
          for(const name of ["bugreport64-be7d8f","bugreport71-dd7d15","bugreport82-0e99ec"]) {
            const report=(await import("./fixtures/bug-reports/"+name+"/"+name+".json")).default
            const srj=structuredClone(report.simple_route_json) as SimpleRouteJson
            const solver=new AutoroutingPipelineSolver7_MultiGraph(srj)
            solver.solve()
            const traces=solver.getOutputSimplifiedPcbTraces()
            const errors=evaluateRelaxedDrc({inputSrj:srj,srjWithPointPairs:solver.srjWithPointPairs!,routedTraces:traces}).errors
            console.log("LEGACY_DRC_COMPARISON="+JSON.stringify({variant:process.argv[2],name,solved:solver.solved,traceCount:traces.length,drcCount:errors.length}))
          }
          TS
          bun review-legacy-drc.private.ts head
          mkdir -p /tmp/legacy-source
          for file in lib/solvers/HighDensitySolver/SingleHighDensityRouteSolver.ts lib/solvers/HighDensitySolver/IntraNodeSolver.ts lib/solvers/HighDensitySolver/CachedIntraNodeRouteSolver.ts lib/solvers/TraceWidthSolver/TraceWidthSolver.ts; do cp --parents "$file" /tmp/legacy-source; done
          cat > restore-legacy-source.private.ts <<'TS'
          import {writeFile} from "node:fs/promises"
          for(const path of ["lib/solvers/HighDensitySolver/SingleHighDensityRouteSolver.ts","lib/solvers/HighDensitySolver/IntraNodeSolver.ts","lib/solvers/HighDensitySolver/CachedIntraNodeRouteSolver.ts","lib/solvers/TraceWidthSolver/TraceWidthSolver.ts"]) {
            const response=await fetch("https://raw.githubusercontent.com/tscircuit/tscircuit-autorouter/8c542342138f0db34a39126687d8015a5eb9920b/"+path)
            if(!response.ok)throw Error(response.status+" "+path)
            await writeFile(path,await response.text())
          }
          TS
          bun restore-legacy-source.private.ts
          bun review-legacy-drc.private.ts base
          cp -r /tmp/legacy-source/lib/. lib/
      - name: Stage only generated SVG snapshots
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,shutil
          for name in subprocess.check_output(['git','diff','--name-only','--','tests/**/*.snap.svg'],text=True).splitlines():
            p=pathlib.Path(name)
            if not name.startswith('tests/') or not name.endswith('.snap.svg'): raise RuntimeError(name)
            out=pathlib.Path('verified-svgs')/p
            out.parent.mkdir(parents=True,exist_ok=True)
            shutil.copyfile(p,out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-shortcut-svgs-${{ matrix.group }}
          path: verified-svgs/
          if-no-files-found: error
  record:
    needs: snapshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-shortcut-svgs-*
          path: verified-svgs
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require("fs")
            const root="verified-svgs/"
            const branch="experiments/shortcut-validation-scope"
            for(const path of fs.readdirSync(root,{recursive:true}).filter(path=>path.endsWith(".snap.svg")).sort()) {
              if(!path.startsWith("tests/")) throw new Error(path)
              const content=fs.readFileSync(root+path).toString("base64")
              const {data}=await github.rest.repos.getContent({...context.repo,path,ref:branch})
              if(data.content.replace(/\s/g,"")===content) continue
              await github.rest.repos.createOrUpdateFileContents({...context.repo,branch,path,content,sha:data.sha,message:"Record verified shortcut routing snapshot "+path})
              console.log("RECORDED_SVG="+path)
            }
