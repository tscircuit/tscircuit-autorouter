name: Review boundary-port received snapshots
on:
  push:
    branches: [artifacts/a13-cpu-pad-contact-snapshots]
    paths: [.github/workflows/a13-cpu-contact-snapshots.yml]
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 44199286937
          github-token: ${{ github.token }}
          pattern: diff-png-and-snap-svg-artifacts-node*
          path: received
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const branch = "artifacts/a13-cpu-pad-contact-snapshots"
            for (const [source, path] of [
              ["tests/bugs/__snapshots__/bugreport62-0f6ca4.received.svg", "review/boundary-bug62.received.svg"],
              ["tests/repro/__snapshots__/pipeline9-h3-ddr-strobe-via-access.received.svg", "review/boundary-h3-strobe.received.svg"]
            ]) {
              const svg = fs.readFileSync("received/" + source, "utf8")
              let sha
              try {
                const { data } = await github.rest.repos.getContent({...context.repo,path,ref:branch})
                if(data.content.replace(/\s/g,"")===Buffer.from(svg).toString("base64")) continue
                sha=data.sha
              } catch(error) {
                if(error.status!==404) throw error
              }
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,branch,path,sha,
                content:Buffer.from(svg).toString("base64"),
                message:"Preserve exact boundary-port CI image " + path
              })
              console.log(path + " bytes=" + Buffer.byteLength(svg))
            }
