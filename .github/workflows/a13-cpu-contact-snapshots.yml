name: Native A13 physical pad snapshots
on:
  push:
    branches: [artifacts/a13-cpu-pad-contact-snapshots]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ref: 7c8c15d591d6321d90a8a227910cc73737599079, branch: repro/a13-cpu-pad-contact }
          - { ref: 129c78f09e7055565afda3ae2bfe522904013dbe, branch: fix/a13-direct-route-inset }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install declared routing and renderer dependencies
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('package.json')
          data=json.loads(p.read_text())
          data['overrides']={**data.get('overrides',{}),'csstype':'3.1.3'}
          data['trustedDependencies']=list(dict.fromkeys([*data.get('trustedDependencies',[]),'sharp']))
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          bun install
      - name: Generate the native CPU pad view and full-board clearance view
        env:
          BUN_UPDATE_SNAPSHOTS: 1
        run: bun test ./tests/repro/pipeline9-a13-regional-repair-shorts.test.ts --timeout 9999999
      - name: Commit generated SVGs
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        with:
          script: |
            const fs = require("fs")
            const branch = process.env.TARGET_BRANCH
            for (const name of [
              "pipeline9-a13-regional-repair-shorts.snap.svg",
              "pipeline9-a13-regional-repair-shorts-copper-contacts.snap.svg"
            ]) {
              const path = "tests/repro/__snapshots__/" + name
              const content = fs.readFileSync(path).toString("base64")
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path, ref: branch
              })
              if (data.content.replace(/\s/g, "") === content) continue
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, branch, path, content, sha: data.sha,
                message: "Record physical A13 pad snapshot " + name
              })
              console.log("Recorded native renderer view: " + name)
            }
