name: Verify rebased DDR corner repro
on:
  push:
    branches: [artifacts/a13-cpu-pad-contact-snapshots]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79a190562db320d73b9a21b6577033cf8c2ca509
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the declared routing dependencies
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('package.json')
          data=json.loads(p.read_text())
          data['overrides']={**data.get('overrides',{}),'csstype':'3.1.3'}
          data['trustedDependencies']=list(dict.fromkeys([*data.get('trustedDependencies',[]),'sharp']))
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          bun install
      - uses: actions/checkout@v4
        with:
          ref: b3f205ef18e07c61bcd8316c4876e34fee942298
          path: comparison-base
          persist-credentials: false
      - name: Type check the fix
        run: bunx tsc --noEmit
      - name: Compare the changed ESP32 snapshot with the base
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" comparison-base/node_modules
          cat > .snapshot-qualification.ts <<'TS'
          import { AutoroutingPipelineSolver7_MultiGraph } from "./lib/autorouter-pipelines/AutoroutingPipeline7_MultiGraph/AutoroutingPipelineSolver7_MultiGraph"
          import { evaluateRelaxedDrc } from "./lib/testing/evaluate-relaxed-drc"
          const caseName = Bun.argv[3]
          const bugReport = await Bun.file(`./fixtures/bug-reports/${caseName}/${caseName}.json`).json()
          const input = bugReport.simple_route_json
          const solver = new AutoroutingPipelineSolver7_MultiGraph(input)
          solver.solve()
          const traces = solver.getOutputSimplifiedPcbTraces()
          const { errors } = evaluateRelaxedDrc({
            inputSrj: input, srjWithPointPairs: solver.srjWithPointPairs!, routedTraces: traces
          })
          const report = { solved: solver.solved, failed: solver.failed, routes: traces.length, errors: errors.length, byType: Object.fromEntries([...new Set(errors.map(e => e.error_type))].map(type => [type, errors.filter(e => e.error_type === type).length])) }
          console.log("CASE_QUALIFICATION=" + JSON.stringify({caseName,...report}))
          await Bun.write(Bun.argv[2], JSON.stringify(report))
          
          TS
          cp .snapshot-qualification.ts comparison-base/
          for case_name in bugreport47-8ee80e-esp32-breakout bugreport62-0f6ca4; do
            bun .snapshot-qualification.ts /tmp/head.json "$case_name"
            (cd comparison-base && bun .snapshot-qualification.ts /tmp/base.json "$case_name")
            python3 - <<'PY'
          import json
          base=json.load(open('/tmp/base.json'))
          head=json.load(open('/tmp/head.json'))
          assert head['solved'] and not head['failed'], head
          assert head['routes'] >= base['routes'], (base,head)
          assert head['errors'] <= base['errors'], (base,head)
          PY
          done
          rm .snapshot-qualification.ts
          rm comparison-base/.snapshot-qualification.ts
      - name: Update the changed ESP32 SVG after its DRC comparison
        run: bun test ./tests/bugs/bugreport47-8ee80e-esp32-breakout.test.ts ./tests/bugs/bugreport62-0f6ca4.test.ts ./tests/repro/pipeline9-h3-ddr-strobe-via-access.test.ts --timeout 9999999
      - name: Generate both views from the unchanged real board
        run: bun test ./tests/repro/pipeline9-a13-regional-repair-shorts.test.ts --timeout 9999999
