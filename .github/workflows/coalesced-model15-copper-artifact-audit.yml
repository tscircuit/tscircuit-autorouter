name: Coalesced model-only original15 captured-copper audit

on:
  push:
    branches: [codex/coalesced-model15-copper-artifact-audit-20261028]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ee0dac23c8ff76fde81a0124bf444790a8394f25
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify immutable private captured artifacts without routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 controller/scripts/experiment-audit/fetch-qualified-copper-audit-artifacts.py --source candidate --output retained-artifacts --manifest controller/scripts/experiment-audit/coalesced-model15-copper-audit.json
      - name: Install the unchanged source dependency declarations in isolation
        run: python3 controller/scripts/experiment-audit/install-pinned-dependencies.py candidate
      - name: Bind original source CJSON and read retained copper only
        run: |
          python3 controller/scripts/experiment-audit/fetch-qualified-copper-audit-artifacts.py --source candidate --output retained-artifacts --manifest controller/scripts/experiment-audit/coalesced-model15-copper-audit.json --finalize-bindings
          mkdir -p candidate/scripts/experiment-audit
          cp controller/scripts/experiment-audit/audit-retention-fixed-artifact.ts candidate/scripts/experiment-audit/
          cp controller/scripts/experiment-audit/audit-retention-stage-geometry.ts candidate/scripts/experiment-audit/
          cp controller/scripts/experiment-audit/audit-original-source-via-pads.ts candidate/scripts/experiment-audit/
          cp controller/scripts/experiment-audit/audit-coalesced-captured-success.ts candidate/scripts/experiment-audit/
          cd candidate
          if ! bun scripts/experiment-audit/audit-coalesced-captured-success.ts ../retained-artifacts/binding-manifest.json ../private-local-audit-report.json > ../private-audit-run.log 2>&1; then
            echo "Offline captured-copper audit failed; detailed data remains only on the ephemeral runner."
            exit 1
          fi
      - name: Publish aggregate diagnostics only
        run: |
          python3 - <<'PY'
          import json
          reports = json.load(open('private-local-audit-report.json'))['reports']
          for report in reports:
              declared = report['independentDeclaredSrjViaPadAudit']
              declared.pop('findings', None)
              declared.pop('potentialUnknownContacts', None)
              original = report['independentOriginalSourceViaPadAudit']
              original.pop('confirmedForeignViolations', None)
              original.pop('unresolvedContacts', None)
          aggregate = {'scope': 'Offline captured output audit; no solver, timing run or public raw PCB geometry', 'reports': reports}
          json.dump(aggregate, open('coalesced-model15-copper-audit-aggregate.json', 'w'), indent=2)
          print('COALESCED_CAPTURED_PHYSICAL_AUDIT_JSON ' + json.dumps(aggregate, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coalesced-model15-copper-audit-aggregate
          path: coalesced-model15-copper-audit-aggregate.json
