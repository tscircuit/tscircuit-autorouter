name: Validate stacked via-query fix
on:
  push:
    branches: [analysis/via-query-validation]
    paths: [.github/workflows/via-query-validation.yml]
permissions:
  contents: read
jobs:
  type-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb0093eead4e5341ba400c2926eb0246f437f2fc
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      - run: git rev-parse HEAD
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun run format:check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb0093eead4e5341ba400c2926eb0246f437f2fc
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: git rev-parse HEAD
      - run: bun install
      - run: bun run build
      - run: bun scripts/check-solver-runtime-packaging.ts
