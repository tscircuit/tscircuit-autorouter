name: HD DRC stage diagnostics

on:
  pull_request:
    paths:
      - scripts/diagnosePipelineDrc.ts
      - scripts/diagnostics/createTinyStaticReachabilityCertificate.ts
      - .github/workflows/hd-drc-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: hd-drc-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dataset: dataset01, sample: 66, pipeline: 9, observeRuntime: true }
          - { dataset: srj18, sample: 2, pipeline: 9 }
          - { dataset: srj18, sample: 4, pipeline: 9 }
          - { dataset: srj18, sample: 8, pipeline: 9, observeRuntime: true }
          - { dataset: srj18, sample: 9, pipeline: 9 }
          - { dataset: srj18, sample: 10, pipeline: 9 }
          - { dataset: srj18, sample: 12, pipeline: 9 }
          - { dataset: srj18, sample: 13, pipeline: 9, staticCertificate: true }
          - { dataset: srj18, sample: 16, pipeline: 9 }
          - { dataset: srj19, sample: 7, pipeline: 9 }
          - { dataset: srj19, sample: 29, pipeline: 9 }
          - { dataset: srj19, sample: 50, pipeline: 9 }
          - { dataset: srj19, sample: 195, pipeline: 9 }
          - { dataset: srj19, sample: 21, pipeline: 9 }
          - { dataset: srj19, sample: 37, pipeline: 9 }
          - { dataset: srj19, sample: 40, pipeline: 9 }
          - { dataset: srj19, sample: 42, pipeline: 9 }
          - { dataset: srj19, sample: 45, pipeline: 9, observeRegional: true }
          - { dataset: srj19, sample: 49, pipeline: 9 }
          - { dataset: srj19, sample: 22, pipeline: 9 }
          - { dataset: srj19, sample: 32, pipeline: 9 }
          - { dataset: srj19, sample: 56, pipeline: 9 }
          - { dataset: srj19, sample: 98, pipeline: 9 }
          - { dataset: srj19, sample: 104, pipeline: 9 }
          - { dataset: srj19, sample: 83, pipeline: 9 }
          - { dataset: srj19, sample: 86, pipeline: 9 }
          - { dataset: srj19, sample: 91, pipeline: 9 }
          - { dataset: srj19, sample: 95, pipeline: 9 }
          - { dataset: srj19, sample: 97, pipeline: 9 }
          - { dataset: srj19, sample: 105, pipeline: 9 }
          - { dataset: srj19, sample: 118, pipeline: 9 }
          - { dataset: srj19, sample: 147, pipeline: 9 }
          - { dataset: srj19, sample: 164, pipeline: 9 }
          - { dataset: srj19, sample: 165, pipeline: 9 }
          - { dataset: srj19, sample: 189, pipeline: 9 }
          - { dataset: srj20, sample: 3, pipeline: 9 }
          - { dataset: srj20, sample: 4, pipeline: 9 }
          - { dataset: srj20, sample: 6, pipeline: 9 }
          - { dataset: srj20, sample: 11, pipeline: 9 }
          - { dataset: srj20, sample: 12, pipeline: 9 }
          - { dataset: srj20, sample: 43, pipeline: 9 }
          - { dataset: srj20, sample: 53, pipeline: 9 }
          - { dataset: srj20, sample: 80, pipeline: 9 }
          - { dataset: srj20, sample: 81, pipeline: 9 }
          - { dataset: srj20, sample: 111, pipeline: 9 }
          - { dataset: srj20, sample: 115, pipeline: 9 }
          - { dataset: srj20, sample: 116, pipeline: 9 }
          - { dataset: srj20, sample: 168, pipeline: 9 }
          - { dataset: srj20, sample: 169, pipeline: 9 }
          - { dataset: srj20, sample: 191, pipeline: 9 }
          - { dataset: srj20, sample: 55, pipeline: 9 }
          - { dataset: srj20, sample: 140, pipeline: 9 }
          - { dataset: srj21, sample: 1, pipeline: 9 }
          - { dataset: srj21, sample: 3, pipeline: 9, observeRegional: true }
          - { dataset: srj23, sample: 14, pipeline: 9 }
          - { dataset: srj23, sample: 17, pipeline: 9 }
          - { dataset: srj23, sample: 26, pipeline: 9 }
          - { dataset: srj23, sample: 42, pipeline: 9 }
          - { dataset: srj23, sample: 43, pipeline: 9 }
          - { dataset: srj23, sample: 45, pipeline: 9 }
          - { dataset: srj23, sample: 46, pipeline: 9 }
          - { dataset: srj23, sample: 49, pipeline: 9 }
          - { dataset: srj23, sample: 50, pipeline: 9 }
          - { dataset: srj23, sample: 72, pipeline: 9 }
          - { dataset: srj20, sample: 169, pipeline: 7 }
          - dataset: fixture
            sample: 77
            pipeline: 7
            fixturePath: fixtures/bug-reports/bugreport77-07f6a7/bugreport77-07f6a7.json
          - dataset: fixture
            sample: 94
            pipeline: 9
            fixturePath: fixtures/bug-reports/bugreport94-56fa2e/bugreport94-56fa2e.json
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: diagnostic-pr
          persist-credentials: false

      - name: Checkout paired main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: diagnostic-main
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8

      - name: Install main dependencies
        working-directory: diagnostic-main
        run: bun install

      - name: Install PR dependencies
        working-directory: diagnostic-pr
        run: bun install

      - name: Use identical diagnostic controller
        run: |
          cp diagnostic-pr/scripts/diagnosePipelineDrc.ts diagnostic-main/scripts/diagnosePipelineDrc.ts
          mkdir -p diagnostic-main/scripts/diagnostics
          cp diagnostic-pr/scripts/diagnostics/createTinyStaticReachabilityCertificate.ts diagnostic-main/scripts/diagnostics/createTinyStaticReachabilityCertificate.ts

      # These stage evaluations are diagnostics, not timed benchmarks. Normal
      # benchmark commands and their equal main/PR budgets remain unchanged.
      - name: Diagnose paired main
        working-directory: diagnostic-main
        env:
          HD_DRC_RUNTIME_OBSERVATION: ${{ matrix.observeRuntime && '1' || '' }}
          HD_DRC_REGIONAL_OBSERVATION: ${{ matrix.observeRegional && '1' || '' }}
          HD_DRC_STATIC_REACHABILITY_CERTIFICATE: ${{ matrix.staticCertificate && '1' || '' }}
        run: bun scripts/diagnosePipelineDrc.ts ${{ matrix.dataset }} ${{ matrix.sample }} ${{ matrix.pipeline }} ../diagnostic-results/main ${{ matrix.fixturePath }}

      - name: Diagnose PR head
        if: success() || failure()
        working-directory: diagnostic-pr
        env:
          HD_DRC_RUNTIME_OBSERVATION: ${{ matrix.observeRuntime && '1' || '' }}
          HD_DRC_REGIONAL_OBSERVATION: ${{ matrix.observeRegional && '1' || '' }}
          HD_DRC_STATIC_REACHABILITY_CERTIFICATE: ${{ matrix.staticCertificate && '1' || '' }}
        run: bun scripts/diagnosePipelineDrc.ts ${{ matrix.dataset }} ${{ matrix.sample }} ${{ matrix.pipeline }} ../diagnostic-results/pr ${{ matrix.fixturePath }}

      - name: Record exact revisions
        if: always()
        env:
          MAIN_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p diagnostic-results
          printenv MAIN_SHA PR_SHA > diagnostic-results/revisions.txt

      - name: Upload stage errors and route ownership
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd-drc-${{ matrix.dataset }}-${{ matrix.sample }}-pipeline${{ matrix.pipeline }}
          path: diagnostic-results
          if-no-files-found: error
