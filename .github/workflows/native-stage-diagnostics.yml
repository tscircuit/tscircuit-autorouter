name: Verify native force with completed neighboring routes
on:
  push:
    branches: [analysis/native-copper-stage-diagnostics]
    paths: [.github/workflows/native-stage-diagnostics.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f98be6237dfa0a852360b07d38f0e2fbee5f92d
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Supply neighboring native paths to each existing force sample
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("node_modules/high-density-repair01/lib/HighDensityForceImproveSolver.ts")
          s=p.read_text()
          anchor="    return this.fixedHdRoutes.filter((route) => {"
          assert s.count(anchor)==1
          replacement="""    const entry = this.sampleEntries.find((entry) => entry.node === node)
              if (!entry) throw new Error("Missing force sample for native context")
              const ownedRouteIndexes = new Set(entry.routeIndexes)
              const context = [
                ...this.fixedHdRoutes,
                ...this.originalHdRoutes.filter((_, index) => !ownedRouteIndexes.has(index)),
              ]
              return context.filter((route) => {"""
          p.write_text(s.replace(anchor,replacement,1))
          PY
      - name: Keep original full-board assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Report actual OrangeCrab findings
        if: always()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg")
          if p.exists():
            m=re.search(r"Relaxed DRC errors: (\d+)",p.read_text())
            if m: print("ORANGECRAB_DRC_COUNT",int(m.group(1)))
          PY
