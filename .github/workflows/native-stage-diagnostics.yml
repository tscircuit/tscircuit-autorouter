name: Verify clean native ownership across all autorouter tests
on:
  push:
    branches: [analysis/native-copper-stage-diagnostics]
    paths: [.github/workflows/native-stage-diagnostics.yml]
permissions:
  contents: write
jobs:
  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e675881d910e8c0b1967b78535de3e516ef6c0ff
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun run build
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [1,2,3,4,5,6,7,8,9]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e675881d910e8c0b1967b78535de3e516ef6c0ff
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Use the original balanced test plans
        env:
          NODE_COUNT: '9'
        run: bun scripts/generate-balanced-test-plan.ts
      - name: Preserve every original functional assertion
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: |
          test_plan=".bun-test-plan/testplans/testplan${{ matrix.node }}.txt"
          if [ ! -f "$test_plan" ]; then
            echo "Test plan not found: $test_plan"
            exit 1
          fi

          mapfile -t test_files < "$test_plan"
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test files found in: $test_plan"
            exit 1
          fi

          echo "Running ${#test_files[@]} test files from $test_plan"
          # Full-board sample 2 and STMP157 mesh validation can exceed five minutes.
          # Keep their assertions and allow the same runner-variance budget.
          regular_tests=()
          slow_tests=()
          full_board_tests=()
          for test_file in "${test_files[@]}"; do
            if [ "$test_file" = "tests/repro/pipeline9-orangecrab-via-roundoff.test.ts" ]; then
              bun install --ignore-scripts --cwd tests/repro/orangecrab-via-roundoff
            fi
            case "$test_file" in
              tests/bugs/bugreport107-board-1726.test.ts|tests/bugs/bugreport110/motherboard-power-full-route.test.ts|tests/bugs/beagleplay-am6254-ddr4.test.ts)
                full_board_tests+=("$test_file")
                ;;
              tests/features/pipeline9-srj18-sample2-bounded-regional-drc.test.ts|tests/features/pipeline9-a13-srj18-sample2-drc.test.ts|tests/features/pipeline9-srj18-sample2-via-simplification.test.ts|tests/repro/pipeline9-stmp157-mesh-memory.test.ts|tests/repro/pipeline10-artix7-ddr-bus-length-matching.test.ts|tests/repro/pipeline9-imx6-fixed-via-force-full-board.test.ts|tests/repro/pipeline9-h616-solitary-crossing.test.ts)
                slow_tests+=("$test_file")
                ;;
              *) regular_tests+=("$test_file") ;;
            esac
          done
          if [ "${#regular_tests[@]}" -gt 0 ]; then
            bun test "${regular_tests[@]}" --timeout 300000
          fi
          if [ "${#slow_tests[@]}" -gt 0 ]; then
            bun test "${slow_tests[@]}" --timeout 600000
          fi
          if [ "${#full_board_tests[@]}" -gt 0 ]; then
            bun test "${full_board_tests[@]}" --timeout 1800000
          fi

      - name: Save verified public test SVGs
        if: success()
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record verified native-ownership test SVGs"
          git push origin HEAD:refs/heads/analysis/verified-native-clean-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}
