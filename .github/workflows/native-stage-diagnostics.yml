name: Inspect native routing aggregate stage counts
on:
  push:
    branches: [analysis/native-copper-stage-diagnostics]
    paths: [.github/workflows/native-stage-diagnostics.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        board: [midi]
        source: [0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Compare aggregate counts without exporting geometry or net identifiers
        env:
          BOARD: ${{ matrix.board }}
        run: |
          cat > native-stage-diagnostics.ts <<'TS'
          import { readFileSync } from "node:fs"
          import { AutoroutingPipelineSolver9_PreloadedTraceGraph } from "./lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph"
          import { convertToCircuitJson } from "./lib/utils/convertToCircuitJson"
          import { getDrcErrors } from "./lib/testing/getDrcErrors"
          import { RELAXED_DRC_OPTIONS } from "./lib/testing/drcPresets"
          import { evaluateRelaxedDrc } from "./lib/testing/evaluate-relaxed-drc"
          import { getViaToPadClearance } from "./lib/utils/getViaToPadClearance"
          const board=process.env.BOARD
          const path=board==="gba"?"fixtures/bug-reports/bugreport96-full-gameboy-no-breakout/bugreport96-full-gameboy-no-breakout.srj.json":"tests/fixtures/bug-reports/usb-dp-phase-detour/input.json"
          const srj=JSON.parse(readFileSync(path,"utf8"))
          if(board==="midi")srj.allowViaInPad=true
          const solver=new AutoroutingPipelineSolver9_PreloadedTraceGraph(srj,{cacheProvider:null,effort:1})
          const observed=new Set<string>()
          const wanted=new Set(["highDensityRouteSolver","highDensityForceImproveSolver","highDensityRepairSolver","highDensityStitchSolver","traceSimplificationSolver","globalDrcForceImproveSolver","pipeline9JointDrcRepairSolver","effortCleanupSolver"])
          while(!solver.solved&&!solver.failed){
           solver.step()
           for(const name of wanted){
            const stage=solver[name]
            if(!stage?.solved||observed.has(name))continue
            observed.add(name)
            let result
            if(!solver.highDensityStitchSolver?.solved){
             const routes=name==="highDensityRouteSolver"?stage.routes:stage.getOutput()
             const c=convertToCircuitJson(solver.srjWithPointPairs,[...routes,...solver.highDensityRouteSolver.getUpdatedFixedHdRoutes()],{originalSrj:srj,includeOriginalConnections:true,connectivityMaps:{source:solver.connMap,route:solver.connMap},minViaDiameter:srj.minViaDiameter,minTraceWidth:srj.minTraceWidth})
             result=getDrcErrors(c,{...RELAXED_DRC_OPTIONS,includeTraceContinuity:false,viaToPadClearance:getViaToPadClearance(srj)})
            }else{
             result=evaluateRelaxedDrc({inputSrj:{...srj,traces:solver.getUpdatedPreloadedTraces()},srjWithPointPairs:solver.srjWithPointPairs,routedTraces:solver.getNewTracesBeforePowerExpansion(),includeBoardClearance:board==="midi"})
            }
            const counts:Record<string,number>={}
            for(const error of result.errors)counts[error.type]=(counts[error.type]??0)+1
            console.log("AGGREGATE_STAGE",JSON.stringify({board,stage:name,total:result.errors.length,counts}))
           }
          }
          console.log("AGGREGATE_FINISH",JSON.stringify({board,solved:solver.solved,failed:solver.failed,iterations:solver.iterations}))
          import { getSameRootViaSite, collectViaNodes, cloneRoutes, materializeRoutes, applyDrcErrorForces, isViaPadDrcError } from "high-density-repair03/lib/solvers/GlobalDrcForceImproveSolver/solverHelpers"
          import { getPipeline9RouteIndexByTraceId } from "./lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/pipeline9JointDrcRepairUtils"
          if(solver.solved){
           const joint=solver.pipeline9JointDrcRepairSolver
           const routes=joint.combinedOutput
           const evalDrc=joint.cachedReferenceDrcEvaluator
           const snapshot=evalDrc({routes,hdRoutes:routes,traces:[]})
           const errors=snapshot.errorsWithCenters.filter(isViaPadDrcError)
           const map=getPipeline9RouteIndexByTraceId({routes,newConnections:joint.params.newConnections,syntheticConnectionNames:joint.syntheticConnectionNames})
           const repairSrj=joint.exactRepairParams.srj
           const vias=collectViaNodes(routes,repairSrj)
           for(const err of errors){
            const ownerIndex=map.get(err.pcb_trace_id)
            const candidates=vias.filter(via=>ownerIndex===undefined||via.routeIndex===ownerIndex)
            const center=err.center??err.pcb_center
            const nearest=center?candidates.toSorted((a,b)=>Math.hypot(a.x-center.x,a.y-center.y)-Math.hypot(b.x-center.x,b.y-center.y))[0]:undefined
            console.log("AGGREGATE_VIA_OWNER",JSON.stringify({remainingErrors:snapshot.errors.length,knownOwner:ownerIndex!==undefined,hasCenter:!!center,ownerViaCount:candidates.length,nearestMovable:nearest?.movable,nearestCanonicalizable:nearest?.canCanonicalize,sameRootViaCount:nearest?vias.filter(v=>v.rootConnectionName===nearest.rootConnectionName&&Math.hypot(v.x-nearest.x,v.y-nearest.y)<1e-6).length:0}))
           }
           for(const scale of [0.03,0.1,0.25,1]){
            const candidate=cloneRoutes(routes)
            const changed=applyDrcErrorForces(repairSrj,candidate,errors,map,scale,joint.params.connMap)
            const result=evalDrc({routes:materializeRoutes(candidate),hdRoutes:materializeRoutes(candidate),traces:[]})
            console.log("AGGREGATE_DIRECT_REPAIR",JSON.stringify({scale,changed,count:result.errors.length,viaPadCount:result.errors.filter(isViaPadDrcError).length}))
           }
          }
          if(solver.solved){
           const joint=solver.pipeline9JointDrcRepairSolver
           const routes=joint.combinedOutput
           const srj=joint.exactRepairParams.srj
           const evaluate=joint.cachedReferenceDrcEvaluator
           const snapshot=evaluate({traces:[],routes,hdRoutes:routes})
           const errors=(Array.isArray(snapshot)?snapshot:snapshot.errors).filter(isViaPadDrcError)
           const index=getPipeline9RouteIndexByTraceId({routes,newConnections:joint.params.newConnections,syntheticConnectionNames:joint.syntheticConnectionNames})
           const vias=collectViaNodes(routes,srj)
           for(const error of errors){
            const identifiers=[error.pcb_trace_id,...(error.pcb_trace_ids??[])].filter(id=>typeof id==="string")
            const owner=identifiers.map(id=>index.get(id)).find(i=>i!==undefined)
            const ownedVias=vias.filter(v=>v.routeIndex===owner)
            const center=error.center
            const nearest=center?ownedVias.toSorted((a,b)=>Math.hypot(a.x-center.x,a.y-center.y)-Math.hypot(b.x-center.x,b.y-center.y))[0]:undefined
            const route=owner!==undefined?routes[owner]:undefined
            if(nearest){
             const site=getSameRootViaSite({routes,via:nearest,srj})
             const padIds=(error.pcb_pad_ids??[]).filter(id=>!(error.pcb_via_ids??[]).includes(id))
             const byConnection=srj.obstacles.filter(o=>padIds.some(id=>o.connectedTo.includes(id)))
             const byObstacleId=srj.obstacles.filter(o=>padIds.includes(o.obstacleId))
             const byMetadata=srj.obstacles.filter(o=>padIds.includes(o.circuitJsonMetadata?.pcb_smtpad_id)||padIds.includes(o.circuitJsonMetadata?.pcb_plated_hole_id))
             const indexed=joint.drcEvaluator({traces:[],routes,hdRoutes:routes})
             const indexedErrors=Array.isArray(indexed)?indexed:indexed.errors
             console.log("AGGREGATE_PAD_RESOLUTION",JSON.stringify({padCount:padIds.length,connectionMatches:byConnection.length,obstacleIdMatches:byObstacleId.length,metadataMatches:byMetadata.length,indexedCount:indexedErrors.length,indexedViaPadCount:indexedErrors.filter(isViaPadDrcError).length,hasSpecificViaRule:srj.minViaEdgeToPadEdgeClearance!==undefined,hasGeneralPadRule:srj.minPadEdgeToPadEdgeClearance!==undefined,hasMessage:typeof error.message==="string",centerCoincidesWithVia:Math.hypot(nearest.x-center.x,nearest.y-center.y)<1e-8}))
             console.log("AGGREGATE_SHARED_SITE",JSON.stringify({count:site.length,movableCount:site.filter(v=>v.movable).length,canonicalCount:site.filter(v=>v.canCanonicalize).length,taggedTerminalCount:site.filter(v=>v.pointIndexes.some(i=>routes[v.routeIndex].route[i].pcb_port_id!==undefined)).length,distinctRadii:new Set(site.map(v=>v.radius)).size,syntheticOwnerCount:site.filter(v=>joint.syntheticConnectionNames.has(routes[v.routeIndex].connectionName)).length}))
            }
            console.log("AGGREGATE_VIA_ELIGIBILITY",JSON.stringify({owned:owner!==undefined,ownedViaCount:ownedVias.length,hasCenter:!!center,nearestFound:!!nearest,movable:nearest?.movable,canCanonicalize:nearest?.canCanonicalize,hasTerminalApproach:nearest?.pointIndexes.some(i=>route.route[i].terminalApproach!==undefined),hasPadPort:nearest?.pointIndexes.some(i=>route.route[i].pcb_port_id!==undefined),touchesRouteEndpoint:nearest?.pointIndexes.some(i=>i===0||i===route.route.length-1)}))
           }
           for(const scale of [0.03,0.1,0.25,1]){
            const candidate=cloneRoutes(routes)
            const changed=applyDrcErrorForces(srj,candidate,errors,index,scale,joint.params.connMap,true,false,true,true)
            const materialized=materializeRoutes(candidate)
            const checked=evaluate({traces:[],routes:materialized,hdRoutes:materialized})
            const e=Array.isArray(checked)?checked:checked.errors
            console.log("AGGREGATE_DIRECT_REPAIR",JSON.stringify({scale,changed,count:e.length,viaPadCount:e.filter(isViaPadDrcError).length}))
           }
          }
          if(!solver.solved)process.exitCode=1
          TS
          bun native-stage-diagnostics.ts
