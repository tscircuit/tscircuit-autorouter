name: Verify saved-copper geometry follows the existing search frame
on:
  push:
    branches: [analysis/native-copper-stage-diagnostics]
    paths: [.github/workflows/native-stage-diagnostics.yml]
permissions:
  contents: write
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: parent
            source: a3011ea856de9661404a115ed2050d9e0a1bff77
          - variant: projection
            source: 93f449589c8748916c2105a5efab437c0908269a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Keep saved copper in the same frame as the existing pad obstacles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/solvers/HyperHighDensitySolver/GrowShrinkHighDensityIntraNodeSolver/GrowShrinkHighDensityIntraNodeSolver.ts")
          s=p.read_text()
          start=s.index("    let metalScale = 1")
          end=s.index("    if (this.preservePhysicalGeometry) {\n      nodeWithPortPoints.width",start)
          block=s[start:end]
          s=s[:start]+"    if (this.preservePhysicalGeometry) {\n"+"".join("  "+line+"\n" for line in block.splitlines())+"    }\n"+s[end:]
          p.write_text(s)
          PY
      - run: bun install
      - name: Use exact native projection for the cleanup candidate
        if: matrix.variant == 'projection'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("node_modules/high-density-repair01/lib/HighDensityForceImproveSolver.ts")
          s=p.read_text()
          old="[...routes, ...(options?.fixedHdRoutes ?? [])],"
          assert s.count(old)==1
          p.write_text(s.replace(old,"routes,",1))
          PY
      - name: Preserve every original physical assertion
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Save only verified public SVGs
        if: success()
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record verified saved-copper frame snapshots"
          git push origin HEAD:refs/heads/analysis/verified-native-frame-${{ matrix.variant }}
