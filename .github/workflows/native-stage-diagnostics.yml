name: Restore completed neighboring traces to native regional repair
on:
  push:
    branches: [analysis/native-copper-stage-diagnostics]
    paths: [.github/workflows/native-stage-diagnostics.yml]
permissions:
  contents: write
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: parent
            source: a3011ea856de9661404a115ed2050d9e0a1bff77
          - variant: cleanup
            source: 93f449589c8748916c2105a5efab437c0908269a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Preserve the neighboring copper that the old path already supplied
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensitySolver.ts")
          s=p.read_text()
          start=s.index("    let regionalCopperRoutes: HighDensityRoute[] =")
          end=s.index("    this.activeFallbackSolver = new Pipeline9RegionalFallbackSolver",start)
          s=s[:start]+"""    const regionalBounds = getNodeBounds(regionalNode, this.obstacleMargin)
              const routedCopperRoutes = this.routes.filter((route) =>
                routeOverlapsNode(
                  route,
                  regionalNode,
                  regionalBounds,
                  Math.max(this.traceWidth, this.viaDiameter) / 2,
                  this,
                ),
              )
              const regionalCopperRoutes = [
                ...this.activeFallbackFixedObstacleRoutes,
                ...routedCopperRoutes,
              ]
          """+s[end:]
          p.write_text(s)
          PY
      - run: bun install
      - name: Preserve all original board quality and preload assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Save only verified public SVGs
        if: success()
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record verified native neighbor-context snapshots"
          git push origin HEAD:refs/heads/analysis/verified-native-neighbors-${{ matrix.variant }}
