name: Check fixed-node clamping against existing routing controls
on:
  push:
    branches: [analysis/butterstick-clamp-checks]
    paths: [.github/workflows/butterstick-clamp-checks.yml]
permissions:
  contents: write
jobs:
  imx6:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the unchanged integration dependencies
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("package.json");m=json.loads(p.read_text())
          m["overrides"]={**m.get("overrides",{}),"csstype":"3.1.3"}
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install
      - name: Check the real i.MX6 board with fixed-node clamping
        run: |
          bun -e 'console.log(Bun.resolveSync("high-density-repair01/lib/HighDensityForceImproveSolver",process.cwd()))' > force-path.private.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path(Path("force-path.private.txt").read_text().strip())
          s=p.read_text();marker="const clampNodeToBounds = (node: MutableNode, bounds: Bounds) => {"
          assert marker in s
          tmp=p.with_name(p.name+".private")
          tmp.write_text(s.replace(marker,marker+"\n  if (node.fixed) return"))
          tmp.replace(p)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tests/repro/pipeline9-imx6-fixed-via-force-full-board.test.ts")
          s=p.read_text().replace('import { readFileSync }','import { readFileSync,writeFileSync,mkdirSync }').replace('import { gunzipSync }','import { gunzipSync,gzipSync }')
          old="  expect(evaluate(traces).errors).toHaveLength(0)"
          assert old in s
          s=s.replace(old,"  const sourceErrors = evaluate(traces).errors")
          target="  expect(findings).toHaveLength(0)"
          extra='''  console.log("IMX6_CLAMP_FINDINGS="+JSON.stringify({source:sourceErrors.map(e=>({type:e.type,drc_source:e.drc_source,keys:Object.keys(e),numbers:Object.fromEntries(Object.entries(e).filter(([,v])=>typeof v==="number"))})),nativeTypes:findings.map(e=>e.error_type??e.type)}))
            mkdirSync("analysis-artifacts",{recursive:true})
            writeFileSync("analysis-artifacts/imx6-fixed-clamp.json.gz",gzipSync(JSON.stringify({fixture,traces,nativeCircuitJson:circuitJson,sourceErrors,nativeFindings:findings})))
            expect(sourceErrors).toHaveLength(0)
          '''+target
          assert target in s
          p.write_text(s.replace(target,extra))
          PY
          test_status=0
          bun test tests/repro/pipeline9-imx6-fixed-via-force-full-board.test.ts --timeout 600000 || test_status=$?
          git config user.name "tscircuit bot"
          git config user.email "githubbot@tscircuit.com"
          git add analysis-artifacts
          git commit -m "Retain actual i.MX6 clamp findings without changing assertions"
          git push origin HEAD:analysis/imx6-fixed-clamp-output
          exit "$test_status"
