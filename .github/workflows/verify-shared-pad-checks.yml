name: Verify shared pad checks
on:
  push:
    branches: [experiments/ddr-3939-pad-preparation]
    paths: [.github/workflows/verify-shared-pad-checks.yml]
permissions:
  contents: read
jobs:
  checks:
    name: Types, A13 snapshots and existing collision regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2656bd06c344f21627f95cb568d81642027d2a1c
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install declared dependencies
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("package.json")
          m=json.loads(p.read_text())
          m["overrides"]={**m.get("overrides",{}),"csstype":"3.1.3"}
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Focused collision and shared geometry checks
        run: bun test --timeout 9999999 tests/solvers/single-route-diagonal-fixed-obstacle.test.ts tests/solvers/single-route-horizontal-fixed-obstacle.test.ts tests/solvers/single-route-layer-change-fixed-obstacle.test.ts tests/solvers/single-route-rejects-blocked-inset.test.ts tests/solvers/portfolio-shared-node-topology.test.ts
      - name: Existing A13 board snapshots and routing assertions
        run: bun test --timeout 9999999 tests/repro/pipeline9-a13-regional-repair-shorts.test.ts tests/repro/pipeline9-a13-declared-trace-clearance.test.ts tests/repro/pipeline9-a13-fixed-copper-checks.test.ts
      - name: Existing Game Boy and H616 regressions
        run: bun test --timeout 9999999 tests/features/pipeline9-gameboy-contact-refinement.test.ts tests/repro/pipeline9-h616-solitary-crossing.test.ts
