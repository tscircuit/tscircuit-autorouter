name: Verify native constraints in every A03 search frame
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [1a2e757a0230bae0e8f915023485978587d7fe14, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Apply the existing native-path validator in each transformed frame
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/solvers/HyperHighDensitySolver/PortfolioSingleIntraNodeSolver.ts")
          s=p.read_text()
          old="if (preservePhysicalGeometry && fixedHdRoutes?.length)"
          assert s.count(old)==1
          p.write_text(s.replace(old,"if (fixedHdRoutes?.length)",1))
          PY
      - run: bun install
      - name: Preserve all original board assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Report the current OrangeCrab DRC total
        if: always()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg")
          if p.exists():
            m=re.search(r"Relaxed DRC errors: (\d+)",p.read_text())
            if m: print("ORANGECRAB_DRC_COUNT",int(m.group(1)))
          PY
