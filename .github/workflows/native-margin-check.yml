name: Inspect accepted via ownership and size consistency
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 767872b7bea7e62b918d6b282d9be12e24af0e54
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Compare native validation and emitted copper without exporting geometry or identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts")
          s=p.read_text()
          marker="  expect(\n    checkViaPadClearance("
          assert s.count(marker)==1
          extra="""  const checked = checkViaPadClearance(circuit, {minClearance:fixture.input.viaToPadClearance})
            const vias = circuit.filter(element => element.type === "pcb_via")
            const trace = circuit.find(element => element.type === "pcb_trace")
            console.log("H616_NATIVE_CONSISTENCY", JSON.stringify({
              nativeGuardAccepts:(lastRegional as any).validateCandidateRoutes(routes),
              witnessGapLegal:witness.circularGap + 1e-9 >= fixture.input.viaToPadClearance!,
              viaSizesMatch:vias.every(via => via.outer_diameter === witness.via.diameter),
              viaOwnersPresent:vias.every(via => circuit.some(element => element.type === "pcb_trace" && element.pcb_trace_id === via.pcb_trace_id)),
              traceSourceDeclared:trace?.type === "pcb_trace" && circuit.some(element => element.type === "source_trace" && element.source_trace_id === trace.source_trace_id),
              routeNameResolved:Boolean(fixture.input.connMap.getNetConnectedToId(witness.route.connectionName)),
              rootNameDeclared:fixture.srjWithPointPairs.connections.some(connection => connection.name === witness.route.rootConnectionName),
              errorCount:checked.length,
            }))
          """
          p.write_text(s.replace(marker,extra+marker))
          PY
      - run: bun install
      - name: Keep original H616 physical-clearance assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts
