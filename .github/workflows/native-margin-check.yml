name: Verify cleanup preserves pad clearance
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [1d5168a1411831d5411d93bb01e43da28522bbb9, 767872b7bea7e62b918d6b282d9be12e24af0e54]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Include physical pads in the existing no-worsening cleanup guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          prefix="lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/"
          p=Path(prefix+"Pipeline9HighDensityForceImproveSolver.ts")
          s=p.read_text()
          a=s.index("    const representedPadObstacleIndexes")
          b=s.index("    this.evaluateFixedObstacles",a)
          s=s[:a]+"""    this.fixedViaObstacleIndexes = new Set(
                params.inputSrj.obstacles.flatMap((obstacle, index) => {
                  if (obstacle.isCopperPour || obstacle.isNonPlatedHole) return []
                  return [index]
                }),
              )
          """+s[b:]
          p.write_text(s)
          p=Path(prefix+"Pipeline9RegionalFallbackSolver.ts")
          s=p.read_text()
          old="""    if (!movablePreloadedConnectionNames.has(route.connectionName)) {
                return false
              }
          """
          assert s.count(old)==1
          p.write_text(s.replace(old,"",1))
          PY
      - run: bun install
      - name: Keep original completion, clearance and via-count assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts
