name: Verify native HD export ownership on original circuits
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [1d5168a1411831d5411d93bb01e43da28522bbb9, 896e20783c83a4afb9554e5ab8a81fec203e8ca7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Use native HD pad ownership in the unchanged converter
        run: git checkout 896e20783c83a4afb9554e5ab8a81fec203e8ca7 -- lib/utils/convertToCircuitJson.ts
      - run: bun install
      - name: Keep original routing, physical-clearance and via-count assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/utils/convertToCircuitJson*.test.ts
      - name: Check types
        if: always()
        run: bunx tsc --noEmit
