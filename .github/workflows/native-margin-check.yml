name: Locate native trace clearance regressions by stage
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [2b1207ad70971f326166b134ea19418137273f23, a3011ea856de9661404a115ed2050d9e0a1bff77, 93f449589c8748916c2105a5efab437c0908269a]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Report aggregate stage DRC counts without geometry or net records
        run: |
          cat > native-stage-counts.ts <<'TS'
          import { AutoroutingPipelineSolver9_PreloadedTraceGraph } from "./lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph"
          import { createPipeline9RelaxedDrcEvaluator } from "./lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/createPipeline9RelaxedDrcEvaluator"
          import { evaluateRelaxedDrc } from "./lib/testing/evaluate-relaxed-drc"
          import srj from "./fixtures/bug-reports/bugreport96-full-gameboy-no-breakout/bugreport96-full-gameboy-no-breakout.srj.json"
          const solver = new AutoroutingPipelineSolver9_PreloadedTraceGraph(structuredClone(srj), {cacheProvider:null, effort:1})
          solver.solve()
          console.log("SOLVE", JSON.stringify({solved:solver.solved,failed:solver.failed}))
          if (!solver.solved) process.exit(1)
          const materializedSrj = solver.globalDrcForceImproveSolver!.getConstructorParams()[0].srj
          const evaluate = createPipeline9RelaxedDrcEvaluator({
            originalSrj: {...solver.originalSrj, traces:materializedSrj.traces},
            srjWithPointPairs: {...solver.srjWithPointPairs!, traces:materializedSrj.traces},
            mutatedPreloadedTraces: [],
            connections: solver.netToPointPairsSolver!.newConnections,
            originalConnections: solver.originalSrj.connections,
            layerCount: solver.srj.layerCount,
            obstacles: solver.srj.obstacles,
            defaultViaHoleDiameter: solver.viaHoleDiameter,
            connMap:solver.connMap,
          })
          const stages = [
            ["stitched",solver.highDensityStitchSolver!.mergedHdRoutes],
            ["simplified",solver.traceSimplificationSolver!.simplifiedHdRoutes],
            ["width",solver.traceWidthSolver!.getHdRoutesWithWidths()],
            ["global-input",solver.globalDrcForceImproveSolver!.guardedInputHdRoutes],
            ["global",solver.globalDrcForceImproveSolver!.getOutput()],
            ["joint",solver.pipeline9JointDrcRepairSolver!.getOutput()],
            ["final",solver._getOutputHdRoutes()],
          ] as const
          for (const [stage,routes] of stages) {
            const {errors} = evaluate({routes})
            const counts:Record<string,number> = {}
            for (const error of errors) {
              const kind=error.error_type ?? error.type ?? "unknown"
              counts[kind]=(counts[kind]??0)+1
            }
            console.log("STAGE_COUNTS", JSON.stringify({stage,routes:routes.length,errors:errors.length,counts}))
          }
          const final=evaluateRelaxedDrc({inputSrj:srj,srjWithPointPairs:solver.srjWithPointPairs!,routedTraces:solver.getOutputSimplifiedPcbTraces()})
          const counts:Record<string,number>={}
          for(const error of final.errors) counts[error.error_type]=(counts[error.error_type]??0)+1
          console.log("FINAL_COUNTS",JSON.stringify({errors:final.errors.length,counts,protectedPreloadRetained:!solver.highDensityRouteSolver!.fixedRouteReplacements.has("source_trace_0_fixed_70_0")}))
          TS
          bun native-stage-counts.ts
