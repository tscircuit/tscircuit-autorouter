name: Diagnose native cleanup without publishing detailed DRC records
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: write
jobs:
  orange:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [coupled]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 93f449589c8748916c2105a5efab437c0908269a
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Reuse native clearance guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensityForceImproveSolver.ts")
          s=p.read_text()
          s='import { FixedCopperClearanceGuard } from "high-density-repair02/lib/high-density-repair-solver/functions/FixedCopperClearanceGuard"\n'+s
          s=s.replace('    if (this.fixedViaObstacleIndexes.size === 0) return','    if (this.fixedViaObstacleIndexes.size === 0 && this.fixedHdRoutes.length === 0) return',1)
          old='    if (!worsensViaClearance) return'
          assert s.count(old)==1
          new="""    let allowsNativeCopper = true
              if (this.fixedHdRoutes.length > 0) {
                const ownedIndexes = new Set(routeIndexes)
                const readOnlyRoutes = [
                  ...this.fixedHdRoutes,
                  ...this.getOutput().filter((_, index) => !ownedIndexes.has(index)),
                ]
                const guard = new FixedCopperClearanceGuard(
                  readOnlyRoutes,
                  this.inputSrj.minTraceToPadEdgeClearance ??
                    this.inputSrj.defaultObstacleMargin ??
                    RELAXED_DRC_OPTIONS.traceClearance,
                  [],
                  this.inputSrj.minPadEdgeToPadEdgeClearance,
                )
                allowsNativeCopper = guard.allows(
                  originalRoutes,
                  candidateRoutes,
                  candidateRoutes.keys(),
                )
              }
              if (!worsensViaClearance && allowsNativeCopper) return"""
          s=s.replace(old,new,1)
          if '${{ matrix.variant }}' == 'pad':
              s=s.replace('violation.kind === "via" &&\n            this.fixedViaObstacleIndexes.has(violation.obstacleIndex)','true')
              s=s.replace('violation.kind === "via" &&\n          this.fixedViaObstacleIndexes.has(violation.obstacleIndex) &&','')
          p.write_text(s)
          p=Path("tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts")
          s=p.read_text()
          old='  expect(evaluateRelaxedDrc(drcInput).errors).toHaveLength(0)'
          assert s.count(old)==1
          s=s.replace(old,"",1)
          end=s.rfind("\n})")
          s=s[:end]+"""
            const errors=evaluateRelaxedDrc(drcInput).errors
            const counts: Record<string, number> = {}
            for (const error of errors) {
              counts[error.error_type]=(counts[error.error_type]??0)+1
            }
            console.log("ORANGE_COUNTS",JSON.stringify({errors:errors.length,counts}))
            expect(errors).toHaveLength(0)
          """+s[end:]
          p.write_text(s)
          PY
      - run: bun install
      - name: Test upstream PR 166 shared-via-site movement against the exact current pin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matches=[p for p in Path("node_modules/high-density-repair03/lib").rglob("*.ts") if "const moveViaAwayFromPoint = (" in p.read_text()]
          assert len(matches)==1
          p=matches[0]
          s=p.read_text()
          start=s.index("const moveViaAwayFromPoint = (")
          end=s.index("\n}",start)
          chunk=s[start:end]
          assert chunk.count("return moveVia(")==1
          p.write_text(s[:start]+chunk.replace("return moveVia(","return translateSameRootViaSite(",1)+s[end:])
          PY
      - name: Keep the zero-clearance-error assertion
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Save public diagnostic SVGs for inspection
        if: always()
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record diagnostic OrangeCrab SVG"
          git push origin HEAD:refs/heads/analysis/native-orange-diagnostic-${{ matrix.variant }}
  gba:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3011ea856de9661404a115ed2050d9e0a1bff77
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Report only whether the protected copper actually changed
        run: |
          cat > native-preload-preservation.ts <<'TS'
          import { AutoroutingPipelineSolver9_PreloadedTraceGraph } from "./lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph"
          import { pointToSegmentDistance } from "@tscircuit/math-utils"
          import srj from "./fixtures/bug-reports/bugreport96-full-gameboy-no-breakout/bugreport96-full-gameboy-no-breakout.srj.json"
          const solver=new AutoroutingPipelineSolver9_PreloadedTraceGraph(structuredClone(srj),{cacheProvider:null,effort:1})
          solver.solve()
          const hd=solver.highDensityRouteSolver!
          const original=hd.fixedHdRoutes.find(r=>r.connectionName==="source_trace_0_fixed_70_0")!
          const replacement=hd.fixedRouteReplacements.get(original.connectionName)
          let originalCopperRetained=true
          if (replacement) {
            for(let i=1;i<original.route.length;i++) {
              const a=original.route[i-1]!,b=original.route[i]!
              if(a.z!==b.z)continue
              for(const t of [0,0.25,0.5,0.75,1]) {
                const point={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}
                const covered=replacement.route.some((end,index)=>{
                  const start=replacement.route[index-1]
                  return start && start.z===a.z && end.z===a.z &&
                    pointToSegmentDistance(point,start,end)<1e-6
                })
                if(!covered)originalCopperRetained=false
              }
            }
          }
          console.log("PROTECTED_PRELOAD_GEOMETRY",JSON.stringify({solved:solver.solved,replacementRecorded:!!replacement,originalCopperRetained,originalPointCount:original.route.length,replacementPointCount:replacement?.route.length??0,startRetained:!replacement || ["x","y","z"].every(k=>replacement.route[0]![k]===original.route[0]![k]),endRetained:!replacement || ["x","y","z"].every(k=>replacement.route.at(-1)![k]===original.route.at(-1)![k])}))
          TS
          bun native-preload-preservation.ts
