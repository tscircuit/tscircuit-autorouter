name: Verify bounded shared-via clearance repair
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [09bd0812beff4b44f03cf5e2e5881b3186655558, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
        movement: [scaled, deficit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Isolate the existing repair helper's shared-site movement
        env:
          MOVEMENT: ${{ matrix.movement }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("node_modules/high-density-repair03/lib/solvers/GlobalDrcForceImproveSolver/solverHelpers.ts")
          s=p.read_text()
          start=s.index("const moveViaAwayFromPoint = (")
          end=s.index("\ntype SegmentContact",start)
          helper=s[start:end]
          assert "  return moveVia(" in helper
          helper=helper.replace("  srj: SimpleRouteJson,\n) =>","  srj: SimpleRouteJson,\n  scale = 1,\n) =>",1)
          helper=helper.replace("  return moveVia(","  return translateSameRootViaSite(",1).replace("directionX * MAX_ERROR_MOVE,","directionX * MAX_ERROR_MOVE * scale,",1).replace("directionY * MAX_ERROR_MOVE,","directionY * MAX_ERROR_MOVE * scale,",1)
          s=s[:start]+helper+s[end:]
          old="moveViaAwayFromPoint(routes, nearestVia, repulsionPoint, srj) ||"
          assert s.count(old)==2
          movement="scale"
          if os.environ["MOVEMENT"]=="deficit":
            movement="typeof error.minimum_clearance === 'number' && typeof error.actual_clearance === 'number' ? Math.min(1, Math.max(0, error.minimum_clearance - error.actual_clearance + 1e-5) / MAX_ERROR_MOVE) : scale"
          s=s.replace(old,"moveViaAwayFromPoint(routes, nearestVia, repulsionPoint, srj, "+movement+") ||",1)
          p.write_text(s)
          PY
      - name: Keep the original full-board assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts
