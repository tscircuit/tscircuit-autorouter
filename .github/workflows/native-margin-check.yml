name: Verify read-only copper retains its physical width during repair
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [1a2e757a0230bae0e8f915023485978587d7fe14, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Apply the new-width minimum only to routes this pass can change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/solvers/HighDensityRepairSolver/Pipeline4HighDensityRepairSolver.ts")
          s=p.read_text()
          old="""    const repairRoutes = contextRoutes.map((route) =>
                toRepairRoute({
                  route,
                  connMap: params.connMap,
                  minimumTraceWidth: params.minimumTraceWidth,
                  viaLayerSpan,
                }),
              )"""
          assert s.count(old)==1
          new="""    const repairRoutes = contextRoutes.map((route, index) => {
                let minimumTraceWidth: number | undefined
                if (index < params.hdRoutes.length) {
                  minimumTraceWidth = params.minimumTraceWidth
                }
                return toRepairRoute({
                  route,
                  connMap: params.connMap,
                  minimumTraceWidth,
                  viaLayerSpan,
                })
              })"""
          p.write_text(s.replace(old,new,1))
          PY
      - run: bun install
      - name: Keep original board clearance, via-count and preservation assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
