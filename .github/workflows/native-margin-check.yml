name: Verify native copper context in clearance projection
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [09bd0812beff4b44f03cf5e2e5881b3186655558, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
        baseline: [preserve, repair]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Supply read-only native routes to the existing clearance solver
        env:
          BASELINE: ${{ matrix.baseline }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9JointDrcRepairSolver.ts")
          s=p.read_text()
          old="            routes: this.exactRepairParams.hdRoutes,\n            drcEvaluator: this.cachedReferenceDrcEvaluator!,"
          assert s.count(old)==1
          s=s.replace(old,"            routes: this.exactRepairParams.hdRoutes,\n            fixedHdRoutes: this.fixedPreloadedObstacleRoutes,\n            drcEvaluator: this.cachedReferenceDrcEvaluator!,",1)
          if os.environ["BASELINE"]=="repair":
            old="    const baselineDrc = evaluateInitialDrc([])"
            assert s.count(old)==1
            s=s.replace(old,"    const baselineDrc = { ...evaluateInitialDrc([]), errors: [], errorsWithCenters: [] }",1)
          p.write_text(s)
          PY
      - run: bun install
      - name: Keep the existing final connectivity and clearance assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts
