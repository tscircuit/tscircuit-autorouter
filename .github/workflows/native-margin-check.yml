name: Isolate native-routing Game Boy regression
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            source: 2b1207ad70971f326166b134ea19418137273f23
          - variant: main-parent-deps
            source: 2b1207ad70971f326166b134ea19418137273f23
          - variant: parent-main-deps
            source: 1a2e757a0230bae0e8f915023485978587d7fe14
          - variant: intra
            source: 1a2e757a0230bae0e8f915023485978587d7fe14
          - variant: grow
            source: 1a2e757a0230bae0e8f915023485978587d7fe14
          - variant: portfolio
            source: 1a2e757a0230bae0e8f915023485978587d7fe14
          - variant: bridge
            source: 1a2e757a0230bae0e8f915023485978587d7fe14
          - variant: repair
            source: 1a2e757a0230bae0e8f915023485978587d7fe14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Fetch the two exact source versions for isolation
        run: |
          git fetch origin 2b1207ad70971f326166b134ea19418137273f23 --depth=1
          git fetch origin 1a2e757a0230bae0e8f915023485978587d7fe14 --depth=1
      - name: Restore one component or dependency set
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          mode=os.environ["VARIANT"]
          main="2b1207ad70971f326166b134ea19418137273f23"
          parent="1a2e757a0230bae0e8f915023485978587d7fe14"
          def restore(ref,path):
            p=Path(path)
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_bytes(subprocess.run(["git","show",ref+":"+path],check=True,capture_output=True).stdout)
          if mode=="main-parent-deps":
            restore(parent,"package.json")
          elif mode=="parent-main-deps":
            restore(main,"package.json")
          elif mode not in ("main",):
            files={
              "intra":"lib/solvers/HighDensitySolver/IntraNodeSolver.ts",
              "grow":"lib/solvers/HyperHighDensitySolver/GrowShrinkHighDensityIntraNodeSolver/GrowShrinkHighDensityIntraNodeSolver.ts",
              "portfolio":"lib/solvers/HyperHighDensitySolver/PortfolioSingleIntraNodeSolver.ts",
              "bridge":"lib/solvers/HyperHighDensitySolver/repairDisconnectedSameRootPortPoints.ts",
              "repair":"lib/solvers/HighDensityRepairSolver/Pipeline4HighDensityRepairSolver.ts",
            }
            restore(main,files[mode])
          PY
      - run: bun install
      - name: Run the unchanged Game Boy clearance and via-count regression
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts
