name: Verify exact-width native copper projection
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: write
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 93f449589c8748916c2105a5efab437c0908269a
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Preserve native copper in exact-width projection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("node_modules/high-density-repair01/lib/HighDensityForceImproveSolver.ts")
          s=p.read_text()
          old='    [...routes, ...(options?.fixedHdRoutes ?? [])],'
          assert s.count(old)==1
          # Exact-width static copper remains in applyProjectionClearance.
          # The legacy heuristic's centerline forces assume uniform route widths.
          p.write_text(s.replace(old,'    routes,',1))
          PY
      - name: Keep all original board assertions including zero-error OrangeCrab
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Save only verified public SVGs
        if: success()
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record verified exact-width projection snapshots"
          git push origin HEAD:refs/heads/analysis/verified-native-projection
