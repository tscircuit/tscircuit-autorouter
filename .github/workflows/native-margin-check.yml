name: Verify completed neighboring copper remains visible
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [7b5f98e1785f9fcf3751448de03f58603afbf0d6, 75a6381c6985cd48f91b30516a828f6a771cfce0]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Keep the original neighboring copper context without changing coordinate policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensitySolver.ts")
          s=p.read_text()
          assert s.count("    if (hasImmutablePreload) {")==1
          p.write_text(s.replace("    if (hasImmutablePreload) {","    if (true) {",1))
          PY
      - run: bun install
      - name: Keep original completion, clearance and via-count assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts
