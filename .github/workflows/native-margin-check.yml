name: Verify native geometry with complete exported ownership
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 896e20783c83a4afb9554e5ab8a81fec203e8ca7
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Keep all native copper in the same physical frame
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensitySolver.ts")
          s=p.read_text()
          old="    const hasImmutablePreload = this.fixedHdRoutes.some(\n      (route) => route.isFixed === true,\n    )"
          assert s.count(old)==1
          p.write_text(s.replace(old,"    const hasImmutablePreload = fixedHdRoutes.length > 0",1))
          PY
      - run: bun install
      - name: Keep original routing, physical-clearance and via-count assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts
