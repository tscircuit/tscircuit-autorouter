name: Verify existing clearance cleanup for native copper
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [09bd0812beff4b44f03cf5e2e5881b3186655558, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
        cleanup: [global, joint, both]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Enable existing clearance cleanup after native routing
        env:
          CLEANUP: ${{ matrix.cleanup }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          cleanup=os.environ["CLEANUP"]
          root=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph")
          names=[]
          if cleanup in ("global","both"):
            names.append("AutoroutingPipelineSolver9_PreloadedTraceGraph.ts")
          if cleanup in ("joint","both"):
            names.append("Pipeline9JointDrcRepairSolver.ts")
          for name in names:
            p=root/name
            s=p.read_text()
            old="enablePostSolveClearanceRelaxation: false,"
            assert s.count(old)==1
            p.write_text(s.replace(old,"enablePostSolveClearanceRelaxation: true,",1))
          PY
      - run: bun install
      - name: Keep the existing final connectivity and clearance assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts
