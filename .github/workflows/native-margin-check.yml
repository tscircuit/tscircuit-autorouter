name: Verify exact pad identity and final shared-via repair
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [1a2e757a0230bae0e8f915023485978587d7fe14, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
        repair: [identity, finalization]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Resolve the reported physical pad before broad connectivity aliases
        env:
          REPAIR: ${{ matrix.repair }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path("node_modules/high-density-repair03/lib/solvers/GlobalDrcForceImproveSolver")
          p=root/"solverHelpers.ts"
          s=p.read_text()
          start=s.index("const moveViaAwayFromPoint = (")
          end=s.index("\ntype SegmentContact",start)
          helper=s[start:end]
          assert "  return moveVia(" in helper
          helper=helper.replace("  return moveVia(","  return translateSameRootViaSite(",1)
          s=s[:start]+helper+s[end:]
          anchor="  const referencedObstacle = srj.obstacles.find("
          assert s.count(anchor)==1
          exact="""  const exactObstacle = srj.obstacles.find(
            (obstacle) =>
              referencedPadIds.some((id) =>
                obstacle.obstacleId === id ||
                obstacle.circuitJsonMetadata?.pcb_smtpad_id === id ||
                obstacle.circuitJsonMetadata?.pcb_plated_hole_id === id
              ) && (obstacleFilter?.(obstacle) ?? true),
          )
          if (exactObstacle) return exactObstacle.center

          """
          s=s.replace(anchor,exact+anchor,1)
          p.write_text(s)
          if os.environ["REPAIR"]=="finalization":
            p=root/"TraceContactRepairSolver.ts"
            s=p.read_text()
            old="  isForbiddenPadDrillError,"
            assert s.count(old)==1
            s=s.replace(old,old+"\n  isViaPadDrcError,",1)
            old="      if (isForbiddenPadDrillError(error)) return true"
            assert s.count(old)==1
            s=s.replace(old,"      if (isForbiddenPadDrillError(error) || isViaPadDrcError(error)) return true",1)
            p.write_text(s)
          PY
      - name: Keep all original board assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Report the actual OrangeCrab DRC total
        if: always()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg")
          if p.exists():
            m=re.search(r"Relaxed DRC errors: (\d+)",p.read_text())
            if m: print("ORANGECRAB_DRC_COUNT",int(m.group(1)))
          PY
