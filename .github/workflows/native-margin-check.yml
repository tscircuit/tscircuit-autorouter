name: Verify existing postroute clearance repair with native paths
on:
  push:
    branches: [analysis/native-complete-cleanup-context]
    paths: [.github/workflows/native-margin-check.yml]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [1a2e757a0230bae0e8f915023485978587d7fe14, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Include saved paths in the existing via-to-trace postroute check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/solvers/HighDensitySolver/IntraNodeSolver.ts")
          s=p.read_text()
          old="    if (this.solvedRoutes.length < 2) return null\n\n    const spatialIndex = new HighDensityRouteSpatialIndex(this.solvedRoutes)"
          assert s.count(old)==1
          new="""    const copperRoutes = [...this.fixedHdRoutes, ...this.solvedRoutes]
              if (this.solvedRoutes.length === 0 || copperRoutes.length < 2) return null

              const spatialIndex = new HighDensityRouteSpatialIndex(copperRoutes)"""
          s=s.replace(old,new,1)
          old="""              return !(
                          this.connMap?.areIdsConnected("""
          new="""              if (
                          route.rootConnectionName !== undefined &&
                          route.rootConnectionName === conflictingRoute.rootConnectionName
                        ) {
                          return false
                        }
                        return !(
                          this.connMap?.areIdsConnected("""
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
      - run: bun install
      - name: Keep original board connectivity, via-count and clearance assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/usb-dp-phase-detour.test.ts tests/repro/pipeline9-h616-portfolio-candidate-clearance.test.ts tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
