name: Routing diagnostics benchmark
on:
  workflow_dispatch:
    inputs:
      sample:
        description: SRJ18 sample number
        type: string
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Record environment
        run: |
          mkdir -p routing-diagnostics
          git rev-parse HEAD > routing-diagnostics/commit.txt
          bun --version > routing-diagnostics/bun-version.txt
          cp package.json routing-diagnostics/package.json
          cp bun.lock routing-diagnostics/bun.lock
      - name: Run diagnostic benchmark
        env:
          SAMPLE: ${{ inputs.sample }}
        run: timeout 600s bun scripts/benchmark/diagnose-routing.ts "$SAMPLE" routing-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-diagnostics
          path: routing-diagnostics
