name: Benchmark Effort
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      pr_number:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to benchmark
        required: true
        type: string
      pr_number:
        description: PR to receive the comparison
        required: true
        type: string
permissions:
  contents: read
  issues: write
jobs:
  benchmark:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/benchmark/cleanup-strategies.ts
        env:
          CLEANUP_STRATEGIES: control,vertex-shortcuts,vertex-local-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-effort
          path: benchmark-effort/
