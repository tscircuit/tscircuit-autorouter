name: Qualify cached ordinary fanout candidates on the minimal stack
on:
  push:
    branches: [codex/ddr2427-minimal-stack-cached]
permissions:
  contents: read
  actions: read
jobs:
  native-subsets:
    strategy:
      fail-fast: false
      matrix:
        board: [icepi, imx6]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 3258e97a80f0239c0c92de072c4cba5d559935ce
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: published2427-${{ matrix.board }}
          run-id: 44519377875
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare immutable source variants with identical dependencies
        run: |
          (cd source && bun install --frozen-lockfile --ignore-scripts)
          python3 - <<'PYVARIANTS'
          import json,subprocess
          from pathlib import Path
          root=Path.cwd()
          variants=json.loads(Path('experiments/full-board-priority-analysis/minimal-stack-variants.json').read_text())
          for name,revision in variants.items():
              subprocess.run(['git','fetch','--no-tags','origin',revision],cwd='source',check=True)
              folder=root/'variants'/name
              subprocess.run(['git','worktree','add','--detach',str(folder),revision],cwd='source',check=True)
              (folder/'node_modules').symlink_to(root/'source/node_modules',target_is_directory=True)
              (folder/'replay-stack-native.ts').write_bytes(Path('experiments/full-board-priority-analysis/replay-stack-native.ts').read_bytes())
          PYVARIANTS
      - name: Replay every subset with the same180second budget
        env:
          BOARD_ID: ${{ matrix.board }}
          NATIVE_FANOUT_BUDGET_MS: '180000'
        run: |
          python3 - <<'PYREPLAY'
          import json,os,subprocess
          from pathlib import Path
          root=Path.cwd()
          variants=json.loads(Path('experiments/full-board-priority-analysis/minimal-stack-variants.json').read_text())
          for name,revision in variants.items():
              output=root/'results'/name
              completed=subprocess.run(['bun','replay-stack-native.ts',str(root/'captured'/os.environ['BOARD_ID']/'fanout-1-input.json.gz'),str(output)],cwd=root/'variants'/name)
              print('STACK_VARIANT_EXIT',json.dumps({'variant':name,'revision':revision,'exitCode':completed.returncode}),flush=True)
          PYREPLAY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-stack-cached-native-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export native metrics and actual copper
        if: always()
        run: |
          python3 - <<'PYEXPORT'
          import base64,hashlib,io,json,zipfile
          from pathlib import Path
          rows=[]
          for path in sorted(Path('results').glob('*/report.json')):
              report=json.loads(path.read_text())
              rows.append({'variant':path.parent.name,**report,'copperSha256':hashlib.sha256((path.parent/'best-traces.json').read_bytes()).hexdigest()})
          print('STACK_NATIVE_SUBSETS_REPORT',json.dumps(rows,separators=(',',':')))
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file():archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('STACK_NATIVE_SUBSETS_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('STACK_NATIVE_SUBSETS_EVIDENCE_END')
          assert len(rows)==4
          assert all(row['copperDrc']['valid'] for row in rows)
          PYEXPORT

  boards:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: a4a8f3a71dd66c2cae01d6a7ade426efad833ff6
          path: router
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 75ab017cd6852dbe50516ee1f4ca9d1108c29985
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build the frozen stack with the selected fanout revision
        run: |
          python3 - <<'PYFANOUT'
          import json
          from pathlib import Path
          path=Path('core/package.json');package=json.loads(path.read_text())
          assert package['devDependencies']['@tscircuit/fanout-solver']=='0.0.91'
          package['devDependencies']['@tscircuit/fanout-solver']='https://codeload.github.com/tscircuit/fanout-solver/tar.gz/a62c05c6a9ec2b253c8cb306e6fe9ef8baf3c349'
          path.write_text(json.dumps(package,indent=2)+'\n')
          PYFANOUT
          for folder in router core; do (cd "$folder" && bun install --ignore-scripts); done
          (cd router && bun build lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts --target bun --packages external --outfile benchmark-runtime/pipeline9.js)
          cd experiments/full-board-priority-analysis
          python3 - <<'PYDEPS'
          import json
          from pathlib import Path
          path=Path('package.json');package=json.loads(path.read_text());package['dependencies']['tscircuit']='0.0.3245';path.write_text(json.dumps(package,indent=2)+'\n')
          PYDEPS
          bun install --ignore-scripts
          bun build-core.ts ../../core
      - name: Verify fanout then buses then remaining nets, and route fresh
        working-directory: experiments/full-board-priority-analysis
        env:
          BOARD_ID: ${{ matrix.board }}
          FULL_BOARD_CAPTURE_STAGE_INPUTS: "1"
          FULL_BOARD_FANOUT_VERSION: "0.0.91+581e6f9"
        run: |
          export FULL_BOARD_CORE_SOURCE="$GITHUB_WORKSPACE/core"
          export FULL_BOARD_CORE_MODULE="$PWD/patched-core/index.js"
          export FULL_BOARD_COPPER_MODULE="$PWD/patched-core/find-floating-copper.js"
          export FULL_BOARD_ROUTER_MODULE="$GITHUB_WORKSPACE/router/benchmark-runtime/pipeline9.js"
          export FULL_BOARD_ROUTER_COMMIT="a4a8f3a71dd66c2cae01d6a7ade426efad833ff6"
          mkdir -p "$GITHUB_WORKSPACE/results/$BOARD_ID"
          cp patched-core/build.json "$GITHUB_WORKSPACE/results/$BOARD_ID/core-build.json"
          cp "$GITHUB_WORKSPACE/core/package.json" "$GITHUB_WORKSPACE/results/$BOARD_ID/core-package.json"
          cp package.json "$GITHUB_WORKSPACE/results/$BOARD_ID/runtime-package.json"
          cp bun.lock "$GITHUB_WORKSPACE/results/$BOARD_ID/runtime-bun.lock"
          bun inspect-routing-workflow.tsx "$BOARD_ID" "$GITHUB_WORKSPACE/results/$BOARD_ID/plan.json"
          bun run-fanout-bus-first.ts "$BOARD_ID" "$GITHUB_WORKSPACE/results/$BOARD_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-stack-cached-board-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export native PCB output and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          names={'core-build.json','core-package.json','plan.json','progress.json','assessment.json','diagnostics.json','process.json','circuit.json','pcb.svg','worker.log','runtime-package.json','runtime-bun.lock'}
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file() and (path.name in names or path.name.startswith('fanout-') and path.name.endswith('.json.gz')):
                      archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('FANOUT_BUS_FIRST_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('FANOUT_BUS_FIRST_EVIDENCE_END')
          PY

  matched-frozen:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 3258e97a80f0239c0c92de072c4cba5d559935ce
          path: original
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: a62c05c6a9ec2b253c8cb306e6fe9ef8baf3c349
          path: cleanup
      - uses: actions/download-artifact@v4
        with:
          name: guard-0
          run-id: 44415945774
          github-token: ${{ github.token }}
          path: frozen
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: |
          for revision in original cleanup; do
            (cd "$revision" && bun install --frozen-lockfile --ignore-scripts)
            cp experiments/full-board-priority-analysis/replay-frozen-fanout31.ts "$revision/replay-frozen-fanout31.ts"
          done
      - name: Run all frozen cases before and after the cleanup on the same worker
        run: |
          for revision in original cleanup; do
            (cd "$revision" && bun replay-frozen-fanout31.ts "$GITHUB_WORKSPACE/frozen/inputs" "$GITHUB_WORKSPACE/matched/$revision" 16)
          done
      - name: Export reports and routed SVG hashes
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          for folder in [*Path('matched').glob('*'),*Path('probes').glob('*/*')]:
              report=folder/'benchmark.json'
              if not report.exists():continue
              print('MATCHED_FANOUT31_RESULT',json.dumps({'cohort':str(folder),'report':json.loads(report.read_text()),'svgs':{path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in folder.glob('*.svg')}},separators=(',',':')))
          print('FROZEN_INPUT_HASHES',json.dumps({path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in Path('frozen/inputs').glob('*.json')},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-stack-cached-frozen
          path: |
            matched
            probes

