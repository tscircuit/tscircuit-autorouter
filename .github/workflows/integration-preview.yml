name: Integration package preview

on:
  push:
    branches:
      - preview/demo-routing-fixes

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --ignore-scripts
      - run: bun run build
      - run: bunx pkg-pr-new@0.0.37 publish --comment=off
