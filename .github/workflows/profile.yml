name: Dataset01 Benchmark Order Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-order-control:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    env:
      BASE_REF: 53df67cbdd0c04a1c2f6fb9cc3d37948e40045c7
      CANDIDATE_REF: f2f2eafe83f6eb48a51a9ea5fd627f4e6c499235
      BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: ${{ vars.BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS || vars.BENCHMARK_TASK_TIMEOUT_MS || '60000' }}
      BENCHMARK_HEARTBEAT_INTERVAL_MS: ${{ vars.BENCHMARK_HEARTBEAT_INTERVAL_MS || '30000' }}
      BENCHMARK_TERMINATE_TIMEOUT_MS: ${{ vars.BENCHMARK_TERMINATE_TIMEOUT_MS || '1000' }}
      BENCHMARK_NETWORKED_CACHE_PROPAGATION_DELAY_MS: '0'
      HD_CACHE2_SERVER_URL: ''
    steps:
      - name: Checkout exact base
        uses: actions/checkout@v4
        with:
          ref: 53df67cbdd0c04a1c2f6fb9cc3d37948e40045c7
          path: base
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: f2f2eafe83f6eb48a51a9ea5fd627f4e6c499235
          path: candidate
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install base dependencies
        working-directory: base
        run: bun install
      - name: Install candidate dependencies
        working-directory: candidate
        run: bun install
      - name: Run candidate-base-base-candidate order control
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const os = require('node:os')
          const { createHash } = require('node:crypto')
          const { spawnSync } = require('node:child_process')
          const root = process.env.GITHUB_WORKSPACE
          const output = path.join(root, 'order-control-results')
          const args = ['--pipeline', '9', '--dataset', 'dataset01', '--concurrency', '3', '--threads', '1', '--effort', '1', '--sample-timeout', '10m']
          const order = ['candidate1', 'base1', 'base2', 'candidate2']
          fs.mkdirSync(output, { recursive: true })
          const readCommand = (cmd, argv, cwd = root) => {
            const result = spawnSync(cmd, argv, { cwd, encoding: 'utf8' })
            if (result.error) throw result.error
            if (result.status !== 0) throw new Error(`${cmd} failed: ${result.stderr}`)
            return result.stdout.trim()
          }
          const baseSha = readCommand('git', ['rev-parse', 'HEAD'], path.join(root, 'base'))
          const candidateSha = readCommand('git', ['rev-parse', 'HEAD'], path.join(root, 'candidate'))
          const bunVersion = readCommand('bun', ['--version'])
          if (baseSha !== process.env.BASE_REF || candidateSha !== process.env.CANDIDATE_REF) throw new Error('Unexpected source revision')
          if (bunVersion !== '1.4.2') throw new Error(`Unexpected Bun ${bunVersion}`)
          const metadata = {
            version: 1, kind: 'benchmark-order-control', baseSha, candidateSha,
            diagnosticSha: process.env.GITHUB_SHA, workflowRunId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY, order, args, bunVersion,
            runner: { name: process.env.RUNNER_NAME, os: process.env.RUNNER_OS, arch: process.env.RUNNER_ARCH },
            host: { logicalCpuCount: os.cpus().length, availableParallelism: os.availableParallelism(), totalMemoryBytes: os.totalmem() },
            environment: Object.fromEntries(['BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS', 'BENCHMARK_HEARTBEAT_INTERVAL_MS', 'BENCHMARK_TERMINATE_TIMEOUT_MS', 'BENCHMARK_NETWORKED_CACHE_PROPAGATION_DELAY_MS', 'HD_CACHE2_SERVER_URL'].map(key => [key, process.env[key]])),
            passes: [],
          }
          const writeMetadata = () => fs.writeFileSync(path.join(output, 'order-metadata.json'), JSON.stringify(metadata, null, 2))
          writeMetadata()
          for (const revision of ['base', 'candidate']) {
            const dir = path.join(output, 'dependencies', revision)
            fs.mkdirSync(dir, { recursive: true })
            for (const filename of ['package.json', 'bun.lock', 'bun.lockb', 'bunfig.toml']) {
              const file = path.join(root, revision, filename)
              if (fs.existsSync(file)) fs.copyFileSync(file, path.join(dir, filename))
            }
          }
          delete process.env.HD_CACHE2_CACHE_VERSION
          for (const label of order) {
            const revision = label.startsWith('candidate') ? 'candidate' : 'base'
            const cwd = path.join(root, revision)
            const passOutput = path.join(output, label)
            fs.mkdirSync(passOutput, { recursive: true })
            fs.chmodSync(path.join(cwd, 'benchmark.sh'), 0o755)
            const startedAt = new Date().toISOString()
            const startedAtMs = Date.now()
            console.log(`ORDER CONTROL ${label} ${revision === 'base' ? baseSha : candidateSha}`)
            const result = spawnSync('./benchmark.sh', args, { cwd, env: process.env, stdio: 'inherit' })
            const pass = { label, revision, sha: revision === 'base' ? baseSha : candidateSha, startedAt, completedAt: new Date().toISOString(), workflowElapsedMs: Date.now() - startedAtMs, exitCode: result.status }
            metadata.passes.push(pass)
            writeMetadata()
            for (const filename of ['benchmark-interrupted.json', 'benchmark-failure.json']) {
              const file = path.join(cwd, filename)
              if (fs.existsSync(file)) fs.copyFileSync(file, path.join(passOutput, filename))
            }
            if (result.error) throw result.error
            if (result.status !== 0) throw new Error(`${label} benchmark exited ${result.status}`)
            const reportPath = path.join(cwd, 'benchmark-result.json')
            if (fs.statSync(reportPath).mtimeMs < startedAtMs) throw new Error(`${label} did not produce a fresh report`)
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
            if (report.datasetName !== 'dataset01' || report.scenarioCount !== 85) throw new Error(`${label} did not execute all 85 dataset01 scenarios`)
            for (const filename of ['benchmark-result.json', 'benchmark-result.txt', 'benchmark-snapshots.html']) {
              fs.copyFileSync(path.join(cwd, filename), path.join(passOutput, filename))
            }
            pass.runtime = report.runtime
            pass.reportSha256 = createHash('sha256').update(fs.readFileSync(reportPath)).digest('hex')
            writeMetadata()
          }
          NODE
      - name: Upload all order-control reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-order-control-dataset01
          path: order-control-results
          if-no-files-found: error
