name: Solver CPU Diagnostics

on:
  workflow_dispatch:
    inputs:
      dataset_name:
        description: Dataset to profile
        required: true
        type: string
      ref:
        description: Exact autorouter revision
        required: true
        type: string
      pr_number:
        description: Related PR for metadata only
        required: true
        type: string
      profile_args_json:
        description: JSON array of sample numbers
        required: true
        type: string

permissions:
  contents: read

jobs:
  profile:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Profile real pipeline solves
        env:
          PROFILE_DATASET: ${{ inputs.dataset_name }}
          PROFILE_SAMPLES: ${{ inputs.profile_args_json }}
          PROFILE_REF: ${{ inputs.ref }}
          PROFILE_PR: ${{ inputs.pr_number }}
        run: |
          mkdir -p cpu-profiles
          cat > cpu-profile.ts <<'TS'
          import { createHash } from "node:crypto"
          import { AutoroutingPipelineSolver } from "./lib"
          import { loadScenarios, type DatasetName } from "./scripts/benchmark/scenarios"
          const dataset = process.argv[2] as DatasetName
          const sample = Number(process.argv[3])
          const scenarios = await loadScenarios(dataset, { effort: 1 })
          const [name, input] = scenarios[sample - 1]!
          const solver = new AutoroutingPipelineSolver(structuredClone(input))
          console.log(JSON.stringify({ event: "start", dataset, sample, name }))
          let lastPhase = ""
          let lastLog = performance.now()
          while (!solver.solved && !solver.failed) {
            solver.step()
            const phase = solver.getCurrentPhase()
            const now = performance.now()
            if (phase !== lastPhase || now - lastLog > 30_000) {
              console.log(JSON.stringify({ event: "progress", sample, phase, iterations: solver.iterations }))
              lastPhase = phase
              lastLog = now
            }
          }
          if (!solver.solved || solver.failed) throw new Error(solver.error ?? "Unsolved")
          const traces = solver.getOutputSimplifiedPcbTraces()
          const output = {
            dataset, sample, name, ref: process.env.PROFILE_REF,
            hash: createHash("sha256").update(JSON.stringify(traces)).digest("hex"),
            stageTimeMs: solver.timeSpentOnPhase,
            highDensityStats: solver.highDensityRouteSolver?.stats,
          }
          await Bun.write(`cpu-profiles/${dataset}-${sample}.json`, JSON.stringify(output, null, 2))
          console.log(JSON.stringify({ event: "complete", sample, hash: output.hash }))
          TS
          node <<'NODE'
          const { spawn } = require('node:child_process')
          const fs = require('node:fs')
          const samples = JSON.parse(process.env.PROFILE_SAMPLES)
          if (!Array.isArray(samples) || samples.length > 3 || samples.some(s => !Number.isSafeInteger(Number(s)) || Number(s) < 1)) throw new Error('Provide at most three positive sample numbers')
          Promise.all(samples.map(sample => new Promise((resolve, reject) => {
            const label = `${process.env.PROFILE_DATASET}-${sample}`
            const output = fs.createWriteStream(`cpu-profiles/${label}.log`)
            const child = spawn('bun', ['--cpu-prof', '--cpu-prof-dir', 'cpu-profiles', '--cpu-prof-name', `${label}.cpuprofile`, 'cpu-profile.ts', process.env.PROFILE_DATASET, String(sample)], { stdio: ['ignore', 'pipe', 'pipe'] })
            child.stdout.pipe(output, { end: false })
            child.stderr.pipe(output, { end: false })
            child.stdout.pipe(process.stdout)
            child.stderr.pipe(process.stderr)
            child.on('error', reject)
            child.on('close', code => { output.end(); code === 0 ? resolve() : reject(new Error(`${label} exited ${code}`)) })
          }))).catch(error => { console.error(error); process.exitCode = 1 })
          NODE
      - name: Upload CPU profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-cpu-profiles
          path: cpu-profiles
          if-no-files-found: error
