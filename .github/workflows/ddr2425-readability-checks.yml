name: Validate plane cache readability cleanup
on:
  push:
    branches: [codex/ddr2425-readability-checks]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: c72c9a0fef489815f024fe748dec97a96a45bc9f
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - if: always()
        run: bun run typecheck
      - if: always()
        run: bun test --timeout 9999999 tests/native-plane-static-rejections.test.ts tests/plane-endpoint-cache-alternatives.test.ts
