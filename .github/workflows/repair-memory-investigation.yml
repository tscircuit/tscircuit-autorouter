name: Repair memory investigation
on:
  push:
    branches: [techmannih/benchmark-repair-memory-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    if: github.ref_name == 'techmannih/benchmark-repair-memory-20261105'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/high-density-repair03
          ref: 94fc55116df29f0ce33f0acd1a9ba7c793a1deea
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/high-density-repair03
          ref: 6ec16dcf29e07a9c5e93af7bc1c572e99e43960c
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install identical dependencies
        run: |
          (cd base && bun install --no-save --ignore-scripts)
          cp -a base/node_modules candidate/node_modules
          cp candidate/benchmarks/srj18Fixtures.ts base/benchmarks/srj18Fixtures.ts
          mkdir outputs
          for revision in base candidate; do
            cp controller/scripts/benchmark/standalone-repair-probe.ts "$revision/standalone-repair-probe.ts"
            sed -i 's|"../|"./|g' "$revision/standalone-repair-probe.ts"
          done
      - name: Repeat standalone cases in both orders
        run: |
          for sample in 6 12 13; do
            for round in 1 2; do
              order="base candidate"
              if [ "$round" = 2 ]; then order="candidate base"; fi
              for revision in $order; do
                (cd "$revision" && COUNTERS=0 bun standalone-repair-probe.ts "$sample" "../outputs/$sample-round-$round-$revision.json")
              done
            done
          done
      - name: Profile the three slow standalone cases
        run: |
          for sample in 6 12 13; do
            for revision in base candidate; do
              (cd "$revision" && COUNTERS=1 bun standalone-repair-probe.ts "$sample" "../outputs/$sample-$revision-counters.json")
              (cd "$revision" && COUNTERS=0 bun --cpu-prof --cpu-prof-dir ../outputs --cpu-prof-name "$sample-$revision.cpuprofile" standalone-repair-probe.ts "$sample" "../outputs/$sample-$revision.json")
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-selected-prefilter-profile
          path: outputs
