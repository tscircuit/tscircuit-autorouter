name: Repair memory investigation
on:
  push:
    branches: [techmannih/benchmark-repair-memory-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.ref_name == 'techmannih/benchmark-repair-memory-20261105'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: dataset01-median-balanced
            dataset: dataset01
            base: 997877375d0d45f6771320b81bfc7898e192ff62
            candidate: a613b05bd2dc579865b09c55c665214efb631dfc
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate }}
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install identical dependencies
        working-directory: base
        run: bun install --no-save --ignore-scripts
      - name: Install exact candidate repair archive
        env:
          BASE_SHA: ${{ matrix.base }}
          CANDIDATE_SHA: ${{ matrix.candidate }}
          COHORT: ${{ matrix.cohort }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          cp -a base/node_modules candidate/node_modules
          cp -a base control
          mkdir outputs
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('base/package.json'));
          const b = JSON.parse(fs.readFileSync('candidate/package.json'));
          const key = 'high-density-repair03';
          const basePin = a.devDependencies[key];
          const candidatePin = b.devDependencies[key];
          delete a.devDependencies[key]; delete b.devDependencies[key];
          if (JSON.stringify(a.dependencies) !== JSON.stringify(b.dependencies) || JSON.stringify(a.devDependencies) !== JSON.stringify(b.devDependencies)) throw Error('Unexpected non-repair dependency difference');
          fs.writeFileSync('outputs/candidate-url.txt', candidatePin);
          fs.writeFileSync('outputs/provenance.json', JSON.stringify({base:process.env.BASE_SHA,candidate:process.env.CANDIDATE_SHA,cohort:process.env.COHORT,runner:process.env.RUNNER_NAME,basePin,candidatePin,bun:'1.4.2',threads:1,concurrency:3,effort:1,rounds:3,orders:'base candidate control / candidate control base / control base candidate',control:process.env.BASE_SHA,dependencies:'copied from one baseline install',forcedGC:false}, null, 2));
          NODE
          curl --fail --location --silent --show-error "$(cat outputs/candidate-url.txt)" -o outputs/candidate.tar.gz
          tar -xzf outputs/candidate.tar.gz --strip-components=1 -C candidate/node_modules/high-density-repair03
      - name: Compare fixed PR between identical main controls
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          for round in 1 2 3; do
            case "$round" in
              1) order="base candidate control" ;;
              2) order="candidate control base" ;;
              3) order="control base candidate" ;;
            esac
            for revision in $order; do
              output="outputs/round-$round-$revision"
              mkdir -p "$output"
              (cd "$revision" && bash ./benchmark.sh --pipeline 9 --dataset "$DATASET" --concurrency 3 --threads 1 --effort 1) > "$output/run.log" 2>&1
              cp "$revision/benchmark-result.json" "$revision/benchmark-result.txt" "$revision/benchmark-snapshots.html" "$output/"
              tail -15 "$output/run.log"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-memory-${{ matrix.cohort }}
          path: outputs
