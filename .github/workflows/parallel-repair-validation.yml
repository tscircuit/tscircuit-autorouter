name: Parallel repair validation
on:
  push:
    branches: [codex/parallel-repair-starting-points]
    paths: [.github/workflows/parallel-repair-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun test tests/features/pipeline9-parallel-repair-portfolio.test.ts tests/features/pipeline9-async-no-runtime.test.ts tests/features/pipeline9-async-outer-budget.test.ts tests/features/pipeline9-async-runtime-failure.test.ts --timeout 9999999
      - run: bun run build
# Validate typed worker forwarding.
# Exercise both executor overloads.
