name: Collect frozen full-board phase inputs
on:
  push:
    branches: [codex/ddr2405-captures]
permissions:
  contents: read
  actions: read
jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        ref: [ef2be60d428e127283bb0966197a2b74eef1b1c4, f35a5f65fae0526beb2fd6a4ca05cd8ec62241f2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --ignore-scripts
      - run: bun run format:check
