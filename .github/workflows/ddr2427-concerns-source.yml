name: Validate reviewed fanout source
on:
  push:
    branches: [codex/ddr2427-concerns-source]
permissions:
  contents: read
jobs:
  source-check:
    strategy:
      fail-fast: false
      matrix:
        revision: ["2e6f5d2f694d64045031807d2983d1a16477ebee", "0d9967492a19b75d0d1f956c27e63b25e51c068e", "36717b30ba3a51633c1f00618a2e910a3fdacc10"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - if: always()
        run: bun run typecheck
      - if: always()
        run: |
          bun test --timeout 9999999 tests/two-via-windows.test.ts tests/native-boundary-contact.test.ts tests/singleton-trace-width.test.ts
          if [[ -f tests/boundary-contact-direction-overrides.test.ts ]]; then
            bun test --timeout 9999999 tests/boundary-contact-direction-overrides.test.ts
          fi
          if [[ -f tests/bus-trace-width.test.ts ]]; then
            bun test --timeout 9999999 tests/bus-trace-width.test.ts
          fi
          if [[ -f tests/boundary-point-direction.test.ts ]]; then
            bun test --timeout 9999999 tests/boundary-point-direction.test.ts
          fi
