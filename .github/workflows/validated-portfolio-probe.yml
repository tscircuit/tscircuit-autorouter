name: Validated portfolio feasibility
on:
  push:
    branches: [codex/validated-portfolio-probe]
    paths: [.github/workflows/validated-portfolio-probe.yml]
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        variant: [0.1, 0.25, 0.5]
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Probe a bounded portfolio candidate (not a baseline comparison)
        env:
          CANDIDATE_SCALE: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts")
          s=p.read_text()
          needle="this.effort = mutableOpts.effort ?? 1"
          if needle not in s:
            for line in s.splitlines():
              if "this.effort =" in line: print(line)
            raise Exception("Locate constructor effort assignment")
          p.write_text(s.replace(needle, "this.effort = (mutableOpts.effort ?? 1) * "+os.environ["CANDIDATE_SCALE"]))
          PY
      - run: bash benchmark.sh --dataset 18 --threads 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-probe-${{ matrix.variant }}
          path: |
            benchmark-result.json
            benchmark-result.txt
