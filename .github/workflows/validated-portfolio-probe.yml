name: Validated portfolio feasibility
on:
  push:
    branches: [codex/validated-portfolio-probe]
    paths: [.github/workflows/validated-portfolio-probe.yml]
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        variant: [0.1, 0.25, 0.5]
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bash benchmark.sh --dataset 18 --threads 1 --effort ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-probe-${{ matrix.variant }}
          path: |
            benchmark-result.json
            benchmark-result.txt
