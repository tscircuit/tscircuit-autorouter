name: Verify native A13 pad clearance
on:
  push:
    branches: [analysis/ddr-3235-pad-proof]
    paths: [.github/workflows/generate-ddr-pad-proof.yml]
permissions:
  contents: read
jobs:
  verify:
    name: A13 source ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: base, ref: 892f42311e92a751416906db1758eb2a011c4c23}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install declared dependencies
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("package.json")
          m=json.loads(p.read_text())
          m["overrides"]={**m.get("overrides",{}),"csstype":"3.1.3"}
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install
      - name: Real A13 board and existing routing assertions
        run: BUN_UPDATE_SNAPSHOTS=1 bun test --timeout 9999999 tests/repro/pipeline9-a13-regional-repair-shorts.test.ts
      - name: Export the generated board SVGs
        env:
          LABEL: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          import pathlib,json,os,gzip,base64
          for p in pathlib.Path("tests/repro/__snapshots__").glob("pipeline9-a13-regional-repair-shorts*.snap.svg"):
           print("DDR_SVG_PROOF="+json.dumps({"release":os.environ["LABEL"],"name":p.name,"gzipBase64":base64.b64encode(gzip.compress(p.read_bytes())).decode()}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-a13-pad-${{ matrix.label }}
          path: tests/repro/__snapshots__/pipeline9-a13-*.snap.svg
