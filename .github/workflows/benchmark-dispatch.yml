name: Dispatch PR Benchmarks

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: |
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, '/benchmark') ||
        startsWith(github.event.comment.body, '/profile')
      ) &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout command parser
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dispatch benchmark
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          script: |
            const { pathToFileURL } = require('node:url')
            const parserUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/benchmark/pr-benchmark-command.js`,
            ).href
            const { parsePrBenchmarkCommand } = await import(parserUrl)
            const command = parsePrBenchmarkCommand(context.payload.comment.body)
            const isProfile = command.kind === 'profile'
            const datasets = command.kind === 'benchmark-all'
              ? ['dataset01', 'srj18', 'srj19', 'srj20', 'srj21', 'srj23']
              : [command.datasetName]
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })
            for (const dataset of datasets) {
              const benchmarkArgs = command.kind === 'benchmark-all'
                ? [...command.benchmarkArgs, '--dataset', dataset]
                : command.benchmarkArgs
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: isProfile ? 'profile.yml' : 'benchmark.yml',
                ref: context.payload.repository.default_branch,
                inputs: {
                  dataset_name: dataset,
                  ref: pr.data.head.sha,
                  pr_number: String(context.issue.number),
                  ...(isProfile
                    ? { profile_args_json: JSON.stringify(command.benchmarkArgs) }
                    : {
                        profile_solvers: String(command.profileSolvers),
                        long_benchmark: String(command.kind === 'benchmark-long'),
                        same_machine_compare: String(command.sameMachineCompare),
                        benchmark_args_json: JSON.stringify(benchmarkArgs),
                      }),
                },
              })
            }
