name: Published3243 remaining-nine via-site bounds regression
on:
  push:
    branches: [bench/remaining-nine-via-site-bounds-3243-20261119]
permissions:
  contents: read
jobs:
  route:
    name: bounds-fix (${{ matrix.board }}, ${{ matrix.cohorts }})
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { board: h616, cohorts: "original" }
          - { board: butterstick, cohorts: "original,spaced" }
          - { board: glider, cohorts: "original,spaced" }
          - { board: imx6, cohorts: "original,spaced" }
          - { board: icepi, cohorts: "original,spaced" }
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: published
      FULL_BOARD_CANDIDATE_LANE: bounds-fix
      FULL_BOARD_COHORTS: ${{ matrix.cohorts }}
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            .github/workflows/full-board-via-site-bounds.yml
            AGENTS.md
      - name: Require the held remaining-nine plan
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('experiments/full-board-ten/via-site-bounds-plan.json').read_text())
          assert plan['qualificationReady'] is True, 'HELD: remaining-nine regression is not released'
          assert plan['jobs'] == 5 and plan['maxParallel'] == 5 and plan['laneOrder'] == ['bounds-fix']
          assert len(plan['cases']) == 9 and plan['expectedRoutableNetsTotal'] == 2735
          assert {(row['board'], row['cohort']) for row in plan['cases']} == {('h616', 'original')} | {(board, cohort) for board in ['butterstick', 'glider', 'imx6', 'icepi'] for cohort in ['original', 'spaced']}
          assert plan['cohortOrder'] == ['original', 'spaced']
          PY
      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis
      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance
      - name: Checkout published Tiny source
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tiny-hypergraph
          ref: f1fe8edcfb3dfde8fd644d09d81bad18743144b3
          path: .full-board-run/source-tiny
          persist-credentials: false
          sparse-checkout: lib
      - name: Checkout published autorouter source
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: a4f2778cb40bbc9c147b95a4e48ef0b32f1dd08f
          path: .full-board-run/source-autorouter
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/
            lib/solvers/PortPointPathingSolver/tinyhypergraph/TinyHypergraphPortPointPathingSolver.ts
            lib/types/capacity-mesh-types.ts
            package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare the unchanged published runtime and native cases
        run: |
          python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"
          bun experiments/full-board-ten/prepare-cases.ts \
            "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis" \
            "$FULL_BOARD_ROOT/sources/spaced" "$FULL_BOARD_ROOT/cases" "$BOARD"
      - name: Authenticate the published graph and activate the source once
        id: activate_original
        run: |
          python3 experiments/full-board-ten/prepare-via-site-bounds.py "$FULL_BOARD_ROOT" baseline "$BOARD" original
          python3 experiments/full-board-ten/prepare-via-site-bounds.py "$FULL_BOARD_ROOT" source "$BOARD" original
          python3 experiments/full-board-ten/prepare-via-site-bounds.py "$FULL_BOARD_ROOT" candidate "$BOARD" original
      - name: Preserve the frozen comparison identities
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os, shutil
          from pathlib import Path
          controller = Path('experiments/full-board-ten')
          plan = json.loads((controller / 'via-site-bounds-plan.json').read_text())
          lane = plan['lanes']['bounds-fix']
          target = Path(os.environ['FULL_BOARD_ROOT']) / 'via-site-bounds/controller'
          target.mkdir(parents=True, exist_ok=True)
          for name in ['via-site-bounds-plan.json', lane['sourceMappingFile'], plan['pairedByteProofFile'], 'release.json', 'source-provenance.json', 'harness-provenance.json', 'baseline-run-plan.json', 'published-baseline-controller-handoff.json']:
            (target / name).parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(controller / name, target / name)
          PYTHON
      - name: Run the original native circuit and published physical assessment
        id: original
        if: ${{ !cancelled() && steps.activate_original.outcome == 'success' }}
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/lanes/candidate/cases/$BOARD-original.json"
          "$FULL_BOARD_ROOT/results/bounds-fix/$BOARD/original"
      - name: Preserve original geometry and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: via-site-bounds-bounds-fix-${{ matrix.board }}-original-case-${{ github.run_attempt }}
          path: .full-board-run/results/bounds-fix/${{ matrix.board }}/original
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve original runtime, source and restoration proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: via-site-bounds-bounds-fix-${{ matrix.board }}-original-summary-${{ github.run_attempt }}
          path: |
            .full-board-run/runtime-manifest.json
            .full-board-run/published-runtime-manifest.json
            .full-board-run/candidate-runtime-manifest.json
            .full-board-run/via-site-bounds/*.json
            .full-board-run/via-site-bounds/runtime-guard.json.gz
            .full-board-run/via-site-bounds/controller
            .full-board-run/lanes/candidate/cases/${{ matrix.board }}-original.json
            .full-board-run/cases/assessment-helper-proof.json
          retention-days: 7
          if-no-files-found: warn
      - name: Reactivate the verified overlay for the spaced circuit
        id: activate_spaced
        if: ${{ !cancelled() && matrix.board != 'h616' && steps.activate_original.outcome == 'success' }}
        run: python3 experiments/full-board-ten/prepare-via-site-bounds.py "$FULL_BOARD_ROOT" candidate "$BOARD" spaced
      - name: Run the spaced native circuit and published physical assessment
        id: spaced
        if: ${{ !cancelled() && steps.activate_spaced.outcome == 'success' }}
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/lanes/candidate/cases/$BOARD-spaced.json"
          "$FULL_BOARD_ROOT/results/bounds-fix/$BOARD/spaced"
      - name: Preserve spaced geometry and diagnostics
        if: ${{ always() && matrix.board != 'h616' }}
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: via-site-bounds-bounds-fix-${{ matrix.board }}-spaced-case-${{ github.run_attempt }}
          path: .full-board-run/results/bounds-fix/${{ matrix.board }}/spaced
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve spaced runtime, source and restoration proofs
        if: ${{ always() && matrix.board != 'h616' }}
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: via-site-bounds-bounds-fix-${{ matrix.board }}-spaced-summary-${{ github.run_attempt }}
          path: |
            .full-board-run/runtime-manifest.json
            .full-board-run/published-runtime-manifest.json
            .full-board-run/candidate-runtime-manifest.json
            .full-board-run/via-site-bounds/*.json
            .full-board-run/via-site-bounds/runtime-guard.json.gz
            .full-board-run/via-site-bounds/controller
            .full-board-run/lanes/candidate/cases/${{ matrix.board }}-spaced.json
            .full-board-run/cases/assessment-helper-proof.json
          retention-days: 7
          if-no-files-found: warn
