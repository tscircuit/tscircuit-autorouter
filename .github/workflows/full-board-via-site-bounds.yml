name: Published3243 paired H616 via-site bounds comparison
on:
  push:
    branches: [bench/h616-via-site-bounds-3243-20261119]
permissions:
  contents: read
jobs:
  route:
    name: ${{ matrix.lane }} (${{ matrix.board }}, ${{ matrix.cohort }})
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { lane: feature-base, board: h616, cohort: spaced }
          - { lane: bounds-fix, board: h616, cohort: spaced }
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: published
      FULL_BOARD_CANDIDATE_LANE: ${{ matrix.lane }}
      FULL_BOARD_COHORTS: ${{ matrix.cohort }}
      BOARD: ${{ matrix.board }}
      COHORT: ${{ matrix.cohort }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            .github/workflows/full-board-via-site-bounds.yml
            AGENTS.md
      - name: Require the reviewed H616 spaced plan
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('experiments/full-board-ten/via-site-bounds-plan.json').read_text())
          assert plan['qualificationReady'] is True, 'HELD: H616 candidate run is not released'
          assert plan['jobs'] == 2 and plan['maxParallel'] == 2 and plan['laneOrder'] == ['feature-base', 'bounds-fix']
          assert plan['cases'] == [{'board': 'h616', 'cohort': 'spaced', 'expectedRoutableNets': 121}]
          PY
      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis
      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance
      - name: Checkout published Tiny source
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tiny-hypergraph
          ref: f1fe8edcfb3dfde8fd644d09d81bad18743144b3
          path: .full-board-run/source-tiny
          persist-credentials: false
          sparse-checkout: lib
      - name: Checkout published autorouter source
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: a4f2778cb40bbc9c147b95a4e48ef0b32f1dd08f
          path: .full-board-run/source-autorouter
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/
            lib/solvers/PortPointPathingSolver/tinyhypergraph/TinyHypergraphPortPointPathingSolver.ts
            lib/types/capacity-mesh-types.ts
            package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare the unchanged published runtime and native cases
        run: |
          python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"
          bun experiments/full-board-ten/prepare-cases.ts \
            "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis" \
            "$FULL_BOARD_ROOT/sources/spaced" "$FULL_BOARD_ROOT/cases" "$BOARD"
      - name: Authenticate the published graph and activate only the reviewed source
        run: |
          python3 experiments/full-board-ten/prepare-via-site-bounds.py "$FULL_BOARD_ROOT" baseline "$BOARD" "$COHORT"
          python3 experiments/full-board-ten/prepare-via-site-bounds.py "$FULL_BOARD_ROOT" source "$BOARD" "$COHORT"
          python3 experiments/full-board-ten/prepare-via-site-bounds.py "$FULL_BOARD_ROOT" candidate "$BOARD" "$COHORT"
      - name: Run the full native circuit and published physical assessment
        id: route
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/lanes/candidate/cases/$BOARD-$COHORT.json"
          "$FULL_BOARD_ROOT/results/$FULL_BOARD_CANDIDATE_LANE/$BOARD/$COHORT"
      - name: Preserve case geometry and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: via-site-bounds-${{ matrix.lane }}-${{ matrix.board }}-${{ matrix.cohort }}-case-${{ github.run_attempt }}
          path: .full-board-run/results/${{ matrix.lane }}/${{ matrix.board }}/${{ matrix.cohort }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve the frozen comparison identities
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          controller = Path('experiments/full-board-ten')
          plan = json.loads((controller / 'via-site-bounds-plan.json').read_text())
          lane = plan['lanes'][os.environ['FULL_BOARD_CANDIDATE_LANE']]
          target = Path(os.environ['FULL_BOARD_ROOT']) / 'via-site-bounds/controller'
          target.mkdir(parents=True, exist_ok=True)
          for name in ['via-site-bounds-plan.json', lane['sourceMappingFile'], plan['pairedByteProofFile'], 'release.json', 'source-provenance.json', 'harness-provenance.json', 'baseline-run-plan.json', 'published-baseline-controller-handoff.json']:
            (target / name).parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(controller / name, target / name)
          PY
      - name: Preserve runtime, source and restoration proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: via-site-bounds-${{ matrix.lane }}-${{ matrix.board }}-${{ matrix.cohort }}-summary-${{ github.run_attempt }}
          path: |
            .full-board-run/runtime-manifest.json
            .full-board-run/published-runtime-manifest.json
            .full-board-run/candidate-runtime-manifest.json
            .full-board-run/via-site-bounds/*.json
            .full-board-run/via-site-bounds/runtime-guard.json.gz
            .full-board-run/via-site-bounds/controller
            .full-board-run/lanes/candidate/cases/${{ matrix.board }}-${{ matrix.cohort }}.json
            .full-board-run/cases/assessment-helper-proof.json
          retention-days: 7
          if-no-files-found: warn
