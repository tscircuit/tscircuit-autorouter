name: Compare start-via fix on all six boards and dataset18
on:
  push:
    branches: [codex/start-via-paired-20261116]
permissions:
  contents: read
jobs:
  boards:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f2c9fdc76996abd6c9b059cdf2b61d3e037dfd6c
          path: base
      - uses: actions/checkout@v4
        with:
          ref: 67ca09859671218dd24a714d355b2df81f3d6348
          path: fixed
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 2f7db1dee7cf872cbe2b358ae00fa8f841501610
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install each router with its pinned simplifier
        run: |
          for folder in base fixed core; do (cd "$folder" && bun install --ignore-scripts); done
          cd experiments/full-board-priority-analysis
          bun install --frozen-lockfile --ignore-scripts
          bun build-core.ts ../../core
      - name: Compare original DDR controls and both full-board modes
        env:
          BOARD_ID: ${{ matrix.board }}
          FULL_BOARD_CASE_IDS: ${{ matrix.board }}
        working-directory: experiments/full-board-priority-analysis
        run: |
          for variant in base fixed; do
            export FULL_BOARD_CORE_SOURCE="$GITHUB_WORKSPACE/core"
            export FULL_BOARD_ROUTER_MODULE="$GITHUB_WORKSPACE/$variant/lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts"
            export FULL_BOARD_ROUTER_COMMIT="$(git -C "../../$variant" rev-parse HEAD)"
            BUN_OPTIONS="--preload=$PWD/select-ddr-router.mjs" bun "$GITHUB_WORKSPACE/core/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" \
              --core "$GITHUB_WORKSPACE/core" --circuit "$BOARD_ID" \
              --out "$GITHUB_WORKSPACE/results/$variant/ddr" --timeout 600
            FULL_BOARD_VARIANT="$variant" bun plane-suite.ts "../../results/$variant/full"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-via-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export compact review evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, io, zipfile
          from pathlib import Path
          stream = io.BytesIO()
          names = {'environment.json', 'summary.json', 'progress.json', 'assessment.json', 'diagnostics.json', 'process.json', 'results.json', 'pcb.svg'}
          with zipfile.ZipFile(stream, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file() and path.name in names:
                      archive.writestr(str(path.relative_to('results')), path.read_bytes())
          print('PAIRED_BOARD_EVIDENCE_BEGIN')
          encoded = base64.b64encode(stream.getvalue()).decode()
          for offset in range(0, len(encoded), 8000): print(encoded[offset:offset + 8000])
          print('PAIRED_BOARD_EVIDENCE_END')
          PY
  dataset18:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f2c9fdc76996abd6c9b059cdf2b61d3e037dfd6c
          path: base
      - uses: actions/checkout@v4
        with:
          ref: 67ca09859671218dd24a714d355b2df81f3d6348
          path: fixed
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install both pinned routers
        run: |
          for folder in base fixed; do (cd "$folder" && bun install --ignore-scripts); done
      - name: Compare all dataset18 samples
        env:
          BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: '240000'
        run: |
          for variant in base fixed; do
            (cd "$variant" && bash ./benchmark.sh --pipeline 9 --dataset 18 --concurrency 2 --sample-timeout 240s)
            mkdir -p "results/$variant"
            cp "$variant/benchmark-result.json" "$variant/benchmark-result.txt" "$variant/benchmark-snapshots.html" "results/$variant/"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-via-dataset18
          path: results
          retention-days: 14
      - name: Export dataset18 results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('results').rglob('benchmark-result.json'):
              print('DATASET18_RESULT', path.parent.name, json.dumps(json.loads(path.read_text()),separators=(',',':')))
          PY
