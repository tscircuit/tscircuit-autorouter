name: Original-owner feedback full42 native/original/optimized126 experiment

on:
  push:
    branches: [codex/owner-feedback-fast126-controller-20261030]
    paths: [scripts/experiment-audit/owner-feedback-fast126-20261030.json]

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all reviewed immutable sources and plan fresh characterization
        id: plan
        run: python3 scripts/experiment-audit/run-owner-feedback-fast126.py --mode plan
  experiment:
    needs: plan
    name: owner-feedback-fast126-shard / ${{ matrix.dataset }} / ${{ matrix.shard }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BENCHMARK_HEARTBEAT_INTERVAL_MS: '30000'
      BENCHMARK_TERMINATE_TIMEOUT_MS: '1000'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Select exact three sources
        id: refs
        run: python3 controller/scripts/experiment-audit/run-owner-feedback-fast126.py --mode select --dataset '${{ matrix.dataset }}' --shard '${{ matrix.shard }}'
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.harness_sha }}
          path: pinned-main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.native_sha }}
          path: native
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.fast_sha }}
          path: fast
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.original_sha }}
          path: original
          persist-credentials: false
      - name: Verify source trees and unchanged current-main validators
        run: python3 controller/scripts/experiment-audit/run-owner-feedback-fast126.py --mode verify-checkouts --dataset '${{ matrix.dataset }}' --shard '${{ matrix.shard }}' --native native --original original --fast fast
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install fresh native dependencies with provenance
        run: python3 controller/scripts/experiment-audit/install-pinned-dependencies.py native
      - name: Install fresh fast dependencies with provenance
        run: python3 controller/scripts/experiment-audit/install-pinned-dependencies.py fast
      - name: Install fresh original dependencies with provenance
        run: python3 controller/scripts/experiment-audit/install-pinned-dependencies.py original
      - name: Verify complete installed pinned dependency source bytes
        run: python3 controller/scripts/experiment-audit/run-owner-feedback-fast126.py --mode verify-dependencies --dataset '${{ matrix.dataset }}' --shard '${{ matrix.shard }}' --native native --original original --fast fast
      - name: Build native
        working-directory: native
        run: bun run build
      - name: Build fast
        working-directory: fast
        run: bun run build
      - name: Build original
        working-directory: original
        run: bun run build
      - name: Prepare identical current-main harness and bounded observer
        run: |
          python3 controller/scripts/experiment-audit/prepare-pinned-harness.py --controller pinned-main --target native --expected-sha '${{ steps.refs.outputs.native_sha }}'
          python3 controller/scripts/experiment-audit/prepare-pinned-harness.py --controller pinned-main --target fast --expected-sha '${{ steps.refs.outputs.fast_sha }}'
          python3 controller/scripts/experiment-audit/prepare-pinned-harness.py --controller pinned-main --target original --expected-sha '${{ steps.refs.outputs.original_sha }}'
      - name: Run every prospectively ordered original case triplet in this exact shard
        run: python3 controller/scripts/experiment-audit/run-owner-feedback-fast126.py --mode run --dataset '${{ matrix.dataset }}' --shard '${{ matrix.shard }}' --native native --original original --fast fast --output 'results/owner-feedback-fast126-${{ matrix.dataset }}-shard${{ matrix.shard }}'
      - name: Retain compact all-record metrics, aggregates and qualification provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-feedback-fast126-metrics-owner-feedback-fast126-${{ matrix.dataset }}-shard${{ matrix.shard }}
          path: |
            results/*/results.jsonl
            results/*/summary.json
            results/*/provenance.json
            results/*/sample-*/config-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain exact inputs, output copper, checks, stage evidence and failures separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-feedback-fast126-raw-owner-feedback-fast126-${{ matrix.dataset }}-shard${{ matrix.shard }}
          path: results
          if-no-files-found: warn
          retention-days: 30

  carrier_plan:
    needs: [plan, experiment]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parts.outputs.matrix }}
      count: ${{ steps.parts.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Plan every original raw ZIP segment from authenticated artifact metadata
        id: parts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/experiment-audit/owner-feedback-fast126-artifact-carrier.py plan --manifest scripts/experiment-audit/owner-feedback-fast126-20261030.json --run-id '${{ github.run_id }}' --controller-sha '${{ github.sha }}'
  artifact_carrier:
    needs: carrier_plan
    if: always() && needs.carrier_plan.result == 'success' && needs.carrier_plan.outputs.count != '0'
    name: owner-feedback-fast126-artifact-carrier / ${{ matrix.artifact_id }} / ${{ matrix.part_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.carrier_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain one exact bounded original server ZIP segment in authenticated logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARRIER_SPEC_JSON: ${{ toJSON(matrix) }}
        run: python3 scripts/experiment-audit/owner-feedback-fast126-artifact-carrier.py carry --repository tscircuit/tscircuit-autorouter
