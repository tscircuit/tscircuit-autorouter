name: Game Boy platform diagnostic

on:
  push:
    branches: [codex/debug-gameboy-platform-divergence]

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - uses: actions/download-artifact@v4
        with:
          name: gameboy-force-improve-linux-reference
          run-id: 36230639068
          github-token: ${{ github.token }}
          path: force-improve-input
      - name: Record unchanged math calls for the first differing node
        run: bun scripts/diagnose-gameboy-force-improve.ts force-improve-input/selected-stage-input.json.gz math-output force-improve-input/node-results.json.gz 414
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-force-improve-linux-math
          path: math-output/
  compare-macos:
    needs: capture
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - uses: actions/download-artifact@v4
        with:
          name: gameboy-force-improve-linux-reference
          run-id: 36230639068
          github-token: ${{ github.token }}
          path: force-improve-input
      - uses: actions/download-artifact@v4
        with:
          name: gameboy-force-improve-linux-math
          path: math-input
      - name: Stop at the first differing math call
        run: bun scripts/diagnose-gameboy-force-improve.ts force-improve-input/selected-stage-input.json.gz math-output force-improve-input/node-results.json.gz 414 math-input/math-calls.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-force-improve-macos-math-difference
          path: math-output/
