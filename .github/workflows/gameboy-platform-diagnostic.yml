name: Game Boy platform diagnostic

on:
  push:
    branches: [codex/debug-gameboy-platform-divergence]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - name: Compare phase inputs and stop at the first difference
        run: bun scripts/diagnose-gameboy-platform.ts platform-diagnostic scripts/gameboy-macos-phase-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-linux-first-difference
          path: platform-diagnostic/
