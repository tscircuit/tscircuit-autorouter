name: Verify port cost snapshots
on:
  workflow_dispatch:
  push:
    branches: [verify/port-cost-snapshots-20261119]
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - pipeline9-h616-preload-reachability
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3f5806dc9868299fe976f245f0ab8e8a21d5a4c1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - if: matrix.test == 'pipeline9-orangecrab-via-roundoff'
        run: bun install --ignore-scripts --cwd tests/repro/orangecrab-via-roundoff
      - name: Update only this failing test's snapshots and run its remaining assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test tests/repro/${{ matrix.test }}.test.ts --timeout 600000
      - name: Collect changed snapshots
        if: always()
        run: |
          mkdir -p reviewed-snapshots
          git diff --name-only -- '*.snap.svg' | while IFS= read -r file; do
            cp --parents "$file" reviewed-snapshots/
          done
          git rev-parse HEAD > reviewed-snapshots/source-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-cost-${{ matrix.test }}
          path: reviewed-snapshots
          retention-days: 7
