name: Measure unrotated obstacle clearance fast path on fanout 99
on:
  push:
    branches: [analysis/e2e-zero-rotation-2450]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: [icepi-original, butterstick-original, imx6-original, imx6-spaced]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pinned native routing dependencies
        run: |
          mkdir -p core/replay
          cat > core/package.json <<'JSON'
          {"name":"fanout-current-capture-replay","private":true,"type":"module","dependencies":{"@tscircuit/fanout-solver":"0.0.99","@tscircuit/capacity-autorouter":"0.0.1147","@tscircuit/checks":"0.0.282","graphics-debug":"0.0.99"}}
          JSON
          cd core
          bun install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          run-id: 44943960114
          name: full-circuit-interception-${{ matrix.sample }}
          path: captures
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay identical fanout inputs and compare all copper and search histories
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          cp core/node_modules/@tscircuit/fanout-solver/lib/route-bus/plan-copper.ts core/replay/original-copper.txt
          cp core/node_modules/@tscircuit/fanout-solver/lib/route-bus/plan-mutual-clearance.ts core/replay/original-mutual.txt
          cp core/node_modules/@tscircuit/fanout-solver/lib/route-bus/plan-static-clearance.ts core/replay/original-static.txt
          cp core/node_modules/@tscircuit/fanout-solver/lib/geometry.ts core/replay/original-geometry.txt
          cat > core/replay/run.ts <<'TS'
          import { readFileSync, writeFileSync } from "node:fs"
          import { gunzipSync } from "node:zlib"
          const mode = process.argv[2]
          const root = "../node_modules/@tscircuit/fanout-solver/lib/route-bus/"
          let copper = readFileSync("original-copper.txt", "utf8")
          let mutual = readFileSync("original-mutual.txt", "utf8")
          let statics = readFileSync("original-static.txt", "utf8")
          let geometry = readFileSync("original-geometry.txt", "utf8")
          function replaceUnique(source: string, marker: string, replacement: string): string {
            if (source.split(marker).length !== 2) throw new Error("Patch marker changed: " + marker)
            return source.replace(marker, replacement)
          }
          if (mode === "arrays") {
            copper = replaceUnique(copper,
              "  return [\n    plan.via,\n    ...(plan.additionalVias ?? []),\n    plan.planeEndpointVia,\n  ].filter((via): via is NonNullable<FanoutRoutePlan[\"via\"]> => Boolean(via))",
              "  const vias: NonNullable<FanoutRoutePlan[\"via\"]>[] = []\n  if (plan.via) vias.push(plan.via)\n  if (plan.additionalVias) vias.push(...plan.additionalVias)\n  if (plan.planeEndpointVia) vias.push(plan.planeEndpointVia)\n  return vias")
          }
          if (mode === "via_bounds") {
            mutual = replaceUnique(mutual, "      for (const otherVia of otherVias) {\n        if (\n          planVia.spanLayers.some", "      for (const otherVia of otherVias) {\n        const requiredDistance = (planVia.diameter + otherVia.diameter) / 2 + clearance\n        if (\n          Math.abs(planVia.center.x - otherVia.center.x) <= requiredDistance + 1e-9 &&\n          Math.abs(planVia.center.y - otherVia.center.y) <= requiredDistance + 1e-9 &&\n          planVia.spanLayers.some")
          }
          if (mode === "pad_bounds") {
            const marker = "      if (\n        allowSameNetMerges &&\n        obstacleSharesElectricalNet(srj, obstacle, plan.connectionName)\n      )"
            statics = replaceUnique(statics, marker,
              "      const obstacleRadiusBound = (Math.abs(obstacle.width) + Math.abs(obstacle.height)) / 2\n      const broadPhaseDistance = obstacleRadiusBound + via.diameter / 2 + clearance + 1e-9\n      if (\n        Math.abs(via.center.x - obstacle.center.x) > broadPhaseDistance ||\n        Math.abs(via.center.y - obstacle.center.y) > broadPhaseDistance\n      ) {\n        continue\n      }\n" + marker)
          }
          if (mode === "zero_rotation") {
            geometry = replaceUnique(geometry,
              "  return {\n    x: dx * Math.cos(rotationRadians)",
              "  if (rotationRadians === 0) return { x: dx, y: dy }\n  return {\n    x: dx * Math.cos(rotationRadians)")
          }
          writeFileSync(root + "../geometry.ts", geometry)
          writeFileSync(root + "plan-copper.ts", copper)
          writeFileSync(root + "plan-mutual-clearance.ts", mutual)
          writeFileSync(root + "plan-static-clearance.ts", statics)
          const { FanoutSolver } = await import("../node_modules/@tscircuit/fanout-solver/lib/fanout-solver")
          const { validateRoutedCopperDrc } = await import("../node_modules/@tscircuit/fanout-solver/lib/validate-routed-copper-drc")
          const sample = process.env.SAMPLE
          const folder = "../../captures/" + sample
          const report = JSON.parse(readFileSync(folder + "/report.json", "utf8"))
          const record = report.solvers.find((entry) => entry.name === "FanoutSolver")
          const [input, options] = JSON.parse(gunzipSync(readFileSync(folder + "/solver-" + record.id + "-input.json.gz")).toString())
          const solver = new FanoutSolver(input, options)
          const start = performance.now()
          solver.solve()
          const best = Reflect.get(solver, "bestAttempt")
          const output = best.outputSrj
          const elapsedMs = performance.now() - start
          const drc = validateRoutedCopperDrc({ inputSrj: input, routedSrj: output, clearance: solver.config.clearance, allowBlindAndBuriedVias: solver.config.allowBlindAndBuriedVias })
          if (!drc.valid) throw new Error("Native DRC failed")
          const summary = { sample, mode, elapsedMs, escapes: best.plans.length, vias: drc.checkedViaCount, assignments: solver.attempts.length,
            copperSha256: new Bun.CryptoHasher("sha256").update(copper).digest("hex"),
            mutualSha256: new Bun.CryptoHasher("sha256").update(mutual).digest("hex"),
            staticSha256: new Bun.CryptoHasher("sha256").update(statics).digest("hex"), geometrySha256: new Bun.CryptoHasher("sha256").update(geometry).digest("hex"), fanoutVersion: "0.0.99" }
          writeFileSync(mode + ".json", JSON.stringify({ summary, plans: best.plans, output, attempts: solver.attempts }))
          console.log("CLEARANCE_CANDIDATE_RESULT", JSON.stringify(summary))
          
          TS
          cd core/replay
          bun run.ts before
          bun run.ts zero_rotation
          bun run.ts before_repeat
          python3 - <<'PY'
          import json
          modes=['before','zero_rotation','before_repeat']
          captures=[json.load(open(mode+'.json')) for mode in modes]
          for entry in captures[1:]:
              for field in ['plans','output','attempts']:assert entry[field]==captures[0][field],field+entry['summary']['mode']
          print('CLEARANCE_CANDIDATE_IDENTICAL',json.dumps([entry['summary'] for entry in captures]))
          PY
