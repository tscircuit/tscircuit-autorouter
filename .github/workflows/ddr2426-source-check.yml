name: Validate native obstacle repro and pruning fix
on:
  push:
    branches: [codex/ddr2426-source-check]
permissions:
  contents: read
  actions: read
jobs:
  source-check:
    strategy:
      fail-fast: false
      matrix:
        revision: [35a7e958edfdacad390e223887e895f49035740b, 679665624f0371d86ca39937eb2ab4af01ca32a3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - if: always()
        run: bun run typecheck
      - if: always()
        run: bun test --timeout 9999999 tests/native-segment-obstacle-broadphase.test.ts tests/segment-obstacle-broadphase-geometry.test.ts tests/near-segment-obstacle-clearance.test.ts tests/native-plane-static-rejections.test.ts tests/plane-endpoint-cache-alternatives.test.ts
