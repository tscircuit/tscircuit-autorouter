name: GBA Through-Via Repro

on:
  pull_request:
    paths:
      - .github/workflows/gba-through-via-repro.yml
      - fixtures/bug-reports/gba-through-via-physical-layers/**
      - tests/bugs/gba-through-via-physical-layers.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gba-through-via-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Route the captured full board and check physical through vias
        env:
          RUN_GBA_THROUGH_VIA_REPRO: "1"
        run: bun test tests/bugs/gba-through-via-physical-layers.test.ts --timeout 3600000
      - name: Upload actual routing stages and clearance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gba-through-via-physical-layers
          path: dist/gba-through-via-physical-layers
          if-no-files-found: warn
