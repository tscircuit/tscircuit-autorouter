name: Crossing mask routing experiment
on:
  push:
    branches: [codex/shared-queue-crossing-masks]
    paths:
      - .github/workflows/crossing-mask-experiment.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bunx tsc --noEmit
      - name: Exact crossing and prepared routing tests
        working-directory: node_modules/tiny-hypergraph
        run: bun test tests/region-crossing-masks.test.ts tests/solver/prepared-routing-order.test.ts tests/solver/prepared-routing-workers.test.ts tests/owned-regional-hop-frontier-parity.test.ts --timeout 9999999
      - run: bun test tests/solvers/prepared-routing-workers.test.ts tests/features/pipeline9-srj18-sample01-thread-parity.test.ts --timeout 9999999
  benchmark:
    needs: validate
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bash benchmark.sh --dataset 18 --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossing-mask-result
          path: |
            benchmark-result.json
            benchmark-result.txt
