name: Verify identical full-circuit inputs and physical copper in every capture
on:
  push:
    branches: [analysis/e2e-plane-replay-validation-20261121]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Wait for every candidate capture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch 44842738664 -R tscircuit/tscircuit-autorouter 
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 2445fddec65cd26589533741465ac22639935929
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: cd core && bun install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          run-id: 44836464072
          pattern: full-circuit-interception-*
          path: core/e2e-runtime/before
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44842738664
          pattern: full-circuit-interception-*
          path: core/e2e-runtime/after
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check original pads and exact captured fanout inputs
        run: |
          cp experiments/e2e-samples-20261120/check-plane-replay-results.ts experiments/e2e-samples-20261120/inputs.json core/e2e-runtime/
          cd core/e2e-runtime
          bun check-plane-replay-results.ts "$GITHUB_WORKSPACE/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plane-replay-physical-results
          path: results
      - name: Export machine-readable findings
        if: always()
        run: |
          python3 - <<'PY'
          import base64,gzip,io,zipfile
          from pathlib import Path
          p=Path('results/plane-replay-final-statistics.json')
          if p.exists():
              print('PLANE_REPLAY_RESULTS_BEGIN')
              encoded=base64.b64encode(gzip.compress(p.read_bytes(),mtime=0)).decode()
              for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
              print('PLANE_REPLAY_RESULTS_END')
          buffer=io.BytesIO()
          with zipfile.ZipFile(buffer,'w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('results').glob('*.svg'):z.writestr(p.name,p.read_bytes())
          print('PLANE_REPLAY_SVGS_BEGIN')
          encoded=base64.b64encode(buffer.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('PLANE_REPLAY_SVGS_END')
          PY
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 893e51d92306eb5a8f669105f1cbe9b8d87f50f3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test tests/repro-duplicate-fanout-connection-orders.test.ts --timeout 9999999
