name: Verify native A13 pad clearance
on:
  push:
    branches: [analysis/ddr-3235-pad-stages]
    paths: [.github/workflows/inspect-ddr-pad-stages.yml]
permissions:
  contents: read
jobs:
  verify:
    name: A13 source ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: base, ref: 2e639aa4fc3026c4ac83f705318e92012f66bfbd}
          - {label: head, ref: b63412bd4d722e3b9d8e6444763c4cbb2d52dddb}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install declared dependencies
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("package.json")
          m=json.loads(p.read_text())
          m["overrides"]={**m.get("overrides",{}),"csstype":"3.1.3"}
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install
      - name: Inspect completed routing stages
        env:
          LABEL: ${{ matrix.label }}
        run: |
          cat > inspect-pad-stages.private.ts <<'TS'
          import {readFileSync} from "node:fs"
          import {gunzipSync} from "node:zlib"
          import {AutoroutingPipelineSolver9_PreloadedTraceGraph} from "./lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph"
          import {evaluateRelaxedDrc} from "./lib/testing/evaluate-relaxed-drc"
          const input=JSON.parse(gunzipSync(readFileSync("tests/fixtures/assets/a13-fixed-copper/remaining64.srj.json.gz")).toString())
          const solver=new AutoroutingPipelineSolver9_PreloadedTraceGraph(input,{cacheProvider:null})
          let phase=solver.getCurrentPhase()
          while(!solver.solved&&!solver.failed) {
           solver.step()
           const next=solver.getCurrentPhase()
           if(next===phase)continue
           if(solver.highDensityStitchSolver?.solved) {
            const traces=solver.getOutputSimplifiedPcbTraces()
            const result=evaluateRelaxedDrc({inputSrj:input,srjWithPointPairs:solver.srjWithPointPairs!,routedTraces:traces,drcOptions:{traceClearance:input.minTraceToPadEdgeClearance}})
            const counts={}
            for(const error of result.errorsWithCenters) {
             let key=error.type
             if(error.type==="pcb_trace_error"&&/gap: /.test(error.message))key="trace_gap"
             counts[key]=(counts[key]??0)+1
            }
            console.log("PAD_STAGE_METRICS="+JSON.stringify({release:process.env.LABEL,stage:phase,traces:traces.length,counts}))
           }
           phase=next
          }
          console.log("PAD_STAGE_SOLVED="+JSON.stringify({release:process.env.LABEL,solved:solver.solved,failed:solver.failed}))
                    TS
          bun inspect-pad-stages.private.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-a13-pad-${{ matrix.label }}
          path: tests/repro/__snapshots__/pipeline9-a13-*.snap.svg
