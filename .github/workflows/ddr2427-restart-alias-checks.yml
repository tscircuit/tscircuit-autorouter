name: Check the minimal restart stack
on:
  push:
    branches: [codex/ddr2427-restart-alias-final]
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        revision:
          - a0e49159c220e0ce93a0a51ad7247571b122f29d
          - 883e1f4c9de615fc46384d7c6b864d50611df5c1
          - 0afb7d56c4c55aa88bd4f9c9021f0474611aada8
          - 775d78c5fac6c84f97e8674f48b2642f75b1d1dc
          - 0f04f023a159bdb9835024f8265dcc5d00031758
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - if: always()
        run: bun run typecheck
