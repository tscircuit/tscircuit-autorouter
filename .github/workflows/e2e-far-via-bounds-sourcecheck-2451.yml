name: Check far-via bounds source
on:
  push:
    branches: [analysis/e2e-far-via-bounds-sourcecheck-2451]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: e676a568f91156a0afba3c24f6f4f7df19a55c1c
          path: fanout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install exact repository lockfile
        working-directory: fanout
        run: bun install --frozen-lockfile
      - name: Run repository typecheck
        working-directory: fanout
        run: bun run typecheck
      - name: Check repository formatting without changes
        working-directory: fanout
        run: bun run format:check
