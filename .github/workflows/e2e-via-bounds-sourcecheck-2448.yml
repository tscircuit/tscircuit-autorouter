name: Check via clearance bounds fix source
on:
  push:
    branches: [analysis/e2e-via-bounds-sourcecheck-2448]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 356e6a2c349b6af30ff7f6f813094daa4557c1e6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
