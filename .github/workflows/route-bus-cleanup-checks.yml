name: Route bus cleanup checks
on:
  push:
    branches: [codex/route-bus-cleanup-checks]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: refactor/route-bus-modules
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Format extracted modules with the repository formatter
        run: bunx biome format --write lib/route-bus.ts lib/route-bus
      - name: Export the formatting patch
        run: |
          git diff > /tmp/route-bus-format.patch
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          encoded=base64.b64encode(gzip.compress(Path('/tmp/route-bus-format.patch').read_bytes(),mtime=0)).decode()
          print('ROUTE_BUS_FORMAT_BEGIN')
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('ROUTE_BUS_FORMAT_END')
          PY
      - run: bun run typecheck
  guard:
    strategy:
      fail-fast: false
      matrix:
        revision: [693c4b54a5b369d6774bb6f82487cfe25730adf1, refactor/route-bus-modules]
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: ./benchmark.sh --dataset dataset31 --concurrency 16 --sample-timeout-seconds 120 --output-directory benchmark-results
      - name: Export results and hashes
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          report=Path('benchmark-results/benchmark.json')
          if report.exists():print('FANOUT31_REPORT',report.read_text().replace('\n',''))
          for pattern,label in [('inputs/*.json','INPUT'),('*.svg','SVG')]:
              hashes={str(path.relative_to('benchmark-results')):hashlib.sha256(path.read_bytes()).hexdigest() for path in Path('benchmark-results').glob(pattern)}
              print('FANOUT31_'+label+'_HASHES',json.dumps(hashes,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-${{ strategy.job-index }}
          path: benchmark-results
