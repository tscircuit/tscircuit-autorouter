name: Publish verified native full-circuit plane recovery evidence
on:
  push:
    branches: [analysis/publish-shared-plane-2458]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Wait for exact audited runs and native checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for spec in tscircuit/tscircuit-autorouter:45014350188 tscircuit/fanout-solver:45013663016 tscircuit/fanout-solver:45013936224; do
            repo=${spec%:*}
            run=${spec##*:}
            for attempt in $(seq 1 100); do
              status=$(gh api repos/$repo/actions/runs/$run --jq .status)
              if [ "$status" = completed ]; then break; fi
              sleep 15
            done
            test "$(gh api repos/$repo/actions/runs/$run --jq .conclusion)" = success
          done
      - uses: actions/download-artifact@v4
        with:
          run-id: 45014350188
          name: shared-plane-completion-audit
          path: audited-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          ref: analysis/e2e-full-circuit-interception-results-20261120
          path: report
      - name: Publish measured analysis and complete PCB SVG artifacts
        run: python3 harness/experiments/e2e-samples-20261120/publish-shared-plane-report.py
