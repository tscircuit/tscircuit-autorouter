name: Update verified native cleanup snapshot
on:
  push:
    branches: [analysis/native-copper-snapshot-update]
    paths: [.github/workflows/native-copper-snapshot-update.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a3b9a25a6e2c6ac07a869af951a91ef20ed6962
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Update the existing public regression only after its geometry assertions pass
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: |
          test "$(git hash-object tests/fixtures/orangecrab-native-fixed-traces.srj.json)" = "39a22700f4d09732a5f6448f4df1a8e3e248ca8f"
          bun test --timeout 9999999 tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
          python - <<'PY'
          import re
          from pathlib import Path
          svg = Path('tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg').read_text()
          count = int(re.search(r'Relaxed DRC errors: (\d+)', svg).group(1))
          print(f'ORANGE_CI_DRC_ERRORS={count}')
          assert count == 0
          PY
      - name: Save only the verified expected SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg
          git diff --cached --stat
          git commit -m "Update the CI OrangeCrab routing snapshot for native cleanup"
          git push origin HEAD:refs/heads/analysis/native-copper-orange-snapshot
