name: Port-point Node worker CPU profiles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install
      - run: bun scripts/build-solver-workers.ts
      - run: bun build scripts/benchmark/port-point-worker-profile.ts --target node --external dataset-srj18 --outfile worker-profile.mjs
      - name: Profile the same route kernel in Node workers
        run: |
          mkdir -p worker-profiles
          bun -e 'import source from "./lib/runtime/generated/nodeWorkerSource.ts"; await Bun.write("worker-profiles/worker-source.cjs", source)'
          node --cpu-prof --cpu-prof-dir=worker-profiles worker-profile.mjs 6 1
          node --cpu-prof --cpu-prof-dir=worker-profiles worker-profile.mjs 6 4
          node --cpu-prof --cpu-prof-dir=worker-profiles worker-profile.mjs 14 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-point-worker-profiles
          path: worker-profiles/**
