name: Read full-board routing evidence
on:
  push:
    branches:
      - codex/full-board-analysis-summary-20261114
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: full-board-priority-analysis
          run-id: 43615248215
          github-token: ${{ github.token }}
          path: artifact-main
      - uses: actions/download-artifact@v4
        with:
          name: full-board-priority-analysis
          run-id: 43616703094
          github-token: ${{ github.token }}
          path: artifact-corrected
      - name: Summarize existing routing evidence
        run: python3 experiments/full-board-priority-analysis/summarizeArtifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: full-board-routing-summary
          path: summary.json
          retention-days: 7
