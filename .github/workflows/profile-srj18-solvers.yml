name: Profile SRJ18 solvers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Profile completed SRJ18 problems
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Profile SRJ18 solvers
        env:
          PROFILE_SOLVERS_HEARTBEAT_INTERVAL_MS: "30000"
        run: |
          bun scripts/profile-solvers.ts \
            --dataset srj18 \
            --concurrency 1 \
            --sample-timeout 20m \
            --markdown-output srj18-solver-profile.md

      - name: Add timing table to job summary
        run: cat srj18-solver-profile.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile data
        uses: actions/upload-artifact@v4
        with:
          name: srj18-solver-profile
          path: |
            profile-solvers.json
            srj18-solver-profile.md
