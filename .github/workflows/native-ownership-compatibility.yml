name: Verify canonical ownership compatibility
on:
  push:
    branches: [analysis/native-copper-stage-diagnostics]
    paths: [.github/workflows/native-ownership-compatibility.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa3234753cd55a3732d90e0de17629eac2343f4c
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - run: bun test --timeout 600000 tests/pipeline7-autorouting-drc-evaluator.test.ts tests/features/tracewidthsolver/terminal-pad-connectivity-filtering.test.ts tests/solvers/high-density-repair-geometry-first.test.ts tests/features/obstacle-route-connectivity.test.ts tests/features/pipeline9-joint-drc-reuses-static-connectivity.test.ts tests/solvers/repair02-connected-pad-distance-filter.test.ts tests/features/pipeline9-high-density-regional-fallback.test.ts tests/features/pipeline9-srj23-sample52-bounded-joint-drc.test.ts
