name: Verify the H616 repro stops at its visualized routing stage
on:
  push:
    branches: [analysis/native-stack-snapshot-verification]
    paths: [.github/workflows/native-stack-snapshots.yml]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [a3011ea856de9661404a115ed2050d9e0a1bff77, 93f449589c8748916c2105a5efab437c0908269a]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Collect accepted neighbors from the high-density routing stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tests/repro/pipeline9-h616-solitary-crossing.test.ts")
          s=p.read_text()
          old="  pipeline.solve()"
          assert s.count(old)==1
          p.write_text(s.replace(old,'  pipeline.solveUntilPhase("highDensityForceImproveSolver")',1))
          PY
      - name: Keep original physical assertions and the exact existing SVG
        run: bun test --timeout 9999999 tests/repro/pipeline9-h616-solitary-crossing.test.ts
      - name: Verify the unchanged SVG a second time
        run: bun test --timeout 9999999 tests/repro/pipeline9-h616-solitary-crossing.test.ts
