name: Compare current OrangeCrab base and native-force SVGs
on:
  push:
    branches: [analysis/native-stack-snapshot-verification]
    paths: [.github/workflows/native-stack-snapshots.yml]
permissions:
  contents: write
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [1a2e757a0230bae0e8f915023485978587d7fe14, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Select only the original tests with SVG-only failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tests=["tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts","tests/repro/pipeline9-h616-preload-reachability.test.ts","tests/repro/pipeline9-h616-solitary-crossing.test.ts"]
          Path("/tmp/native-snapshot-tests").write_text("\n".join(p for p in tests if Path(p).exists())+"\n")
          PY
      - name: Regenerate SVGs while retaining all routing assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: |
          mapfile -t tests < /tmp/native-snapshot-tests
          bun test --timeout 9999999 "${tests[@]}"
      - name: Verify the same tests without snapshot updates
        run: |
          mapfile -t tests < /tmp/native-snapshot-tests
          bun test --timeout 9999999 "${tests[@]}"
      - name: Report real OrangeCrab DRC total
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path("tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg").read_text()
          m=re.search(r"Relaxed DRC errors: (\\d+)",s)
          assert m
          print("ORANGECRAB_DRC_COUNT",int(m.group(1)))
          PY
      - name: Save only verified public SVGs
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          git add -- '**/*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git commit -m "Regenerate verified native-copper SVG baselines"
          git push origin "HEAD:refs/heads/analysis/verified-native-round5-${SOURCE}"
