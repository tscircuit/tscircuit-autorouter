name: Verify current OrangeCrab and H616 SVG baselines
on:
  push:
    branches: [analysis/native-stack-snapshot-verification]
    paths: [.github/workflows/native-stack-snapshots.yml]
permissions:
  contents: write
jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source: [1a2e757a0230bae0e8f915023485978587d7fe14, 0f98be6237dfa0a852360b07d38f0e2fbee5f92d]
        case: [orange, reach, crossing]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Select one original board test
        env:
          CASE: ${{ matrix.case }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          cases={
            "orange":"tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts",
            "reach":"tests/repro/pipeline9-h616-preload-reachability.test.ts",
            "crossing":"tests/repro/pipeline9-h616-solitary-crossing.test.ts",
          }
          Path("/tmp/native-snapshot-test").write_text(cases[os.environ["CASE"]]+"\n")
          PY
      - name: Regenerate the SVG with original physical assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: |
          read -r test < /tmp/native-snapshot-test
          bun test --timeout 9999999 "$test"
      - name: Verify without snapshot updates
        run: |
          read -r test < /tmp/native-snapshot-test
          bun test --timeout 9999999 "$test"
      - name: Save only verified public SVGs
        env:
          SOURCE: ${{ matrix.source }}
          CASE: ${{ matrix.case }}
        run: |
          git add -- '**/*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git commit -m "Regenerate verified native-copper board SVG"
          git push origin "HEAD:refs/heads/analysis/verified-native-round6-${SOURCE}-${CASE}"
      - name: Report the OrangeCrab DRC total
        if: ${{ matrix.case == 'orange' }}
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path("tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg").read_text()
          m=re.search(r"Relaxed DRC errors: (\d+)",s)
          print("ORANGECRAB_DRC_COUNT",int(m.group(1)))
          PY
