name: Isolate boundary layer diversity and native coordination cuts
on:
  push:
    branches: [codex/ddr2427-minimal-stack-final-dimensions]
permissions:
  contents: read
  actions: read
jobs:
  native-subsets:
    strategy:
      fail-fast: false
      matrix:
        board: [icepi, imx6]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 3258e97a80f0239c0c92de072c4cba5d559935ce
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: published2427-${{ matrix.board }}
          run-id: 44519377875
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare immutable source variants with identical dependencies
        run: |
          (cd source && bun install --frozen-lockfile --ignore-scripts)
          python3 - <<'PYVARIANTS'
          import json,subprocess
          from pathlib import Path
          root=Path.cwd()
          variants=json.loads(Path('experiments/full-board-priority-analysis/minimal-stack-variants.json').read_text())
          for name,revision in variants.items():
              subprocess.run(['git','fetch','--no-tags','origin',revision],cwd='source',check=True)
              folder=root/'variants'/name
              subprocess.run(['git','worktree','add','--detach',str(folder),revision],cwd='source',check=True)
              (folder/'node_modules').symlink_to(root/'source/node_modules',target_is_directory=True)
              (folder/'replay-stack-native.ts').write_bytes(Path('experiments/full-board-priority-analysis/replay-stack-native.ts').read_bytes())
          PYVARIANTS
      - name: Replay every subset with the same180second budget
        env:
          BOARD_ID: ${{ matrix.board }}
          NATIVE_FANOUT_BUDGET_MS: '180000'
        run: |
          python3 - <<'PYREPLAY'
          import json,os,subprocess
          from pathlib import Path
          root=Path.cwd()
          variants=json.loads(Path('experiments/full-board-priority-analysis/minimal-stack-variants.json').read_text())
          for name,revision in variants.items():
              output=root/'results'/name
              completed=subprocess.run(['bun','replay-stack-native.ts',str(root/'captured'/os.environ['BOARD_ID']/'fanout-1-input.json.gz'),str(output)],cwd=root/'variants'/name)
              print('STACK_VARIANT_EXIT',json.dumps({'variant':name,'revision':revision,'exitCode':completed.returncode}),flush=True)
          PYREPLAY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-stack-layer-native-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export native metrics and actual copper
        if: always()
        run: |
          python3 - <<'PYEXPORT'
          import base64,hashlib,io,json,zipfile
          from pathlib import Path
          rows=[]
          for path in sorted(Path('results').glob('*/report.json')):
              report=json.loads(path.read_text())
              rows.append({'variant':path.parent.name,**report,'copperSha256':hashlib.sha256((path.parent/'best-traces.json').read_bytes()).hexdigest()})
          print('STACK_NATIVE_SUBSETS_REPORT',json.dumps(rows,separators=(',',':')))
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file():archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('STACK_NATIVE_SUBSETS_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('STACK_NATIVE_SUBSETS_EVIDENCE_END')
          assert len(rows)==3
          assert all(row['copperDrc']['valid'] for row in rows)
          PYEXPORT


  native-pairs:
    strategy:
      fail-fast: false
      matrix:
        board: [icepi, imx6]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 5fe34c40d44bfd98ba18bc5aa485450cf3302504
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: published2427-${{ matrix.board }}
          run-id: 44519377875
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare scoped site and small ordering stages
        run: |
          (cd source && bun install --frozen-lockfile --ignore-scripts)
          python3 - <<'PYSETUP'
          from pathlib import Path
          import subprocess
          root=Path.cwd()
          for name,revision in {'s':'5fe34c40d44bfd98ba18bc5aa485450cf3302504','so':'9e0a054abf9f0a8bb4222ac9ce0247b17dbdd189'}.items():
              subprocess.run(['git','fetch','--no-tags','origin',revision],cwd='source',check=True)
              folder=root/'variants'/name
              subprocess.run(['git','worktree','add','--detach',str(folder),revision],cwd='source',check=True)
              (folder/'node_modules').symlink_to(root/'source/node_modules',target_is_directory=True)
              (folder/'probe-native-plane-boundary-pairs.ts').write_bytes(Path('experiments/full-board-priority-analysis/probe-native-plane-boundary-pairs.ts').read_bytes())
          PYSETUP
      - name: Route original plane and boundary pairs without added guidance
        env:
          BOARD_ID: ${{ matrix.board }}
        run: |
          for revision in s so; do
            (cd "variants/$revision" && PAIR_PROBE_VARIANT="$revision" bun probe-native-plane-boundary-pairs.ts "$GITHUB_WORKSPACE/captured/$BOARD_ID/fanout-1-input.json.gz" "$GITHUB_WORKSPACE/pairs/$revision")
          done
      - name: Compare exact native pair inputs and keep actual changed copper
        if: always()
        run: |
          python3 - <<'PYCOMPARE'
          import base64,io,json,shutil,zipfile
          from pathlib import Path
          root=Path('pairs');evidence=Path('pair-evidence');evidence.mkdir(exist_ok=True)
          stages={name:json.loads((root/name/'pairs.json').read_text()) for name in ['s','so']}
          before={row['pairId']:row for row in stages['s']};after={row['pairId']:row for row in stages['so']}
          assert set(before)==set(after)
          gains=[];losses=[]
          for pairId,first in before.items():
              second=after[pairId]
              assert first['inputSha256']==second['inputSha256']
              if first['status']!='solved' and second['status']=='solved':gains.append(pairId)
              if first['status']=='solved' and second['status']!='solved':losses.append(pairId)
          report={'pairs':len(before),'beforeSolved':sum(row['status']=='solved' for row in before.values()),'afterSolved':sum(row['status']=='solved' for row in after.values()),'gains':gains,'losses':losses,'stages':stages}
          (evidence/'comparison.json').write_text(json.dumps(report,indent=2))
          print('NATIVE_PAIR_COMPARISON_REPORT',json.dumps(report,separators=(',',':')))
          shutil.copy2(root/'s/original-input.json.gz',evidence/'original-input.json.gz')
          for pairId in (gains+losses)[:4]:
              for stage in ['s','so']:
                  shutil.copytree(root/stage/'pairs'/pairId,evidence/stage/pairId)
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in evidence.rglob('*'):
                  if path.is_file():archive.writestr(str(path.relative_to(evidence)),path.read_bytes())
          print('NATIVE_PAIR_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
          print('NATIVE_PAIR_EVIDENCE_END')
          PYCOMPARE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-native-pairs-${{ matrix.board }}
          path: pair-evidence
