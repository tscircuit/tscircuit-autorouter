name: Core saved-cohort snapshot qualification

on:
  push:
    branches: [bench/core-saved-cohort-snapshot-3216]

permissions:
  contents: read

jobs:
  qualify:
    name: Verify retained saved escapes and one snapshot
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.core-saved-cohort/cache
    steps:
      - name: Checkout reviewed single-test controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten/saved-cohort
            .github/workflows/full-board-ten.yml
      - name: Checkout exact Core fix head
        uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 8a3e33bbc6019c1f0fba2e9678938aaf9246dc08
          path: .core-saved-cohort/source
          persist-credentials: false
      - name: Setup CI Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Update one snapshot, verify it, and typecheck Core
        run: >-
          python3 experiments/full-board-ten/saved-cohort/qualify.py
          "$GITHUB_WORKSPACE/.core-saved-cohort/source"
          "$GITHUB_WORKSPACE/.core-saved-cohort/proof"
      - name: Preserve exact test evidence and one actual snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: core-saved-cohort-snapshot-${{ github.run_attempt }}
          path: |
            .core-saved-cohort/proof
            experiments/full-board-ten/saved-cohort/plan.json
            experiments/full-board-ten/saved-cohort/test.patch
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
