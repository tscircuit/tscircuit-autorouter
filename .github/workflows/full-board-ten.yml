name: Core original iMX6 same-VM comparison

on:
  push:
    branches: [bench/core-imx6-paired-control-3216]

permissions:
  contents: read
  actions: read

jobs:
  route:
    name: Published then candidate original iMX6
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: published
      BOARD: imx6
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Restore unchanged frozen3216 external runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authentic cases and published neutral assessors
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced"
          "$FULL_BOARD_ROOT/cases" "$BOARD"

      - name: Record published pre-run filesystem inventory
        run: python3 experiments/full-board-ten/verify-core-imx6-pair.py "$FULL_BOARD_ROOT" published-before

      - name: Route complete original iMX6 with published3216
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/imx6-original.json"
          "$FULL_BOARD_ROOT/paired-control/imx6/original"

      - name: Verify published post-run filesystem inventory
        run: python3 experiments/full-board-ten/verify-core-imx6-pair.py "$FULL_BOARD_ROOT" published-after

      - name: Preserve published original output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-imx6-paired-published-${{ github.run_attempt }}
          path: .full-board-run/paired-control/imx6/original
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Authenticate primary qualification and reuse compiled Core
        id: prepare
        run: >-
          python3 experiments/full-board-ten/prepare-core-publication-all-ten.py
          "$FULL_BOARD_ROOT" prepare "$BOARD"

      - name: Record candidate pre-run filesystem inventory
        run: python3 experiments/full-board-ten/verify-core-imx6-pair.py "$FULL_BOARD_ROOT" candidate-before

      - name: Route complete original iMX6 with qualified candidate
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/candidate-$BOARD-original.json"
          "$FULL_BOARD_ROOT/results/$BOARD/original"

      - name: Compare same-VM native prefix and physical output
        id: comparison
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 experiments/full-board-ten/verify-core-imx6-pair.py
          "$FULL_BOARD_ROOT" verify

      - name: Preserve original output and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-imx6-paired-candidate-${{ github.run_attempt }}
          path: .full-board-run/results/imx6/original
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Restore original Core alias
        if: always()
        run: |
          if test -f "$FULL_BOARD_ROOT/published-runtime-manifest.json"; then
            python3 experiments/full-board-ten/prepare-core-publication-all-ten.py "$FULL_BOARD_ROOT" restore
          fi

      - name: Preserve compact shared provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: core-imx6-paired-proof-${{ github.run_attempt }}
          path: |
            .full-board-run/core-all-ten-reuse.json
            .full-board-run/imx6-pair
            .full-board-run/*runtime-manifest.json
            .full-board-run/cases/*.json
            .full-board-run/baselines/*/*/archive-proof.json
            .full-board-run/qualified-primary/core-source-pair/provenance.json
            .full-board-run/qualified-primary/core-source-pair/*-validation.json
            experiments/full-board-ten/core-publication-all-ten-plan.json
          if-no-files-found: warn
          retention-days: 7

      - name: Require same-VM regression qualification
        if: always()
        run: test "${{ steps.comparison.outcome }}" = success
