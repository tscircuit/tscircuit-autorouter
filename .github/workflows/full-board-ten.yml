name: Published3230 H616 phase3 stage diagnostic

on:
  push:
    branches: [bench/h616-stage-provenance-3230]

permissions:
  contents: read
  actions: read

jobs:
  route:
    name: H616 published phase3 immutable stage snapshots
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      BOARD: h616
      FULL_BOARD_COHORTS: spaced
      FULL_BOARD_EXPERIMENT: published
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout benchmark controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare verified package runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authentic paired cases
        id: prepare
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced"
          "$FULL_BOARD_ROOT/cases"
          "$BOARD"

      - name: Run authentic H616 spaced circuit once
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/h616-spaced.json"
          "$FULL_BOARD_ROOT/results/h616/spaced"

      - name: Require unchanged native output and authenticated stage evidence
        run: python3 experiments/full-board-ten/verify-h616-stage-diagnostic.py "$FULL_BOARD_ROOT"

      - name: Preserve immutable native stages and parity proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: h616-published-stage-diagnostic-${{ github.run_attempt }}
          path: |
            .full-board-run/results/h616/spaced
            .full-board-run/runtime-manifest.json
            .full-board-run/cases/h616-spaced.json
            .full-board-run/h616-stage-parity.json
            experiments/full-board-ten/h616-stage-diagnostic-plan.json
            experiments/full-board-ten/harness-provenance.json
            experiments/full-board-ten/h616-stage-provenance.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
