name: Bus repeat-exhaustion ButterStick completion screen

on:
  push:
    branches: [bench/bus-repeat-exhaustion-3230]

permissions:
  contents: read
  actions: read

jobs:
  route:
    name: ButterStick spaced completion screen
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      BOARD: butterstick
      FULL_BOARD_COHORTS: spaced
      FULL_BOARD_EXPERIMENT: published

    steps:
      - name: Checkout benchmark controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Checkout exact published Bus source
        uses: actions/checkout@v4
        with:
          repository: tscircuit/bus-lanes-solver
          ref: 0f1c5ca41a1dccad289662e68228ef7e58afa071
          path: .full-board-run/bus-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lib/bus-lanes-pipeline-solver.ts
            /lib/route-generated-signal-sites.ts
            /package.json
            /biome.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare verified published package runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authentic spaced case and neutral assessor
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced"
          "$FULL_BOARD_ROOT/cases"
          "$BOARD"

      - name: Check exact formatter, source equivalence, and focused controls
        run: >-
          python3 experiments/full-board-ten/prepare-bus-repeat-source.py
          "$FULL_BOARD_ROOT" "$FULL_BOARD_ROOT/bus-source"

      - name: Install source-qualified Bus declarations in selected Core
        id: install
        run: >-
          python3 experiments/full-board-ten/bus-repeat-runtime.py
          install "$FULL_BOARD_ROOT" butterstick spaced

      - name: Run complete native ButterStick circuit and neutral assessment
        id: native
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/butterstick-spaced.json"
          "$FULL_BOARD_ROOT/results/butterstick/spaced"

      - name: Verify original dependency graph and assessment restoration
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.native.outcome != 'skipped' }}
        run: python3 experiments/full-board-ten/bus-repeat-runtime.py verify "$FULL_BOARD_ROOT"

      - name: Require native completion gain and physical validity
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/full-board-ten/verify-bus-repeat-candidate.py "$FULL_BOARD_ROOT"

      - name: Preserve native circuit, accepted phases, and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: bus-repeat-butterstick-spaced-${{ github.run_attempt }}
          path: .full-board-run/results/butterstick/spaced
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Preserve source, runtime, and qualification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: bus-repeat-qualification-${{ github.run_attempt }}
          path: |
            .full-board-run/bus-repeat-*.json
            .full-board-run/bus-repeat-source/*.json
            .full-board-run/bus-repeat-source/*.log
            .full-board-run/bus-repeat-source/*.test.ts
            .full-board-run/runtime-manifest.json
            .full-board-run/cases/butterstick-spaced.json
            .full-board-run/cases/assessment-helper-proof.json
            experiments/full-board-ten/bus-repeat-plan.json
            experiments/full-board-ten/bus-repeat-production.patch
            experiments/full-board-ten/bus-repeat-source-test.ts
            experiments/full-board-ten/release.json
            experiments/full-board-ten/source-provenance.json
            experiments/full-board-ten/harness-provenance.json
          if-no-files-found: warn
          retention-days: 7
