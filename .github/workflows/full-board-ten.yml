name: Core independent phase continuation qualification

on:
  push:
    branches: [bench/core-independent-phase-continuation-3230]

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    name: Frozen Core source qualification and H616 candidate
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: published
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout exact Core2407 prepublish build source
        uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 7bfce91b1648255b6521b51d08e48db1120e32b1
          path: .full-board-run/source-core
          persist-credentials: false

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare unchanged verified published runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authentic case and original neutral assessment
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced"
          "$FULL_BOARD_ROOT/cases"
          h616

      - name: Authenticate published full-board control
        run: python3 experiments/full-board-ten/prepare-core-publication.py "$FULL_BOARD_ROOT" baseline

      - name: Prove baseline repro and fixed lifecycle tests on one frozen source graph
        run: >-
          python3 experiments/full-board-ten/prepare-core-source-pair.py
          "$FULL_BOARD_ROOT" "$FULL_BOARD_ROOT/source-core"

      - name: Install reviewed Core source fix only
        run: python3 experiments/full-board-ten/prepare-core-publication.py "$FULL_BOARD_ROOT" candidate

      - name: Run actual H616 candidate with unchanged capture limits
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/candidate-h616-spaced.json"
          "$FULL_BOARD_ROOT/results/candidate/h616/spaced"

      - name: Require additional valid completed nets and unchanged failure prefix
        run: python3 experiments/full-board-ten/verify-core-publication.py "$FULL_BOARD_ROOT" candidate

      - name: Render actual candidate CircuitJSON for visual review
        run: >-
          bun experiments/full-board-ten/render-core-publication-svg.ts
          "$FULL_BOARD_ROOT/results/candidate/h616/spaced"

      - name: Restore original isolated Core alias
        if: always()
        run: |
          if test -f "$FULL_BOARD_ROOT/published-runtime-manifest.json"; then
            python3 experiments/full-board-ten/prepare-core-publication.py "$FULL_BOARD_ROOT" restore
          fi

      - name: Preserve source qualification and native output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: h616-core-phase-continuation-${{ github.run_attempt }}
          path: |
            .full-board-run/core-source-pair
            .full-board-run/published-baseline/archive-proof.json
            .full-board-run/published-baseline/pcb.svg.gz
            .full-board-run/results
            .full-board-run/cases/*.json
            .full-board-run/*runtime-manifest.json
            experiments/full-board-ten/core-publication-plan.json
            experiments/full-board-ten/core-publication-*.patch
            experiments/full-board-ten/core-source-lock-refresh.patch
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
