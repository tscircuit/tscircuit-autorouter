name: Core accepted phase all-ten regression

on:
  push:
    branches: [bench/core-publication-all-ten-3216]

permissions:
  contents: read
  actions: read

jobs:
  route:
    name: Complete circuits (${{ matrix.board }})
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        board: [h616, butterstick, glider, imx6, icepi]
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: published
      BOARD: ${{ matrix.board }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Restore unchanged frozen3216 external runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authentic cases and published neutral assessors
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced"
          "$FULL_BOARD_ROOT/cases" "$BOARD"

      - name: Authenticate primary qualification and reuse compiled Core
        id: prepare
        run: >-
          python3 experiments/full-board-ten/prepare-core-publication-all-ten.py
          "$FULL_BOARD_ROOT" prepare "$BOARD"

      - name: Route complete original circuit
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/candidate-$BOARD-original.json"
          "$FULL_BOARD_ROOT/results/$BOARD/original"

      - name: Compare original native prefix and physical output
        id: original
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 experiments/full-board-ten/verify-core-publication-all-ten.py
          "$FULL_BOARD_ROOT" "$BOARD" original

      - name: Preserve original output and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-publication-${{ matrix.board }}-original-${{ github.run_attempt }}
          path: .full-board-run/results/${{ matrix.board }}/original
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Route complete spaced circuit
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/candidate-$BOARD-spaced.json"
          "$FULL_BOARD_ROOT/results/$BOARD/spaced"

      - name: Compare spaced native prefix and physical output
        id: spaced
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 experiments/full-board-ten/verify-core-publication-all-ten.py
          "$FULL_BOARD_ROOT" "$BOARD" spaced

      - name: Preserve spaced output and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-publication-${{ matrix.board }}-spaced-${{ github.run_attempt }}
          path: .full-board-run/results/${{ matrix.board }}/spaced
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Restore original Core alias
        if: always()
        run: |
          if test -f "$FULL_BOARD_ROOT/published-runtime-manifest.json"; then
            python3 experiments/full-board-ten/prepare-core-publication-all-ten.py "$FULL_BOARD_ROOT" restore
          fi

      - name: Preserve compact shared provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: core-publication-${{ matrix.board }}-proof-${{ github.run_attempt }}
          path: |
            .full-board-run/core-all-ten-reuse.json
            .full-board-run/*runtime-manifest.json
            .full-board-run/cases/*.json
            .full-board-run/baselines/*/*/archive-proof.json
            .full-board-run/qualified-primary/core-source-pair/provenance.json
            .full-board-run/qualified-primary/core-source-pair/*-validation.json
            experiments/full-board-ten/core-publication-all-ten-plan.json
          if-no-files-found: warn
          retention-days: 7

      - name: Require both regression qualifications
        if: always()
        run: test "${{ steps.original.outcome }}" = success && test "${{ steps.spaced.outcome }}" = success
