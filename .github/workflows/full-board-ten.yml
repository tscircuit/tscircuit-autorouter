name: Published3203 iMX6 byte1 CPU prefix

on:
  push:
    branches: [bench/imx6-byte1-cpu-prefix-3203]

permissions:
  contents: read
  actions: read

jobs:
  prefix:
    name: Published iMX6 byte1 diagnostic prefix
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 8
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: published

    steps:
      - name: Checkout benchmark controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare verified package runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Verify genuine published phase artifact identity
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const repository = "tscircuit/tscircuit-autorouter"
            const runId = 43929516030
            const artifactId = 14259406094
            const headSha = "4faeb09514467a8b0804688328bc393206c4b614"
            const name = "full-board-imx6-published-spaced-1"
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: "tscircuit", repo: "tscircuit-autorouter", run_id: runId,
              name, per_page: 100,
            })
            if (data.total_count !== 1 || data.artifacts.length !== 1) throw new Error("Expected exactly one genuine published phase artifact")
            const artifact = data.artifacts[0]
            if (artifact.id !== artifactId || artifact.name !== name || artifact.workflow_run?.id !== runId || artifact.workflow_run.head_sha !== headSha || artifact.expired !== false) throw new Error("Published phase artifact identity mismatch")
            if (artifact.size_in_bytes !== 14582165 || artifact.digest !== "sha256:d991063caf8773c76c95b202d08374c61416f7241dfdc129e519fc310eb4bb42") throw new Error("Published phase archive identity changed")
            const identity = {
              repository, runId, artifactId, name, sizeInBytes: artifact.size_in_bytes,
              digest: artifact.digest, headSha: artifact.workflow_run.head_sha, expired: artifact.expired,
            }
            const fs = require("node:fs")
            const path = require("node:path")
            const directory = path.join(process.env.FULL_BOARD_ROOT, "prefix-input")
            fs.mkdirSync(directory, { recursive: true })
            fs.writeFileSync(path.join(directory, "artifact-identity.json"), JSON.stringify(identity, null, 2) + "\n")
            core.info(`PREFIX_SOURCE_ARTIFACT ${JSON.stringify(identity)}`)

      - name: Download genuine published phase input
        uses: actions/download-artifact@v4
        with:
          name: full-board-imx6-published-spaced-1
          run-id: 43929516030
          repository: tscircuit/tscircuit-autorouter
          github-token: ${{ github.token }}
          path: .full-board-run/prefix-input

      - name: Observe bounded published byte1 prefix
        id: prefix
        run: >-
          bun experiments/full-board-ten/run-bus-prefix.ts
          "$FULL_BOARD_ROOT/prefix-input"
          "$FULL_BOARD_ROOT/results/imx6/byte1-prefix"

      - name: Summarize prefix CPU samples
        if: always()
        run: >-
          python3 experiments/full-board-ten/summarize-cpu-profile.py
          "$FULL_BOARD_ROOT/results/imx6/byte1-prefix"

      - name: Preserve prefix profile and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: imx6-byte1-prefix-profile-${{ github.run_attempt }}
          path: .full-board-run/results/imx6/byte1-prefix
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Preserve small runtime and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: imx6-byte1-prefix-provenance-${{ github.run_attempt }}
          path: |
            .full-board-run/prefix-input/artifact-identity.json
            .full-board-run/runtime-manifest.json
            experiments/full-board-ten/release.json
            experiments/full-board-ten/source-provenance.json
            experiments/full-board-ten/harness-provenance.json
            experiments/full-board-ten/prefix-provenance.json
          if-no-files-found: warn
          retention-days: 7
