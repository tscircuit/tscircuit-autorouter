name: iMX6 spaced same-worker routing and pour diagnostic

on:
  push:
    branches: [bench/core-pour-imx6-same-worker-3230]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    name: Published then candidate on one ARM worker
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: published
      CASE_BOARD: imx6
      CASE_COHORT: spaced
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md
      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis
      - name: Checkout immutable spaced source for unchanged bootstrap
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Prepare verified published3230 runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"
      - name: Prepare authentic case and unchanged neutral assessors
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced" "$FULL_BOARD_ROOT/cases" "$CASE_BOARD"
      - name: Authenticate saved published control and runtime graph
        run: python3 experiments/full-board-ten/prepare-core-reentrancy.py "$FULL_BOARD_ROOT" baseline "$CASE_BOARD" "$CASE_COHORT"
      - name: Authenticate passed source pair, prove scoped compiled mapping and held-routing repro
        run: python3 experiments/full-board-ten/prepare-core-reentrancy.py "$FULL_BOARD_ROOT" source "$CASE_BOARD" "$CASE_COHORT"
      - name: Qualify complete via and pour geometry audit
        run: python3 experiments/full-board-ten/audit-via-pour.py --self-test --output "$FULL_BOARD_ROOT/core-reentrancy/audit-self-test.json"
      - name: Require the real focused repro to clear the signal via physically
        run: >-
          python3 experiments/full-board-ten/audit-via-pour.py
          --baseline "$FULL_BOARD_ROOT/core-reentrancy/base.circuit.json"
          --candidate "$FULL_BOARD_ROOT/core-reentrancy/candidate.circuit.json"
          --output "$FULL_BOARD_ROOT/core-reentrancy/tiny-via-pour-audit.json"
      - name: Run predetermined published and candidate primary captures sequentially
        run: python3 experiments/full-board-ten/run-core-pour-same-worker.py "$FULL_BOARD_ROOT"
      - name: Preserve both lanes, worker counters and the unreplaced first-failure reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-pour-imx6-same-worker-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .full-board-run/same-worker
            .full-board-run/results
            .full-board-run/core-reentrancy/*.json
            .full-board-run/core-reentrancy/*.json.gz
            .full-board-run/core-reentrancy/*.log
            .full-board-run/core-reentrancy/*.svg
            .full-board-run/core-reentrancy/*.test.tsx
            .full-board-run/published-baseline/archive-proof.json
            .full-board-run/cases/*.json
            .full-board-run/*runtime-manifest.json
            experiments/full-board-ten/core-pour-same-worker-plan.json
            experiments/full-board-ten/core-reentrancy-plan.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
