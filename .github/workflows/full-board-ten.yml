name: Published3209 board grid cache remaining nine cases

on:
  push:
    branches: [bench/board-grid-cache-nine-3209]

permissions:
  contents: read

jobs:
  route:
    name: Board grid cache (${{ matrix.board }}, ${{ matrix.cohort }})
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { board: h616, cohort: original }
          - { board: h616, cohort: spaced }
          - { board: butterstick, cohort: original }
          - { board: butterstick, cohort: spaced }
          - { board: glider, cohort: original }
          - { board: glider, cohort: spaced }
          - { board: imx6, cohort: original }
          - { board: icepi, cohort: original }
          - { board: icepi, cohort: spaced }
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      BOARD: ${{ matrix.board }}
      FULL_BOARD_COHORTS: ${{ matrix.cohort }}
      FULL_BOARD_EXPERIMENT: board-grid-cache-candidate

    steps:
      - name: Checkout benchmark controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare verified package runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authentic paired cases
        id: prepare
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced"
          "$FULL_BOARD_ROOT/cases"
          "$BOARD"

      - name: Install exact candidate after the original neutral assessor is prepared
        id: candidate
        run: python3 experiments/full-board-ten/board-grid-cache-runtime.py install "$FULL_BOARD_ROOT" "$BOARD" "$FULL_BOARD_COHORTS"

      - name: Run selected full circuit with unchanged deadlines
        id: render
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/$BOARD-$FULL_BOARD_COHORTS.json"
          "$FULL_BOARD_ROOT/results/$BOARD/$FULL_BOARD_COHORTS"

      - name: Verify original package bytes and restored neutral assessment
        if: ${{ always() && steps.candidate.outcome == 'success' }}
        run: python3 experiments/full-board-ten/board-grid-cache-runtime.py verify "$FULL_BOARD_ROOT"

      - name: Preserve actual full circuit and native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: full-board-${{ matrix.board }}-board-grid-cache-${{ matrix.cohort }}-${{ github.run_attempt }}
          path: .full-board-run/results/${{ matrix.board }}/${{ matrix.cohort }}
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Publish compact result notices and summary
        id: report
        if: always()
        run: python3 experiments/full-board-ten/report.py "$FULL_BOARD_ROOT" "$BOARD"

      - name: Preserve small reports and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: full-board-${{ matrix.board }}-board-grid-cache-${{ matrix.cohort }}-summary-${{ github.run_attempt }}
          path: |
            .full-board-run/results/${{ matrix.board }}/summary.json
            .full-board-run/results/${{ matrix.board }}/*/result.json
            .full-board-run/results/${{ matrix.board }}/*/assessment.json
            .full-board-run/results/${{ matrix.board }}/*/process.json
            .full-board-run/results/${{ matrix.board }}/*/progress.json
            .full-board-run/runtime-manifest.json
            .full-board-run/cases/assessment-helper-proof.json
            .full-board-run/cases/${{ matrix.board }}-${{ matrix.cohort }}.json
            .full-board-run/board-grid-cache-*.json
            experiments/full-board-ten/board-grid-cache-anchor.json
            experiments/full-board-ten/harness-provenance.json
            experiments/full-board-ten/release.json
            experiments/full-board-ten/source-provenance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Require selected full circuits to be complete and clean
        if: always()
        run: test "${{ steps.report.outputs.all_clean }}" = true
