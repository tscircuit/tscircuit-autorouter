name: Frozen3207 partial recovery handoff comparison

on:
  push:
    branches: [bench/full-board-recovery-handoff-3207]

permissions:
  contents: read
  actions: read

jobs:
  replay:
    name: Native pair (${{ matrix.case }})
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [glider-spaced, imx6-spaced]
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: recovery-handoff-phase-replay

    steps:
      - name: Checkout diagnostic controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare verified package runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Authenticate native input and prepare paired source entries
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 experiments/full-board-ten/prepare-four-coarse-phase.py
          "$FULL_BOARD_ROOT" "${{ matrix.case }}"

      - name: Replay and qualify source baseline
        id: baseline
        continue-on-error: true
        run: >-
          timeout --signal=KILL 960s
          bun experiments/full-board-ten/run-four-coarse-phase.ts
          "$FULL_BOARD_ROOT/phase-source-baseline-runtime.json"
          "$FULL_BOARD_ROOT/phase-results/source-baseline"

      - name: Replay partial recovery handoff in a fresh process
        id: handoff
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        continue-on-error: true
        run: >-
          timeout --signal=KILL 960s
          bun experiments/full-board-ten/run-four-coarse-phase.ts
          "$FULL_BOARD_ROOT/phase-handoff-only-runtime.json"
          "$FULL_BOARD_ROOT/phase-results/handoff-only"

      - name: Compare phase completion and recovery states
        id: compare
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' && steps.handoff.outcome == 'success' }}
        run: python3 experiments/full-board-ten/compare-four-coarse-phase.py "$FULL_BOARD_ROOT"

      - name: Preserve bounded observations and runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: recovery-handoff-${{ matrix.case }}-${{ github.run_attempt }}
          path: |
            .full-board-run/phase-results
            .full-board-run/phase-*-runtime.json
            .full-board-run/runtime-manifest.json
            experiments/full-board-ten/source-bundles/manifest.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Require both valid observations and a qualified native baseline
        if: always()
        run: >-
          test "${{ steps.baseline.outcome }}" = success &&
          test "${{ steps.handoff.outcome }}" = success &&
          test "${{ steps.compare.outcome }}" = success
