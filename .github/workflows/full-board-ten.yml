name: H616 original combined antipad and pad-edge diagnostic

on:
  push:
    branches: [bench/h616-antipad-pad-edge-3200]

permissions:
  contents: read

jobs:
  route:
    name: H616 original (two-change joint hypothesis)
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      BOARD: h616
      FULL_BOARD_COHORTS: original
      FULL_BOARD_EXPERIMENT: published

    steps:
      - name: Checkout diagnostic controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            experiments/full-board-h616-antipad-pad-edge
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits for unchanged case factory
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare verified published runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authentic H616 original case and unchanged helper
        id: prepare
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced"
          "$FULL_BOARD_ROOT/cases"
          "$BOARD"

      - name: Install frozen two-change diagnostic
        id: candidate
        run: bun experiments/full-board-h616-antipad-pad-edge/install-candidate.mjs "$FULL_BOARD_ROOT"

      - name: Run authentic H616 original full circuit
        id: original
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.candidate.outcome == 'success' }}
        continue-on-error: true
        run: >-
          bun experiments/full-board-ten/run-one.ts
          "$FULL_BOARD_ROOT/cases/h616-original.json"
          "$FULL_BOARD_ROOT/results/h616/original"

      - name: Preserve actual geometry and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: h616-original-antipad-pad-edge-${{ github.run_attempt }}
          path: .full-board-run/results/h616/original
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Publish compact results and explicit joint-hypothesis label
        id: report
        if: always()
        run: python3 experiments/full-board-ten/report.py "$FULL_BOARD_ROOT" "$BOARD"

      - name: Preserve small reports and frozen composition provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: h616-antipad-pad-edge-provenance-${{ github.run_attempt }}
          path: |
            .full-board-run/results/h616/summary.json
            .full-board-run/results/h616/original/result.json
            .full-board-run/results/h616/original/assessment.json
            .full-board-run/results/h616/original/process.json
            .full-board-run/results/h616/original/progress.json
            .full-board-run/runtime-manifest.json
            .full-board-run/cases/assessment-helper-proof.json
            .full-board-run/combined-candidate-proof.json
            experiments/full-board-ten/release.json
            experiments/full-board-ten/source-provenance.json
            experiments/full-board-h616-antipad-pad-edge/
          if-no-files-found: warn
          retention-days: 7

      - name: Require complete clean native circuit
        if: always()
        run: test "${{ steps.report.outputs.all_clean }}" = true
