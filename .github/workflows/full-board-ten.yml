name: Core recursive render guard source validation

on:
  push:
    branches: [bench/core-pour-dependency-source-ci-3230]

permissions:
  contents: read

jobs:
  source:
    name: Actual Core source before and recursive render guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CORE_SOURCE: ${{ github.workspace }}/.core-source
      CORE_CANDIDATE: ${{ github.workspace }}/.core-candidate
      CORE_PROOF: ${{ github.workspace }}/.core-proof
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: fb77fad92dd4197eab9934a5ebbb5dfcbffc7eaf
          path: .core-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: c647b88752e8319622d1441445ec5da5069f3d78
          path: .core-candidate
          persist-credentials: false
          fetch-depth: 4
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /lib/IsolatedCircuit.ts
            /lib/components/base-components/Renderable.ts
            /lib/components/primitive-components/Group/Group.ts
            /lib/components/primitive-components/CopperPour/CopperPour.ts
            /lib/components/primitive-components/CopperPour/CopperPour_doInitialPcbCopperPourRender.ts
            /tests/repros/repro-routing-event-copper-pour.test.tsx
            /tests/repros/__snapshots__/repro-routing-event-copper-pour-pcb.snap.svg
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Validate real source pair with one frozen compatible dependency graph
        run: python3 experiments/full-board-ten/check-core-pour-source.py
      - name: Preserve actual source, snapshots, dependency graph, logs and builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-pour-source-pair-${{ github.run_attempt }}
          include-hidden-files: true
          path: .core-proof
          if-no-files-found: error
          retention-days: 7
