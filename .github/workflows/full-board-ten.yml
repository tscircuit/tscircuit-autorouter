name: Core stacked fix type and class export validation

on:
  push:
    branches: [bench/core-effect-stack-checks-3230]

permissions:
  contents: read

jobs:
  checks:
    name: Exact Core fix type and class export checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_SOURCE_SHA: af05d673fb66094abd0f82671eae34d6b001eec7
      CORE_PROOF: ${{ github.workspace }}/.core-proof
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: af05d673fb66094abd0f82671eae34d6b001eec7
          path: .core-source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install once and run standard Core checks
        working-directory: .core-source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import time

          proof = Path(os.environ["CORE_PROOF"])
          proof.mkdir(parents=True, exist_ok=True)
          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (proof / "source-head.txt").write_text(source_sha + "\n")
          shutil.copyfile("package.json", proof / "package.json")
          report = {
              "sourceRepository": "tscircuit/core",
              "sourceCommit": source_sha,
              "expectedSourceCommit": os.environ["CORE_SOURCE_SHA"],
              "controllerCommit": os.environ["GITHUB_SHA"],
              "packageJsonSha256": hashlib.sha256(Path("package.json").read_bytes()).hexdigest(),
              "status": "running",
              "checks": {},
          }

          def run_check(name, command):
              print(f"Running {name}: {command}", flush=True)
              started = time.monotonic()
              log = proof / f"{name}.log"
              with log.open("w") as output:
                  result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT)
              report["checks"][name] = {
                  "command": command,
                  "exitCode": result.returncode,
                  "durationSeconds": round(time.monotonic() - started, 3),
                  "logSha256": hashlib.sha256(log.read_bytes()).hexdigest(),
              }
              (proof / "result.json").write_text(json.dumps(report, indent=2) + "\n")
              print(log.read_text(errors="replace")[-4000:], flush=True)
              print(f"{name}: exit {result.returncode}", flush=True)
              return result.returncode

          (proof / "result.json").write_text(json.dumps(report, indent=2) + "\n")
          assert source_sha == report["expectedSourceCommit"], "Wrong Core source commit"
          assert not subprocess.check_output(["git", "status", "--porcelain"], text=True).strip(), "Core checkout is not clean"
          run_check("bun-version", ["bun", "--version"])
          run_check("node-version", ["node", "--version"])
          if run_check("install", ["bun", "install"]) == 0:
              run_check("dependency-inventory", ["bun", "pm", "ls", "--all"])
              run_check("typecheck", ["bunx", "tsc", "--noEmit"])
              run_check("class-export-tests", ["bun", "test", "tests/scripts/"])
              run_check("class-exports", ["bun", "run", "check:class-exports"])
          report["trackedChanges"] = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=no"], text=True
          ).splitlines()
          report["failedChecks"] = [name for name, check in report["checks"].items() if check["exitCode"] != 0]
          report["passed"] = not report["failedChecks"] and not report["trackedChanges"]
          report["status"] = "complete"
          (proof / "result.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2), flush=True)
          sys.exit(0 if report["passed"] else 1)
          PY
      - name: Preserve source identity, dependency versions and all check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-stacked-fix-checks-${{ github.run_attempt }}
          include-hidden-files: true
          path: .core-proof
          if-no-files-found: error
          retention-days: 7
