name: Frozen3207 unchanged-candidate coarse failure witness

on:
  push:
    branches: [bench/full-board-via-reservation-3207]

permissions:
  contents: read
  actions: read

jobs:
  replay:
    name: Native phase (${{ matrix.variant }})
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [via-reservation]
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_EXPERIMENT: hd-phase-replay

    steps:
      - name: Checkout diagnostic controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original sources for runtime provenance
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced sources for runtime provenance
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare unchanged frozen package runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Download the authenticated native phase source artifact
        uses: actions/download-artifact@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          run-id: 43972696308
          artifact-ids: 14279817246
          github-token: ${{ github.token }}
          path: .full-board-run/native-artifact
          merge-multiple: true

      - name: Verify native input and select isolated autorouter entry
        run: >-
          python3 experiments/full-board-ten/prepare-phase-replay.py
          "$FULL_BOARD_ROOT" "${{ matrix.variant }}"

      - name: Replay only the native other_signals phase
        id: replay
        continue-on-error: true
        run: >-
          timeout --signal=KILL 960s
          bun experiments/full-board-ten/run-phase-replay.ts
          "$FULL_BOARD_ROOT/phase-replay-runtime.json"
          "$FULL_BOARD_ROOT/phase-results"

      - name: Preserve bounded observations and runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: hd-phase-icepi-${{ matrix.variant }}-${{ github.run_attempt }}
          path: |
            .full-board-run/phase-results
            .full-board-run/phase-replay-runtime.json
            .full-board-run/runtime-manifest.json
            experiments/full-board-ten/source-bundles/manifest.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Require a valid diagnostic observation
        if: always()
        run: test "${{ steps.replay.outcome }}" = success
