name: Native DDR port-cost comparison

on:
  push:
    branches: [bench/native-port-cost-3244-20261119]

permissions:
  contents: read

jobs:
  route:
    name: Native pair (${{ matrix.board }}, ${{ matrix.cohorts }})
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { board: butterstick, experiment: published, cohorts: "original" }
          - { board: glider, experiment: published, cohorts: "spaced" }
          - { board: icepi, experiment: published, cohorts: "spaced" }
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      BOARD: ${{ matrix.board }}
      COHORT: ${{ matrix.cohorts }}
      FULL_BOARD_COHORTS: ${{ matrix.cohorts }}
      FULL_BOARD_EXPERIMENT: ${{ matrix.experiment }}

    steps:
      - name: Checkout benchmark controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Checkout reviewed search source
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tiny-hypergraph
          ref: cba224ed2ced6d8ed4184f551740d3e4e62c219f
          path: .full-board-run/source-tiny
          persist-credentials: false
          sparse-checkout: lib

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare verified package runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Prepare authentic paired cases
        id: prepare
        run: >-
          bun experiments/full-board-ten/prepare-cases.ts
          "$FULL_BOARD_ROOT/sources/original/experiments/full-board-priority-analysis"
          "$FULL_BOARD_ROOT/sources/spaced"
          "$FULL_BOARD_ROOT/cases"
          "$BOARD"

      - name: Freeze published control
        run: python3 experiments/full-board-ten/activate-port-cost.py "$FULL_BOARD_ROOT" baseline "$BOARD" "$COHORT"

      - name: Run published full board
        id: base
        continue-on-error: true
        run: bun experiments/full-board-ten/run-one.ts "$FULL_BOARD_ROOT/lanes/base/$BOARD-$COHORT.json" "$FULL_BOARD_ROOT/results/$BOARD/$COHORT/base"

      - name: Preserve published control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: port-cost-${{ matrix.board }}-${{ matrix.cohorts }}-base
          path: .full-board-run/results/${{ matrix.board }}/${{ matrix.cohorts }}/base
          if-no-files-found: error
          retention-days: 7

      - name: Activate qualified source change
        run: python3 experiments/full-board-ten/activate-port-cost.py "$FULL_BOARD_ROOT" candidate "$BOARD" "$COHORT"

      - name: Run candidate full board
        id: candidate
        continue-on-error: true
        run: bun experiments/full-board-ten/run-one.ts "$FULL_BOARD_ROOT/lanes/candidate/$BOARD-$COHORT.json" "$FULL_BOARD_ROOT/results/$BOARD/$COHORT/candidate"

      - name: Preserve candidate board
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: port-cost-${{ matrix.board }}-${{ matrix.cohorts }}-candidate
          path: .full-board-run/results/${{ matrix.board }}/${{ matrix.cohorts }}/candidate
          if-no-files-found: error
          retention-days: 7

      - name: Compare completed nets
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          root=Path(os.environ['FULL_BOARD_ROOT'])/'results'/os.environ['BOARD']/os.environ['COHORT']
          reports={lane:json.loads((root/lane/'assessment.json').read_text()) for lane in ['base','candidate']}
          print(json.dumps({lane:{'connectedNets':report['connectedNets'],'findings':report['findings']} for lane,report in reports.items()}))
          PYTHON

      - name: Preserve comparison provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: port-cost-${{ matrix.board }}-${{ matrix.cohorts }}-proof
          path: |
            .full-board-run/base-manifest.json
            .full-board-run/candidate-manifest.json
            .full-board-run/port-cost-runtime-proof.json
            .full-board-run/lanes
            experiments/full-board-ten/port-cost-plan.json
            experiments/full-board-ten/port-cost/mapping-proof.json
            experiments/full-board-ten/release.json
            experiments/full-board-ten/harness-provenance.json
            experiments/full-board-ten/source-provenance.json
          if-no-files-found: error
          retention-days: 7
