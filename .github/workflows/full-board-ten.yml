name: ButterStick exact same-net segment reuse phase qualification

on:
  push:
    branches: [bench/butter-exact-segment-reuse-3216]

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    name: Retained source pair and native ButterStick plane escape
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    env:
      FULL_BOARD_ROOT: ${{ github.workspace }}/.full-board-run
      FULL_BOARD_RUNTIME_MANIFEST: ${{ github.workspace }}/.full-board-run/runtime-manifest.json
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.full-board-run/bun-cache
      FULL_BOARD_COHORTS: original
      FULL_BOARD_EXPERIMENT: butter-exact-segment-reuse
      BOARD: butterstick
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout reviewed benchmark controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/full-board-ten
            .github/workflows/full-board-ten.yml
            AGENTS.md

      - name: Checkout immutable original circuits
        uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ea398b4023119f65157e876a3101aa6ce3ca5f97
          path: .full-board-run/sources/original
          persist-credentials: false
          sparse-checkout: experiments/full-board-priority-analysis

      - name: Checkout immutable spaced circuits
        uses: actions/checkout@v4
        with:
          repository: ShiboSoftwareDev/core-ddr-benchmark
          ref: a3679559d6027aea2c441c1078853d58925d3a12
          path: .full-board-run/sources/spaced
          persist-credentials: false
          sparse-checkout: |
            full-boards
            circuits
            scripts
            licenses
            provenance

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare unchanged verified published runtime
        run: python3 experiments/full-board-ten/bootstrap.py --root "$FULL_BOARD_ROOT"

      - name: Authenticate retained source entries and native Butter input
        run: python3 experiments/full-board-ten/prepare-butter-phase.py "$FULL_BOARD_ROOT"

      - name: Run unchanged source control on native plane escape
        run: >-
          timeout 960s bun experiments/full-board-ten/run-tiny-source-phase.ts
          "$FULL_BOARD_ROOT/phase-runtime-base.json"
          "$FULL_BOARD_ROOT/native-phase/base"

      - name: Require complete source-control coarse parity
        run: python3 experiments/full-board-ten/verify-butter-phase.py "$FULL_BOARD_ROOT" base

      - name: Run candidate on the entire native plane-escape phase
        run: >-
          timeout 960s bun experiments/full-board-ten/run-tiny-source-phase.ts
          "$FULL_BOARD_ROOT/phase-runtime-candidate.json"
          "$FULL_BOARD_ROOT/native-phase/candidate"

      - name: Require actual whole-phase completion
        run: python3 experiments/full-board-ten/verify-butter-phase.py "$FULL_BOARD_ROOT" candidate

      - name: Preserve evidence even when completion fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: butter-tiny-reuse-phase-${{ github.run_attempt }}
          path: |
            .full-board-run/native-input
            .full-board-run/native-phase
            .full-board-run/phase-runtime-*.json
            .full-board-run/runtime-manifest.json
            .full-board-run/butter-artifact-proof.json
            .full-board-run/retained-source/provenance.json
            .full-board-run/retained-source/published-closure-audit.json
            .full-board-run/retained-source/glider-control-validation.json
            .full-board-run/retained-source/base/index.js
            .full-board-run/retained-source/base/index.js.map
            .full-board-run/retained-source/candidate/index.js
            .full-board-run/retained-source/candidate/index.js.map
            experiments/full-board-ten/butter-phase-plan.json
          if-no-files-found: error
          retention-days: 7
