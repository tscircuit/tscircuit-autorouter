name: Validate reviewed fanout source
on:
  push:
    branches: [codex/ddr2427-concerns-clean]
permissions:
  contents: read
jobs:
  source-check:
    strategy:
      fail-fast: false
      matrix:
        revision: ["ae13569eb35dccc74e99708794cb2135a5c3ddc0", "e4edfc8122093bf7c6d67677f4cdc3344ef3983e", "554e03f4df22fadd2a9a628930052ee46fa948af", "49575e9a305851105819caf2a354a884d840510e", "6a081e9f703e08123238cb529243f695d1c78cd0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - if: always()
        run: bun run typecheck
