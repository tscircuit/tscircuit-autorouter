name: "Latest published six-board baseline: fanout then buses then rest"
on:
  push:
    branches: [codex/ddr2417-published-baseline]
permissions:
  contents: read
  actions: read
jobs:
  boards:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 83180d0881807ce08dc38b0cc226b9eb8fcca59d
          path: router
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 1a16da2f74fc2c80712d52abb17254dd2a80e2c5
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build the frozen latest published stack
        run: |
          for folder in router core; do (cd "$folder" && bun install --ignore-scripts); done
          (cd router && bun build lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts --target bun --packages external --outfile benchmark-runtime/pipeline9.js)
          cd experiments/full-board-priority-analysis
          python3 - <<'PYDEPS'
          import json
          from pathlib import Path
          path=Path('package.json');package=json.loads(path.read_text());package['dependencies']['tscircuit']='0.0.3235';path.write_text(json.dumps(package,indent=2)+'\n')
          PYDEPS
          bun install --ignore-scripts
          bun build-core.ts ../../core
      - name: Verify fanout then buses then remaining nets, and route fresh
        working-directory: experiments/full-board-priority-analysis
        env:
          BOARD_ID: ${{ matrix.board }}
          FULL_BOARD_CAPTURE_STAGE_INPUTS: "1"
        run: |
          export FULL_BOARD_CORE_SOURCE="$GITHUB_WORKSPACE/core"
          export FULL_BOARD_CORE_MODULE="$PWD/patched-core/index.js"
          export FULL_BOARD_COPPER_MODULE="$PWD/patched-core/find-floating-copper.js"
          export FULL_BOARD_ROUTER_MODULE="$GITHUB_WORKSPACE/router/benchmark-runtime/pipeline9.js"
          export FULL_BOARD_ROUTER_COMMIT="83180d0881807ce08dc38b0cc226b9eb8fcca59d"
          mkdir -p "$GITHUB_WORKSPACE/results/$BOARD_ID"
          cp package.json "$GITHUB_WORKSPACE/results/$BOARD_ID/runtime-package.json"
          cp bun.lock "$GITHUB_WORKSPACE/results/$BOARD_ID/runtime-bun.lock"
          bun inspect-routing-workflow.tsx "$BOARD_ID" "$GITHUB_WORKSPACE/results/$BOARD_ID/plan.json"
          bun run-fanout-bus-first.ts "$BOARD_ID" "$GITHUB_WORKSPACE/results/$BOARD_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published2417-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export native PCB output and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          names={'plan.json','progress.json','assessment.json','diagnostics.json','process.json','circuit.json','pcb.svg','worker.log','runtime-package.json','runtime-bun.lock'}
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file() and (path.name in names or path.name.startswith('fanout-') and path.name.endswith('.json.gz')):
                      archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('FANOUT_BUS_FIRST_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('FANOUT_BUS_FIRST_EVIDENCE_END')
          PY

  native-profile:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 5f568062b3f3ba6c2c16e43271eab6c1f7373d7d
          path: fanout
      - uses: actions/download-artifact@v4
        with:
          name: fanout-bus-first-icepi
          run-id: 44296522072
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Profile the native iCEPi regression fixture with published fanout86
        run: |
          (cd fanout && bun install --frozen-lockfile --ignore-scripts)
          cp experiments/full-board-priority-analysis/replay-native-plane-drop.ts fanout/replay-native-plane-drop.ts
          mkdir -p native
          cd fanout
          bun --cpu-prof --cpu-prof-dir "$GITHUB_WORKSPACE/native" --cpu-prof-name fanout.cpuprofile replay-native-plane-drop.ts "$GITHUB_WORKSPACE/captured/icepi/fanout-1-input.json.gz" "$GITHUB_WORKSPACE/native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published2417-native-profile
          path: native
      - name: Export profile and native copper evidence
        if: always()
        run: |
          python3 - <<'PYPROFILE'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('native').glob('*'):
                  if path.is_file(): archive.writestr(path.name,path.read_bytes())
          print('NATIVE_PLANE_DROP_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('NATIVE_PLANE_DROP_EVIDENCE_END')
          PYPROFILE
  fanout31:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: 5f568062b3f3ba6c2c16e43271eab6c1f7373d7d
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run all 72 fanout31 cases
        run: ./benchmark.sh --dataset dataset31 --concurrency 16 --sample-timeout-seconds 120 --output-directory benchmark-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published2417-fanout31
          path: benchmark-results
      - name: Export benchmark results and input checksums
        if: always()
        run: |
          python3 - <<'PYBENCH'
          import hashlib,json
          from pathlib import Path
          report=Path('benchmark-results/benchmark.json')
          if report.exists(): print('FANOUT31_REPORT',report.read_text().replace('\n',''))
          checksums={str(path.relative_to('benchmark-results/inputs')):hashlib.sha256(path.read_bytes()).hexdigest() for path in Path('benchmark-results/inputs').rglob('*.json')}
          print('FANOUT31_INPUT_CHECKSUMS',json.dumps(checksums,separators=(',',':')))
          PYBENCH
