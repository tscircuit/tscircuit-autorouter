name: Read-only pinned experiment artifact inspection

on:
  push:
    branches: [codex/deep-experiment-artifact-audit]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Inspect ${{ matrix.sourceKey }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sourceKey: copper-soft-only-srj24
            kind: full
            expectedFile: expected-copper-soft-only-srj24.json
            runId: 40639451020
            artifactName: pinned-experiment-3201-srj24
    steps:
      - name: Checkout read-only artifact inspector
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify read-only identity analysis invariants
        run: python3 scripts/experiment-artifact-audit/test-via-identity-equivalence.py
      - name: Verify supplemental intended-reference invariants
        run: python3 scripts/experiment-artifact-audit/test-intended-trace-references.py
      - name: Verify targeted parsing and inspection boundaries
        run: |
          python3 scripts/experiment-artifact-audit/test-targeted-parser-source.py
          python3 scripts/experiment-artifact-audit/test-inspect-targeted-forest-scope-artifact.py
      - name: Verify immutable source artifact metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/experiment-artifact-audit/verify-artifact-metadata.py
          --expected 'scripts/experiment-artifact-audit/${{ matrix.expectedFile }}'
          --output compact-report/source-artifact-metadata.json
      - name: Download retained exact-source benchmark artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.runId }}
          name: ${{ matrix.artifactName }}
          path: downloaded
      - name: Inspect captured evidence without routing or validator changes
        if: matrix.kind == 'full'
        run: >-
          python3 scripts/experiment-artifact-audit/inspect-artifact.py
          --directory downloaded
          --expected 'scripts/experiment-artifact-audit/${{ matrix.expectedFile }}'
          --output compact-report/inspection.json
          --source-metadata compact-report/source-artifact-metadata.json
          --example-limit 3
          > compact-report/full-inspection.log
      - name: Print compact verified inspection facts
        if: matrix.kind == 'full'
        run: >-
          python3 scripts/experiment-artifact-audit/print-compact-inspection.py
          --report compact-report/inspection.json
      - name: Resolve declared electrical identities separately from coordinate unions
        if: matrix.kind == 'full'
        run: >-
          python3 scripts/experiment-artifact-audit/inspect-via-identity-equivalence.py
          --directory downloaded
          --expected 'scripts/experiment-artifact-audit/${{ matrix.expectedFile }}'
          --inspection compact-report/inspection.json
          --include-baseline
          --examples-per-class 3
          --output compact-report/identity-equivalence.json
      - name: Query intended original ownership without extending original identities
        if: matrix.kind == 'full'
        run: >-
          python3 scripts/experiment-artifact-audit/inspect-intended-trace-references.py
          --directory downloaded
          --expected 'scripts/experiment-artifact-audit/${{ matrix.expectedFile }}'
          --inspection compact-report/inspection.json
          --examples-per-class 3
          --output compact-report/intended-trace-references.json
      - name: Inspect exact targeted original cases without qualifying a full corpus
        if: matrix.kind == 'targeted'
        run: >-
          python3 scripts/experiment-artifact-audit/inspect-targeted-forest-scope-artifact.py
          --directory downloaded
          --expected 'scripts/experiment-artifact-audit/${{ matrix.expectedFile }}'
          --source-metadata compact-report/source-artifact-metadata.json
          --output compact-report/targeted-inspection.json
          --example-limit 3
      - name: Retain compact inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-inspection-${{ matrix.sourceKey }}
          path: compact-report
          if-no-files-found: error
          retention-days: 30
