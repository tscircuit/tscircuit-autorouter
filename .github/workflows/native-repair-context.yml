name: Compare complete native repair context
on:
  push:
    branches: [analysis/native-copper-repair-context]
    paths: [.github/workflows/native-repair-context.yml]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [physical-original, physical-validated, physical-complete]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0641e36e11b35d2d590ccdb8ef6749511493b39
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Isolate routing and repair context
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          from pathlib import Path
          variant=os.environ["VARIANT"]
          prefix="lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/"
          p=Path(prefix+"Pipeline9HighDensitySolver.ts")
          source=p.read_text()
          source=source.replace("    if (hasImmutablePreload) {","    {")
          source=source.replace('''    const hasImmutablePreload = this.fixedHdRoutes.some(
                (route) => route.isFixed === true,
              )''',"    const hasImmutablePreload = this.fixedHdRoutes.length > 0")
          import re
          source,n=re.subn(r"const hasImmutablePreload = this.fixedHdRoutes.some\(\s*\(route\) => route.isFixed === true,\s*\)", "const hasImmutablePreload = this.fixedHdRoutes.length > 0", source)
          assert "const hasImmutablePreload = this.fixedHdRoutes.length > 0" in source
          if variant!="physical-original":
              source,n=re.subn(r"immutableHdRoutes: this.activeFallbackFixedObstacleRoutes.filter\(\s*\(route\) => route.isFixed === true \|\| route.isThroughObstacle === true,\s*\),", "immutableHdRoutes: regionalCopperRoutes,", source)
              assert n==1
          p.write_text(source)
          if variant=="physical-complete":
              for name in ["AutoroutingPipelineSolver9_PreloadedTraceGraph.ts","Pipeline9HighDensityForceImproveSolver.ts","Pipeline9RegionalFallbackSolver.ts"]:
                  url="https://raw.githubusercontent.com/tscircuit/tscircuit-autorouter/3db2cef321fe8821239903945e3bcc5eb1c94fd9/"+prefix+name
                  Path(prefix+name).write_bytes(urllib.request.urlopen(url).read())
              package=Path("package.json")
              data=json.loads(package.read_text())
              data["devDependencies"]["high-density-repair01"]="git+https://github.com/tscircuit/high-density-repair01.git#eeca3801e32a6b413a5dbfe6e4b72b5858cf2738"
              package.write_text(json.dumps(data,indent=2)+"\n")
          # Report solver failure, without exporting inputs or route geometry.
          p=Path("tests/bugs/t113-linux-exact-pipeline9-root.test.ts")
          s=p.read_text().replace("  expect(solver.solved).toBe(true)",'  console.log("T113_STATUS", JSON.stringify({error:solver.error,stats:solver.stats}))\n  expect(solver.solved).toBe(true)')
          p.write_text(s)
          PY
      - run: bun install
      - name: Run unchanged routing and DRC assertions
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/t113-linux-exact-pipeline9-root.test.ts tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/repro/pipeline9-h616-staged-regional-clearance.test.ts tests/repro/pipeline9-h616-preload-reachability.test.ts tests/features/pipeline9-srj33-sample37-pair-repair.test.ts
