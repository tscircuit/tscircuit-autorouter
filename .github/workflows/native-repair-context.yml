name: Verify real OrangeCrab reproduction on the original autorouter
on:
  push:
    branches: [analysis/native-copper-repair-context]
    paths: [.github/workflows/native-repair-context.yml]
permissions:
  contents: write
jobs:
  before:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bc7eeee1d42c94eb72f32460dc03f54add143e5
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Restore unchanged published OrangeCrab reproduction
        run: |
          git checkout 67930e546d96d48fea7e5869bdf112122fbd342f -- tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg tests/fixtures/orangecrab-native-fixed-traces.srj.json
      - run: bun install
      - name: Generate original routing and clearance image
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Save verified reproduction
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts tests/features/__snapshots__/pipeline9-orangecrab-native-fixed-traces.snap.svg tests/fixtures/orangecrab-native-fixed-traces.srj.json
          git commit -m "Reproduce OrangeCrab native trace cleanup on the base autorouter"
          git push origin HEAD:refs/heads/analysis/orangecrab-original-native-repro
