# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'version-bumps/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun i

      - name: Run type check
        run: bunx tsc --noEmit

      - name: Install gps logger reproduction dependencies
        run: bun install --cwd tests/gps-logger --frozen-lockfile

      - name: Type check gps logger reproduction
        run: bunx tsc --noEmit -p tests/gps-logger/tsconfig.check.json
