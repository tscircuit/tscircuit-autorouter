name: Reroute six full boards after the merged core fixes
on:
  push:
    branches: [codex/full-boards-merged-20261116]
  workflow_dispatch:
    inputs:
      core_ref:
        description: Core source revision
        required: true
        default: 2f7db1dee7cf872cbe2b358ae00fa8f841501610
      fixed_core_ref:
        description: Optional paired core fix revision
        required: false
        default: ""
permissions:
  contents: read
jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: ${{ inputs.core_ref || '2f7db1dee7cf872cbe2b358ae00fa8f841501610' }}
          path: .merged-core
      - uses: actions/checkout@v4
        if: inputs.fixed_core_ref != '' && inputs.fixed_core_ref != null
        with:
          repository: tscircuit/core
          ref: ${{ inputs.fixed_core_ref }}
          path: .fixed-core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install current solver and circuit dependencies
        run: |
          bun install --ignore-scripts
          cd experiments/full-board-priority-analysis
          bun install --frozen-lockfile --ignore-scripts
          cd ../../.merged-core
          bun install --ignore-scripts
          cd ..
          if [ -d .fixed-core ]; then
            cmp .merged-core/package.json .fixed-core/package.json
            ln -s ../.merged-core/node_modules .fixed-core/node_modules
          fi
      - name: Reroute and assess the original passing DDR sample
        env:
          BOARD_ID: ${{ matrix.board }}
        run: |
          for variant in merged fixed; do
            if [ ! -d ".$variant-core" ]; then continue; fi
            bun "$GITHUB_WORKSPACE/.merged-core/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" \
              --core "$GITHUB_WORKSPACE/.$variant-core" --circuit "$BOARD_ID" \
              --out "$GITHUB_WORKSPACE/results/$variant/ddr" --timeout 600
            python3 - "$variant" <<'PY'
          import json, sys
          from pathlib import Path
          variant = sys.argv[1]
          result = json.loads(Path(f'results/{variant}/ddr/results.json').read_text())
          print('DDR_CONTROL_RESULT', variant, json.dumps(result, separators=(',', ':')))
          assert all(case['status'] == 'passed' for case in result['cases'])
          PY
          done
      - name: Reroute both full-board modes with fresh copper
        env:
          FULL_BOARD_CASE_IDS: ${{ matrix.board }}
        working-directory: experiments/full-board-priority-analysis
        run: |
          for variant in merged fixed; do
            if [ ! -d "../../.$variant-core" ]; then continue; fi
            bun build-core.ts "../../.$variant-core"
            FULL_BOARD_VARIANT="$variant" bun plane-suite.ts "../../results/$variant/full"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged-full-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export review evidence for the local analysis
        if: always()
        run: |
          python3 - <<'PY'
          import base64, io, zipfile
          from pathlib import Path
          stream = io.BytesIO()
          names = {'environment.json', 'summary.json', 'progress.json', 'assessment.json', 'diagnostics.json', 'process.json', 'results.json', 'pcb.svg', 'circuit.json'}
          with zipfile.ZipFile(stream, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file() and (path.name in names or path.name.endswith('.srj.json')):
                      archive.writestr(str(path.relative_to('results')), path.read_bytes())
          print('MERGED_BOARD_EVIDENCE_BEGIN')
          encoded = base64.b64encode(stream.getvalue()).decode()
          for offset in range(0, len(encoded), 8000):
              print(encoded[offset:offset + 8000])
          print('MERGED_BOARD_EVIDENCE_END')
          PY
