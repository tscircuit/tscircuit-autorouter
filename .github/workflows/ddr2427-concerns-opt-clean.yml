name: Validate reviewed fanout source
on:
  push:
    branches: [codex/ddr2427-concerns-opt-clean]
permissions:
  contents: read
jobs:
  source-check:
    strategy:
      fail-fast: false
      matrix:
        revision: ["ae13569eb35dccc74e99708794cb2135a5c3ddc0", "e4edfc8122093bf7c6d67677f4cdc3344ef3983e", "fe8a51b2a0952175de94126915e9a0ebf1a111e5", "4ba26be75a787cbe91632585b581c70d88ba1709", "9d2431e84bbbe9ae1f0d88b3ae75204c33831342"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.revision }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - if: always()
        run: bun run typecheck
