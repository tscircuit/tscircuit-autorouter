name: Verify native trace anchor compatibility
on:
  push:
    branches: [analysis/native-a03-copper-guidance]
    paths: [.github/workflows/native-anchor-compatibility.yml]
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: parent
            branch: analysis/native-anchor-parent
          - name: native
            branch: analysis/native-a03-copper-guidance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install
      - name: Run original routing, physical-clearance and length-matching checks
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/bugs/bugreport96-full-gameboy-no-breakout.test.ts tests/bugs/t113-linux-exact-pipeline9-root.test.ts tests/repro/pipeline9-h616-staged-regional-clearance.test.ts tests/repro/pipeline9-h616-preload-reachability.test.ts tests/features/pipeline9-srj33-sample37-pair-repair.test.ts tests/features/pipeline9-srj23-sample46-regional-trace-set.test.ts tests/repro/pipeline10-artix7-ddr-bus-length-matching.test.ts
      - name: Verify the real OrangeCrab native-trace reproduction
        if: matrix.name == 'native'
        env:
          BUN_UPDATE_SNAPSHOTS: '1'
        run: bun test --timeout 9999999 tests/features/pipeline9-orangecrab-native-fixed-traces.test.ts
      - name: Check types
        if: always()
        run: bunx tsc --noEmit
      - name: Save SVGs only after the original routing assertions pass
        if: success()
        run: |
          git config user.name "tscircuit-bot"
          git config user.email "actions@github.com"
          git add -- '*.snap.svg'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update verified routing SVGs"
          git push origin HEAD:${{ matrix.branch }}
