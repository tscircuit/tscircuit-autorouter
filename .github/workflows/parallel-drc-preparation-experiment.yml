name: Prepared parallel DRC experiment
on:
  push:
    branches: [codex/parallel-drc-preparation]
    paths:
      - .github/workflows/parallel-drc-preparation-experiment.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/checks
          ref: 2632078db20dbc4af65b4d7e9ba0cb932a97d22d
          path: checks-source
      - name: Build prepared reference checks
        run: |
          cd checks-source
          bun install
          bun run build
          cp -r dist/. ../node_modules/@tscircuit/checks/dist/
          cd ..
          rm -rf checks-source
      - run: bunx tsc --noEmit
      - run: bun test tests/solvers/parallel-reference-drc-workers.test.ts tests/features/pipeline9-srj18-sample01-thread-parity.test.ts --timeout 9999999
  benchmark:
    needs: validate
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/checks
          ref: 2632078db20dbc4af65b4d7e9ba0cb932a97d22d
          path: checks-source
      - name: Build prepared reference checks
        run: |
          cd checks-source
          bun install
          bun run build
          cp -r dist/. ../node_modules/@tscircuit/checks/dist/
          cd ..
          rm -rf checks-source
      - run: bash benchmark.sh --dataset 18 --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-drc-preparation-result
          path: |
            benchmark-result.json
            benchmark-result.txt
