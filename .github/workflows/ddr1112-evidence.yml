name: Collect completed DDR1112 evidence
on:
  push:
    branches: [codex/ddr1112-evidence]
permissions:
  contents: read
  actions: read
jobs:
  routed-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 43968901837
          github-token: ${{ github.token }}
          name: diff-png-and-snap-svg-artifacts-node1
          path: snapshots
      - uses: actions/download-artifact@v4
        with:
          run-id: 43968901837
          github-token: ${{ github.token }}
          name: diff-png-and-snap-svg-artifacts-node9
          path: snapshots9
      - name: Export the validated received native PCB SVG
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in [*Path('snapshots').rglob('*bugreport107*.svg'), *Path('snapshots9').rglob('*bugreport109*.svg')]:
                  archive.writestr(path.name,path.read_bytes())
          print('DDR1112_BUG107_NATIVE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('DDR1112_BUG107_NATIVE_END')
          PY
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for the submitted candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            status="$(gh api repos/tscircuit/tscircuit-autorouter/actions/runs/43967019925 --jq .status)"
            if [ "$status" = completed ]; then exit 0; fi
            sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          run-id: 43967019925
          github-token: ${{ github.token }}
          pattern: endpoint-layers-*
          path: evidence/after
      - name: Export compact native PCB and measured metadata
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          names={'environment.json','summary.json','progress.json','assessment.json','diagnostics.json','process.json','results.json','pcb.svg'}
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('evidence').rglob('*'):
                  if path.is_file() and path.name in names:
                      archive.writestr(str(path.relative_to('evidence')),path.read_bytes())
          print('DDR1112_AFTER_COMPACT_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('DDR1112_AFTER_COMPACT_EVIDENCE_END')
          PY
