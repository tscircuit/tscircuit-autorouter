name: Coalesced full18 retained placement and lifecycle audit

on:
  push:
    branches: [codex/coalesced-full18-offline-artifact-audit-20261029]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ee0dac23c8ff76fde81a0124bf444790a8394f25
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify exact retained full18 ZIP and all32 actual success or native failure identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 controller/scripts/experiment-audit/read-coalesced-full18-artifact.py --source candidate --output retained-artifacts --manifest controller/scripts/experiment-audit/coalesced-full18-offline-audit.json > private-identity-audit.log 2>&1; then
            echo "Retained-artifact identity audit failed; detailed data remains on the ephemeral runner."
            exit 1
          fi
      - name: Install unchanged declared dependencies without routing
        run: python3 controller/scripts/experiment-audit/install-pinned-dependencies.py candidate
      - name: Read retained sample16 materialized copper using unchanged original evaluators
        run: |
          mkdir -p candidate/scripts/experiment-audit
          cp controller/scripts/experiment-audit/audit-coalesced-full18-placement.ts candidate/scripts/experiment-audit/
          cd candidate
          if ! bun scripts/experiment-audit/audit-coalesced-full18-placement.ts ../retained-artifacts/placement-bindings.json ../coalesced-full18-placement-aggregate.json > ../private-placement-audit.log 2>&1; then
            echo "Retained placement audit failed; detailed data remains on the ephemeral runner."
            exit 1
          fi
      - name: Export aggregates and provenance only
        run: |
          python3 - <<'PY'
          import json
          identity = json.load(open('retained-artifacts/offline-identity-receipt.json'))
          placement = json.load(open('coalesced-full18-placement-aggregate.json'))
          aggregate = {'scope': 'Read-only immutable full18 retained outputs; all32 identities include native B6/B13 failures; no routing, benchmark, evaluator edits or raw PCB exports', 'identity': identity, 'placement': placement}
          json.dump(aggregate, open('coalesced-full18-offline-audit-aggregate.json', 'w'), indent=2)
          print('COALESCED_FULL18_OFFLINE_AUDIT_JSON ' + json.dumps(aggregate, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coalesced-full18-offline-audit-aggregate
          path: coalesced-full18-offline-audit-aggregate.json
