# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable autorouter candidate commit
        required: true
        type: string
      compare_pre_hd:
        description: Compare isolated upstream geometry against main
        type: boolean
        default: false
      base_ref:
        description: Base ref for isolated geometry comparison
        type: string
        default: adbcaf83bb2c53a911b6fc6fd1246bf9605800cd
      artifact_id:
        description: Public test artifact to inspect instead of building
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    if: inputs.artifact_id == '' && inputs.compare_pre_hd != true && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'version-bumps/'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Run build
        run: bun run build

      - name: Check packed solver runtime consumers
        run: bun scripts/check-solver-runtime-packaging.ts

      - name: Create npm package tarball
        id: create-npm-package-tarball
        run: |
          mkdir -p npm-package
          npm pack --pack-destination npm-package
          TARBALL_PATH=$(find npm-package -maxdepth 1 -name '*.tgz' -type f | head -n 1)
          if [ -z "$TARBALL_PATH" ]; then
            echo "No npm package tarball was created" >&2
            exit 1
          fi
          echo "tarball-name=$(basename "$TARBALL_PATH")" >> "$GITHUB_OUTPUT"
          echo "tarball-path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"

      - name: Ensure AWS CLI is available
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          aws --version

      - name: Upload npm package tarball to R2
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        id: upload-npm-package-tarball-to-r2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARBALL_NAME: ${{ steps.create-npm-package-tarball.outputs.tarball-name }}
          TARBALL_PATH: ${{ steps.create-npm-package-tarball.outputs.tarball-path }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done

          OBJECT_KEY="npm-tarballs/$RUN_ID-$RUN_ATTEMPT/$TARBALL_NAME"
          R2_ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          PACKAGE_URL="${R2_PUBLIC_BASE_URL%/}/$OBJECT_KEY"

          aws s3 cp "$TARBALL_PATH" "s3://$R2_BUCKET/$OBJECT_KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/gzip"

          echo "package-url=$PACKAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded npm package tarball to: $PACKAGE_URL"
          echo "Install with:"
          echo "  bun add -D $PACKAGE_URL"
          echo "### npm package tarball" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $PACKAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install with:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo "bun add -D $PACKAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  inspect-visual-artifact:
    if: inputs.artifact_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the selected public test artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: gh api "/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
      - name: Inspect the exact expected and received mesh drawing
        run: |
          python3 -m pip install pillow --quiet
          python3 - <<'PY_ARTIFACT'
          import base64, io, json, zipfile, xml.etree.ElementTree as ET
          from PIL import Image
          with zipfile.ZipFile('artifact.zip') as z:
              selected = {name: z.read(name) for name in z.namelist() if 'stmp157-mesh-retention-visual' in name}
          print('FILES=' + json.dumps({name: len(data) for name, data in selected.items()}))
          drawings = {}
          for name, data in selected.items():
              if name.endswith('.svg'):
                  root = ET.fromstring(data)
                  drawings[name] = list(root.iter())
                  print('SVG_TEXTS=' + json.dumps({'file':name,'texts':[el.text for el in root.iter() if el.tag.endswith('text')]}))
          names = list(drawings)
          if len(names) == 2:
              a,b = (drawings[name] for name in names)
              differences = [{'index':i,'before': {'tag':x.tag,'attrs':x.attrib,'text':x.text}, 'after':{'tag':y.tag,'attrs':y.attrib,'text':y.text}} for i,(x,y) in enumerate(zip(a,b)) if (x.tag,x.attrib,x.text)!=(y.tag,y.attrib,y.text)]
              print('XML_DIFF=' + json.dumps({'files':names,'elementCounts':[len(a),len(b)],'differences':differences[:12],'totalDifferences':len(differences)}))
          for name,data in selected.items():
              if not name.endswith('.diff.png'):continue
              img = Image.open(io.BytesIO(data)).convert('RGB')
              mask = Image.new('L',img.size)
              mask.putdata([255 if r>200 and b>200 and g<100 else 0 for r,g,b in img.getdata()])
              box = mask.getbbox()
              print('DIFF_BOUNDS=' + json.dumps(box))
              if box:
                  x0,y0,x1,y1=box
                  crop=img.crop((max(0,x0-20),max(0,y0-20),min(img.width,x1+20),min(img.height,y1+20)))
                  crop.thumbnail((768,768))
                  out=io.BytesIO();crop.save(out,format='PNG')
                  print('CROP_PNG_BASE64=' + base64.b64encode(out.getvalue()).decode())
          PY_ARTIFACT

  compare-pre-hd:
    if: inputs.compare_pre_hd == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Compare fresh isolated topology results before detailed routing
        run: |
          for revision in base head; do
            cp tooling/scripts/inspect-pre-hd.ts "$revision/inspect-pre-hd.ts"
            (cd "$revision" && bun install --ignore-scripts --backend=copyfile && REVISION="$revision" bun inspect-pre-hd.ts)
          done
