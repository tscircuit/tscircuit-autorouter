name: Native port-pathing benchmark

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  benchmark:
    if: contains(github.event.pull_request.title, '[PORT PATHING]')
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reference
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Save matching x64 runtime for local benchmark reproduction
        run: |
          curl --fail --location \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-x64.zip \
            --output bun-linux-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: native-port-pathing-bun-linux-x64
          path: bun-linux-x64.zip
      - name: Install both revisions
        run: |
          cd reference
          bun install
          cd ../candidate
          bun install
      - name: Capture current Pipeline9 sample14 input
        working-directory: candidate
        run: bun scripts/benchmark/capture-native-port-pathing.ts 14 native-port-pathing.json --emit-capture
      - name: Compare isolated native searches in ABBA order
        working-directory: candidate
        run: |
          bun node_modules/tiny-hypergraph/scripts/benchmarking/native-port-point-pathing.ts \
            --input native-port-pathing.json \
            --reference ../reference/node_modules/tiny-hypergraph \
            --repeat 2 | tee native-port-pathing-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-port-pathing-profile
          path: |
            candidate/native-port-pathing.json.gz
            candidate/native-port-pathing-results.jsonl
