name: Compare Core-like stepping with source and bundle
on:
  push:
    branches: [analysis/butterstick-core-parity]
    paths: [.github/workflows/butterstick-core-parity.yml]
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [dist, preview]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install the same dependencies
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("package.json");m=json.loads(p.read_text())
          m["overrides"]={**m.get("overrides",{}),"csstype":"3.1.3"}
          p.write_text(json.dumps(m,indent=2)+"\n")
          PY
          bun install
      - name: Build the production bundle
        if: matrix.mode == 'dist'
        run: bun run build
      - name: Replay unchanged input
        env:
          MODE: ${{ matrix.mode }}
        run: |
          cat > core-parity.private.ts <<'TS'
          import {readFileSync,writeFileSync,mkdirSync} from "node:fs"
          import {gunzipSync,gzipSync} from "node:zlib"
          import {createHash} from "node:crypto"
          import {getBugReportSnapshotSvg} from "./lib/testing/getBugReportSnapshotSvg"
          import {evaluateRelaxedDrc} from "./lib/testing/evaluate-relaxed-drc"
          const input=JSON.parse(gunzipSync(readFileSync("tests/fixtures/assets/butterstick-fixed-via-force.srj.json.gz")).toString())
          const mode=process.env.MODE
          const lib=await import(mode==="dist"?"./dist/index.js":"./lib/index.ts")
          const solver=new lib.AutoroutingPipelineSolver9_PreloadedTraceGraph(input,{cacheProvider:null})
          const start=performance.now()
          if(mode==="preview") {
            let last=performance.now()
            while(!solver.solved&&!solver.failed) {
              solver.step()
              if(performance.now()-last>=250){solver.preview();last=performance.now();await new Promise(r=>setTimeout(r,0))}
            }
          }else solver.solve()
          if(!solver.solved)throw Error(solver.error??"Replay incomplete")
          const traces=solver.getOutputSimplifiedPcbTraces()
          const evaluation={inputSrj:input,srjWithPointPairs:solver.srjWithPointPairs,routedTraces:traces,includeBoardClearance:true,drcOptions:{traceClearance:input.minTraceToPadEdgeClearance,viaToPadClearance:input.minViaEdgeToPadEdgeClearance}}
          const result=evaluateRelaxedDrc(evaluation)
          console.log("CORE_PARITY="+JSON.stringify({mode,seconds:(performance.now()-start)/1000,errors:result.errors.length,traceCount:traces.length,viaCount:traces.reduce((n,t)=>n+t.route.filter(p=>p.route_type==="via").length,0),digest:createHash("sha256").update(JSON.stringify(traces)).digest("hex")}))
          mkdirSync("analysis-artifacts",{recursive:true})
          writeFileSync("analysis-artifacts/butterstick-"+mode+".svg",getBugReportSnapshotSvg(evaluation))
          writeFileSync("analysis-artifacts/butterstick-"+mode+".json.gz",gzipSync(JSON.stringify({input,traces,circuitJson:result.circuitJson})))
          TS
          bun core-parity.private.ts
          git config user.name "tscircuit bot"
          git config user.email "githubbot@tscircuit.com"
          git add analysis-artifacts
          git commit -m "Capture ButterStick $MODE replay output"
          git push origin HEAD:analysis/butterstick-parity-$MODE
