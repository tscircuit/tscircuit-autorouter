name: Worker tail profile
on:
  push:
    branches: [codex/worker-tail-profile]
    paths: [.github/workflows/worker-tail-profile.yml]
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        variant: [profile]
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Instrument individual node cost
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9HighDensityBatchSolver.ts")
          s=p.read_text()
          s=s.replace("      solver.solve()", '      const nodeStarted = performance.now()\n      solver.solve()\n      const nodeTime = performance.now() - nodeStarted\n      solver.benchmarkDiagnosticCounters["nodeTime:" + node.capacityMeshNodeId] = nodeTime')
          p.write_text(s)
          p=Path("scripts/benchmark/benchmark-run-task.ts")
          s=p.read_text().replace("    highDensityIterations: solver.highDensityRouteSolver?.iterations,", "    highDensityIterations: solver.highDensityRouteSolver?.iterations,\n    workerNodeTimes: (solver.highDensityRouteSolver as any)?.benchmarkDiagnosticCounters,\n    jointDrcStats: (solver as any).pipeline9JointDrcRepairSolver?.stats,")
          p.write_text(s)
          PY
      - run: bash benchmark.sh --dataset 18 --threads 4 --sample-numbers 2,4,13
      - name: Report measured worker tails
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open("benchmark-result.json"))
          for t in x["tests"]:
            m=t["routingMetrics"]
            times=sorted([v for k,v in m["workerNodeTimes"].items() if k.startswith("nodeTime:")], reverse=True)
            print(t["scenarioName"], "drc", m.get("jointDrcStats"), "phase",m["phaseTimeMs"].get("highDensityRouteSolver"),"sum",sum(times),"top",times[:8])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-tail-${{ matrix.variant }}
          path: |
            benchmark-result.json
            benchmark-result.txt
