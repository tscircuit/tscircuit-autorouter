name: Validate shared winding layer capacity
on:
  push:
    branches: [analysis/check-shared-capacity-2444]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ref: [22782814e0a770e51c5832827b3c5632b38ba8fd, f5cabaac17c50ac4be93150cae431e9c81e18c1b]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/winding-breakout-point-solver
          ref: ${{ matrix.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun test --timeout 9999999
      - run: bun run typecheck
      - name: Check formatting on the changed TypeScript files
        run: |
          paths=(lib/layer-assignment/assign-connection-layers.ts tests/glider-shared-layer-capacity.test.ts)
          if [ -f tests/shared-layer-reservations.test.ts ]; then paths+=(tests/shared-layer-reservations.test.ts); fi
          if [ -f lib/gate-placement/get-gate-axis-layout.ts ]; then paths+=(lib/gate-placement/get-gate-axis-layout.ts lib/gate-placement/place-breakout-gates.ts lib/solvers/GatePlacementSolver.ts); fi
          bunx biome format "${paths[@]}"
