name: Anti-slop diagnostics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    # Advisory during adoption. A failed setup remains visible in step outcomes.
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        id: install
        run: bun install
      - name: Verify plugin and config integration
        id: integration
        run: bun run test:anti-slop
      - name: Type check tooling
        id: typecheck
        run: bun run typecheck:anti-slop
      - name: Report lib warnings
        id: lint
        if: ${{ !cancelled() }}
        run: bun run lint:anti-slop
      - name: Summarize diagnostic status
        if: ${{ always() }}
        env:
          STEPS_JSON: ${{ toJson(steps) }}
        run: |
          echo '### Anti-slop adoption check (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Warnings request human review; they do not measure routing quality.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Setup or integration failures remain visible below and in the logs.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$STEPS_JSON" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
