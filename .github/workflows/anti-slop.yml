name: Anti-slop diagnostics

on:
  pull_request:
    branches: [main, codex/anti-slop-assertion-fixes]
  push:
    branches: [main]

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    # Advisory during adoption. A failed setup remains visible in step outcomes.
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        id: install
        run: bun install
      - name: Verify plugin and config integration
        id: integration
        run: bun run test:anti-slop
      - name: Type check tooling
        id: typecheck
        run: bun run typecheck:anti-slop
      - name: Report lib diagnostics
        id: lint
        if: ${{ !cancelled() }}
        run: bun run lint:anti-slop --format json | tee anti-slop-diagnostics.json
      - name: Upload full diagnostic inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: anti-slop-diagnostics
          path: anti-slop-diagnostics.json
          if-no-files-found: warn
      - name: Summarize diagnostic status
        if: ${{ always() }}
        env:
          STEPS_JSON: ${{ toJson(steps) }}
        run: |
          echo '### Anti-slop adoption check (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo 'All 24 pinned rules use upstream error severity; this job remains advisory.' >> "$GITHUB_STEP_SUMMARY"
          echo 'An advisory green check can contain a failed lint step. Inspect the outcomes and diagnostic artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Setup or integration failures remain visible below and in the logs.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$STEPS_JSON" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
