name: Repair portfolio width
on:
  push:
    branches: [codex/repair-portfolio-width]
    paths: [.github/workflows/repair-portfolio-width.yml]
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        warmups: ["2, 16", "4, 16", "2, 4", "2"]
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Select repair portfolio
        env:
          WARMUPS: ${{ matrix.warmups }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/Pipeline9JointDrcRepairSolver.ts")
          s=p.read_text()
          assert s.count("const warmups = [2, 4, 8, 16] as const")==1
          p.write_text(s.replace("const warmups = [2, 4, 8, 16] as const", "const warmups = ["+os.environ["WARMUPS"]+"] as const"))
          PY
      - run: bash benchmark.sh --dataset 18 --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-width-${{ matrix.warmups }}
          path: |
            benchmark-result.json
            benchmark-result.txt
