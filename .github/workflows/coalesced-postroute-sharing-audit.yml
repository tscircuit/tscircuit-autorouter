name: Coalesced camera unchanged postroute-sharing audit

on:
  push:
    branches: [codex/coalesced-postroute-sharing-audit-20261028]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ee0dac23c8ff76fde81a0124bf444790a8394f25
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify immutable existing private captured artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 controller/scripts/experiment-audit/fetch-qualified-copper-audit-artifacts.py --source candidate --output retained-artifacts --manifest controller/scripts/experiment-audit/coalesced-copper-audit-qualified-cases.json > private-fetch-audit.log 2>&1; then
            echo "::error::Private artifact identity checks failed; assertion details remain private"
            exit 1
          fi
      - name: Install unchanged source declarations in isolation without routing
        run: |
          if ! python3 controller/scripts/experiment-audit/install-pinned-dependencies.py candidate > private-dependency-install.log 2>&1; then
            echo "::error::Isolated dependency installation failed; detailed output remains private"
            exit 1
          fi
      - name: Apply the unchanged conservative prototype to qualified captured copper only
        run: |
          if ! python3 controller/scripts/experiment-audit/fetch-qualified-copper-audit-artifacts.py --source candidate --output retained-artifacts --manifest controller/scripts/experiment-audit/coalesced-copper-audit-qualified-cases.json --finalize-bindings > private-finalize-audit.log 2>&1; then
            echo "::error::Qualified original source bindings failed; assertion details remain private"
            exit 1
          fi
          mkdir -p candidate/scripts/experiment-audit
          cp controller/scripts/experiment-audit/audit-retention-fixed-artifact.ts candidate/scripts/experiment-audit/
          cp controller/scripts/experiment-audit/audit-retention-stage-geometry.ts candidate/scripts/experiment-audit/
          cp controller/scripts/experiment-audit/audit-original-source-via-pads.ts candidate/scripts/experiment-audit/
          cp controller/scripts/experiment-audit/audit-coalesced-captured-success.ts candidate/scripts/experiment-audit/
          cp controller/scripts/experiment-audit/audit-coalesced-postroute-sharing.ts candidate/scripts/experiment-audit/
          cp -R controller/scripts/experiment-audit/postroute-prototype candidate/scripts/experiment-audit/
          cd candidate
          if ! bun scripts/experiment-audit/audit-coalesced-postroute-sharing.ts ../retained-artifacts/binding-manifest.json ../coalesced-postroute-sharing-aggregate.json > ../private-postroute-audit.log 2>&1; then
            echo "::error::Offline postroute validation failed; detailed assertions remain private"
            exit 1
          fi
          python3 - <<'PY'
          import json
          report = json.load(open('../coalesced-postroute-sharing-aggregate.json'))
          print('COALESCED_POSTROUTE_SHARING_AUDIT_JSON ' + json.dumps(report, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coalesced-postroute-sharing-aggregate
          path: coalesced-postroute-sharing-aggregate.json
