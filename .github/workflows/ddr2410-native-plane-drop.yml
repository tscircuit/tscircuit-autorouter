name: Test native plane-drop fix on full boards and fanout31
on:
  push:
    branches: [codex/ddr2410-native-plane-drop]
permissions:
  contents: read
  actions: read
jobs:
  boards:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: d88899c9ac79cf48491a402b5e3643b3efabe373
          path: router
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 5d9e4a0630bebe77003ee31e0dfa5993ee22e394
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build published core and router with only the candidate fanout override
        run: |
          python3 - <<'PYCORE'
          import json
          from pathlib import Path
          path=Path('core/package.json');package=json.loads(path.read_text())
          sections=[key for key in ['dependencies','devDependencies'] if '@tscircuit/fanout-solver' in package.get(key,{})]
          assert len(sections)==1, sections
          assert package[sections[0]]['@tscircuit/fanout-solver']=='0.0.84'
          package[sections[0]]['@tscircuit/fanout-solver']='https://codeload.github.com/tscircuit/fanout-solver/tar.gz/65439fb38d1d86af15495553588cfe21b28a197a'
          path.write_text(json.dumps(package,indent=2)+'\n')
          PYCORE
          for folder in router core; do (cd "$folder" && bun install --ignore-scripts); done
          (cd router && bun build lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts --target bun --packages external --outfile benchmark-runtime/pipeline9.js)
          cd experiments/full-board-priority-analysis
          bun install --frozen-lockfile --ignore-scripts
          bun build-core.ts ../../core
      - name: Verify fanout then buses then remaining nets, and route fresh
        working-directory: experiments/full-board-priority-analysis
        env:
          BOARD_ID: ${{ matrix.board }}
          FULL_BOARD_CAPTURE_STAGE_INPUTS: "1"
        run: |
          export FULL_BOARD_CORE_SOURCE="$GITHUB_WORKSPACE/core"
          export FULL_BOARD_CORE_MODULE="$PWD/patched-core/index.js"
          export FULL_BOARD_COPPER_MODULE="$PWD/patched-core/find-floating-copper.js"
          export FULL_BOARD_ROUTER_MODULE="$GITHUB_WORKSPACE/router/benchmark-runtime/pipeline9.js"
          export FULL_BOARD_ROUTER_COMMIT="d88899c9ac79cf48491a402b5e3643b3efabe373"
          mkdir -p "$GITHUB_WORKSPACE/results/$BOARD_ID"
          bun inspect-routing-workflow.tsx "$BOARD_ID" "$GITHUB_WORKSPACE/results/$BOARD_ID/plan.json"
          bun run-fanout-bus-first.ts "$BOARD_ID" "$GITHUB_WORKSPACE/results/$BOARD_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plane-drop-candidate-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export native PCB output and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          names={'plan.json','progress.json','assessment.json','diagnostics.json','process.json','circuit.json','pcb.svg','worker.log'}
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file() and (path.name in names or path.name.startswith('fanout-') and path.name.endswith('.json.gz')):
                      archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('FANOUT_BUS_FIRST_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('FANOUT_BUS_FIRST_EVIDENCE_END')
          PY

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: before
            sha: 8c699afbd643652c4923b15b63a56d82eb794833
          - revision: after
            sha: 65439fb38d1d86af15495553588cfe21b28a197a
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.sha }}
          path: fanout
      - uses: actions/download-artifact@v4
        with:
          name: fanout-bus-first-icepi
          run-id: 44296522072
          github-token: ${{ github.token }}
          path: captured
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Replay unchanged native iCEPi input
        run: |
          (cd fanout && bun install --frozen-lockfile --ignore-scripts)
          cp experiments/full-board-priority-analysis/replay-native-plane-drop.ts fanout/replay-native-plane-drop.ts
          mkdir -p native
          cd fanout
          bun replay-native-plane-drop.ts "$GITHUB_WORKSPACE/captured/icepi/fanout-1-input.json.gz" "$GITHUB_WORKSPACE/native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plane-drop-native-${{ matrix.revision }}
          path: native
      - name: Export native routing evidence
        if: always()
        run: |
          python3 - <<'PYNATIVE'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('native').glob('*'):
                  if path.is_file(): archive.writestr(path.name,path.read_bytes())
          print('NATIVE_PLANE_DROP_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('NATIVE_PLANE_DROP_EVIDENCE_END')
          PYNATIVE
  fanout31:
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: before
            sha: 8c699afbd643652c4923b15b63a56d82eb794833
          - revision: after
            sha: 65439fb38d1d86af15495553588cfe21b28a197a
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/fanout-solver
          ref: ${{ matrix.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run all 72 fanout31 cases with the same budget
        run: ./benchmark.sh --dataset dataset31 --concurrency 32 --sample-timeout-seconds 120 --output-directory benchmark-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plane-drop-fanout31-${{ matrix.revision }}
          path: benchmark-results
      - name: Export compact benchmark results and input checksums
        if: always()
        run: |
          python3 - <<'PYBENCH'
          import hashlib,json
          from pathlib import Path
          report=Path('benchmark-results/benchmark.json')
          if report.exists(): print('FANOUT31_REPORT',report.read_text().replace('\n',''))
          checksums={str(path.relative_to('benchmark-results/inputs')):hashlib.sha256(path.read_bytes()).hexdigest() for path in Path('benchmark-results/inputs').rglob('*.json')}
          print('FANOUT31_INPUT_CHECKSUMS',json.dumps(checksums,separators=(',',':')))
          PYBENCH
