name: Diagnose via repair regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: 34e35ffbef0ac13ef1a99fdf1c28e955f03b5c5b
          - label: drill-span-only
            ref: ad5541b202652ced9a9e1614619c5f0af95d64d9
          - label: transition-fixes
            ref: 108872dcca1b806d5ba96474043a54743a323d29
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: solver
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
        working-directory: solver
      - name: Use identical diagnostic capture for all revisions
        run: cp diagnostics/scripts/capture-via-repair-regression.ts solver/scripts/
      - name: Capture unmodified board-1726 routing and reference DRC
        working-directory: solver
        run: bun scripts/capture-via-repair-regression.ts fixtures/bug-reports/bugreport107-board-1726/bugreport107-board-1726.json regression-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-regression-${{ matrix.label }}
          path: solver/regression-result/
