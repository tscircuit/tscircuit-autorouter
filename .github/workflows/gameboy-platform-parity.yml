name: Game Boy joint repair parity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --network-concurrency 8 --verbose
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36566411709
          name: repair-ubuntu-latest
          path: original-input
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36566062240
          name: repair-${{ matrix.os }}
          path: expected-output
      - name: Replay only the first clearance projection without changing its output
        run: bun scripts/replay-gameboy-clearance.ts original-input/relax-input.json.gz expected-output repair-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-${{ matrix.os }}
          path: repair-result/

  compare:
    needs: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Compare the native distance calculations
        run: |
          bun -e 'import { readFileSync } from "node:fs"; import { gunzipSync } from "node:zlib"; const read = (os) => JSON.parse(gunzipSync(readFileSync(`results/repair-${os}/hypot-calls.json.gz`)).toString()); const linux = read("ubuntu-latest"); const mac = read("macos-14"); for (let index=0; index<Math.max(linux.length,mac.length); index++) { if (JSON.stringify(linux[index])!==JSON.stringify(mac[index])) { console.log("FIRST_NATIVE_DIFFERENCE", JSON.stringify({index,linux:linux[index],mac:mac[index]})); throw new Error("Native distance calculations differ") } } console.log("All captured native distances match")'
