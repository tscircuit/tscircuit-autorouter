name: Game Boy platform parity

on:
  pull_request:
    paths:
      - package.json
      - scripts/validate-gameboy-platform-parity.ts
      - tests/repro/assets/gameboy-full-board-through-vias.srj.json
      - .github/workflows/gameboy-platform-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - name: Route the unchanged full Game Boy using Pipeline 9
        run: bun scripts/validate-gameboy-platform-parity.ts platform-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-${{ matrix.os }}
          path: platform-result/

  compare:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Compare measured geometry and DRC counts
        run: diff -u results/gameboy-ubuntu-latest/summary.json results/gameboy-macos-14/summary.json
