name: Game Boy joint repair parity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36564545230
          name: gameboy-${{ matrix.os }}
          path: stage-inputs
      - name: Replay only the first divergent stage without changing its output
        run: bun scripts/diagnose-gameboy-joint-repair.ts stage-inputs repair-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-${{ matrix.os }}
          path: repair-result/

  compare:
    needs: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Stop at the first differing repair observation
        run: bun scripts/compare-gameboy-joint-repair.ts results/repair-ubuntu-latest results/repair-macos-14
