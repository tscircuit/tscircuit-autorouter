name: Game Boy platform parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - name: Route the unchanged full Game Boy using Pipeline 9
        run: bun scripts/diagnose-gameboy-platform.ts platform-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-${{ matrix.os }}
          path: platform-result/

  compare:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Compare stage inputs and stop at the first difference
        run: bun scripts/compare-gameboy-stages.ts results/gameboy-ubuntu-latest results/gameboy-macos-14
