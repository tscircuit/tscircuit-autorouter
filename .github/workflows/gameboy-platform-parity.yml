name: Game Boy platform parity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - uses: actions/download-artifact@v4
        with:
          name: gameboy-ubuntu-latest
          run-id: 36445569801
          github-token: ${{ github.token }}
          path: captured
      - name: Route the unchanged full Game Boy using Pipeline 9
        run: bun scripts/diagnose-gameboy-simplification.ts captured/traceSimplificationSolver-input.json.gz platform-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-${{ matrix.os }}
          path: platform-result/

  compare:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Compare simplification phase and route outputs
        run: diff -u results/gameboy-ubuntu-latest/records.json results/gameboy-macos-14/records.json
