name: Game Boy through-via stage diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - name: Capture unchanged Game Boy routing stages
        run: bun scripts/diagnose-gameboy-via-stages.ts stage-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-via-stages-${{ matrix.os }}
          path: stage-result/
