name: Game Boy platform parity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Abse2001/trace-simplification-solver
          ref: b2ed5fb51a01e3d091b9a8182bc1c9d0b1774f60
          path: repro
      - uses: actions/checkout@v4
        with:
          repository: Abse2001/trace-simplification-solver
          ref: 9d20fff072cbef145990ae4aeeae15a8f0b363fa
          path: baseline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
        working-directory: repro
      - run: bun install
        working-directory: baseline
      - run: bun test tests/get-vector-length.test.ts tests/gameboy-via-removal-platform.test.ts
        working-directory: repro
      - name: Measure alternating baseline and fix solves
        run: bun scripts/measure-gameboy-via-removal.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-removal-${{ matrix.os }}
          path: repro/tmp/
  compare:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Require identical Linux and macOS route geometry
        run: diff -u results/via-removal-ubuntu-latest/gameboy-via-removal-routes.json results/via-removal-macos-14/gameboy-via-removal-routes.json
