name: Game Boy platform parity
run-name: Published autorouter 0.0.951 on the public Game Boy input

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Route the public input with the published npm Pipeline 9
        run: bun scripts/validate-gameboy-published.ts platform-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-${{ matrix.os }}
          path: platform-result/

  compare:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Compare actual routes, DRC data, and native image bytes
        run: |
          for file in routes.json summary.json drc-errors.json board.svg through-via-contacts.json repair03-errors.json; do
            cmp "results/gameboy-ubuntu-latest/$file" "results/gameboy-macos-14/$file"
          done
