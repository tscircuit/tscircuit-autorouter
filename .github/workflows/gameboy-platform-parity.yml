name: Game Boy platform parity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Abse2001/trace-simplification-solver
          ref: f2d8670
          path: repro
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
        working-directory: repro
      - run: bun test tests/gameboy-via-removal-platform.test.ts
        working-directory: repro
      - name: Observe native math without changing results
        run: bun scripts/probe-gameboy-via-math.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: via-removal-${{ matrix.os }}
          path: repro/tmp/
  compare:
    needs: route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Require identical Linux and macOS route geometry
        run: diff -u results/via-removal-ubuntu-latest/gameboy-via-removal-routes.json results/via-removal-macos-14/gameboy-via-removal-routes.json
