name: Architecture Balanced Benchmark
on:
  push:
    branches: [experiment/architecture-balanced-harness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-balanced-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  benchmark:
    name: Balanced ${{ matrix.candidate }} SRJ${{ matrix.dataset }}
    if: github.ref == 'refs/heads/experiment/architecture-balanced-harness'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: split-owner-cardinality-distance
            head: b0cbd60ee7b40b5d96db603bf18cb4d049dfa5f4
            dataset: '18'
          - candidate: split-owner-cardinality-distance
            head: b0cbd60ee7b40b5d96db603bf18cb4d049dfa5f4
            dataset: '24'
    env:
      BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: 60000
      BENCHMARK_HEARTBEAT_INTERVAL_MS: 30000
      BENCHMARK_TERMINATE_TIMEOUT_MS: 1000
      BALANCED_HEAD_SHA: ${{ matrix.head }}
      BALANCED_DATASET: ${{ matrix.dataset }}
      BALANCED_ORDER: ABBA
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Run four balanced passes
        run: bun scripts/benchmark/runBalancedBenchmark.ts
      - name: Preserve balanced benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ matrix.candidate }}-${{ matrix.dataset }}-${{ github.run_id }}
          path: tmp/balanced-benchmark/artifacts
