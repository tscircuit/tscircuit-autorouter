name: Board 109 paired routing benchmark
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        default: board109
      rectdiff_sha:
        type: string
        required: true
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Pin candidate rectdiff revision
        working-directory: candidate
        env:
          RECTDIFF_SHA: ${{ inputs.rectdiff_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          sha = os.environ['RECTDIFF_SHA']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          p = json.load(open('package.json'))
          p['devDependencies']['@tscircuit/rectdiff'] = f'https://codeload.github.com/tscircuit/rectdiff/tar.gz/{sha}'
          open('package.json', 'w').write(json.dumps(p, indent=2) + '\n')
          PY
      - name: Install baseline dependencies
        run: bun install
      - name: Install candidate dependencies
        working-directory: candidate
        run: bun install
      - name: Baseline first pass
        run: bun scripts/benchmarkBoard109.ts comparison/base-1
      - name: Candidate first pass
        working-directory: candidate
        run: bun scripts/benchmarkBoard109.ts ../comparison/head-1
      - name: Candidate second pass
        working-directory: candidate
        run: bun scripts/benchmarkBoard109.ts ../comparison/head-2
      - name: Baseline second pass
        run: bun scripts/benchmarkBoard109.ts comparison/base-2
      - name: Compare routing results
        run: python3 scripts/compareBoard109Results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board109-paired-results
          path: comparison/
