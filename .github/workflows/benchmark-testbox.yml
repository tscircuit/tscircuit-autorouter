name: Architecture Balanced Benchmark
on:
  push:
    branches: [experiment/architecture-balanced-harness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-balanced-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  owner-cut:
    name: Cold owner-release operator ABBA
    if: github.ref == 'refs/heads/experiment/architecture-balanced-harness'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    env:
      OWNER_CUT_SOURCE_SHA: 11e4a5b6b134710ac9aba65ef5f6257e029f4a2d
      OWNER_CUT_BENCHMARK_APPROVED: '1'
      OWNER_CUT_OUTPUT_DIR: tmp/owner-cut-operator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11e4a5b6b134710ac9aba65ef5f6257e029f4a2d
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Preserve source and resolved dependency block
        run: |
          set -euo pipefail
          mkdir -p tmp/owner-cut-provenance
          bun -e 'console.log(JSON.stringify({controller:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,source:process.env.OWNER_CUT_SOURCE_SHA},null,2))' > tmp/owner-cut-provenance/launch.json
          git rev-parse HEAD HEAD^{tree} HEAD:lib > tmp/owner-cut-provenance/source.txt
          bun --version > tmp/owner-cut-provenance/bun-version.txt
          bun install --lockfile-only --save-text-lockfile 2>&1 | tee tmp/owner-cut-provenance/resolution.log
          cp bun.lock tmp/owner-cut-provenance/resolved-bun.lock
          bun install --frozen-lockfile 2>&1 | tee tmp/owner-cut-provenance/install.log
          sha256sum package.json bunfig.toml bun.lock scripts/benchmark/runOwnerCutOperatorBenchmark.ts scripts/benchmark/ownerCutBenchmarkModel.ts scripts/benchmark/owner-cut-real-query-reference.json > tmp/owner-cut-provenance/hashes.txt
      - name: Run four fresh selected-first cold operator passes
        run: bun scripts/benchmark/runOwnerCutOperatorBenchmark.ts
      - name: Preserve all operator rows and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-cut-operator-${{ github.run_id }}
          path: |
            tmp/owner-cut-operator
            tmp/owner-cut-provenance
          if-no-files-found: error
