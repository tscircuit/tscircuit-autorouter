name: Blacksmith Testbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        board: [icepi-native, imx6-native, h616-local]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack original frozen sources
        run: |
          mkdir -p experiments/boards-3273/runtime
          unzip -q experiments/boards-3273/boards.zip -d experiments/boards-3273/runtime
      - name: Install once before measuring either revision
        working-directory: experiments/boards-3273/runtime
        run: bun install --frozen-lockfile
      - name: Run base-head-head-base in fresh processes on the same machine
        env:
          BOARD_SAMPLE: ${{ matrix.board }}
        run: python3 experiments/boards-3273/replay-paired.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-board-clips-${{ matrix.board }}
          path: paired-results/
