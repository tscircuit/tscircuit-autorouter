name: Latest boards with indexed breakout selectors
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack original board sources
        run: |
          mkdir -p experiments/boards-3269/runtime
          unzip -q experiments/boards-3269/boards.zip -d experiments/boards-3269/runtime
      - name: Install latest tscircuit with its frozen dependencies
        working-directory: experiments/boards-3269/runtime
        run: bun install --frozen-lockfile
      - name: Apply the minimal breakout selector fix
        run: python3 experiments/boards-3269/apply-breakout-selector-fix.py
      - name: Run all 19 original TSX boards through tscircuit
        env:
          BOARD_VARIANT: indexed-breakouts
          BOARD_FIX_PROVENANCE: breakout-selector-provenance.json
        run: python3 experiments/boards-3269/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boards-tscircuit-3269-indexed-breakouts
          path: board-benchmark-results
