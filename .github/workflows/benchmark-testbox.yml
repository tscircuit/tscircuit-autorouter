name: Board 109 paired routing benchmark
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        default: board109
      rectdiff_sha:
        type: string
        required: true
      topology_only:
        type: boolean
        default: false
      verification_only:
        type: boolean
        default: false
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 60
    env:
      TOPOLOGY_ONLY: ${{ inputs.topology_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Pin candidate rectdiff revision
        working-directory: candidate
        env:
          RECTDIFF_SHA: ${{ inputs.rectdiff_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          sha = os.environ['RECTDIFF_SHA']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          p = json.load(open('package.json'))
          p['devDependencies']['@tscircuit/rectdiff'] = f'git+https://github.com/tscircuit/rectdiff.git#{sha}'
          open('package.json', 'w').write(json.dumps(p, indent=2) + '\n')
          PY
      - name: Install baseline dependencies
        run: bun install
      - name: Install candidate dependencies
        working-directory: candidate
        run: bun install
      - name: Verify installed rectangle algorithms
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          source = Path('node_modules/@tscircuit/rectdiff/lib/solvers/RectDiffSeedingSolver/computeEdgeCandidates3D.ts')
          audits = []
          for name, root in [('baseline', Path('.')), ('candidate', Path('candidate'))]:
              package = json.loads((root / 'package.json').read_text())
              data = (root / source).read_bytes()
              audit = {'checkout': name, 'rectdiff': package['devDependencies']['@tscircuit/rectdiff'], 'sourceSha256': hashlib.sha256(data).hexdigest(), 'hasDistanceIndex': b'hardRectIndexByLayer' in data}
              audits.append(audit)
              print(json.dumps(audit), flush=True)
          assert not audits[0]['hasDistanceIndex'], 'Baseline installed source contains candidate algorithm'
          assert audits[1]['hasDistanceIndex'], 'Candidate installed source is missing the indexed algorithm'
          PY
      - name: Baseline first pass
        if: ${{ !inputs.verification_only }}
        run: bun scripts/benchmarkBoard109.ts comparison/base-1 ${{ inputs.topology_only && '--topology-only' || '' }}
      - name: Candidate first pass
        if: ${{ !inputs.verification_only }}
        working-directory: candidate
        run: bun scripts/benchmarkBoard109.ts ../comparison/head-1 ${{ inputs.topology_only && '--topology-only' || '' }}
      - name: Candidate second pass
        if: ${{ !inputs.verification_only }}
        working-directory: candidate
        run: bun scripts/benchmarkBoard109.ts ../comparison/head-2 ${{ inputs.topology_only && '--topology-only' || '' }}
      - name: Baseline second pass
        if: ${{ !inputs.verification_only }}
        run: bun scripts/benchmarkBoard109.ts comparison/base-2 ${{ inputs.topology_only && '--topology-only' || '' }}
      - name: Compare routing results
        if: ${{ !inputs.verification_only }}
        run: python3 scripts/compareBoard109Results.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.verification_only }}
        with:
          name: board109-paired-results
          path: comparison/
