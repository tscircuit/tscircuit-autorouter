name: Remote overlap repair validation
on:
  workflow_dispatch:
    inputs:
      repair_sha:
        type: string
        required: true
jobs:
  validate:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/high-density-repair03
          ref: ${{ inputs.repair_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --no-save
      - run: bunx biome format --write lib/solvers/GlobalDrcForceImproveSolver/getTraceClearanceDetour.ts lib/solvers/GlobalDrcForceImproveSolver/solverHelpers.ts lib/solvers/GlobalDrcForceImproveSolver/GlobalDrcForceImproveSolver.ts tests/clearance-detour-*.test.ts tests/fixtures/expectClearanceDetour.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-overlap-repair
          path: |
            lib/solvers/GlobalDrcForceImproveSolver/getTraceClearanceDetour.ts
            lib/solvers/GlobalDrcForceImproveSolver/solverHelpers.ts
            lib/solvers/GlobalDrcForceImproveSolver/GlobalDrcForceImproveSolver.ts
            tests/clearance-detour-*.test.ts
            tests/fixtures/expectClearanceDetour.ts
      - run: bun run typecheck
      - run: bun test tests/clearance-detour-*.test.ts
