name: Paired full-circuit breakout selector comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        board: [icepi-native, h616-local, orangecrab-local]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack original frozen sources
        run: |
          mkdir -p experiments/boards-3268/runtime
          unzip -q experiments/boards-3268/boards.zip -d experiments/boards-3268/runtime
      - name: Install once before measuring either revision
        working-directory: experiments/boards-3268/runtime
        run: bun install --frozen-lockfile
      - name: Run base-head-head-base in fresh processes on the same machine
        env:
          BOARD_SAMPLE: ${{ matrix.board }}
          BOARD_REPLAY_ORDER: ${{ matrix.board == 'orangecrab-local' && '["base","head"]' || '["base","head","head","base"]' }}
        run: python3 experiments/boards-3268/replay-paired.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-breakout-selectors-${{ matrix.board }}
          path: paired-results/
