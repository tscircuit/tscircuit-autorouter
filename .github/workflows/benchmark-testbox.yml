name: Clean Priority Routing Balanced Benchmark
on:
  push:
    branches: [experiment/architecture-balanced-harness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clean-priority-balanced-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  benchmark:
    name: Clean Priority Routing SRJ${{ matrix.dataset }}
    if: github.ref == 'refs/heads/experiment/architecture-balanced-harness'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        dataset: ['18', '24']
    env:
      BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: 60000
      BENCHMARK_HEARTBEAT_INTERVAL_MS: 30000
      BENCHMARK_TERMINATE_TIMEOUT_MS: 1000
      BALANCED_HEAD_SHA: b00f8daa6f3e22b0ad8042239a24b20beac9678b
      BALANCED_DATASET: ${{ matrix.dataset }}
      BALANCED_ORDER: ABBA
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Run four balanced passes against current main
        run: bun scripts/benchmark/runCleanPriorityBalancedBenchmark.ts
      - name: Preserve balanced benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-priority-routing-${{ matrix.dataset }}-${{ github.run_id }}
          path: tmp/clean-priority-routing/artifacts
