name: Architecture Balanced Benchmark
on:
  push:
    branches: [experiment/architecture-balanced-harness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-balanced-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  cpu-diagnostics:
    name: Cold port CPU diagnostics SRJ18 6 and 14
    if: github.ref == 'refs/heads/experiment/architecture-balanced-harness'
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Profile cold native and eager regional cost implementation
        run: bun scripts/benchmark/runStageCpuDiagnostics.ts
      - name: Preserve CPU diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-port-cpu-diagnostics-${{ github.run_id }}
          path: tmp/stage-cpu-diagnostics/artifacts
