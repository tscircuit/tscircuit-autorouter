name: Uploaded boards with outline broad phase
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack original board sources
        run: |
          mkdir -p experiments/boards-3266/runtime
          unzip -q experiments/boards-3266/boards.zip -d experiments/boards-3266/runtime
      - name: Install latest tscircuit with its frozen dependencies
        working-directory: experiments/boards-3266/runtime
        run: bun install --frozen-lockfile
      - name: Apply exact embedded bus solver predicate replacement
        run: python3 experiments/boards-3266/apply-outline-broad-phase.py
      - name: Run all 19 original TSX boards through tscircuit
        env:
          BOARD_VARIANT: outline-broad-phase
          BOARD_FIX_PROVENANCE: experiments/boards-3266/outline-provenance.json
        run: python3 experiments/boards-3266/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boards-tscircuit-3266-outline-broad-phase
          path: board-benchmark-results
