name: Blacksmith Testbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack boards with copper pours disabled
        run: |
          mkdir -p experiments/boards-3273-no-pours/runtime
          unzip -q experiments/boards-3273-no-pours/boards.zip -d experiments/boards-3273-no-pours/runtime
      - name: Install latest released tscircuit from frozen lockfile
        working-directory: experiments/boards-3273-no-pours/runtime
        run: bun install --frozen-lockfile
      - name: Apply clearance padding to regional trace cuts
        run: python3 experiments/boards-3273-no-pours/apply-regional-padding.py
      - name: Run all 19 TSX boards with default routing
        env:
          BOARD_VARIANT: immutable-regional-overlap
          BOARD_FIX_PROVENANCE: experiments/boards-3273-no-pours/regional-padding-provenance.json
        run: python3 experiments/boards-3273-no-pours/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boards-tscircuit-3273-no-pours-immutable-regional-overlap
          path: board-benchmark-results/
