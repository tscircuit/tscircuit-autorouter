name: Uploaded boards on latest tscircuit 3257
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack the original board sources
        run: |
          mkdir -p experiments/boards-3257/runtime
          unzip -q experiments/boards-3257/boards.zip -d experiments/boards-3257/runtime
      - name: Install the pinned latest release
        working-directory: experiments/boards-3257/runtime
        run: bun install --frozen-lockfile
      - name: Render all 19 original TSX entries on the released native-copper stack
        run: python3 experiments/boards-3257/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boards-tscircuit-3257
          path: board-benchmark-results
