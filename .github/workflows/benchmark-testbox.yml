name: Blacksmith Testbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack boards with copper pours disabled
        run: |
          mkdir -p experiments/boards-3279-no-pours/runtime
          unzip -q experiments/boards-3279-no-pours/boards.zip -d experiments/boards-3279-no-pours/runtime
      - name: Install latest tscircuit and record the baseline lockfile
        working-directory: experiments/boards-3279-no-pours/runtime
        run: |
          bun install
          mkdir -p ../../../board-benchmark-results
          cp bun.lock ../../../board-benchmark-results/bun.lock
      - name: Run all 19 TSX boards with default routing
        env:
          BOARD_VARIANT: base
        run: python3 experiments/boards-3279-no-pours/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boards-tscircuit-3279-no-pours-base
          path: board-benchmark-results/
