name: Blacksmith Testbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack boards with copper pours disabled
        run: |
          mkdir -p experiments/boards-3278-no-pours/runtime
          unzip -q experiments/boards-3278-no-pours/boards.zip -d experiments/boards-3278-no-pours/runtime
      - name: Install latest released tscircuit from the frozen baseline lockfile
        working-directory: experiments/boards-3278-no-pours/runtime
        run: |
          bun install --frozen-lockfile
          mkdir -p ../../../board-benchmark-results
          cp bun.lock ../../../board-benchmark-results/bun.lock
      - name: Preserve hard constraints during graph completion
        run: bun experiments/boards-3278-no-pours/apply-hard-constraints.mjs experiments/boards-3278-no-pours/runtime experiments/boards-3278-no-pours/runtime/node_modules/@tscircuit/capacity-autorouter experiments/boards-3278-no-pours/fix-provenance.json
      - name: Run all 19 TSX boards with default routing
        env:
          BOARD_VARIANT: fix
          BOARD_FIX_PROVENANCE: experiments/boards-3278-no-pours/fix-provenance.json
        run: python3 experiments/boards-3278-no-pours/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boards-tscircuit-3278-no-pours-fix
          path: board-benchmark-results/
