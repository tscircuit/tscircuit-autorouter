name: SRJ33 clean-routing experiment
on:
  workflow_dispatch:
jobs:
  experiment:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [via-in-pad, small-via-in-pad]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
      - run: bun scripts/debug-srj33-clean-routing.ts '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-routing-${{ matrix.variant }}
          path: debug-artifacts/
