name: SRJ33 clean-routing experiment
on:
  workflow_dispatch:
jobs:
  experiment:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: main
            ref: 109c67baebc709be95fb37df1fdac9b3b74624c5
          - revision: pr
            ref: de161e0ce
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: router
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install
        working-directory: router
      - run: cp controller/scripts/debug-srj33-clean-routing.ts router/scripts/debug-srj33-clean-routing.ts
      - run: bun scripts/debug-srj33-clean-routing.ts small-via-in-pad
        working-directory: router
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-routing-${{ matrix.revision }}
          path: router/debug-artifacts/
