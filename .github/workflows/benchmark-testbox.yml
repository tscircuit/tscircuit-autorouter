name: Board 109 routing benchmark
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        default: board109

jobs:
  benchmark:
    name: Run benchmark
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - run: bun --cpu-prof --cpu-prof-dir=board109-results --cpu-prof-name=board109.cpuprofile scripts/benchmarkBoard109.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board109-results
          path: board109-results/
