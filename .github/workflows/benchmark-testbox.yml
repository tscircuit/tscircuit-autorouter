name: Uploaded boards with typed selector reuse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boards:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack original board sources
        run: |
          mkdir -p experiments/boards-3260/runtime
          unzip -q experiments/boards-3260/boards.zip -d experiments/boards-3260/runtime
      - name: Install latest tscircuit with its frozen dependencies
        working-directory: experiments/boards-3260/runtime
        run: bun install --frozen-lockfile
      - name: Apply the exact core selector call replacement
        run: python3 experiments/boards-3260/apply-selector-reuse.py
      - name: Run all 19 original TSX boards through tscircuit
        env:
          BOARD_VARIANT: selector-reuse
          BOARD_FIX_PROVENANCE: experiments/boards-3260/selector-reuse-provenance.json
        run: python3 experiments/boards-3260/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boards-tscircuit-3260-selector-reuse
          path: board-benchmark-results
