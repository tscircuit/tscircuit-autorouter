name: Counterbalanced whole-circuit outline comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        board: [icepi-spaced, glider-local]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Unpack original frozen sources
        run: |
          mkdir -p experiments/boards-3266/runtime
          unzip -q experiments/boards-3266/boards.zip -d experiments/boards-3266/runtime
      - name: Install once before measuring either revision
        working-directory: experiments/boards-3266/runtime
        run: bun install --frozen-lockfile
      - name: Run base-head-head-base in fresh processes on the same machine
        env:
          BOARD_SAMPLE: ${{ matrix.board }}
        run: python3 experiments/boards-3266/replay-paired.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-outline-${{ matrix.board }}
          path: paired-results/
