bel="" data-x="6.15" data-y="4" x="341.75438596491233" y="250.52631578947364" width="258.24561403508767" height="68.77192982456143" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="5.25" data-y="4.725" x="404.91228070175436" y="218.94736842105266" width="5.614035087719344" height="30.175438596491176" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="5.25" data-y="5" x="404.91228070175436" y="211.92982456140348" width="5.614035087719344" height="5.614035087719287" fill="#f59e0b" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="5.252" data-y="4.998" x="405.0526315789474" y="212.07017543859644" width="5.614035087719287" height="5.614035087719344" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="5.25" data-y="5.275" x="404.91228070175436" y="180.35087719298244" width="5.614035087719344" height="30.175438596491233" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="6.65" data-y="5" x="411.9298245614035" y="180.3508771929824" width="188.0701754385965" height="68.77192982456143" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="6.25" data-y="5.725" x="475.0877192982456" y="148.77192982456143" width="5.614035087719287" height="30.175438596491176" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="6.25" data-y="6" x="475.0877192982456" y="141.7543859649123" width="5.614035087719287" height="5.614035087719287" fill="#f59e0b" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="6.252" data-y="5.998" x="475.2280701754386" y="141.89473684210523" width="5.614035087719287" height="5.614035087719287" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="6.25" data-y="6.275" x="475.0877192982456" y="110.17543859649123" width="5.614035087719287" height="30.175438596491176" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="7.15" data-y="6" x="482.1052631578947" y="110.17543859649126" width="117.89473684210526" height="68.77192982456137" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="7.25" data-y="6.725" x="545.2631578947368" y="78.59649122807016" width="5.61403508771923" height="30.175438596491233" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="7.25" data-y="7" x="545.2631578947368" y="71.57894736842107" width="5.61403508771923" height="5.614035087719287" fill="#f59e0b" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="7.252" data-y="6.998" x="545.4035087719296" y="71.719298245614" width="5.614035087719344" height="5.614035087719287" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="7.25" data-y="7.275" x="545.2631578947368" y="40" width="5.61403508771923" height="30.175438596491176" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="" data-x="7.65" data-y="7" x="552.280701754386" y="40" width="47.71929824561403" height="68.77192982456143" fill="rgba(0,200,200,0.1)" stroke="black" stroke-width="0.014250000000000002"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":70.17543859649122,"c":0,"e":39.298245614035125,"b":0,"d":-70.17543859649122,"f":565.6140350877192};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>