<svg width="1600" height="680" viewBox="0 0 1600 680" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-2,0.5 -0.5314055180229014,0.5 -0.155705313068644,0.8757002049542574 0.15,0.941 0.4,0.941 0.65,0.941 0.9,0.941 1.15,0.94 1.56,0.94 2,0.5" data-type="line" data-label="" points="64,301.6 298.9751171163358,301.6 359.08714990901694,241.48796720731883 408,231.04000000000002 448,231.04000000000002 488,231.04000000000002 528,231.04000000000002 568,231.20000000000005 633.6,231.20000000000005 704,301.6" fill="none" stroke="red" stroke-linejoin="round" stroke-width="16"/></g><g><polyline data-points="3.2,0.5 4.0099116975917255,1.3099116975917258 6.364262765163747,1.3099116975917258 6.390088302408275,1.3099116975917258 7.2,0.5" data-type="line" data-label="" points="896,301.6 1025.585871614676,172.0141283853239 1402.2820424261995,172.0141283853239 1406.414128385324,172.0141283853239 1536,301.6" fill="none" stroke="red" stroke-linejoin="round" stroke-width="16"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" data-ccw-rotation-degrees="45" x="216" y="310.40000000000003" width="336" height="142.39999999999998" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00625" transform="rotate(-45 384 381.6)"/></g><g><rect data-type="rect" data-label="" data-x="-2" data-y="0.5" x="40" y="277.6" width="48" height="48" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00625"/></g><g><rect data-type="rect" data-label="" data-x="2" data-y="0.5" x="680" y="277.6" width="48" height="48" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00625"/></g><g><rect data-type="rect" data-label="" data-x="5.2" data-y="0" data-ccw-rotation-degrees="45" x="1048" y="310.4" width="336.00000000000006" height="142.40000000000006" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00625" transform="rotate(-44.999999999999986 1216 381.6)"/></g><g><rect data-type="rect" data-label="" data-x="3.2" data-y="0.5" x="872" y="277.6" width="48" height="48" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00625"/></g><g><rect data-type="rect" data-label="" data-x="7.2" data-y="0.5" x="1512" y="277.6" width="48" height="48" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00625"/></g><g><polygon data-type="polygon" data-label="" data-points="-0.4277996026178614,-1.0571246378738886 1.0571246378738886,0.4277996026178612 0.4277996026178614,1.0571246378738886 -1.0571246378738886,-0.4277996026178612" points="315.5520635811422,550.7399420598222 553.1399420598221,313.1520635811422 452.4479364188578,212.46005794017785 214.86005794017782,450.04793641885783" fill="transparent" stroke="black" stroke-width="1.28"/></g><g><polygon data-type="polygon" data-label="" data-points="4.7722003973821385,-1.0571246378738886 6.257124637873889,0.4277996026178612 5.627799602617862,1.0571246378738886 4.142875362126111,-0.4277996026178612" points="1147.5520635811422,550.7399420598222 1385.1399420598223,313.1520635811422 1284.4479364188578,212.46005794017785 1046.8600579401777,450.04793641885783" fill="transparent" stroke="black" stroke-width="1.28"/></g><text data-type="text" data-label="BEFORE: Pipeline9 routes through keepout" data-x="0" data-y="1.9" x="384" y="77.60000000000002" fill="black" font-size="21.6" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BEFORE: Pipeline9 routes through keepout</text><text data-type="text" data-label="Solver reports solved; centerline intersects original shape" data-x="0" data-y="1.65" x="384" y="117.60000000000002" fill="black" font-size="15.2" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Solver reports solved; centerline intersects original shape</text><text data-type="text" data-label="Same SRJ | 0.10 mm trace | 0.10 mm required clearance" data-x="0" data-y="-1.4" x="384" y="605.6" fill="black" font-size="15.2" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Same SRJ | 0.10 mm trace | 0.10 mm required clearance</text><text data-type="text" data-label="AFTER: Pipeline9 routes clear of keepout" data-x="5.2" data-y="1.9" x="1216" y="77.60000000000002" fill="black" font-size="21.6" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">AFTER: Pipeline9 routes clear of keepout</text><text data-type="text" data-label="Minimum copper clearance: 0.2028 mm" data-x="5.2" data-y="1.65" x="1216" y="117.60000000000002" fill="black" font-size="15.2" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Minimum copper clearance: 0.2028 mm</text><text data-type="text" data-label="Same SRJ | 0.10 mm trace | 0.10 mm required clearance" data-x="5.2" data-y="-1.4" x="1216" y="605.6" fill="black" font-size="15.2" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Same SRJ | 0.10 mm trace | 0.10 mm required clearance</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="680" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '680');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":160,"c":0,"e":384,"b":0,"d":-160,"f":381.6};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>