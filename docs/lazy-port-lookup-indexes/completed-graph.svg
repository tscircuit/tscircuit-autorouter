"4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="2.3125" cx="320" cy="375" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="2.3125" cx="320" cy="375" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="2.3125" cx="320" cy="375" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="2.3125" cx="320" cy="375" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="3.6875" cx="320" cy="265" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="3.6875" cx="320" cy="265" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="3.6875" cx="320" cy="265" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="3.6875" cx="320" cy="265" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="4" cx="320" cy="240" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="4" cx="320" cy="240" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="4" cx="320" cy="240" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="4" cx="320" cy="240" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="4.3125" cx="320" cy="215" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="4.3125" cx="320" cy="215" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="4.3125" cx="320" cy="215" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="4.3125" cx="320" cy="215" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="5.6875" cx="320" cy="105" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="5.6875" cx="320" cy="105" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="5.6875" cx="320" cy="105" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="5.6875" cx="320" cy="105" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="6" cx="320" cy="80" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="6" cx="320" cy="80" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="6" cx="320" cy="80" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="6" cx="320" cy="80" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="6.3125" cx="320" cy="55" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="6.3125" cx="320" cy="55" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="6.3125" cx="320" cy="55" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><circle data-type="circle" data-label="" data-x="0.5" data-y="6.3125" cx="320" cy="55" r="4" fill="rgba(0, 200, 0, 0.7)" stroke="black" stroke-width="0.0125"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":80,"c":0,"e":280,"b":0,"d":-80,"f":560};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>