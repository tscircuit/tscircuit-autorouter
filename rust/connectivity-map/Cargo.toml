[package]
name = "connectivity-map"
version = "0.1.0"
edition = "2024"
publish = false
[features]
wasm-types = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
tsify = { version = "=0.5.8", default-features = false, features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
ryu-js = "1.0.3"
