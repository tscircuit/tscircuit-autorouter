[package]
name = "tscircuit-hybrid-routing-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic geometry and path-search core for the tscircuit hybrid transactional router"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
node = ["dep:napi", "dep:napi-derive"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "3", optional = true }
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }

[build-dependencies]
napi-build = "2"
