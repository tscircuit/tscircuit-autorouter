[package]
name = "uniform-port-distribution"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
wasm-types = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
tsify = { version = "=0.5.8", default-features = false, features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
