[package]
name = "high-density-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
high-density = { path = "../high-density" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
