[package]
name = "capacity-autorouter-bindings"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capacity-autorouter = { path = "../capacity-autorouter", features = ["wasm-types"] }
checks = { path = "../checks", features = ["wasm-types"] }
length-matching-solver = { path = "../length-matching-solver" }
circuit-json-to-connectivity-map = { path = "../circuit-json-to-connectivity-map", features = ["wasm-types"] }
high-density-a01 = { path = "../high-density-a01" }
high-density-repair03 = { path = "../high-density-repair03", features = ["wasm-types"] }
serde = { version = "1", features = ["derive"] }
json-bindings = { path = "../json-bindings" }
# JSON preserves omitted metadata fields and avoids per-property WASM crossings.
tsify = { version = "=0.5.8", default-features = false, features = ["json"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "fat"
codegen-units = 1

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
module-allocator = { path = "../module-allocator" }
