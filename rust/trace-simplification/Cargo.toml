[package]
name = "trace-simplification"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
intra-node-routing = { path = "../intra-node-routing" }
autorouting-drc = { path = "../drc" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2.1.2"
ryu-js = "1.0.3"
