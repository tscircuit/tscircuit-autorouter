925925925" cy="331.60755555555556" r="3" fill="rgba(37,99,235,0.75)"/></g><g><circle data-type="point" data-label="" data-x="1.35" data-y="0.6" cx="215" cy="331.60755555555556" r="3" fill="rgba(37,99,235,0.75)"/></g><g><circle data-type="point" data-label="" data-x="2" data-y="0.6" cx="299.25925925925924" cy="331.60755555555556" r="3" fill="rgba(37,99,235,0.75)"/></g><g><circle data-type="point" data-label="Connection start" data-x="2.32" data-y="0.68755" cx="340.7407407407407" cy="320.2584814814815" r="3" fill="green"/></g><g><circle data-type="point" data-label="Connection end" data-x="4.32" data-y="0.68755" cx="600" cy="320.2584814814815" r="3" fill="red"/></g><g><circle data-type="point" data-label="" data-x="2.32" data-y="0.68755" cx="340.7407407407407" cy="320.2584814814815" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="2.9699999999999998" data-y="0.68755" cx="424.99999999999994" cy="320.2584814814815" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="3.0448999999999997" data-y="0.41245" cx="434.70925925925917" cy="355.9195925925926" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="3.5951" data-y="0.41245" cx="506.0314814814814" cy="355.9195925925926" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="3.67" data-y="0.68755" cx="515.7407407407406" cy="320.2584814814815" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="4.32" data-y="0.68755" cx="600" cy="320.2584814814815" r="3" fill="#2563eb"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":129.62962962962962,"c":0,"e":40,"b":0,"d":-129.62962962962962,"f":409.38533333333334};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>