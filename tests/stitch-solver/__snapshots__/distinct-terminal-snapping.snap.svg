<circle data-type="point" data-label="" data-x="197.975" data-y="123" cx="396.76097422488965" cy="151.5777414724289" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.95" cx="396.76097422488965" cy="185.99986854023882" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.9" cx="396.76097422488965" cy="220.42199560804875" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.85" cx="396.76097422488965" cy="254.84412267585867" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.801" cx="396.76097422488965" cy="288.5778072023095" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.752" cx="396.76097422488965" cy="322.31149172877485" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.705" cx="396.76097422488965" cy="354.66829117250745" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.661" cx="396.76097422488965" cy="384.9597629921773" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.6" cx="396.76097422488965" cy="426.9547580149083" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.984" data-y="122.552" cx="402.9569570971071" cy="460" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.984" data-y="122.552" cx="402.9569570971071" cy="460" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="197.984" data-y="123.162" cx="402.9569570971071" cy="40.05004977273347" r="3" fill="green"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="500" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '500');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":688.442541356165,"c":0,"e":-135897.65115076187,"b":0,"d":-688.442541356165,"f":84830.01032828072};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>