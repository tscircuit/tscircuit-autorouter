,122.402 198.015,122.283" data-type="line" data-label="" points="373.4515842115943,283.1171815543712 383.3672575783421,321.1805728654581" fill="none" stroke="rgba(0,204,0,0.5)" stroke-linejoin="round" stroke-width="31.986043118557145"/></g><g><polyline data-points="198.015,122.283 198.067,121.999" data-type="line" data-label="" points="383.3672575783421,321.1805728654581 400,412.02093532215804" fill="none" stroke="rgba(0,204,0,0.5)" stroke-linejoin="round" stroke-width="31.986043118557145"/></g><g><polyline data-points="198.067,121.999 198.067,121.999" data-type="line" data-label="" points="400,412.02093532215804 400,412.02093532215804" fill="none" stroke="rgba(0,204,0,0.5)" stroke-linejoin="round" stroke-width="31.986043118557145"/></g><g><polyline data-points="198.067,121.999 198.015,122.286" data-type="line" data-label="" points="400,412.02093532215804 383.3672575783421,320.2209915718995" fill="none" stroke="hsl(120, 100%, 40%)" stroke-linejoin="round" stroke-width="31.986043118557145"/></g><g><polyline data-points="198.015,122.286 197.984,122.402" data-type="line" data-label="" points="383.3672575783421,320.2209915718995 373.4515842115943,283.1171815543712" fill="none" stroke="hsl(120, 100%, 40%)" stroke-linejoin="round" stroke-width="31.986043118557145"/></g><g><polyline data-points="197.984,122.402 197.984,122.552" data-type="line" data-label="" points="373.4515842115943,283.1171815543712 373.4515842115943,235.13811687653651" fill="none" stroke="hsl(120, 100%, 40%)" stroke-linejoin="round" stroke-width="31.986043118557145"/></g><g><polyline data-points="197.984,122.552 197.984,123.162" data-type="line" data-label="" points="373.4515842115943,235.13811687653651 373.4515842115943,40.02325385333825" fill="none" stroke="hsl(120, 100%, 40%)" stroke-linejoin="round" stroke-width="31.986043118557145"/></g><circle data-type="circle" data-label="" data-x="198.067" data-y="121.999" cx="400" cy="412.02093532215804" r="47.979064677835716" fill="hsl(120, 100%, 40%)" stroke="black" stroke-width="0.003126363571428553"/><g><circle data-type="point" data-label="" data-x="197.98394489999998" data-y="123.16207269999998" cx="373.4339599018276" cy="40" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="123.15" cx="370.57284033091855" cy="43.86157902756531" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="123.1" cx="370.57284033091855" cy="59.85460058684839" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="123.05" cx="370.57284033091855" cy="75.8476221461242" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="123" cx="370.57284033091855" cy="91.8406437054" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.95" cx="370.57284033091855" cy="107.8336652646758" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.9" cx="370.57284033091855" cy="123.82668682395888" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.85" cx="370.57284033091855" cy="139.81970838323468" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.801" cx="370.57284033091855" cy="155.49286951132672" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.752" cx="370.57284033091855" cy="171.16603063942603" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.705" cx="370.57284033091855" cy="186.19947090514324" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.661" cx="370.57284033091855" cy="200.27332987730915" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.975" data-y="122.6" cx="370.57284033091855" cy="219.78481617962825" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.984" data-y="122.552" cx="373.4515842115943" cy="235.13811687653651" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="197.984" data-y="122.402" cx="373.4515842115943" cy="283.1171815543712" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="198.015" data-y="122.283" cx="383.3672575783421" cy="321.1805728654581" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="198.067" data-y="121.999" cx="400" cy="412.02093532215804" r="3" fill="rgba(0,204,0,0.5)"/></g><g><circle data-type="point" data-label="" data-x="198.067" data-y="121.999" cx="400" cy="412.02093532215804" r="3" fill="hsl(120, 100%, 40%)"/></g><g><circle data-type="point" data-label="" data-x="198.015" data-y="122.286" cx="383.3672575783421" cy="320.2209915718995" r="3" fill="hsl(120, 100%, 40%)"/></g><g><circle data-type="point" data-label="" data-x="197.984" data-y="122.402" cx="373.4515842115943" cy="283.1171815543712" r="3" fill="hsl(120, 100%, 40%)"/></g><g><circle data-type="point" data-label="" data-x="197.984" data-y="122.552" cx="373.4515842115943" cy="235.13811687653651" r="3" fill="hsl(120, 100%, 40%)"/></g><g><circle data-type="point" data-label="" data-x="197.984" data-y="123.162" cx="373.4515842115943" cy="40.02325385333825" r="3" fill="hsl(120, 100%, 40%)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="500" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '500');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":319.86043118557143,"c":0,"e":-62953.79602363258,"b":0,"d":-319.86043118557143,"f":39434.673679530686};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>