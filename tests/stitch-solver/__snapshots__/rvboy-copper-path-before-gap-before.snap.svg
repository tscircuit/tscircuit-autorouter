th="58.31775700934577" height="69.11734164070617" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00925961538461538"/></g><g><rect data-type="rect" data-label="top" data-x="-7.29" data-y="13.225" x="595.0363447559707" y="326.7289719626168" width="58.31775700934588" height="69.11734164070617" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00925961538461538"/></g><g><rect data-type="rect" data-label="top" data-x="-8.31" data-y="13.225" x="484.8805815160954" y="326.7289719626168" width="58.31775700934577" height="69.11734164070617" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00925961538461538"/></g><g><rect data-type="rect" data-label="top" data-x="-10.31" data-y="13" x="268.8888888888887" y="351.02803738317755" width="58.31775700934577" height="69.11734164070617" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00925961538461538"/></g><g><rect data-type="rect" data-label="top" data-x="-9.290000000000001" data-y="13" x="379.044652128764" y="351.02803738317755" width="58.31775700934577" height="69.11734164070617" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00925961538461538"/></g><g><rect data-type="rect" data-label="top" data-x="-10.31" data-y="15.5" x="268.8888888888887" y="81.03842159916928" width="58.31775700934577" height="69.11734164070617" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00925961538461538"/></g><g><rect data-type="rect" data-label="top" data-x="-9.290000000000001" data-y="15.5" x="379.044652128764" y="81.03842159916928" width="58.31775700934577" height="69.11734164070617" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00925961538461538"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="-8.2" data-y="13.85" x="223.5306334371753" y="39.999999999999886" width="604.776739356179" height="507.5804776739358" fill="none" stroke="none" stroke-width="0.00925961538461538"/></g><circle data-type="circle" data-label="" data-x="-6.664" data-y="14.821" cx="691.8006230529595" cy="188.92627206645898" r="24.299065420560762" fill="blue" stroke="none" stroke-width="0.00925961538461538"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":107.99584631360338,"c":0,"e":1411.4849428868124,"b":0,"d":-107.99584631360338,"f":1789.5327102803747};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>