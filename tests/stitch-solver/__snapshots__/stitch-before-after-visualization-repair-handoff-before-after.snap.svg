5228915663" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="5.4" data-y="0.6" cx="404.3373493975904" cy="326.0415228915663" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="Connection start" data-x="5.8" data-y="0.6" cx="431.32530120481925" cy="326.0415228915663" r="3" fill="green"/></g><g><circle data-type="point" data-label="Connection end" data-x="8.3" data-y="0.6" cx="600" cy="326.0415228915663" r="3" fill="red"/></g><g><circle data-type="point" data-label="" data-x="5.8" data-y="0.6" cx="431.32530120481925" cy="326.0415228915663" r="3" fill="rgba(100,116,139,0.65)"/></g><g><circle data-type="point" data-label="" data-x="6.8" data-y="0.6" cx="498.79518072289153" cy="326.0415228915663" r="3" fill="rgba(100,116,139,0.65)"/></g><g><circle data-type="point" data-label="" data-x="7.3" data-y="0.6" cx="532.5301204819277" cy="326.0415228915663" r="3" fill="rgba(100,116,139,0.65)"/></g><g><circle data-type="point" data-label="" data-x="8.3" data-y="0.6" cx="600" cy="326.0415228915663" r="3" fill="rgba(100,116,139,0.65)"/></g><g><circle data-type="point" data-label="" data-x="5.8" data-y="0.6" cx="431.32530120481925" cy="326.0415228915663" r="3" fill="rgba(22,163,74,0.7)"/></g><g><circle data-type="point" data-label="" data-x="6.8" data-y="0.6" cx="498.79518072289153" cy="326.0415228915663" r="3" fill="rgba(22,163,74,0.7)"/></g><g><circle data-type="point" data-label="" data-x="7.3" data-y="0.6" cx="532.5301204819277" cy="326.0415228915663" r="3" fill="rgba(22,163,74,0.7)"/></g><g><circle data-type="point" data-label="" data-x="8.3" data-y="0.6" cx="600" cy="326.0415228915663" r="3" fill="rgba(22,163,74,0.7)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":67.46987951807229,"c":0,"e":40,"b":0,"d":-67.46987951807229,"f":366.52345060240964};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>