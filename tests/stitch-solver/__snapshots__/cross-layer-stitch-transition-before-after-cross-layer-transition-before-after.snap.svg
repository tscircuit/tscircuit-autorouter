ta-type="rect" data-label="Before: offset cross-layer fragments step:1 layer:all" data-x="0.01" data-y="0.006" x="40" y="253.3772281959379" width="259.25925925925924" height="155.55555555555554" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.00007714285714285715"/></g><g><rect data-type="rect" data-label="After: explicit vertical transition step:2 layer:all" data-x="0.0332" data-y="0.006" x="340.74074074074065" y="253.3772281959379" width="259.2592592592593" height="155.55555555555554" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.00007714285714285715"/></g><circle data-type="circle" data-label="" data-x="0.034" data-y="0.006" cx="480.7407407407407" cy="331.1550059737157" r="19.444444444444443" fill="#2563eb" stroke="black" stroke-width="0.00007714285714285715"/><circle data-type="circle" data-label="" data-x="0.034" data-y="0.006" cx="480.7407407407407" cy="331.1550059737157" r="27.222222222222218" fill="rgba(147, 51, 234, 0.25)" stroke="#7e22ce" stroke-width="0.00007714285714285715"/><text data-type="text" data-label="Before: offset cross-layer fragments" data-x="0" data-y="0.013692384229390682" x="40" y="231.4389141112439" fill="rgb(18,18,18)" font-size="11.615558210540287" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: offset cross-layer fragments</text><text data-type="text" data-label="step:1" data-x="0.005555555555555556" data-y="0.0126888" x="112.01646090534979" y="244.44833930704903" fill="rgb(190,92,12)" font-size="11.615558210540287" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="0.008888888888888889" data-y="0.0126888" x="155.22633744855966" y="244.44833930704903" fill="rgb(120,58,175)" font-size="11.615558210540287" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="After: explicit vertical transition" data-x="0.0232" data-y="0.01372105806451613" x="340.7407407407407" y="231.06721624850658" fill="rgb(18,18,18)" font-size="11.947431302270012" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: explicit vertical transition</text><text data-type="text" data-label="step:2" data-x="0.028628571428571427" data-y="0.0126888" x="411.11111111111103" y="244.44833930704903" fill="rgb(190,92,12)" font-size="11.947431302270012" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:2</text><text data-type="text" data-label=" layer:all" data-x="0.032057142857142853" data-y="0.0126888" x="455.5555555555555" y="244.44833930704903" fill="rgb(120,58,175)" font-size="11.947431302270012" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="Connection start" data-x="0" data-y="0.0058000000000000005" cx="40" cy="333.7475985663083" r="3" fill="green"/></g><g><circle data-type="point" data-label="Connection end" data-x="0.02" data-y="0.006200000000000001" cx="299.25925925925924" cy="328.56241338112306" r="3" fill="red"/></g><g><circle data-type="point" data-label="" data-x="0" data-y="0.0058000000000000005" cx="40" cy="333.7475985663083" r="3" fill="rgba(37,99,235,0.75)"/></g><g><circle data-type="point" data-label="" data-x="0.01" data-y="0.0058000000000000005" cx="169.62962962962962" cy="333.7475985663083" r="3" fill="rgba(37,99,235,0.75)"/></g><g><circle data-type="point" data-label="" data-x="0.0108" data-y="0.006200000000000001" cx="180" cy="328.56241338112306" r="3" fill="rgba(37,99,235,0.3)"/></g><g><circle data-type="point" data-label="" data-x="0.02" data-y="0.006200000000000001" cx="299.25925925925924" cy="328.56241338112306" r="3" fill="rgba(37,99,235,0.3)"/></g><g><circle data-type="point" data-label="Connection start" data-x="0.023200000000000002" data-y="0.0056" cx="340.74074074074076" cy="336.3401911589009" r="3" fill="green"/></g><g><circle data-type="point" data-label="Connection end" data-x="0.0432" data-y="0.006" cx="600" cy="331.1550059737157" r="3" fill="red"/></g><g><circle data-type="point" data-label="" data-x="0.023200000000000002" data-y="0.0056" cx="340.74074074074076" cy="336.3401911589009" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="0.0332" data-y="0.0056" cx="470.3703703703703" cy="336.3401911589009" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="0.034" data-y="0.006" cx="480.7407407407407" cy="331.1550059737157" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="" data-x="0.034" data-y="0.006" cx="480.7407407407407" cy="331.1550059737157" r="3" fill="rgba(37,99,235,0.55)"/></g><g><circle data-type="point" data-label="" data-x="0.0432" data-y="0.006" cx="600" cy="331.1550059737157" r="3" fill="rgba(37,99,235,0.55)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":12962.962962962962,"c":0,"e":40,"b":0,"d":-12962.962962962962,"f":408.93278375149345};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>