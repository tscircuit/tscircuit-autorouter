<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><circle data-type="point" data-label="source_trace_0 pcb_port_0" data-x="-6.825" data-y="2" cx="256.3" cy="301.3333333333333" r="3" fill="black"/></g><g><circle data-type="point" data-label="source_trace_0 pcb_port_4" data-x="2.54" data-y="0" cx="343.70666666666665" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="source_trace_0 (top)" data-x="-6.825" data-y="2" cx="256.3" cy="301.3333333333333" r="3" fill="hsl(0, 100%, 50%)"/></g><g><circle data-type="point" data-label="source_trace_0 (top)" data-x="2.54" data-y="0" cx="343.70666666666665" cy="320" r="3" fill="hsl(0, 100%, 50%)"/></g><g><polyline data-points="-30,-20 30,-20 30,20 -30,20 -30,-20" data-type="line" data-label="" points="40,506.6666666666667 600,506.6666666666667 600,133.33333333333331 40,133.33333333333331 40,506.6666666666667" fill="none" stroke="rgba(255,0,0,0.25)" stroke-width="1px"/></g><g><polyline data-points="2.54,0 -0.2378247591302025,2.7778247591302025" data-type="line" data-label="" points="343.70666666666665,320 317.7803022481181,294.0736355814514" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="1.4000000000000001"/></g><g><polyline data-points="-0.2378247591302025,2.7778247591302025 -6.28973252931692,2.7778247591302025" data-type="line" data-label="" points="317.7803022481181,294.0736355814514 261.2958297263754,294.0736355814514" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="1.4000000000000001"/></g><g><polyline data-points="-6.28973252931692,2.7778247591302025 -6.28973252931692,2.5352674706830802" data-type="line" data-label="" points="261.2958297263754,294.0736355814514 261.2958297263754,296.3375036069579" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="1.4000000000000001"/></g><g><polyline data-points="-6.28973252931692,2.5352674706830802 -6.825,2" data-type="line" data-label="" points="261.2958297263754,296.33