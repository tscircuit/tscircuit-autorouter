6835281615" fill="none" stroke="rgba(0,0,255,0.5)" stroke-width="9.766785894944581"/></g><g><polyline data-points="2.9999999999999996,3.5999999999999996 6.022421668865937,3.5999999999999996" data-type="line" data-label="" points="186.50178842416867,411.15666835281615 383.2974239178667,411.15666835281615" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="9.766785894944581"/></g><g><polyline data-points="6.022421668865937,3.5999999999999996 9.350577600813336,6.928155931947399" data-type="line" data-label="" points="383.2974239178667,411.15666835281615 600,194.45409227068285" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="9.766785894944581"/></g><g><polyline data-points="9.350577600813336,6.928155931947399 9.350577600813336,8.649422399186664" data-type="line" data-label="" points="600,194.45409227068285 600,82.37915191285924" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="9.766785894944581"/></g><g><polyline data-points="9.350577600813336,8.649422399186664 9,9" data-type="line" data-label="" points="600,82.37915191285924 577.173224221952,59.5523761348112" fill="none" stroke="rgba(255,0,0,0.5)" stroke-width="9.766785894944581"/></g><g><rect data-type="rect" data-label="" data-x="5" data-y="5" x="251.61369439046592" y="254.88809403370283" width="130.2238119325944" height="130.2238119325944" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015358174287166671"/></g><g><rect data-type="rect" data-label="" data-x="1" data-y="1" x="39.99999999999997" y="564.1696473736146" width="32.555952983148615" height="32.555952983148586" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015358174287166671"/></g><g><rect data-type="rect" data-label="" data-x="9" data-y="9" x="560.8952477303777" y="43.27439964323685" width="32.555952983148586" height="32.555952983148586" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015358174287166671"/></g><g><rect data-type="rect" data-label="" data-x="1" data-y="9" x="39.99999999999997" y="43.27439964323685" width="32.555952983148615" height="32.555952983148586" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015358174287166671"/></g><g><rect data-type="rect" data-label="" data-x="9" data-y="1" x="560.8952477303777" y="564.1696473736146" width="32.555952983148586" height="32.555952983148586" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015358174287166671"/></g><g><rect data-type="rect" data-label="" data-x="4" data-y="1" x="235.33571789889163" y="564.1696473736146" width="32.555952983148586" height="32.555952983148586" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.015358174287166671"/></g><circle data-type="circle" data-label="" data-x="2.9999999999999996" data-y="2" cx="186.50178842416867" cy="515.3357178988916" r="19.533571789889162" fill="blue" stroke="none" stroke-width="0.015358174287166671"/><circle data-type="circle" data-label="" data-x="2.9999999999999996" data-y="3.5999999999999996" cx="186.50178842416867" cy="411.15666835281615" r="19.533571789889162" fill="blue" stroke="none" stroke-width="0.015358174287166671"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":65.11190596629721,"c":0,"e":-8.833929474722936,"b":0,"d":-65.11190596629721,"f":645.5595298314861};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>