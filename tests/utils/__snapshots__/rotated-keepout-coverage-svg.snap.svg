1" cy="304.83716212071215" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="0.7863603896932108" data-y="0.06363961030678927" cx="867.0134293171577" cy="299.58318833970577" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="0.7792893218813453" data-y="0.07071067811865477" cx="861.7594555361513" cy="294.3292145586994" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="0.9419238815542512" data-y="-0.04949747468305832" cx="982.6008524992985" cy="383.64676883580813" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="0.8005025253169417" data-y="0.09192388155425121" cx="877.5213768791705" cy="278.56729321568014" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="1.1116295090390227" data-y="0.12020815280171303" cx="1108.696223243452" cy="257.5513980916546" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="0.970208152801713" data-y="0.26162950903902255" cx="1003.616747623324" cy="152.47192247152668" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="1.132842712474619" data-y="0.14142135623730945" cx="1124.458144586471" cy="241.78947674863545" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="1.1257716446627535" data-y="0.14849242404917495" cx="1119.2041708054649" cy="236.53550296762904" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="1.118700576850888" data-y="0.1555634918610404" cx="1113.9501970244582" cy="231.28152918662266" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="1.1116295090390227" data-y="0.1626345596729059" cx="1108.696223243452" cy="226.02755540561623" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="1.0126345596729058" data-y="0.26162950903902255" cx="1035.1405903093623" cy="152.47192247152668" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="1.0055634918610403" data-y="0.26870057685088805" cx="1029.886616528356" cy="147.21794869052027" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="0.9984924240491749" data-y="0.2757716446627535" cx="1024.6326427473496" cy="141.9639749095139" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><circle data-type="circle" data-label="" data-x="0.9914213562373095" data-y="0.282842712474619" cx="1019.3786689663433" cy="136.71000112850746" r="2.972096390980759" fill="#e07600" stroke="black" stroke-width="0.001345851370143498"/><text data-type="text" data-label="INPUT: 0.6 x 0.2 mm at 45 deg" data-x="0" data-y="0.4" x="282.72871026280404" y="49.65931327068745" fill="black" font-size="19.318626541374933" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">INPUT: 0.6 x 0.2 mm at 45 deg</text><text data-type="text" data-label="Entire outlined area must be blocked" data-x="0" data-y="0.35" x="282.72871026280404" y="86.810518157947" fill="black" font-size="16.346530150394173" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Entire outlined area must be blocked</text><text data-type="text" data-label="AFTER OBSTACLE PREPROCESSING" data-x="0.85" data-y="0.4" x="914.2991933462152" y="49.65931327068745" fill="black" font-size="19.318626541374933" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">AFTER OBSTACLE PREPROCESSING</text><text data-type="text" data-label="32/441 points uncovered (orange)" data-x="0.85" data-y="0.35" x="914.2991933462152" y="86.810518157947" fill="black" font-size="16.346530150394173" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">32/441 points uncovered (orange)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":743.0240977451897,"c":0,"e":282.72871026280404,"b":0,"d":-743.0240977451897,"f":346.86895236876336};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>