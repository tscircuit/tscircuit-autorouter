"/></g><g><polyline data-points="-16.08,2.44 -16.48,2.22" data-type="line" data-label="0.0800 mm width guide" points="219.09838389566198,233.4675361497023 187.34335129004785,250.9328040827899" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="6.351006521122768"/></g><g><rect data-type="rect" data-label="" data-x="-14.75" data-y="0.15" x="304.8369719308191" y="379.5406861355259" width="39.69379075701727" height="71.44882336263112" fill="rgba(255,255,255,0)" stroke="rgba(100,116,139,0.08)" stroke-width="0.012596428571428571"/></g><g><rect data-type="rect" data-label="" data-x="-12.85" data-y="-0.25" x="447.73461865608147" y="417.24978735469233" width="55.57130705982422" height="59.54068613552596" fill="rgba(220,38,38,0.10)" stroke="none" stroke-width="0.012596428571428571"/></g><g><rect data-type="rect" data-label="" data-x="-14.45" data-y="1.35" x="169.87808335696042" y="141.37794159342218" width="357.24411681315576" height="357.24411681315564" fill="rgba(255,255,255,0)" stroke="none" stroke-width="0.012596428571428571"/></g><circle data-type="circle" data-label="" data-x="-15.45" data-y="1.55" cx="269.11256024950376" cy="304.12248369719305" r="57.15905869010491" fill="rgba(220,38,38,0.04)" stroke="rgba(220,38,38,0.12)" stroke-width="0.012596428571428571"/><circle data-type="circle" data-label="" data-x="-16.08" data-y="2.44" cx="219.09838389566198" cy="233.4675361497023" r="10.320385596824497" fill="rgba(255,255,255,0)" stroke="#991b1b" stroke-width="0.012596428571428571"/><text data-type="text" data-label="CURRENT 0.0800 mm  •  EXPECTED MINIMUM 0.1500 mm" data-x="-14.45" data-y="3.28" x="348.5001417635383" y="166.78196767791326" fill="#991b1b" font-size="17.46526793308761" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">CURRENT 0.0800 mm  •  EXPECTED MINIMUM 0.1500 mm</text><text data-type="text" data-label="source_net_0 • microphone GND terminal" data-x="-14.45" data-y="2.92" x="348.5001417635383" y="195.3614970229657" fill="#475569" font-size="14.289764672526227" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">source_net_0 • microphone GND terminal</text><text data-type="text" data-label="0.0800 mm trace width" data-x="-16.32" data-y="2.7" x="200.0453643322935" y="212.8267649560533" fill="#991b1b" font-size="12.702013042245536" font-family="sans-serif" text-anchor="end" dominant-baseline="text-after-edge">0.0800 mm trace width</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":79.3875815140346,"c":0,"e":1495.650694641338,"b":0,"d":-79.3875815140346,"f":427.1732350439467};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>