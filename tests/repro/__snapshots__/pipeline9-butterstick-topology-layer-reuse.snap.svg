 font-size="15.7006092254134" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">X = 5.255 mm</text><text data-type="text" data-label="Cell calculations: 2" data-x="4.35" data-y="5.85" x="295.66231505657083" y="416.81462140992176" fill="black" font-size="18.555265448215835" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Cell calculations: 2</text><text data-type="text" data-label="12 regions: 9 calculations" data-x="4.35" data-y="5.6" x="295.66231505657083" y="452.49782419495216" fill="black" font-size="15.7006092254134" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">12 regions: 9 calculations</text><text data-type="text" data-label="Calculate layers" data-x="4.5" data-y="4.95" x="317.07223672758914" y="545.2741514360313" fill="#9a3412" font-size="17.127937336814618" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Calculate layers</text><text data-type="text" data-label="Calculate layers" data-x="6" data-y="4.95" x="531.1714534377718" y="545.2741514360313" fill="#9a3412" font-size="17.127937336814618" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Calculate layers</text><text data-type="text" data-label="Native cell: 0.40 x 0.40 mm / layers 0-7" data-x="5.1" data-y="3.1" x="402.71192341166216" y="809.3298520452566" fill="black" font-size="15.7006092254134" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Native cell: 0.40 x 0.40 mm / layers 0-7</text><text data-type="text" data-label="Copper and merged mesh stay identical." data-x="5.1" data-y="2.8" x="402.71192341166216" y="852.1496953872931" fill="black" font-size="15.7006092254134" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Copper and merged mesh stay identical.</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="900" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '900');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":142.7328111401218,"c":0,"e":-325.225413402959,"b":0,"d":-142.7328111401218,"f":1251.8015665796343};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>