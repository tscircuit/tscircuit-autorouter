ne="central">R_BOOT_SEL1 / 3.3k / 0402</text><text data-type="text" data-label="1 → U_SOC.PC5" data-x="5.959" data-y="1.8875000000000028" x="508.15937149270474" y="290.74738764409835" fill="black" font-size="7.856341189674523" font-family="sans-serif" text-anchor="start" dominant-baseline="central">1 → U_SOC.PC5</text><text data-type="text" data-label="2 → GND" data-x="5.959" data-y="1.0275000000000034" x="508.15937149270474" y="358.3119218752992" fill="black" font-size="7.856341189674523" font-family="sans-serif" text-anchor="start" dominant-baseline="central">2 → GND</text><text data-type="text" data-label="PC5 pad gap: 0.051mm (min 0.10)" data-x="5.3389999999999995" data-y="0.5174999999999983" x="459.4500561167227" y="398.3792619426397" fill="red" font-size="8.641975308641975" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">PC5 pad gap: 0.051mm (min 0.10)</text><text data-type="text" data-label="Native candidate validator: REJECT" data-x="5.3389999999999995" data-y="0.31750000000000256" x="459.4500561167227" y="414.0919443219884" fill="red" font-size="8.641975308641975" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Native candidate validator: REJECT</text><text data-type="text" data-label="Materialized explicit-via copper:frame" data-x="3.828" data-y="3.0118560611205436" x="340.7407407407407" y="202.4141392956833" fill="rgb(18,18,18)" font-size="11.004213041564483" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Materialized explicit-via copper:frame</text><text data-type="text" data-label="step:unknown" data-x="4.522736842105263" data-y="2.8549800000000003" x="395.3216374269005" y="214.7388579022355" fill="rgb(190,92,12)" font-size="11.004213041564485" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="5.564842105263158" data-y="2.8549800000000003" x="477.1929824561403" y="214.7388579022355" fill="rgb(120,58,175)" font-size="11.004213041564485" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":78.56341189674522,"c":0,"e":40,"b":0,"d":-78.56341189674522,"f":439.0358275992052};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>