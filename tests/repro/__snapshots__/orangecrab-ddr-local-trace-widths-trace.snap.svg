d5e1" stroke="black" stroke-width="0.011115853658536592"/><circle data-type="circle" data-label="" data-x="12.54" data-y="6.549999999999983" cx="770.038398244652" cy="462.89680357341217" r="17.992320351069655" fill="#cbd5e1" stroke="black" stroke-width="0.011115853658536592"/><circle data-type="circle" data-label="" data-x="13.339999999999998" data-y="6.549999999999983" cx="842.0076796489304" cy="462.89680357341217" r="17.992320351069655" fill="#cbd5e1" stroke="black" stroke-width="0.011115853658536592"/><circle data-type="circle" data-label="" data-x="11.739999999999998" data-y="5.749999999999983" cx="698.0691168403732" cy="534.8660849776908" r="17.992320351069655" fill="#cbd5e1" stroke="black" stroke-width="0.011115853658536592"/><circle data-type="circle" data-label="" data-x="12.54" data-y="5.749999999999983" cx="770.038398244652" cy="534.8660849776908" r="17.992320351069655" fill="#cbd5e1" stroke="black" stroke-width="0.011115853658536592"/><circle data-type="circle" data-label="" data-x="13.339999999999998" data-y="5.749999999999983" cx="842.0076796489304" cy="534.8660849776908" r="17.992320351069655" fill="#cbd5e1" stroke="black" stroke-width="0.011115853658536592"/><circle data-type="circle" data-label="" data-x="5.058" data-y="6.968" cx="96.94569391113623" cy="425.29285403967503" r="12.59462424574876" fill="#64748b" stroke="black" stroke-width="0.011115853658536592"/><circle data-type="circle" data-label="" data-x="12.615" data-y="7.135" cx="776.7855183763031" cy="410.26926654653187" r="12.59462424574876" fill="#64748b" stroke="black" stroke-width="0.011115853658536592"/><text data-type="text" data-label="OrangeCrab · RAM_A11" data-x="4.539999999999993" data-y="9.701171620906454" x="50.34558420186522" y="179.41235715066887" fill="black" font-size="24.54152495885902" font-family="sans-serif" text-anchor="start" dominant-baseline="central">OrangeCrab · RAM_A11</text><text data-type="text" data-label="0.00 of 12.63 mm at requested width" data-x="4.539999999999993" data-y="9.322771620906453" x="50.34558420186522" y="213.45382725489276" fill="black" font-size="17.416566099835432" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0.00 of 12.63 mm at requested width</text><text data-type="text" data-label="Teal at requested width · amber below" data-x="4.539999999999993" data-y="9.023571620906454" x="50.34558420186522" y="240.37033850009288" fill="black" font-size="13.45825562260011" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Teal at requested width · amber below</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="720" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="900" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '900');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '720');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":89.96160175534827,"c":0,"e":-358.0800877674153,"b":0,"d":-89.96160175534827,"f":1052.1452950709418};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>