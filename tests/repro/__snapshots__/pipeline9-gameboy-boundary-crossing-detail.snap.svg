7.65923462058774" width="214.36806456261695" height="378.2965845222653" fill="transparent" stroke="transparent" stroke-width="0.015860571428571436"/></g><g><rect data-type="rect" data-label="" data-x="7.181919999999998" data-y="3.3999999999999986" x="472.64014987750363" y="240.9723921360801" width="40.35163568237499" height="141.230724888312" fill="rgba(0,200,200,0.05)" stroke="#64748b" stroke-width="0.015860571428571436"/></g><text data-type="text" data-label="VBUS" data-x="2.6445000000000007" data-y="4.6399999999999935" x="206.73421962818847" y="233.40646044563493" fill="#7c3aed" font-size="8.826920305519524" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">VBUS</text><text data-type="text" data-label="Red: existing top-layer copper" data-x="1.5120000000000005" data-y="0.3999999999999986" x="135.33073929961088" y="500.7360468413687" fill="black" font-size="7.565931690445305" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Red: existing top-layer copper</text><text data-type="text" data-label="Copper gap: 0.0325 mm; required: 0.1500 mm" data-x="1.5120000000000005" data-y="0.1999999999999993" x="135.33073929961088" y="513.3459329921109" fill="black" font-size="7.565931690445305" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Copper gap: 0.0325 mm; required: 0.1500 mm</text><text data-type="text" data-label="Before uniform spacing:end" data-x="0" data-y="6.5217260704714635" x="40" y="114.7647028679915" fill="rgb(18,18,18)" font-size="16.08308059920963" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before uniform spacing:end</text><text data-type="text" data-label="step:1510636" data-x="0.39538461538461567" data-y="6.2360288" x="64.92877492877494" y="132.77775313910627" fill="rgb(190,92,12)" font-size="16.08308059920963" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1510636</text><text data-type="text" data-label=" layer:z0" data-x="2.2932307692307705" data-y="6.2360288" x="184.5868945868946" y="132.77775313910627" fill="rgb(120,58,175)" font-size="16.08308059920963" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:z0</text><text data-type="text" data-label="VBUS" data-x="7.566920500000002" data-y="4.6399999999999935" x="517.0900300835854" y="233.40646044563493" fill="#7c3aed" font-size="8.826920305519524" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">VBUS</text><text data-type="text" data-label="Red: existing top-layer copper" data-x="6.2819199999999995" data-y="0.3999999999999986" x="436.0714800403514" y="500.7360468413687" fill="black" font-size="7.565931690445305" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Red: existing top-layer copper</text><text data-type="text" data-label="Copper gap: 0.1850 mm; required: 0.1500 mm" data-x="6.2819199999999995" data-y="0.1999999999999993" x="436.0714800403514" y="513.3459329921109" fill="black" font-size="7.565931690445305" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Copper gap: 0.1850 mm; required: 0.1500 mm</text><text data-type="text" data-label="After uniform spacing:end" data-x="4.769920000000003" data-y="6.533153961290322" x="340.74074074074076" y="114.0441808571469" fill="rgb(18,18,18)" font-size="16.726403823178014" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After uniform spacing:end</text><text data-type="text" data-label="step:0" data-x="5.5923200000000035" data-y="6.2360288" x="392.59259259259267" y="132.77775313910627" fill="rgb(190,92,12)" font-size="16.726403823178014" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:z0" data-x="6.579200000000004" data-y="6.2360288" x="454.81481481481484" y="132.77775313910627" fill="rgb(120,58,175)" font-size="16.726403823178014" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:z0</text><g><circle data-type="point" data-label="" data-x="2.5444999999999993" data-y="4.519999999999996" cx="200.4292765528173" cy="240.9723921360801" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="" data-x="7.4669205000000005" data-y="4.519999999999996" cx="510.78508700821425" cy="240.9723921360801" r="3" fill="#7c3aed"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":63.04943075371088,"c":0,"e":40,"b":0,"d":-63.04943075371088,"f":525.955819142853};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>