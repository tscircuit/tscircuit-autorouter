253244" y="235.49002601908035" fill="black" font-size="33.998265394622734" font-family="sans-serif" text-anchor="start" dominant-baseline="central">12 cells in this 2 × 1.5 mm crop</text><text data-type="text" data-label="Whole mesh: 69478 retained cells" data-x="0" data-y="-0.18" x="114.31049436253244" y="1143.7294015611446" fill="black" font-size="32.54119687771033" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Whole mesh: 69478 retained cells</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="1200" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '1200');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":485.68950563746756,"c":0,"e":114.31049436253244,"b":0,"d":-485.68950563746756,"f":1056.3052905464006};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>