<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-5.62,5.739999999999999 -5.678,5.848 -5.796,5.964 -5.912,6.081 -6.028,6.198 -6.145000000000004,6.265000000000003 -8.419999999999993,8.539999999999992" data-type="line" data-label="" points="363.26237038597367,419.28772804712037 356.5662212851214,406.81903661794706 342.9430213902839,393.4267384162423 329.55072318857924,379.9189893679712 316.1584249868746,366.41124031970014 302.65067593860306,358.67603359974976 40,96.0253576611467" fill="none" stroke="red" stroke-linejoin="round" stroke-width="9.236067725313559"/></g><g><polyline data-points="-3.569450899194317,6.064054626381577 -5.094999999999998,6.445441901582997 -5.212,6.432 -5.328,6.315 -5.112908459247908,5.985923776884594" data-type="line" data-label="" points="600,381.87534709760246 423.87406483334416,337.8438633059385 410.36631578507286,339.395742223158 396.9740175833681,352.90349127142906 421.8065180524727,390.89561981498275" fill="none" stroke="rgba(255,255,0,0.5)" stroke-linejoin="round" stroke-width="9.236067725313559" stroke-dasharray="0.2 0.2"/></g><g><polyline data-points="-5.112908459247908,5.985923776884594 -5.569450899194318,6.14" data-type="line" data-label="" points="421.8065180524727,390.89561981498275 369.098306867161,373.1073894205525" fill="none" stroke="red" stroke-linejoin="round" stroke-width="9.236067725313559"/></g><g><polyline data-points="-5.62,6.34 -5.445,6.548 -5.319,6.556 -5.212,6.315 -5.42,6.14" data-type="line" data-label="" points="363.26237038597367,350.0172201072686 383.466268535097,326.00344402145333 398.013075202466,325.079837248922 410.36631578507286,352.90349127142906 386.3525396992576,373.1073894205525" fill="none" stroke="rgba(0,128,0,0.5)" stroke-linejoin="round" stroke-width="9.236067725313559" stroke-dasharray="0.2 0.2"/></g><g><rect data-type="rect" data-label="" data-x="-5.620000000000001" data-y="6.139999999999992" x="340.17220107268935" y="350.0172201072697" width="46.180338626568414" height="46.18033862656773" fill="transparent" stroke="#64748b" stroke-width="0.008661694822867279"/></g><circle data-type="circle" data-label="" data-x="-5.112908459247908" data-y="5.985923776884594" cx="421.8065180524727" cy="390.89561981498275" r="20.203898149123408" fill="blue" stroke="none" stroke-width="0.008661694822867279"/><text data-type="text" data-label="SVREF region: routed" data-x="-8.419999999999993" data-y="5.339999999999999" x="40" y="465.4680666736882" fill="#166534" font-size="23.090169313283894" font-family="sans-serif" text-anchor="start" dominant-baseline="central">SVREF region: routed</text><text data-type="text" data-label="Via–trace gap: 0.349 mm (minimum 0.100 mm)" data-x="-8.419999999999993" data-y="5.039999999999999" x="40" y="500.1033206436141" fill="black" font-size="18.472135450627118" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Via–trace gap: 0.349 mm (minimum 0.100 mm)</text><text data-type="text" data-label="Routing clearance: 0.150 mm" data-x="-8.419999999999993" data-y="4.739999999999999" x="40" y="534.7385746135399" fill="black" font-size="18.472135450627118" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Routing clearance: 0.150 mm</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":115.45084656641947,"c":0,"e":1012.0961280892511,"b":0,"d":-115.45084656641947,"f":1081.975587338368};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>