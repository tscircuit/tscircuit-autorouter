t" data-label="top" data-x="-12.55" data-y="6.5" x="877.2584419926447" y="703.368438649281" width="14.764292878635729" height="14.764292878635956" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.016255434782608696"/></g><g><rect data-type="rect" data-label="top" data-x="-11.9" data-y="6.5" x="917.2450685389504" y="703.368438649281" width="14.764292878635729" height="14.764292878635956" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.016255434782608696"/></g><g><rect data-type="rect" data-label="top" data-x="-12.75" data-y="13" x="841.5780675359413" y="255.51822133065838" width="61.517886994316314" height="110.73219658976939" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.016255434782608696"/></g><circle data-type="circle" data-label="" data-x="-22.411" data-y="12.75" cx="278.0127047810097" cy="326.2637913741222" r="9.227683049147442" fill="blue" stroke="none" stroke-width="0.016255434782608696"/><circle data-type="circle" data-label="" data-x="-18.75" data-y="9.487" cx="503.22968906720166" cy="526.9966566365762" r="9.227683049147442" fill="blue" stroke="none" stroke-width="0.016255434782608696"/><circle data-type="circle" data-label="" data-x="-15.630406545097486" data-y="8.44" cx="695.1404866941033" cy="591.4058843196254" r="9.227683049147442" fill="blue" stroke="none" stroke-width="0.016255434782608696"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="850" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '850');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":61.517886994316285,"c":0,"e":1656.690070210632,"b":0,"d":-61.517886994316285,"f":1110.6168505516548};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></g>
