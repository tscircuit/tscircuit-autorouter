" stroke-width="0.011416071428571428"/><circle data-type="circle" data-label="" data-x="-0.2952619265760646" data-y="19.451679857547955" cx="347.00036307170404" cy="526.8821710891832" r="19.70905678085406" fill="blue" stroke="none" stroke-width="0.011416071428571428"/><circle data-type="circle" data-label="" data-x="0.07715436677031655" data-y="21.090560652761475" cx="379.62246916805526" cy="383.32308375622983" r="19.70905678085406" fill="blue" stroke="none" stroke-width="0.011416071428571428"/><circle data-type="circle" data-label="" data-x="1.8357750564254889" data-y="20.987112376899404" cx="533.6702692942708" cy="392.38471905777214" r="19.70905678085406" fill="blue" stroke="none" stroke-width="0.011416071428571428"/><circle data-type="circle" data-label="" data-x="2.362" data-y="22.807" cx="579.7653683716565" cy="232.970192397936" r="19.70905678085406" fill="blue" stroke="none" stroke-width="0.011416071428571428"/><circle data-type="circle" data-label="" data-x="-2.630075625672591" data-y="22.124998999999995" cx="142.4804707685514" cy="292.7106209917106" r="19.70905678085406" fill="blue" stroke="none" stroke-width="0.011416071428571428"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":87.59580791490693,"c":0,"e":372.8640700766463,"b":0,"d":-87.59580791490693,"f":2230.767783513218};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="relaxed-drc-summary"><rect x="12" y="12" width="300" height="44" rx="6" fill="white" stroke="#b91c1c"/><text x="24" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#b91c1c">Relaxed DRC errors: 1</text></g></svg>