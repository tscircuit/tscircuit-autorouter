.2595004276136" y="319.0998626974037" width="154.20965250765374" height="36.265903407308656" fill="rgba(255, 0, 0, 0.15)" stroke="black" stroke-width="0.0027574109729704673"/></g><g><rect data-type="rect" data-label="obstacle (Z: 0)" data-x="1.1041675973246647" data-y="0.4500000000000002" x="356.2725342953961" y="282.83395929009487" width="168.32764001033678" height="36.26590340730871" fill="rgba(255, 0, 0, 0.15)" stroke="black" stroke-width="0.0027574109729704673"/></g><g><rect data-type="rect" data-label="obstacle (Z: 0)" data-x="1.044569999822862" data-y="0.5500000000000003" x="356.269357534411" y="246.56805588278624" width="125.10677924614629" height="36.26590340730871" fill="rgba(255, 0, 0, 0.15)" stroke="black" stroke-width="0.0027574109729704673"/></g><g><rect data-type="rect" data-label="obstacle (Z: 0)" data-x="0.941189957396098" data-y="0.6500000000000004" x="356.2661807734258" y="210.30215247547756" width="50.12972011026682" height="36.265903407308684" fill="rgba(255, 0, 0, 0.15)" stroke="black" stroke-width="0.0027574109729704673"/></g><text data-type="text" data-label="BUG: 0.10mm terminal taper below 0.15mm minimum:end" data-x="0" data-y="0.7950359030492817" x="40.000000000000625" y="175.83652367336163" fill="rgb(18,18,18)" font-size="17.71030993042376" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">BUG: 0.10mm terminal taper below 0.15mm minimum:end</text><text data-type="text" data-label="step:unknown" data-x="0.4390230804023562" data-y="0.7403411477600004" x="199.21568627451023" y="195.67207079543624" fill="rgb(190,92,12)" font-size="17.710309930423765" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="0.8023525262525821" data-y="0.7403411477600004" x="330.98039215686305" y="195.67207079543624" fill="rgb(120,58,175)" font-size="17.710309930423765" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":362.65903407308673,"c":0,"e":40.000000000000625,"b":0,"d":-362.65903407308673,"f":464.1634763266384};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>