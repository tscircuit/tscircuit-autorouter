-y="-91.28800000000001" cx="40" cy="393.48958333333314" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA7_mst1" data-x="174.87799999999982" data-y="-66.70000000000027" cx="599.9999999999986" cy="233.41145833333536" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA5_mst1" data-x="88.86199999999974" data-y="-76.15200000000004" cx="40" cy="294.94791666666697" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA5_mst1" data-x="174.87799999999982" data-y="-62.700000000000045" cx="599.9999999999986" cy="207.3697916666673" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA3_mst1" data-x="125.54999999999984" data-y="-100.79999999999995" cx="278.8541666666665" cy="455.41666666666583" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA3_mst1" data-x="174.87799999999982" data-y="-64.70000000000005" cx="599.9999999999986" cy="220.39062500000063" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA2_mst1" data-x="125.22999999999968" data-y="-100.79999999999995" cx="276.7708333333321" cy="455.41666666666583" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA2_mst1" data-x="174.87799999999982" data-y="-65.70000000000027" cx="599.9999999999986" cy="226.90104166666873" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA0_mst1" data-x="125.86999999999955" data-y="-100.79999999999995" cx="280.93749999999795" cy="455.41666666666583" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SA0_mst1" data-x="174.87799999999982" data-y="-60.700000000000045" cx="599.9999999999986" cy="194.34895833333405" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SDQS0_N" data-x="126.18999999999971" data-y="-100.79999999999995" cx="283.02083333333235" cy="455.41666666666583" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SDQS0_N" data-x="174.87799999999982" data-y="-59.700000000000045" cx="599.9999999999986" cy="187.83854166666737" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SDQ5" data-x="125.38999999999999" data-y="-100.79999999999995" cx="277.8125000000008" cy="455.41666666666583" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SDQ5" data-x="174.87799999999982" data-y="-65.20000000000027" cx="599.9999999999986" cy="223.64583333333542" r="3" fill="blue"/></g><g><circle data-type="point" data-label="/S0SDQ2" data-x="125.7099999999997" data-y="-100.79999999999995" cx="279.89583333333223" cy="455.41666666666583" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SDQ2" data-x="174.87799999999982" data-y="-61.700000000000045" cx="599.9999999999986" cy="200.85937500000068" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SDQ1" data-x="126.02999999999986" data-y="-100.79999999999995" cx="281.97916666666663" cy="455.41666666666583" r="3" fill="red"/></g><g><circle data-type="point" data-label="/S0SDQ1" data-x="174.87799999999982" data-y="-70.70000000000027" cx="599.9999999999986" cy="259.45312500000193" r="3" fill="red"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":6.510416666666644,"c":0,"e":-538.5286458333296,"b":0,"d":-6.510416666666644,"f":-200.83333333333155};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>