e="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="130.2" data-y="-83.8" cx="264.2267181261068" cy="205.33294775829017" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="131" data-y="-85.4" cx="363.88303729326617" cy="404.64558609260894" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="131" data-y="-84.6" cx="363.88303729326617" cy="304.98926692544774" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="131" data-y="-83.8" cx="363.88303729326617" cy="205.33294775829017" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="131.8" data-y="-85.4" cx="463.53935646042737" cy="404.64558609260894" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="131.8" data-y="-84.6" cx="463.53935646042737" cy="304.98926692544774" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="131.8" data-y="-83.8" cx="463.53935646042737" cy="205.33294775829017" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="132.6" data-y="-85.4" cx="563.1956756275831" cy="404.64558609260894" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="132.6" data-y="-84.6" cx="563.1956756275831" cy="304.98926692544774" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><circle data-type="circle" data-label="" data-x="132.6" data-y="-83.8" cx="563.1956756275831" cy="205.33294775829017" r="24.914079791789604" fill="rgba(220,38,38,0.35)" stroke="black" stroke-width="0.008027589285714244"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":124.57039895894802,"c":0,"e":-15954.839226328924,"b":0,"d":-124.57039895894802,"f":-10233.666485001553};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g><rect x="12" y="12" width="580" height="92" rx="6" fill="white" stroke="#b91c1c"/><text x="24" y="38" font-family="Arial,sans-serif" font-size="18" fill="#b91c1c">A64 CPU to DDR: via copper / pad clearance</text><text x="24" y="64" font-family="Arial,sans-serif" font-size="18" fill="#b91c1c">Violations: 2; source minimum: 0.10668 mm</text><text x="24" y="90" font-family="Arial,sans-serif" font-size="16" fill="#334155">Whole input: 11 signals, 2122 obstacles</text></g></svg>