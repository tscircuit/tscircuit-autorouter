ata-label="" data-x="1.726" data-y="1.1575" cx="167.85185185185185" cy="456.66126719852" r="22.22222222222222" fill="blue" stroke="none" stroke-width="0.0135"/><circle data-type="circle" data-label="" data-x="1.746" data-y="4.1575" cx="169.33333333333334" cy="234.43904497629785" r="22.22222222222222" fill="blue" stroke="none" stroke-width="0.0135"/><circle data-type="circle" data-label="" data-x="5.7860000000000005" data-y="1.1575" cx="468.59259259259267" cy="456.66126719852" r="22.22222222222222" fill="blue" stroke="none" stroke-width="0.0135"/><circle data-type="circle" data-label="" data-x="5.806" data-y="4.1575" cx="470.0740740740741" cy="234.43904497629785" r="22.22222222222222" fill="blue" stroke="none" stroke-width="0.0135"/><circle data-type="circle" data-label="" data-x="5.4110000000000005" data-y="1.1575" cx="440.81481481481484" cy="456.66126719852" r="7.407407407407408" fill="rgba(185, 28, 28, 0.12)" stroke="#b91c1c" stroke-width="0.0135"/><circle data-type="circle" data-label="" data-x="5.421" data-y="4.1575" cx="441.5555555555556" cy="234.43904497629785" r="7.407407407407408" fill="rgba(185, 28, 28, 0.12)" stroke="#b91c1c" stroke-width="0.0135"/><text data-type="text" data-label="0.150 mm gap / 0.200 mm required" data-x="1.976" data-y="0.5075" x="186.37037037037038" y="504.8094153466682" fill="#b91c1c" font-size="9.62962962962963" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.150 mm gap / 0.200 mm required</text><text data-type="text" data-label="0.170 mm gap / 0.200 mm required" data-x="1.976" data-y="3.5075000000000003" x="186.37037037037038" y="282.58719312444595" fill="#b91c1c" font-size="9.62962962962963" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.170 mm gap / 0.200 mm required</text><text data-type="text" data-label="Autorouter reference: 2 errors:frame" data-x="0" data-y="5.976527240143369" x="40" y="99.69628644715937" fill="rgb(18,18,18)" font-size="11.615558210540291" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Autorouter reference: 2 errors:frame</text><text data-type="text" data-label="step:unknown" data-x="0.6805555555555554" data-y="5.8008999999999995" x="90.41152263374485" y="112.7057116429645" fill="rgb(190,92,12)" font-size="11.615558210540291" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="1.847222222222222" data-y="5.8008999999999995" x="176.8312757201646" y="112.7057116429645" fill="rgb(120,58,175)" font-size="11.615558210540291" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="0.150 mm gap / 0.200 mm required" data-x="6.0360000000000005" data-y="0.5075" x="487.11111111111114" y="504.8094153466682" fill="#b91c1c" font-size="9.62962962962963" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.150 mm gap / 0.200 mm required</text><text data-type="text" data-label="0.170 mm gap / 0.200 mm required" data-x="6.0360000000000005" data-y="3.5075000000000003" x="487.11111111111114" y="282.58719312444595" fill="#b91c1c" font-size="9.62962962962963" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.170 mm gap / 0.200 mm required</text><text data-type="text" data-label="Via-pad checker: 2 errors:frame" data-x="4.0600000000000005" data-y="6.004854214360041" x="340.74074074074076" y="97.59799206073922" fill="rgb(18,18,18)" font-size="13.489035341272595" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Via-pad checker: 2 errors:frame</text><text data-type="text" data-label="step:unknown" data-x="4.5680645161290325" data-y="5.8008999999999995" x="378.3751493428913" y="112.7057116429645" fill="rgb(190,92,12)" font-size="13.489035341272595" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="5.9229032258064525" data-y="5.8008999999999995" x="478.7335722819594" y="112.7057116429645" fill="rgb(120,58,175)" font-size="13.489035341272595" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":74.07407407407408,"c":0,"e":40,"b":0,"d":-74.07407407407408,"f":542.4020079392608};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>