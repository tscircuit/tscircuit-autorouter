cx="320" cy="450.53613053613054" r="3" fill="red"/></g><g><circle data-type="point" data-label="signal_2" data-x="-0.858" data-y="-0.8" cx="180" cy="450.53613053613054" r="3" fill="red"/></g><g><circle data-type="point" data-label="signal_3" data-x="0" data-y="0.8" cx="320" cy="189.46386946386946" r="3" fill="red"/></g><g><circle data-type="point" data-label="signal_3" data-x="-0.858" data-y="0.8" cx="180" cy="189.46386946386946" r="3" fill="red"/></g><g><circle data-type="point" data-label="signal_4" data-x="0.858" data-y="0.8452" cx="460" cy="182.0885780885781" r="3" fill="red"/></g><g><circle data-type="point" data-label="signal_4" data-x="-0.858" data-y="-0.03154953652639" cx="180" cy="325.14794302295405" r="3" fill="red"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":163.17016317016316,"c":0,"e":320,"b":0,"d":-163.17016317016316,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>