"source_trace_2" data-x="-0.37749999999999995" data-y="-0.325" cx="292.9840255591054" cy="587.4760383386581" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_trace_2" data-x="-2.835" data-y="0.5724999999999998" cx="117.11182108626201" cy="523.2460063897764" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_trace_1" data-x="2.835" data-y="4.535" cx="522.888178913738" cy="239.66773162939302" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_trace_1" data-x="-2.835" data-y="-0.14250000000000007" cx="117.11182108626201" cy="574.4153354632588" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_trace_0" data-x="2.835" data-y="1.25" cx="522.888178913738" cy="474.7603833865815" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_trace_0" data-x="-2.1325" data-y="-0.325" cx="167.3865814696486" cy="587.4760383386581" r="3" fill="red"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":71.56549520766772,"c":0,"e":320,"b":0,"d":-71.56549520766772,"f":564.2172523961661};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="via-count-summary"><rect x="12" y="64" width="300" height="44" rx="6" fill="white" stroke="#334155"/><text x="24" y="92" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#334155">Routed vias: 6</text></g></svg>