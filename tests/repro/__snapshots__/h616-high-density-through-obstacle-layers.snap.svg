"#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g><rect data-type="rect" data-label="" data-x="2.464999999999997" data-y="4.024999999999997" x="313.9575713240673" y="557.1909290416972" width="9.524506217995622" height="9.524506217995622" fill="#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g><rect data-type="rect" data-label="" data-x="2.314999999999997" data-y="3.8749999999999973" x="298.5954645208485" y="572.5530358449159" width="9.524506217995622" height="9.524506217995508" fill="#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g><rect data-type="rect" data-label="" data-x="1.989999999999998" data-y="5.649999999999997" x="265.3108997805414" y="390.768105340161" width="9.524506217995622" height="9.524506217995622" fill="#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g><rect data-type="rect" data-label="" data-x="1.989999999999998" data-y="4.349999999999997" x="265.3108997805414" y="523.9063643013899" width="9.524506217995622" height="9.524506217995622" fill="#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g><rect data-type="rect" data-label="" data-x="1.989999999999998" data-y="3.6999999999999975" x="265.3108997805414" y="590.4754937820044" width="9.524506217995622" height="9.524506217995622" fill="#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g><rect data-type="rect" data-label="" data-x="1.9899999999999975" data-y="8.899999999999997" x="265.3108997805414" y="57.92245793708855" width="9.524506217995622" height="9.524506217995622" fill="#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g><rect data-type="rect" data-label="" data-x="1.9899999999999975" data-y="7.599999999999997" x="265.3108997805414" y="191.06071689831754" width="9.524506217995622" height="9.524506217995622" fill="#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g><rect data-type="rect" data-label="" data-x="1.9899999999999975" data-y="6.9499999999999975" x="265.3108997805414" y="257.6298463789319" width="9.524506217995622" height="9.524506217995622" fill="#2563eb" stroke="black" stroke-width="0.009764285714285715"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":102.41404535479151,"c":0,"e":66.2692026335043,"b":0,"d":-102.41404535479151,"f":974.1697147037305};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="layered-obstacles"><rect x="12" y="12" width="470" height="44" rx="6" fill="white" stroke="#166534"/><text x="24" y="40" font-family="Arial, sans-serif" font-size="20" fill="#166534">Obstacles layer-normalized: 0</text></g></svg>