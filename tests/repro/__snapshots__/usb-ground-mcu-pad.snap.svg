y="86.39652810515406" width="18.321584430234054" height="73.28633772093622" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010916064642857142"/></g><g><rect data-type="rect" data-label="top" data-x="1.874997" data-y="-6.600027000000001" x="526.7136622790638" y="178.00677710220072" width="73.28633772093622" height="18.32158443023411" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010916064642857142"/></g><g><rect data-type="rect" data-label="top" data-x="1.874997" data-y="-7.000077000000001" x="526.7136622790638" y="214.65459965442165" width="73.28633772093622" height="18.321584430233997" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010916064642857142"/></g><g><rect data-type="rect" data-label="top" data-x="1.874997" data-y="-7.400127" x="526.7136622790638" y="251.30242220664235" width="73.28633772093622" height="18.32158443023411" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010916064642857142"/></g><g><rect data-type="rect" data-label="top" data-x="1.874997" data-y="-7.800177000000001" x="526.7136622790638" y="287.95024475886316" width="73.28633772093622" height="18.321584430233997" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010916064642857142"/></g><g><rect data-type="rect" data-label="top" data-x="1.874997" data-y="-8.200227" x="526.7136622790638" y="324.5980673110838" width="73.28633772093622" height="18.321584430234225" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010916064642857142"/></g><circle data-type="circle" data-label="" data-x="-2.472" data-y="-8.129" cx="165.13667193184253" cy="327.2338890051984" r="13.741215805107158" fill="blue" stroke="none" stroke-width="0.010916064642857142"/><circle data-type="circle" data-label="" data-x="-3.688" data-y="-9.148" cx="53.74121580510712" cy="420.5825483745597" r="13.741215805107158" fill="blue" stroke="none" stroke-width="0.010916064642857142"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":91.60810536738106,"c":0,"e":391.5919084000085,"b":0,"d":-91.60810536738106,"f":-417.44839952624216};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>