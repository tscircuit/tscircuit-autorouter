<circle data-type="point" data-label="ESD.DM" data-x="5" data-y="-3.7" cx="572.546527462551" cy="475.95097594189735" r="3" fill="black"/></g><g><circle data-type="point" data-label="ESD.DM" data-x="5" data-y="-3.7" cx="572.546527462551" cy="475.95097594189735" r="3" fill="black"/></g><g><circle data-type="point" data-label="MCU.DM" data-x="-3" data-y="-3.7" cx="165.82841579664094" cy="475.95097594189735" r="3" fill="black"/></g><g><circle data-type="point" data-label="ESD.DP" data-x="5" data-y="-2.3" cx="572.546527462551" cy="404.7753064003631" r="3" fill="black"/></g><g><circle data-type="point" data-label="TP.DP" data-x="5" data-y="1.7" cx="572.546527462551" cy="201.41625056740807" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":50.83976395823876,"c":0,"e":318.3477076713572,"b":0,"d":-50.83976395823876,"f":287.84384929641396};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>