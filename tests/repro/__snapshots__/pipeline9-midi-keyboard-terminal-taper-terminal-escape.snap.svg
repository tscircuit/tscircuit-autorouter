source_net_18" data-x="33.22717900000002" data-y="18.401239000000004" x="639.0572851707238" y="183.42352676890005" width="160.80125388181477" height="135.41158221626392" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0059079141304347865"/></g><circle data-type="circle" data-label="" data-x="29.363" data-y="19.133" cx="65.38967166554994" cy="127.26817435933845" r="25.389671665549567" fill="blue" stroke="none" stroke-width="0.0059079141304347865"/><circle data-type="circle" data-label="" data-x="29.784" data-y="18.676" cx="136.65001680685873" cy="204.62204070037933" r="25.389671665549567" fill="blue" stroke="none" stroke-width="0.0059079141304347865"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":169.26447777033044,"c":0,"e":-4904.723189104663,"b":0,"d":-169.26447777033044,"f":3365.8054275390705};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="terminal-taper-summary"><rect x="12" y="12" width="830" height="84" rx="6" fill="white" stroke="#b91c1c"/><text x="24" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#b91c1c">Real MIDI keyboard: live trace-width stage</text><text x="24" y="76" font-family="Arial, sans-serif" font-size="18" fill="#b91c1c">Board minimum: 0.150 mm; emitted minimum: 0.100 mm; below minimum: 9</text></g></svg>