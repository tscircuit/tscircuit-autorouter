99999999" data-y="5.390000000000001" cx="427.3534292318752" cy="373.7019806489709" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="3.9139999999999997" data-y="5.390000000000001" cx="339.1853697444613" cy="373.7019806489709" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="4.474" data-y="1.790000000000001" cx="362.69685227443836" cy="524.8472254845376" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="3.9139999999999997" data-y="5.390000000000001" cx="339.1853697444613" cy="373.7019806489709" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="4.374079999999999" data-y="10.985043099999999" cx="358.5017320344467" cy="138.79526975590204" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="6.013999999999999" data-y="3.3900000000000006" cx="427.3534292318752" cy="457.6715611131747" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="6.474" data-y="0.39000000000000057" cx="446.66643273864213" cy="583.6259318094802" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="5.644079999999999" data-y="8.4450431" cx="411.82241562921604" cy="245.4366369454408" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="6.013999999999999" data-y="3.3900000000000006" cx="427.3534292318752" cy="457.6715611131747" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="3.9139999999999997" data-y="3.3900000000000006" cx="339.1853697444613" cy="457.6715611131747" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="4.474" data-y="0.39000000000000057" cx="362.69685227443836" cy="583.6259318094802" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="3.9139999999999997" data-y="3.3900000000000006" cx="339.1853697444613" cy="457.6715611131747" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="6.9140799999999984" data-y="10.985043099999999" cx="465.14309922398536" cy="138.79526975590204" r="3" fill="#111827"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":41.984790232101865,"c":0,"e":174.8569007760146,"b":0,"d":-41.984790232101865,"f":600};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>