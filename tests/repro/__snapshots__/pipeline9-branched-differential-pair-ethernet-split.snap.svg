499247" fill="rgb(120,58,175)" font-size="8.515476575886174" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="" data-x="6.474" data-y="1.790000000000001" cx="446.7063818142324" cy="524.8235231996858" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="0.564079999999999" data-y="8.4450431" cx="198.50137412053806" cy="245.32481190793118" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="4.474" data-y="1.790000000000001" cx="362.7103183501942" cy="524.8235231996858" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="4.374079999999999" data-y="10.985043099999999" cx="358.5138750195308" cy="138.64981130860275" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="6.474" data-y="0.39000000000000057" cx="446.7063818142324" cy="583.6207676245125" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="5.644079999999999" data-y="8.4450431" cx="411.85137531919503" cy="245.32481190793118" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="4.474" data-y="0.39000000000000057" cx="362.7103183501942" cy="583.6207676245125" r="3" fill="#111827"/></g><g><circle data-type="point" data-label="" data-x="6.9140799999999984" data-y="10.985043099999999" cx="465.18887561885924" cy="138.64981130860275" r="3" fill="#111827"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":41.998031732019086,"c":0,"e":174.8111243811408,"b":0,"d":-41.998031732019086,"f":600};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>