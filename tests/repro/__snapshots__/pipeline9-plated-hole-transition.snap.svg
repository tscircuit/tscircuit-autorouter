ta-x="2" data-y="4" x="284.6297448662103" y="155.34536403235842" width="278.7803360298693" height="3.484754200373345" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.02869642857142857"/></g><g><rect data-type="rect" data-label="top" data-x="-2" data-y="0.5" x="282.88736776602366" y="157.0877411325451" width="3.484754200373345" height="243.93279402613564" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.02869642857142857"/></g><g><rect data-type="rect" data-label="top" data-x="1.5" data-y="-3" x="284.62974486621033" y="399.27815805849406" width="243.93279402613564" height="3.484754200373345" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.02869642857142857"/></g><g><rect data-type="rect" data-label="top" data-x="5" data-y="0" x="526.8201617921593" y="191.93528313627877" width="3.484754200373345" height="209.08525202240196" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.02869642857142857"/></g><g><rect data-type="rect" data-label="top" data-x="2" data-y="3" x="319.4772868699439" y="190.1929060360921" width="209.08525202240202" height="3.484754200373345" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.02869642857142857"/></g><g><rect data-type="rect" data-label="top" data-x="-1" data-y="0.5" x="317.7349097697572" y="191.93528313627874" width="3.484754200373402" height="174.23771001866834" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.02869642857142857"/></g><circle data-type="circle" data-label="" data-x="-7.65" data-y="-1.075" cx="87.74113254511508" cy="333.93901680149344" r="5.22713130056005" fill="blue" stroke="none" stroke-width="0.02869642857142857"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":34.847542003733665,"c":0,"e":354.32482887367763,"b":0,"d":-34.847542003733665,"f":296.47790914747975};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="relaxed-drc-summary"><rect x="12" y="12" width="300" height="44" rx="6" fill="white" stroke="#166534"/><text x="24" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#166534">Relaxed DRC errors: 0</text></g></svg>