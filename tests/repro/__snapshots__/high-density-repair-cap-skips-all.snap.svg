-type="line" data-label="" points="552.5676274944568,365.07317073170725 568.3370288248337,351.9113082039912" fill="none" stroke="rgba(14,165,233,0.5)" stroke-width="12.416851441241686" stroke-dasharray="0.1 0.3"/></g><g><polyline data-points="2.05,8.573 2.178,8.678" data-type="line" data-label="" points="568.3370288248337,351.9113082039912 584.2305986696231,338.87361419068725" fill="none" stroke="rgba(14,165,233,0.5)" stroke-width="12.416851441241686" stroke-dasharray="0.1 0.3"/></g><g><polyline data-points="2.178,8.678 2.3049999999999997,8.703" data-type="line" data-label="" points="584.2305986696231,338.87361419068725 600,335.76940133037715" fill="none" stroke="rgba(14,165,233,0.5)" stroke-width="12.416851441241686" stroke-dasharray="0.1 0.3"/></g><g><polyline data-points="2.3049999999999997,8.887 2.178,8.996" data-type="line" data-label="" points="600,312.9223946784923 584.2305986696231,299.3880266075389" fill="none" stroke="#0ea5e9" stroke-width="12.416851441241686"/></g><g><polyline data-points="2.178,8.996 2.0860000000000003,9.068" data-type="line" data-label="" points="584.2305986696231,299.3880266075389 572.8070953436808,290.44789356984484" fill="none" stroke="#0ea5e9" stroke-width="12.416851441241686"/></g><g><polyline data-points="2.0860000000000003,9.068 2.16,8.98" data-type="line" data-label="" points="572.8070953436808,290.44789356984484 581.9955654101996,301.3747228381376" fill="none" stroke="rgba(14,165,233,0.5)" stroke-width="12.416851441241686" stroke-dasharray="0.1 0.3"/></g><g><polyline data-points="2.16,8.98 2.233,8.885" data-type="line" data-label="" points="581.9955654101996,301.3747228381376 591.059866962306,313.17073170731715" fill="none" stroke="rgba(14,165,233,0.5)" stroke-width="12.416851441241686" stroke-dasharray="0.1 0.3"/></g><g><polyline data-points="2.233,8.885 2.3049999999999997,8.784" data-type="line" data-label="" points="591.059866962306,313.17073170731715 600,325.7117516629712" fill="none" stroke="rgba(14,165,233,0.5)" stroke-width="12.416851441241686" stroke-dasharray="0.1 0.3"/></g><g><polyline data-points="2.3049999999999997,8.784 2.3049999999999997,8.703" data-type="line" data-label="" points="600,325.7117516629712 600,335.76940133037715" fill="none" stroke="rgba(14,165,233,0.5)" stroke-width="12.416851441241686" stroke-dasharray="0.1 0.3"/></g><circle data-type="circle" data-label="" data-x="-1.914" data-y="9.068" cx="76.13303769401332" cy="290.44789356984484" r="18.625277161862527" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-width="0.008053571428571429"/><circle data-type="circle" data-label="" data-x="0.08600000000000008" data-y="9.068" cx="324.47006651884703" cy="290.44789356984484" r="18.625277161862527" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-width="0.008053571428571429"/><circle data-type="circle" data-label="" data-x="2.0860000000000003" data-y="9.068" cx="572.8070953436808" cy="290.44789356984484" r="18.625277161862527" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-width="0.008053571428571429"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":124.16851441241685,"c":0,"e":313.7915742793792,"b":0,"d":-124.16851441241685,"f":1416.4079822616409};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>