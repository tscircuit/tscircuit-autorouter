source_trace_0" data-x="4.49" data-y="0" x="524.4290657439446" y="304.4982698961938" width="26.159169550173033" height="31.00346020761242" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.02064285714285714"/></g><g><rect data-type="rect" data-label="top" data-x="5.51" data-y="0" x="573.8408304498271" y="304.4982698961938" width="26.15916955017292" height="31.00346020761242" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.02064285714285714"/></g><circle data-type="circle" data-label="" data-x="-1.315" data-y="-0.665" cx="256.29757785467126" cy="352.2145328719723" r="7.26643598615917" fill="blue" stroke="none" stroke-width="0.02064285714285714"/><circle data-type="circle" data-label="" data-x="-0.546" data-y="-1.331" cx="293.5501730103806" cy="384.47750865051904" r="7.26643598615917" fill="blue" stroke="none" stroke-width="0.02064285714285714"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":48.44290657439447,"c":0,"e":320,"b":0,"d":-48.44290657439447,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="relaxed-drc-summary"><rect x="12" y="12" width="300" height="44" rx="6" fill="white" stroke="#b91c1c"/><text x="24" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#b91c1c">Relaxed DRC errors: 2</text></g></svg>