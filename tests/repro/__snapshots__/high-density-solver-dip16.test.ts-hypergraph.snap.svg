77064206" width="9.530112237966023" height="9.530112237966023" fill="rgba(255, 100, 255, 0.6)" stroke="black" stroke-width="0.031479167559523805"/></g><g><rect data-type="rect" data-label="" data-x="-6.199999999999999" data-y="-1.461666666666666" x="118.27929096305306" y="415.06286163195057" width="9.530112237966023" height="9.530112237965966" fill="rgba(255, 100, 255, 0.6)" stroke="black" stroke-width="0.031479167559523805"/></g><g><rect data-type="rect" data-label="" data-x="6.199999999999999" data-y="1.461666666666666" x="512.1905967989809" y="322.19721237977086" width="9.530112237966023" height="9.530112237965966" fill="rgba(255, 100, 255, 0.6)" stroke="black" stroke-width="0.031479167559523805"/></g><g><rect data-type="rect" data-label="" data-x="-6.199999999999999" data-y="-6.541666666666666" x="118.27929096305306" y="576.4394288615081" width="9.530112237966023" height="9.530112237966023" fill="rgba(255, 100, 255, 0.6)" stroke="black" stroke-width="0.031479167559523805"/></g><g><rect data-type="rect" data-label="" data-x="6.199999999999999" data-y="6.158333333333333" x="512.1905967989809" y="172.99801078761425" width="9.530112237966023" height="9.530112237966023" fill="rgba(255, 100, 255, 0.6)" stroke="black" stroke-width="0.031479167559523805"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":31.76704079321999,"c":0,"e":320,"b":0,"d":-31.76704079321999,"f":373.3950931248437};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>