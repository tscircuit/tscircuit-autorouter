wn layer:all" data-x="1.15" data-y="-0.8352799999999998" x="40" y="396.06553043478254" width="560" height="146.08695652173918" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.004107142857142857"/></g><g><rect data-type="rect" data-label="obstacle (Z: 0, 1)" data-x="0.3" data-y="-0.8352799999999998" x="40" y="396.06553043478254" width="146.08695652173915" height="146.08695652173918" fill="rgba(128, 0, 128, 0.15)" stroke="black" stroke-width="0.004107142857142857"/></g><g><rect data-type="rect" data-label="obstacle (Z: 0)" data-x="0.3" data-y="-0.8352799999999998" x="94.78260869565219" y="456.19662399572394" width="36.521739130434796" height="25.824769399856507" fill="rgba(255, 0, 0, 0.15)" stroke="black" stroke-width="0.004107142857142857"/></g><g><rect data-type="rect" data-label="obstacle (Z: 0)" data-x="0.3" data-y="-0.8352799999999998" x="100.13109356094131" y="450.8481391304348" width="25.82476939985652" height="36.52173913043475" fill="rgba(255, 0, 0, 0.15)" stroke="black" stroke-width="0.004107142857142857"/></g><circle data-type="circle" data-label="" data-x="0.3" data-y="0.3" cx="113.04347826086958" cy="192.69300869565222" r="73.04347826086958" fill="rgba(50,100,200,0.15)" stroke="blue" stroke-width="0.004107142857142857"/><circle data-type="circle" data-label="" data-x="0.3" data-y="-0.8352799999999998" cx="113.04347826086958" cy="469.10900869565216" r="73.04347826086958" fill="rgba(50,100,200,0.15)" stroke="blue" stroke-width="0.004107142857142857"/><text data-type="text" data-label="Via only: 0.150mm outside via (minimum 0.150mm):end" data-x="0.3721479999999999" data-y="0.689544" x="130.60994782608697" y="97.84751304347827" fill="rgb(18,18,18)" font-size="11.97913043478261" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Via only: 0.150mm outside via (minimum 0.150mm):end</text><text data-type="text" data-label="step:unknown" data-x="0.8144559999999998" data-y="0.63444" x="238.3023304347826" y="111.26413913043481" fill="rgb(190,92,12)" font-size="11.97913043478261" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="1.180504" data-y="0.63444" x="327.42706086956525" y="111.26413913043481" fill="rgb(120,58,175)" font-size="11.97913043478261" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="With trace end caps: 0.126mm outside via (minimum 0.150mm):end" data-x="0.2043759999999999" data-y="-0.44573599999999985" x="89.76111304347825" y="374.26351304347827" fill="rgb(18,18,18)" font-size="11.97913043478261" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">With trace end caps: 0.126mm outside via (minimum 0.150mm):end</text><text data-type="text" data-label="step:unknown" data-x="0.8144559999999998" data-y="-0.5008399999999998" x="238.3023304347826" y="387.6801391304348" fill="rgb(190,92,12)" font-size="11.97913043478261" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="1.180504" data-y="-0.5008399999999998" x="327.42706086956525" y="387.6801391304348" fill="rgb(120,58,175)" font-size="11.97913043478261" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":243.47826086956525,"c":0,"e":40,"b":0,"d":-243.47826086956525,"f":265.7364869565218};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>