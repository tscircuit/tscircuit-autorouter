-x="133.29933251813696" data-y="-86.47534024951737" cx="491.58956064450103" cy="513.0157530691777" r="29.541844724372467" fill="blue" stroke="none" stroke-width="0.005534522353815977"/><circle data-type="circle" data-label="" data-x="132.79933251813696" data-y="-86.37534024951738" cx="401.24752784825614" cy="494.94734650992905" r="29.541844724372467" fill="blue" stroke="none" stroke-width="0.005534522353815977"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":180.68406559249215,"c":0,"e":-23593.475779497978,"b":0,"d":-180.68406559249215,"f":-15111.700296707695};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="a64-whole-sample-checks"><rect x="12" y="12" width="480" height="68" rx="6" fill="white" stroke="#166534"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#166534">Whole sample source-clearance DRC: 0</text><text x="24" y="64" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#166534">Direct drill/pad overlaps: 0</text></g></svg>