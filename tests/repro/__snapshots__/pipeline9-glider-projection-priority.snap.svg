005818" width="3.479281835526649" height="366.8861601682891" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.03650178571428572"/></g><circle data-type="circle" data-label="" data-x="-19.5" data-y="-7.974" cx="365.20326794188145" cy="46.16408199207481" r="6.164081992074751" fill="blue" stroke="none" stroke-width="0.03650178571428572"/><circle data-type="circle" data-label="" data-x="-22.458497803898187" data-y="-21.140799222984153" cx="284.1524988903192" cy="406.88065969723226" r="6.164081992074751" fill="blue" stroke="none" stroke-width="0.03650178571428572"/><circle data-type="circle" data-label="" data-x="-22.535789226997824" data-y="-13.993887882436043" cx="282.0350292491179" cy="211.08444861622155" r="6.164081992074751" fill="blue" stroke="none" stroke-width="0.03650178571428572"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":27.39591996477667,"c":0,"e":899.4237072550266,"b":0,"d":-27.39591996477667,"f":-172.29098380705437};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="relaxed-drc-summary"><rect x="12" y="12" width="300" height="44" rx="6" fill="white" stroke="#166534"/><text x="24" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#166534">Relaxed DRC errors: 0</text></g></svg>