ect" data-label="top" data-x="-5.6289957088759595" data-y="-0.6505456201163615" x="411.3774562384907" y="131.3279197696615" width="14.022014405811206" height="14.022014405811063" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009259259259259259"/></g><g><rect data-type="rect" data-label="top" data-x="-5.889957088759598" data-y="-0.9115069999999994" x="384.7182344139634" y="162.64328535569803" width="10.972800000000007" height="7.758941288603722" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009259259259259259"/></g><g><rect data-type="rect" data-label="top" data-x="-5.889957088759598" data-y="-0.9115069999999994" x="386.32516376966146" y="161.0363559999999" width="7.7589412886038645" height="10.972799999999978" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009259259259259259"/></g><g><rect data-type="rect" data-label="top" data-x="-5.6" data-y="-0.6215499112404017" x="416.0336" y="131.3279197696615" width="10.972800000000007" height="7.758941288603751" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009259259259259259"/></g><g><rect data-type="rect" data-label="top" data-x="-5.6" data-y="-0.6215499112404017" x="417.64052935569805" y="129.72099041396336" width="7.7589412886038645" height="10.972800000000007" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009259259259259259"/></g><g><rect data-type="rect" data-label="top" data-x="-5.6" data-y="-0.5786779556202006" x="416.0336" y="120.46064799999994" width="10.972800000000007" height="20.233142413963435" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009259259259259259"/></g><g><rect data-type="rect" data-label="" data-x="-6.539999999999999" data-y="-1.7400000000000002" x="50" y="40" width="540" height="432" fill="none" stroke="#94a3b8" stroke-width="0.009259259259259259"/></g><circle data-type="circle" data-label="" data-x="-5.198169472733609" data-y="-1.7358060000000002" cx="464.9176969447702" cy="255.54704800000002" r="24.3" fill="blue" stroke="none" stroke-width="0.009259259259259259"/><circle data-type="circle" data-label="" data-x="-6.7988884648696235" data-y="-3.335806003242444" cx="292.0400457940806" cy="428.3470483501839" r="24.3" fill="blue" stroke="none" stroke-width="0.009259259259259259"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="512" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '512');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":108,"c":0,"e":1026.32,"b":0,"d":-108,"f":68.07999999999998};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>