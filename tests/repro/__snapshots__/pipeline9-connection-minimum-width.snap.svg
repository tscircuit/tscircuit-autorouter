WIDE_POWER" data-x="11.4" data-y="0" x="581.0169491525423" y="310.50847457627117" width="18.983050847457662" height="18.983050847457662" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.04214285714285715"/></g><g><rect data-type="rect" data-label="top" data-x="0" data-y="1.425" x="82.71186440677968" y="258.30508474576277" width="474.57627118644064" height="55.762711864406754" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.04214285714285715"/></g><g><rect data-type="rect" data-label="top" data-x="0" data-y="-1.425" x="82.71186440677968" y="325.93220338983053" width="474.57627118644064" height="55.762711864406754" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.04214285714285715"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":23.72881355932203,"c":0,"e":320,"b":0,"d":-23.72881355932203,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script><g data-testid="relaxed-drc-summary"><rect x="12" y="12" width="300" height="44" rx="6" fill="white" stroke="#166534"/><text x="24" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#166534">Relaxed DRC errors: 0</text></g><text x="24" y="85" font-family="Arial, sans-serif" font-size="15" fill="black">Explicit minimum 0.40 mm; emitted 0.2375 mm; board minimum 0.10 mm</text>
