" height="259.83760149906357" fill="#fef3c7" stroke="#fef3c7" stroke-width="0.00384855769230769"/></g><g><rect data-type="rect" data-label="" data-x="-2.2499999999999996" data-y="17.15" x="787.6027482823235" y="144.25983760149984" width="1.5590256089944887" height="259.83760149906357" fill="#334155" stroke="black" stroke-width="0.00384855769230769"/></g><g><rect data-type="rect" data-label="" data-x="-1.9499999999999997" data-y="17.15" x="865.8138663335417" y="144.25983760149984" width="1.039350405996288" height="259.83760149906357" fill="#b45309" stroke="black" stroke-width="0.00384855769230769"/></g><g><rect data-type="rect" data-label="" data-x="-2.119420059549919" data-y="17.194329720881658" x="788.3822610868206" y="262.1404347990201" width="67.85915706087906" height="1.0393504059957195" fill="#334155" stroke="black" stroke-width="0.00384855769230769"/></g><g><rect data-type="rect" data-label="" data-x="-1.9888401190998377" data-y="17.194329720881658" x="855.7217429447018" y="256.16416996454154" width="1.0393504059961742" height="12.99188007495286" fill="#334155" stroke="black" stroke-width="0.00384855769230769"/></g><circle data-type="circle" data-label="" data-x="-3.899999" data-y="17.15319750452544" cx="359.65047845096774" cy="273.34780644435796" r="77.95128044971896" fill="#60a5fa" stroke="#2563eb" stroke-width="0.00384855769230769"/><circle data-type="circle" data-label="" data-x="-3.899999" data-y="17.15319750452544" cx="359.65047845096774" cy="273.34780644435796" r="38.97564022485948" fill="white" stroke="#2563eb" stroke-width="0.00384855769230769"/><circle data-type="circle" data-label="" data-x="-1.6888401190998379" data-y="17.194329720881658" cx="934.1926985974187" cy="262.660110002018" r="77.95128044971896" fill="#60a5fa" stroke="#2563eb" stroke-width="0.00384855769230769"/><circle data-type="circle" data-label="" data-x="-1.6888401190998379" data-y="17.194329720881658" cx="934.1926985974187" cy="262.660110002018" r="38.97564022485948" fill="white" stroke="#2563eb" stroke-width="0.00384855769230769"/><text data-type="text" data-label="Board edge / required copper-free inset" data-x="-4.1" data-y="17.8" x="307.68269831355383" y="105.2841973766399" fill="black" font-size="19.48782011242974" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Board edge / required copper-free inset</text><text data-type="text" data-label="Gap: 0.300001 mm" data-x="-4.1" data-y="16.5" x="307.68269831355383" y="443.07307932542244" fill="#166534" font-size="28.582136164896955" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gap: 0.300001 mm</text><text data-type="text" data-label="Required gap: 0.3 mm" data-x="-4.1" data-y="16.3" x="307.68269831355383" y="495.0405996252348" fill="black" font-size="23.38538413491569" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Required gap: 0.3 mm</text><text data-type="text" data-label="0.6 mm copper / 0.3 mm drill" data-x="-4.1" data-y="16.15" x="307.68269831355383" y="534.0162398500943" fill="black" font-size="20.78700811992506" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.6 mm copper / 0.3 mm drill</text><text data-type="text" data-label="Board edge / required copper-free inset" data-x="-1.8499999999999992" data-y="17.8" x="892.3173016864462" y="105.2841973766399" fill="black" font-size="19.48782011242974" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Board edge / required copper-free inset</text><text data-type="text" data-label="Gap: 0.261160 mm" data-x="-1.8499999999999992" data-y="16.5" x="892.3173016864462" y="443.07307932542244" fill="#b91c1c" font-size="28.582136164896955" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gap: 0.261160 mm</text><text data-type="text" data-label="Required gap: 0.3 mm" data-x="-1.8499999999999992" data-y="16.3" x="892.3173016864462" y="495.0405996252348" fill="black" font-size="23.38538413491569" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Required gap: 0.3 mm</text><text data-type="text" data-label="0.6 mm copper / 0.3 mm drill" data-x="-1.8499999999999992" data-y="16.15" x="892.3173016864462" y="534.0162398500943" fill="black" font-size="20.78700811992506" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">0.6 mm copper / 0.3 mm drill</text><text data-type="text" data-label="Before global repair" data-x="-4.1" data-y="18.05125" x="307.68269831355383" y="40" fill="black" font-size="26.308557151780157" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Before global repair</text><text data-type="text" data-label="Final output (after repair)" data-x="-1.8499999999999992" data-y="18.05125" x="892.3173016864462" y="40" fill="black" font-size="26.308557151780157" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Final output (after repair)</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":259.8376014990632,"c":0,"e":1373.016864459713,"b":0,"d":-259.8376014990632,"f":4730.393504059965};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>