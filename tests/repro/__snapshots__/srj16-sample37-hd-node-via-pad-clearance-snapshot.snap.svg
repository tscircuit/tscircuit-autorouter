677823315119" fill="hsl(300, 100%, 50%)" stroke="black" stroke-width="0.003921428571428571"/><circle data-type="circle" data-label="" data-x="-1.0050000000000001" data-y="2.195" cx="267.7231329690346" cy="380.5202737796916" r="0.01369677823315119" fill="hsl(300, 100%, 50%)" stroke="black" stroke-width="0.003921428571428571"/><circle data-type="circle" data-label="" data-x="-0.804652050043983" data-y="2.154213594256625" cx="318.8136848703869" cy="390.9211787051423" r="38.251366120218584" fill="rgba(255,0,255,0.5)" stroke="black" stroke-width="0.003921428571428571"/><text data-type="text" data-label="Red: foreign BGA pad. The magenta via overlaps it by 0.084 mm" data-x="-0.8" data-y="3.23" x="320" y="116.5858475501833" fill="#dc2626" font-size="15.300546448087433" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Red: foreign BGA pad. The magenta via overlaps it by 0.084 mm</text><g><circle data-type="point" data-label="bga_conn_029 (Port z=0)" data-x="-1.4200000000000002" data-y="2" cx="161.89435336976322" cy="430.2470497359757" r="3" fill="hsl(60, 100%, 50%)"/></g><g><circle data-type="point" data-label="bga_conn_029 (Port z=0)" data-x="-1.2000000000000002" data-y="2.2199999999999998" cx="217.99635701275042" cy="374.14504609298854" r="3" fill="hsl(60, 100%, 50%)"/></g><g><circle data-type="point" data-label="bga_conn_025 (Port z=0)" data-x="-1.2000000000000002" data-y="1.7800000000000002" cx="217.99635701275042" cy="486.3490533789629" r="3" fill="hsl(180, 100%, 50%)"/></g><g><circle data-type="point" data-label="bga_conn_025 (Port z=1)" data-x="-1.4200000000000002" data-y="2" cx="161.89435336976322" cy="430.2470497359757" r="3" fill="hsl(180, 100%, 50%)"/></g><g><circle data-type="point" data-label="bga_conn_010 (Port z=0)" data-x="-0.98" data-y="2" cx="274.0983606557378" cy="430.2470497359757" r="3" fill="hsl(300, 100%, 50%)"/></g><g><circle data-type="point" data-label="bga_conn_010 (Port z=1)" data-x="-1.2000000000000002" data-y="2.2199999999999998" cx="217.99635701275042" cy="374.14504609298854" r="3" fill="hsl(300, 100%, 50%)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":255.0091074681239,"c":0,"e":524.0072859744992,"b":0,"d":-255.0091074681239,"f":940.2652646722235};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>