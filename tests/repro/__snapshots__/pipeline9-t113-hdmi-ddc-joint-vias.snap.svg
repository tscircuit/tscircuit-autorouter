p" data-x="0.0990906375623426" data-y="2.851726679379301" x="46.66124462313316" y="224.1481139037508" fill="rgb(18,18,18)" font-size="13.678352058564679" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">INPUT: 0.176mm drill-edge gap</text><text data-type="text" data-label="step:0" data-x="0.9190948129022924" data-y="2.623834700128496" x="101.78500341914882" y="239.46786820934327" fill="rgb(190,92,12)" font-size="13.678352058564679" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="1.676021743985323" data-y="2.623834700128496" x="152.66847307700942" y="239.46786820934327" fill="rgb(120,58,175)" font-size="13.678352058564679" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="FIXED: declared 0.20mm drill clearance" data-x="4.4737272727501605" data-y="2.807173444401379" x="340.7407407407408" y="227.14314960279106" fill="rgb(18,18,18)" font-size="11.004213041564485" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">FIXED: declared 0.20mm drill clearance</text><text data-type="text" data-label="step:1" data-x="5.590129269126107" data-y="2.623834700128496" x="415.7894736842105" y="239.46786820934327" fill="rgb(190,92,12)" font-size="11.004213041564485" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="6.199075812603897" data-y="2.623834700128496" x="456.72514619883043" y="239.46786820934327" fill="rgb(120,58,175)" font-size="11.004213041564485" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":67.22375379754982,"c":0,"e":40,"b":0,"d":-67.22375379754982,"f":415.85188609624925};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
