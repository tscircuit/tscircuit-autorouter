x="689.6551724137921" cy="347.93103448275986" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><circle data-type="circle" data-label="" data-x="-12.800000000000006" data-y="-4.400000000000006" cx="193.10344827586096" cy="513.4482758620702" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><circle data-type="circle" data-label="" data-x="-12.000000000000005" data-y="-4.400000000000006" cx="358.62068965517165" cy="513.4482758620702" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><circle data-type="circle" data-label="" data-x="-11.200000000000006" data-y="-4.400000000000006" cx="524.1379310344814" cy="513.4482758620702" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><circle data-type="circle" data-label="" data-x="-10.400000000000006" data-y="-4.400000000000006" cx="689.6551724137921" cy="513.4482758620702" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><circle data-type="circle" data-label="" data-x="-12.800000000000006" data-y="-5.2000000000000055" cx="193.10344827586096" cy="678.9655172413806" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><circle data-type="circle" data-label="" data-x="-12.000000000000005" data-y="-5.2000000000000055" cx="358.62068965517165" cy="678.9655172413806" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><circle data-type="circle" data-label="" data-x="-11.200000000000006" data-y="-5.2000000000000055" cx="524.1379310344814" cy="678.9655172413806" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><circle data-type="circle" data-label="" data-x="-10.400000000000006" data-y="-5.2000000000000055" cx="689.6551724137921" cy="678.9655172413806" r="41.37931034482759" fill="#ef444480" stroke="black" stroke-width="0.004833333333333334"/><text data-type="text" data-label="ButterStick U4 native routing cell" data-x="-11.8" data-y="-2.25" x="400" y="68.6206896551725" fill="black" font-size="33.103448275862064" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">ButterStick U4 native routing cell</text><text data-type="text" data-label="Native BGA pads and the source_net_27 route" data-x="-11.8" data-y="-2.55" x="400" y="130.68965517241384" fill="black" font-size="22.75862068965517" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Native BGA pads and the source_net_27 route</text><text data-type="text" data-label="Pressure entries copied: 3 / entries used: 1" data-x="-11.8" data-y="-5.95" x="400" y="834.1379310344829" fill="black" font-size="26.89655172413793" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Pressure entries copied: 3 / entries used: 1</text><text data-type="text" data-label="Orange: copied foreign pressure / gray: omitted" data-x="-11.8" data-y="-6.2" x="400" y="885.8620689655173" fill="black" font-size="22.75862068965517" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Orange: copied foreign pressure / gray: omitted</text><text data-type="text" data-label="Three actual native pressure entries in this focused repro" data-x="-11.8" data-y="-6.45" x="400" y="937.5862068965517" fill="black" font-size="20.689655172413794" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Three actual native pressure entries in this focused repro</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="1000" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '1000');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":206.8965517241379,"c":0,"e":2841.3793103448274,"b":0,"d":-206.8965517241379,"f":-396.8965517241378};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>