h="0.0032785714285714284"/><circle data-type="circle" data-label="" data-x="1.486" data-y="0.2" cx="493.24618736383445" cy="329.1039651416122" r="45.751633986928105" fill="rgba(22, 163, 74, 0.4)" stroke="#15803d" stroke-width="0.0032785714285714284"/><circle data-type="circle" data-label="" data-x="1.686" data-y="0.2" cx="554.2483660130719" cy="329.1039651416122" r="45.751633986928105" fill="rgba(37, 99, 235, 0.35)" stroke="#1d4ed8" stroke-width="0.0032785714285714284"/><text data-type="text" data-label="Before: duplicate site scheduled twice" data-x="0.03861599999999993" data-y="0.459696" x="51.77830065359475" y="249.89385620915033" fill="rgb(18,18,18)" font-size="10.004357298474947" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: duplicate site scheduled twice</text><text data-type="text" data-label="step:1" data-x="0.262312" data-y="0.42296" x="120.0080174291939" y="261.09873638344226" fill="rgb(190,92,12)" font-size="10.004357298474947" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="0.384328" data-y="0.42296" x="157.2242265795207" y="261.09873638344226" fill="rgb(120,58,175)" font-size="10.004357298474947" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="After: one candidate per physical site" data-x="1.024616" data-y="0.459696" x="352.51904139433555" y="249.89385620915033" fill="rgb(18,18,18)" font-size="10.004357298474947" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: one candidate per physical site</text><text data-type="text" data-label="step:2" data-x="1.248312" data-y="0.42296" x="420.74875816993466" y="261.09873638344226" fill="rgb(190,92,12)" font-size="10.004357298474947" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:2</text><text data-type="text" data-label=" layer:all" data-x="1.3703280000000002" data-y="0.42296" x="457.9649673202615" y="261.09873638344226" fill="rgb(120,58,175)" font-size="10.004357298474947" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":305.0108932461874,"c":0,"e":40,"b":0,"d":-305.0108932461874,"f":390.10614379084967};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>