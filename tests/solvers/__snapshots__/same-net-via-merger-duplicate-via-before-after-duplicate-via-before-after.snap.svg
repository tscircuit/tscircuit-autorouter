ts="3.7088162085047855,6 3.2088162085047855,6.2" data-type="line" data-label="nearby route: z1" points="387.6739149462429,324.6728061666752 364.72998212679914,315.49523303889765" fill="none" stroke="rgba(37, 99, 235, 0.55)" stroke-width="6.883179845833121"/></g><g><rect data-type="rect" data-label="Before: duplicate site scheduled twice:frame step:unknown layer:all" data-x="1.0342819905134895" data-y="6" x="217.4842550910472" y="49.345612333350346" width="94.92198602680821" height="550.6543876666497" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.021792253487435125"/></g><g><rect data-type="rect" data-label="After: one candidate per physical site:frame step:unknown layer:all" data-x="3.433816208504785" data-y="6" x="327.5937588821447" y="49.345612333350346" width="94.92198602680821" height="550.6543876666497" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.021792253487435125"/></g><circle data-type="circle" data-label="" data-x="1.0342819905134895" data-y="6.035" cx="264.9452481044513" cy="323.0667308693141" r="5.9654225330553725" fill="rgba(220, 38, 38, 0.38)" stroke="#b91c1c" stroke-width="0.021792253487435125"/><circle data-type="circle" data-label="" data-x="1.0342819905134895" data-y="5.965" cx="264.9452481044513" cy="326.2788814640362" r="4.588786563888748" fill="rgba(249, 115, 22, 0.38)" stroke="#c2410c" stroke-width="0.021792253487435125"/><circle data-type="circle" data-label="" data-x="1.2342819905134894" data-y="6" cx="274.1228212322288" cy="324.6728061666752" r="6.883179845833121" fill="rgba(37, 99, 235, 0.35)" stroke="#1d4ed8" stroke-width="0.021792253487435125"/><circle data-type="circle" data-label="" data-x="3.5088162085047854" data-y="6" cx="378.49634181846534" cy="324.6728061666752" r="6.883179845833121" fill="rgba(22, 163, 74, 0.4)" stroke="#15803d" stroke-width="0.021792253487435125"/><circle data-type="circle" data-label="" data-x="3.7088162085047855" data-y="6" cx="387.6739149462429" cy="324.6728061666752" r="6.883179845833121" fill="rgba(37, 99, 235, 0.35)" stroke="#1d4ed8" stroke-width="0.021792253487435125"/><g data-type="arrow" data-start="1.0342819905134895,6.035" data-end="1.2342819905134894,6" data-double-sided="false" data-label="first scheduled move"><line data-type="arrow-shaft" x1="264.9452481044513" y1="323.0667308693141" x2="264.9452481044513" y2="323.0667308693141" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><polygon data-type="arrow-head" points="274.1228212322288,324.6728061666752 312.4062411178556,51.861056507004946 217.484255091047,594.2724052316231" fill="#f59e0b"/></g><g data-type="arrow" data-start="1.0342819905134895,5.965" data-end="1.2342819905134894,6" data-double-sided="false" data-label="stale duplicate move"><line data-type="arrow-shaft" x1="264.9452481044513" y1="326.2788814640362" x2="264.9452481044513" y2="326.2788814640362" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><polygon data-type="arrow-head" points="274.1228212322288,324.6728061666752 217.484255091047,55.07320710172712 312.4062411178556,597.4845558263453" fill="#dc2626"/></g><g data-type="arrow" data-start="3.7088162085047855,6" data-end="3.5088162085047854,6" data-double-sided="false" data-label="single deterministic merge"><line data-type="arrow-shaft" x1="387.6739149462429" y1="324.6728061666752" x2="387.6739149462429" y2="324.6728061666752" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/><polygon data-type="arrow-head" points="378.49634181846534,324.6728061666752 387.6739149462429,600 387.6739149462429,49.345612333350346" fill="#16a34a"/></g><text data-type="text" data-label="Before: duplicate site scheduled twice:frame" data-x="0" data-y="12.20366195296367" x="217.4842550910472" y="40" fill="rgb(18,18,18)" font-size="3.4795449423316787" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: duplicate site scheduled twice:frame</text><text data-type="text" data-label="step:unknown" data-x="0.5171409952567447" data-y="12.118735572510948" x="241.21475159774926" y="43.897090335411576" fill="rgb(190,92,12)" font-size="3.4795449423316787" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="1.0812948082641025" data-y="12.118735572510948" x="267.1025659686969" y="43.897090335411576" fill="rgb(120,58,175)" font-size="3.4795449423316787" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="After: one candidate per physical site:frame" data-x="2.3995342179912957" data-y="12.20366195296367" x="327.5937588821447" y="40" fill="rgb(18,18,18)" font-size="3.4795449423316787" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: one candidate per physical site:frame</text><text data-type="text" data-label="step:unknown" data-x="2.9166752132480402" data-y="12.118735572510948" x="351.3242553888467" y="43.897090335411576" fill="rgb(190,92,12)" font-size="3.4795449423316787" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="3.4808290262553983" data-y="12.118735572510948" x="377.2120697597944" y="43.897090335411576" fill="rgb(120,58,175)" font-size="3.4795449423316787" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":45.887865638887476,"c":0,"e":217.4842550910472,"b":0,"d":-45.887865638887476,"f":600};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>