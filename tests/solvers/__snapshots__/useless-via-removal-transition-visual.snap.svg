chor="end" dominant-baseline="central">z0</text><text data-type="text" data-label="z1" data-x="0.192" data-y="1.08" x="54.46187617018529" y="330.3808332324606" fill="#0f172a" font-size="12.05156347515441" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z1</text><text data-type="text" data-label="z2" data-x="0.192" data-y="0.08000000000000007" x="54.46187617018529" y="405.70310495217564" fill="#0f172a" font-size="12.05156347515441" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z2</text><text data-type="text" data-label="Input: two physical via transitions:frame" data-x="0" data-y="2.435637815892998" x="40" y="228.27111331024716" fill="rgb(18,18,18)" font-size="10.199026721450009" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Input: two physical via transitions:frame</text><text data-type="text" data-label="step:unknown" data-x="0.7975365853658536" data-y="2.2839840000000002" x="100.07226738934055" y="239.69402323827117" fill="rgb(190,92,12)" font-size="10.199026721450013" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="1.8049512195121953" data-y="2.2839840000000002" x="175.95302619692865" y="239.69402323827117" fill="rgb(120,58,175)" font-size="10.199026721450013" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="z0" data-x="4.18472" data-y="2.08" x="355.20261691092605" y="255.05856151274554" fill="#0f172a" font-size="12.05156347515441" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z0</text><text data-type="text" data-label="z2" data-x="4.18472" data-y="0.08000000000000007" x="355.20261691092605" y="405.70310495217564" fill="#0f172a" font-size="12.05156347515441" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z2</text><text data-type="text" data-label="Fix: simplified route still meets its via:frame" data-x="3.9927200000000003" data-y="2.4162777542896365" x="340.74074074074076" y="229.72935713084595" fill="rgb(18,18,18)" font-size="8.897023310201073" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Fix: simplified route still meets its via:frame</text><text data-type="text" data-label="step:unknown" data-x="4.908145531914894" data-y="2.2839840000000002" x="409.69267139479905" y="239.69402323827117" fill="rgb(190,92,12)" font-size="8.897023310201075" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="5.786954042553192" data-y="2.2839840000000002" x="475.88652482269504" y="239.69402323827117" fill="rgb(120,58,175)" font-size="8.897023310201075" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="route point (0, 0, z0)" data-x="0.442" data-y="2.08" cx="73.29244410011407" cy="255.05856151274554" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (1, 0, z0)" data-x="1.442" data-y="2.08" cx="148.61471581982912" cy="255.05856151274554" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (1, 0, z1)" data-x="1.442" data-y="1.08" cx="148.61471581982912" cy="330.3808332324606" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="route point (2, 0, z1)" data-x="2.442" data-y="1.08" cx="223.9369875395442" cy="330.3808332324606" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="route point (2, 0, z2)" data-x="2.442" data-y="0.08000000000000007" cx="223.9369875395442" cy="405.70310495217564" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="route point (3, 0, z2)" data-x="3.442" data-y="0.08000000000000007" cx="299.25925925925924" cy="405.70310495217564" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="route point (0, 0, z0)" data-x="4.43472" data-y="2.08" cx="374.0331848408548" cy="255.05856151274554" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (1, 0, z0)" data-x="5.43472" data-y="2.08" cx="449.35545656056985" cy="255.05856151274554" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (2, 0, z0)" data-x="6.43472" data-y="2.08" cx="524.677728280285" cy="255.05856151274554" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (2, 0, z2)" data-x="6.43472" data-y="0.08000000000000007" cx="524.677728280285" cy="405.70310495217564" r="3" fill="#7c3aed"/></g><g><circle data-type="point" data-label="route point (3, 0, z2)" data-x="7.43472" data-y="0.08000000000000007" cx="600" cy="405.70310495217564" r="3" fill="#7c3aed"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":75.32227171971506,"c":0,"e":40,"b":0,"d":-75.32227171971506,"f":411.72888668975287};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>