x=1, next layer starts at x=2:frame</text><text data-type="text" data-label="step:unknown" data-x="1.0722816" data-y="1.2265840000000001" x="120.76668603525081" y="277.8176598446209" fill="rgb(190,92,12)" font-size="7.164654485979297" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="1.7799744" data-y="1.2265840000000001" x="174.07171541093678" y="277.8176598446209" fill="rgb(120,58,175)" font-size="7.164654485979297" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="z0" data-x="4.18472" data-y="1.08" x="355.20261691092605" y="288.8586997223836" fill="#0f172a" font-size="12.05156347515441" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z0</text><text data-type="text" data-label="z1" data-x="4.18472" data-y="0.08000000000000007" x="355.20261691092605" y="364.18097144209867" fill="#0f172a" font-size="12.05156347515441" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z1</text><text data-type="text" data-label="Fix: simplified route still meets its via:frame" data-x="4.3278216" data-y="1.3331184" x="365.98135450965196" y="269.7932468203241" fill="rgb(18,18,18)" font-size="7.164654485979297" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Fix: simplified route still meets its via:frame</text><text data-type="text" data-label="step:unknown" data-x="5.0650016" data-y="1.2265840000000001" x="421.5074267759916" y="277.8176598446209" fill="rgb(190,92,12)" font-size="7.164654485979297" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="5.772694400000001" data-y="1.2265840000000001" x="474.81245615167757" y="277.8176598446209" fill="rgb(120,58,175)" font-size="7.164654485979297" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="route point (0, 0, z0)" data-x="0.442" data-y="1.08" cx="73.29244410011407" cy="288.8586997223836" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (1, 0, z0)" data-x="1.442" data-y="1.08" cx="148.61471581982912" cy="288.8586997223836" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (2, 0, z1)" data-x="2.442" data-y="0.08000000000000007" cx="223.9369875395442" cy="364.18097144209867" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="route point (3, 0, z1)" data-x="3.442" data-y="0.08000000000000007" cx="299.25925925925924" cy="364.18097144209867" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="route point (0, 0, z0)" data-x="4.43472" data-y="1.08" cx="374.0331848408548" cy="288.8586997223836" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (1, 0, z0)" data-x="5.43472" data-y="1.08" cx="449.35545656056985" cy="288.8586997223836" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="route point (1, 0, z1)" data-x="5.43472" data-y="0.08000000000000007" cx="449.35545656056985" cy="364.18097144209867" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="route point (2, 0, z1)" data-x="6.43472" data-y="0.08000000000000007" cx="524.677728280285" cy="364.18097144209867" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="route point (3, 0, z1)" data-x="7.43472" data-y="0.08000000000000007" cx="600" cy="364.18097144209867" r="3" fill="#2563eb"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":75.32227171971506,"c":0,"e":40,"b":0,"d":-75.32227171971506,"f":370.2067531796759};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>