-size="6.5993265993266" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">start</text><text data-type="text" data-label="shortcut: 1 lane" data-x="2.75" data-y="1.75" x="169.62962962962965" y="355.9858119116184" fill="black" font-size="6.5993265993266" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">shortcut: 1 lane</text><text data-type="text" data-label="detour: 1 lane" data-x="2.75" data-y="3.75" x="169.62962962962965" y="261.7097176355241" fill="black" font-size="6.5993265993266" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">detour: 1 lane</text><text data-type="text" data-label="end" data-x="4.75" data-y="1.75" x="263.9057239057239" y="355.9858119116184" fill="black" font-size="6.5993265993266" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">end</text><text data-type="text" data-label="Input: 2 nets compete for a 1-lane shortcut" data-x="0" data-y="4.9893577644411105" x="40" y="203.28881291439433" fill="rgb(18,18,18)" font-size="9.724653385568615" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Input: 2 nets compete for a 1-lane shortcut</text><text data-type="text" data-label="step:0" data-x="1.7267441860465114" data-y="4.7583" x="121.3953488372093" y="214.18042470623118" fill="rgb(190,92,12)" font-size="9.724653385568617" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="2.494186046511628" data-y="4.7583" x="157.57105943152456" y="214.18042470623118" fill="rgb(120,58,175)" font-size="9.724653385568617" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Result: shortcut + detour, 0 overflow" data-x="6.379999999999999" data-y="5.026826591107237" x="340.7407407407407" y="201.52260559679914" fill="rgb(18,18,18)" font-size="11.301624204850011" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Result: shortcut + detour, 0 overflow</text><text data-type="text" data-label="step:3" data-x="7.9408108108108095" data-y="4.7583" x="414.3143143143143" y="214.18042470623118" fill="rgb(190,92,12)" font-size="11.301624204850011" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:3</text><text data-type="text" data-label=" layer:all" data-x="8.8327027027027" data-y="4.7583" x="456.3563563563563" y="214.18042470623118" fill="rgb(120,58,175)" font-size="11.301624204850011" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":47.13804713804714,"c":0,"e":40,"b":0,"d":-47.13804713804714,"f":438.4773944032009};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>