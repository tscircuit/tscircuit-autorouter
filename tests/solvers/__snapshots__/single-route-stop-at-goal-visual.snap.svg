305 446.06343229667493,317.6016450167547" fill="#b45309"/></g><g data-type="arrow" data-start="420.50000000000006,343.6071428571429" data-end="438.50000000000006,279.6071428571429" data-double-sided="false"><line data-type="arrow-shaft" x1="426.84285714285716" y1="344.33775510204083" x2="439.90807558246854" y2="297.8836450945337" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><polygon data-type="arrow-head" points="442.7857142857143,287.6520408163266 445.02387772157215,299.3224644461566 434.792273443365,296.44482574291084" fill="#b45309"/></g><text data-type="text" data-label="Stop expanding once the checked goal connection is accepted" data-x="32" data-y="38" x="82.74285714285712" y="73.65714285714286" fill="#172033" font-size="24.799999999999997" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Stop expanding once the checked goal connection is accepted</text><text data-type="text" data-label="The baseline really runs its original step implementation. Orange branches are unused neighbors created after success." data-x="32" data-y="72" x="82.74285714285712" y="103.77142857142857" fill="#475569" font-size="14.17142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">The baseline really runs its original step implementation. Orange branches are unused neighbors created after success.</text><text data-type="text" data-label="Before: success still generates neighbors" data-x="44" data-y="130" x="93.37142857142854" y="155.14285714285714" fill="#b45309" font-size="19.485714285714284" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Before: success still generates neighbors</text><text data-type="text" data-label="8 extra neighbor objects; none improve the accepted route." data-x="44" data-y="158" x="93.37142857142854" y="179.94285714285715" fill="#475569" font-size="12.399999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="central">8 extra neighbor objects; none improve the accepted route.</text><text data-type="text" data-label="A" data-x="94.64285714285711" data-y="377.6071428571429" x="138.22653061224486" y="374.45204081632653" fill="#2563eb" font-size="12.399999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="central">A</text><text data-type="text" data-label="B: accepted goal" data-x="438.92857142857144" data-y="423.6071428571429" x="443.16530612244895" y="415.19489795918366" fill="#047857" font-size="12.399999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="central">B: accepted goal</text><text data-type="text" data-label="via z1" data-x="447.50000000000006" data-y="271.6071428571429" x="450.75714285714287" y="280.5663265306123" fill="#b45309" font-size="10.628571428571428" font-family="sans-serif" text-anchor="start" dominant-baseline="central">via z1</text><text data-type="text" data-label="Blue: accepted path centerline. Orange: post-success neighbors." data-x="44" data-y="490" x="93.37142857142854" y="474" fill="#64748b" font-size="11.514285714285714" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Blue: accepted path centerline. Orange: post-success neighbors.</text><text data-type="text" data-label="The via node is offset to distinguish its separate layer." data-x="44" data-y="185" x="93.37142857142854" y="203.85714285714286" fill="#64748b" font-size="10.628571428571428" font-family="sans-serif" text-anchor="start" dominant-baseline="central">The via node is offset to distinguish its separate layer.</text><text data-type="text" data-label="After: return immediately after success" data-x="644" data-y="130" x="624.8" y="155.14285714285714" fill="#047857" font-size="19.485714285714284" font-family="sans-serif" text-anchor="start" dominant-baseline="central">After: return immediately after success</text><text data-type="text" data-label="Zero extra neighbor objects. The complete accepted route is identical." data-x="644" data-y="158" x="624.8" y="179.94285714285715" fill="#475569" font-size="12.399999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Zero extra neighbor objects. The complete accepted route is identical.</text><text data-type="text" data-label="A" data-x="694.6428571428571" data-y="377.6071428571429" x="669.6551020408162" y="374.45204081632653" fill="#2563eb" font-size="12.399999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="central">A</text><text data-type="text" data-label="B: accepted goal" data-x="1038.9285714285716" data-y="423.6071428571429" x="974.5938775510205" y="415.19489795918366" fill="#047857" font-size="12.399999999999999" font-family="sans-serif" text-anchor="start" dominant-baseline="central">B: accepted goal</text><text data-type="text" data-label="Blue: accepted path centerline. Orange: post-success neighbors." data-x="644" data-y="490" x="624.8" y="474" fill="#64748b" font-size="11.514285714285714" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Blue: accepted path centerline. Orange: post-success neighbors.</text><text data-type="text" data-label="The via node is offset to distinguish its separate layer." data-x="644" data-y="185" x="624.8" y="203.85714285714286" fill="#64748b" font-size="10.628571428571428" font-family="sans-serif" text-anchor="start" dominant-baseline="central">The via node is offset to distinguish its separate layer.</text><text data-type="text" data-label="Neighbor objects generated after accepting the goal" data-x="32" data-y="552" x="82.74285714285712" y="528.9142857142857" fill="#172033" font-size="17.714285714285715" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Neighbor objects generated after accepting the goal</text><text data-type="text" data-label="Before: 8" data-x="48" data-y="584" x="96.91428571428568" y="557.2571428571429" fill="#b45309" font-size="20.37142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Before: 8</text><text data-type="text" data-label="After: 0" data-x="648" data-y="584" x="628.342857142857" y="557.2571428571429" fill="#047857" font-size="20.37142857142857" font-family="sans-serif" text-anchor="start" dominant-baseline="central">After: 0</text><text data-type="text" data-label="The complete route and 10 iterations match the baseline; both base and future-cost variants are checked." data-x="32" data-y="659" x="82.74285714285712" y="623.6857142857143" fill="#047857" font-size="13.285714285714285" font-family="sans-serif" text-anchor="start" dominant-baseline="central">The complete route and 10 iterations match the baseline; both base and future-cost variants are checked.</text><text data-type="text" data-label="Generated from live test observations. Shared bar scale; counts are not elapsed-time measurements." data-x="32" data-y="683" x="82.74285714285712" y="644.9428571428571" fill="#64748b" font-size="11.514285714285714" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Generated from live test observations. Shared bar scale; counts are not elapsed-time measurements.</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":0.8857142857142857,"c":0,"e":54.39999999999998,"b":0,"d":0.8857142857142857,"f":40};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>