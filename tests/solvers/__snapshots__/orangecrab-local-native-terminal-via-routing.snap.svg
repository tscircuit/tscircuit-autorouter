882196,331.64725457570717 320,331.64725457570717 319.0599444117804,331.64725457570717 318.1198888235608,331.64725457570717 316.8860658640226,333.0754249291788" fill="none" stroke="rgba(255,0,0,0.75)" stroke-linejoin="round" stroke-width="1.6527089235127528"/></g><g><rect data-type="rect" data-label="" data-x="18.507499999999997" data-y="4.4533333333333305" x="270.17705382436236" y="40" width="99.64589235127528" height="560" fill="none" stroke="gray" stroke-width="0.10758095238095207"/></g><circle data-type="circle" data-label="" data-x="18.810896226415093" data-y="3.2003105934553515" cx="322.8201667646588" cy="331.64725457570717" r="2.6026912181303197" fill="rgba(0,0,0,0.3)" stroke="black" stroke-width="0.10758095238095207"/><g><circle data-type="point" data-label="source_net_121" data-x="18.172499999999996" data-y="4.646666666666635" cx="316.8860658640226" cy="318.2029036827198" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_net_121" data-x="18.842499999999998" data-y="4.453333333333323" cx="323.1139341359774" cy="320.00000000000006" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_net_67" data-x="18.172499999999996" data-y="4.646666666666635" cx="316.8860658640226" cy="318.2029036827198" r="3" fill="gray"/></g><g><circle data-type="point" data-label="source_net_67" data-x="18.172499999999996" data-y="3.046666666666635" cx="316.8860658640226" cy="333.0754249291788" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_net_46_fixed_34_1" data-x="18.172499999999996" data-y="3.0679752102398927" cx="316.8860658640226" cy="332.87735507478857" r="3" fill="red"/></g><g><circle data-type="point" data-label="source_net_46_fixed_34_1" data-x="18.172499999999996" data-y="4.7175474235253185" cx="316.8860658640226" cy="317.54404395625363" r="3" fill="gray"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":9.295325779036855,"c":0,"e":147.96675814447545,"b":0,"d":-9.295325779036855,"f":361.39518413597744};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>