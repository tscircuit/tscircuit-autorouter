dth="0.021214285714285713"/><circle data-type="circle" data-label="" data-x="9.129999999999999" data-y="1" cx="470.3703703703704" cy="327.0348821548821" r="3.7710437710437716" fill="#2563eb" stroke="black" stroke-width="0.021214285714285713"/><circle data-type="circle" data-label="" data-x="10.129999999999999" data-y="1" cx="517.5084175084176" cy="327.0348821548821" r="5.656565656565657" fill="#16a34a" stroke="black" stroke-width="0.021214285714285713"/><text data-type="text" data-label="Input: route crosses a one-region section" data-x="0.6655600000000002" data-y="2.2984799999999996" x="71.37319865319867" y="265.8270707070707" fill="rgb(18,18,18)" font-size="7.730639730639732" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Input: route crosses a one-region section</text><text data-type="text" data-label="step:0" data-x="1.93656" data-y="2.1148" x="131.28565656565658" y="274.48538720538716" fill="rgb(190,92,12)" font-size="7.730639730639732" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="2.54664" data-y="2.1148" x="160.04363636363638" y="274.48538720538716" fill="rgb(120,58,175)" font-size="7.730639730639732" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Result: one fixed point outside each boundary" data-x="6.842199999999999" data-y="2.2984799999999996" x="362.5279461279461" y="265.8270707070707" fill="rgb(18,18,18)" font-size="7.730639730639732" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Result: one fixed point outside each boundary</text><text data-type="text" data-label="step:1" data-x="8.316559999999999" data-y="2.1148" x="432.0263973063973" y="274.48538720538716" fill="rgb(190,92,12)" font-size="7.730639730639732" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="8.926639999999999" data-y="2.1148" x="460.7843771043771" y="274.48538720538716" fill="rgb(120,58,175)" font-size="7.730639730639732" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":47.13804713804714,"c":0,"e":40,"b":0,"d":-47.13804713804714,"f":374.17292929292927};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
