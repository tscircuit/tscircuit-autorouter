-label="" data-x="3.25" data-y="0.5" cx="280.74074074074076" cy="325.5274074074074" r="7.407407407407408" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.0135"/><circle data-type="circle" data-label="" data-x="4.3100000000000005" data-y="0.5" cx="359.2592592592593" cy="325.5274074074074" r="7.407407407407408" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.0135"/><circle data-type="circle" data-label="" data-x="7.3100000000000005" data-y="0.5" cx="581.4814814814815" cy="325.5274074074074" r="7.407407407407408" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.0135"/><text data-type="text" data-label="Input: current MST + orange same-root bridge" data-x="0.6315200000000001" data-y="1.1492399999999998" x="86.77925925925928" y="277.4355555555556" fill="rgb(18,18,18)" font-size="6.074074074074074" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Input: current MST + orange same-root bridge</text><text data-type="text" data-label="step:0" data-x="1.34328" data-y="1.0574" x="139.50222222222223" y="284.23851851851856" fill="rgb(190,92,12)" font-size="6.074074074074074" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="1.64832" data-y="1.0574" x="162.09777777777776" y="284.23851851851856" fill="rgb(120,58,175)" font-size="6.074074074074074" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Result: bridge joined; only current terminals kept" data-x="4.539000000000001" data-y="1.1492399999999998" x="376.2222222222223" y="277.4355555555556" fill="rgb(18,18,18)" font-size="6.074074074074074" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Result: bridge joined; only current terminals kept</text><text data-type="text" data-label="step:4" data-x="5.4032800000000005" data-y="1.0574" x="440.242962962963" y="284.23851851851856" fill="rgb(190,92,12)" font-size="6.074074074074074" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:4</text><text data-type="text" data-label=" layer:all" data-x="5.7083200000000005" data-y="1.0574" x="462.8385185185186" y="284.23851851851856" fill="rgb(120,58,175)" font-size="6.074074074074074" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="Start" data-x="4.3100000000000005" data-y="0.5" cx="359.2592592592593" cy="325.5274074074074" r="3" fill="green"/></g><g><circle data-type="point" data-label="End" data-x="7.3100000000000005" data-y="0.5" cx="581.4814814814815" cy="325.5274074074074" r="3" fill="red"/></g><g><circle data-type="point" data-label="" data-x="4.3100000000000005" data-y="0.5" cx="359.2592592592593" cy="325.5274074074074" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="5.260000000000001" data-y="0.5" cx="429.6296296296297" cy="325.5274074074074" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="5.3100000000000005" data-y="0.5" cx="433.33333333333337" cy="325.5274074074074" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="6.3100000000000005" data-y="0.5" cx="507.40740740740745" cy="325.5274074074074" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="6.36" data-y="0.5" cx="511.11111111111114" cy="325.5274074074074" r="3" fill="green"/></g><g><circle data-type="point" data-label="" data-x="7.3100000000000005" data-y="0.5" cx="581.4814814814815" cy="325.5274074074074" r="3" fill="green"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":74.07407407407408,"c":0,"e":40,"b":0,"d":-74.07407407407408,"f":362.56444444444446};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
