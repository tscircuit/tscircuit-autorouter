1228070175438" cy="538.5964912280701" r="3" fill="black"/><text x="189.91228070175438" y="533.5964912280701" font-family="sans-serif" font-size="12">P13</text></g><g><circle data-type="point" data-label="P14" data-x="38" data-y="5" cx="516.4912280701753" cy="538.5964912280701" r="3" fill="black"/><text x="521.4912280701753" y="533.5964912280701" font-family="sans-serif" font-size="12">P14</text></g><g><circle data-type="point" data-label="P15" data-x="35" data-y="36" cx="479.64912280701753" cy="157.89473684210532" r="3" fill="black"/><text x="484.64912280701753" y="152.89473684210532" font-family="sans-serif" font-size="12">P15</text></g><g><circle data-type="point" data-label="P16" data-x="31" data-y="0" cx="430.52631578947364" cy="600" r="3" fill="black"/><text x="435.52631578947364" y="595" font-family="sans-serif" font-size="12">P16</text></g><g><circle data-type="point" data-label="P17" data-x="28" data-y="26" cx="393.6842105263158" cy="280.70175438596493" r="3" fill="black"/><text x="398.6842105263158" y="275.70175438596493" font-family="sans-serif" font-size="12">P17</text></g><g><circle data-type="point" data-label="P18" data-x="34" data-y="5" cx="467.36842105263156" cy="538.5964912280701" r="3" fill="black"/><text x="472.36842105263156" y="533.5964912280701" font-family="sans-serif" font-size="12">P18</text></g><g><circle data-type="point" data-label="P19" data-x="6" data-y="6" cx="123.50877192982455" cy="526.3157894736842" r="3" fill="black"/><text x="128.50877192982455" y="521.3157894736842" font-family="sans-serif" font-size="12">P19</text></g><g><circle data-type="point" data-label="P20" data-x="16" data-y="6" cx="246.3157894736842" cy="526.3157894736842" r="3" fill="black"/><text x="251.3157894736842" y="521.3157894736842" font-family="sans-serif" font-size="12">P20</text></g><g><circle data-type="point" data-label="P21" data-x="7" data-y="4" cx="135.78947368421052" cy="550.8771929824561" r="3" fill="black"/><text x="140.78947368421052" y="545.8771929824561" font-family="sans-serif" font-size="12">P21</text></g><g><circle data-type="point" data-label="P22" data-x="31" data-y="34" cx="430.52631578947364" cy="182.4561403508772" r="3" fill="black"/><text x="435.52631578947364" y="177.4561403508772" font-family="sans-serif" font-size="12">P22</text></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":12.280701754385964,"c":0,"e":49.82456140350877,"b":0,"d":-12.280701754385964,"f":600};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>