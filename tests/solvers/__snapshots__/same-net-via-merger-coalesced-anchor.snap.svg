type="rect" data-label="Input: orange via sits between two shared anchors step:0 layer:all" data-x="0.6" data-y="0.5" x="40" y="222.95489844683394" width="259.25925925925924" height="216.04938271604937" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.004628571428571429"/></g><g><rect data-type="rect" data-label="" data-x="0.6" data-y="0.5" x="61.60493827160492" y="255.36230585424136" width="216.0493827160494" height="151.23456790123456" fill="#f1f5f9" stroke="#64748b" stroke-width="0.004628571428571429"/></g><g><rect data-type="rect" data-label="Result: orange via joins one anchor and stays there step:2 layer:all" data-x="1.992" data-y="0.5" x="340.74074074074065" y="222.95489844683394" width="259.2592592592593" height="216.04938271604937" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.004628571428571429"/></g><g><rect data-type="rect" data-label="" data-x="1.992" data-y="0.5" x="362.3456790123456" y="255.36230585424136" width="216.04938271604937" height="151.23456790123456" fill="#f1f5f9" stroke="#64748b" stroke-width="0.004628571428571429"/></g><circle data-type="circle" data-label="" data-x="0.3" data-y="0.35" cx="104.81481481481481" cy="363.386997212266" r="32.407407407407405" fill="#9333ea" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="0.3" data-y="0.35" cx="104.81481481481481" cy="363.386997212266" r="32.407407407407405" fill="#9333ea" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="0.6" data-y="0.6499999999999999" cx="169.62962962962962" cy="298.57218239745123" r="32.407407407407405" fill="#f97316" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="0.8999999999999999" data-y="0.35" cx="234.4444444444444" cy="363.386997212266" r="32.407407407407405" fill="#9333ea" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="0.8999999999999999" data-y="0.35" cx="234.4444444444444" cy="363.386997212266" r="32.407407407407405" fill="#9333ea" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="1.692" data-y="0.35" cx="405.55555555555554" cy="363.386997212266" r="32.407407407407405" fill="#9333ea" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="1.692" data-y="0.35" cx="405.55555555555554" cy="363.386997212266" r="32.407407407407405" fill="#9333ea" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="1.692" data-y="0.35" cx="405.55555555555554" cy="363.386997212266" r="32.407407407407405" fill="#f97316" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="2.292" data-y="0.35" cx="535.1851851851851" cy="363.386997212266" r="32.407407407407405" fill="#9333ea" stroke="#4c1d95" stroke-width="0.004628571428571429"/><circle data-type="circle" data-label="" data-x="2.292" data-y="0.35" cx="535.1851851851851" cy="363.386997212266" r="32.407407407407405" fill="#9333ea" stroke="#4c1d95" stroke-width="0.004628571428571429"/><text data-type="text" data-label="Input: orange via sits between two shared anchors" data-x="0" data-y="1.1016396313364054" x="40" y="200.9957188371167" fill="rgb(18,18,18)" font-size="8.533879501621437" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Input: orange via sits between two shared anchors</text><text data-type="text" data-label="step:0" data-x="0.4040816326530612" data-y="1.0574" x="127.30158730158729" y="210.5536638789327" fill="rgb(190,92,12)" font-size="8.533879501621437" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="0.5510204081632653" data-y="1.0574" x="159.04761904761904" y="210.5536638789327" fill="rgb(120,58,175)" font-size="8.533879501621437" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Result: orange via joins one anchor and stays there" data-x="1.392" data-y="1.099904743833017" x="340.7407407407407" y="201.37054021130555" fill="rgb(18,18,18)" font-size="8.19921756038138" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Result: orange via joins one anchor and stays there</text><text data-type="text" data-label="step:2" data-x="1.803764705882353" data-y="1.0574" x="429.70225127087866" y="210.5536638789327" fill="rgb(190,92,12)" font-size="8.19921756038138" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:2</text><text data-type="text" data-label=" layer:all" data-x="1.9449411764705882" data-y="1.0574" x="460.2033405954974" y="210.5536638789327" fill="rgb(120,58,175)" font-size="8.19921756038138" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":216.04938271604937,"c":0,"e":40,"b":0,"d":-216.04938271604937,"f":439.0042811628833};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
