bel="" data-x="1.7080000000000002" data-y="0.4" cx="380.6267806267807" cy="331.6749674857202" r="19.943019943019948" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.005014285714285714"/><circle data-type="circle" data-label="" data-x="2.608" data-y="0.4" cx="560.1139601139602" cy="331.6749674857202" r="19.943019943019948" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.005014285714285714"/><text data-type="text" data-label="Input: one island between distinct PCB terminals" data-x="0" data-y="0.8948447311827957" x="40" y="232.9879840589518" fill="rgb(18,18,18)" font-size="8.711668657905218" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Input: one island between distinct PCB terminals</text><text data-type="text" data-label="step:0" data-x="0.43333333333333335" data-y="0.84592" x="126.41975308641976" y="242.74505295580565" fill="rgb(190,92,12)" font-size="8.711668657905218" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="0.5958333333333333" data-y="0.84592" x="158.82716049382717" y="242.74505295580565" fill="rgb(120,58,175)" font-size="8.711668657905218" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Result: start and end stay paired" data-x="1.508" data-y="0.9170832453567938" x="340.74074074074076" y="228.55295274220006" fill="rgb(18,18,18)" font-size="12.671518047862135" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Result: start and end stay paired</text><text data-type="text" data-label="step:4" data-x="1.8428484848484847" data-y="0.84592" x="407.5196408529742" y="242.74505295580565" fill="rgb(190,92,12)" font-size="12.671518047862138" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:4</text><text data-type="text" data-label=" layer:all" data-x="2.0792121212121213" data-y="0.84592" x="454.65768799102136" y="242.74505295580565" fill="rgb(120,58,175)" font-size="12.671518047862138" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="" data-x="1.7080000000000002" data-y="0.4" cx="380.6267806267807" cy="331.6749674857202" r="3" fill="hsl(120, 100%, 40%)"/></g><g><circle data-type="point" data-label="" data-x="1.8080000000000003" data-y="0.4" cx="400.56980056980063" cy="331.6749674857202" r="3" fill="hsl(120, 100%, 40%)"/></g><g><circle data-type="point" data-label="" data-x="1.9080000000000001" data-y="0.4" cx="420.51282051282055" cy="331.6749674857202" r="3" fill="hsl(120, 100%, 40%)"/></g><g><circle data-type="point" data-label="" data-x="2.608" data-y="0.4" cx="560.1139601139602" cy="331.6749674857202" r="3" fill="hsl(120, 100%, 40%)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":199.43019943019945,"c":0,"e":40,"b":0,"d":-199.43019943019945,"f":411.44704725779997};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
