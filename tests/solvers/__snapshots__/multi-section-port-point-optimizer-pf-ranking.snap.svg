<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 2.5,0" data-type="line" data-label="" points="40,403.4263111111111 299.25925925925924,403.4263111111111" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.185185185185185"/></g><g><polyline data-points="2.5,0 2.5,1.4" data-type="line" data-label="" points="299.25925925925924,403.4263111111111 299.25925925925924,258.2411259259259" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.185185185185185"/></g><g><polyline data-points="2.5,1.4 0,1.4" data-type="line" data-label="" points="299.25925925925924,258.2411259259259 40,258.2411259259259" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.185185185185185"/></g><g><polyline data-points="0,1.4 0,0" data-type="line" data-label="" points="40,258.2411259259259 40,403.4263111111111" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.185185185185185"/></g><g><polyline data-points="2.9,0 5.4,0" data-type="line" data-label="" points="340.7407407407407,403.4263111111111 600,403.4263111111111" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.185185185185185"/></g><g><polyline data-points="5.4,0 5.4,1.4" data-type="line" data-label="" points="600,403.4263111111111 600,258.2411259259259" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.185185185185185"/></g><g><polyline data-points="5.4,1.4 2.9,1.4" data-type="line" data-label="" points="600,258.2411259259259 340.7407407407407,258.2411259259259" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.185185185185185"/></g><g><polyline data-points="2.9,1.4 2.9,0" data-type="line" data-label="" points="340.7407407407407,258.2411259259259 340.7407407407407,403.4263111111111" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.185185185185185"/></g><g><rect data-type="rect" data-label="Raw Pf: 0.9 vs 0.3 step:0 layer:all" data-x="1.25" data-y="0.7" x="40" y="258.24112592592587