-y="0.9" cx="506.2918340026773" cy="329.60194325689855" r="9.370816599732262" fill="rgba(22, 163, 74, 0.75)" stroke="black" stroke-width="0.010671428571428573"/><text data-type="text" data-label="Before: two nearby same-net vias" data-x="0" data-y="2.0049329032258068" x="40" y="226.06070734551105" fill="rgb(18,18,18)" font-size="8.501748931208704" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: two nearby same-net vias</text><text data-type="text" data-label="step:1" data-x="0.45" data-y="1.9033200000000001" x="82.16867469879517" y="235.58266614846482" fill="rgb(190,92,12)" font-size="8.501748931208704" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="0.7875000000000001" data-y="1.9033200000000001" x="113.79518072289156" y="235.58266614846482" fill="rgb(120,58,175)" font-size="8.501748931208704" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="After: one retained physical via site" data-x="2.088" data-y="1.9912014298169138" x="235.66265060240963" y="227.3474585350994" fill="rgb(18,18,18)" font-size="7.352863940504824" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: one retained physical via site</text><text data-type="text" data-label="step:2" data-x="2.598810810810811" data-y="1.9033200000000001" x="283.52979485509604" y="235.58266614846482" fill="rgb(190,92,12)" font-size="7.352863940504824" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:2</text><text data-type="text" data-label=" layer:all" data-x="2.890702702702703" data-y="1.9033200000000001" x="310.882448713774" y="235.58266614846482" fill="rgb(120,58,175)" font-size="7.352863940504824" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Movement: removed site to retained site" data-x="4.176" data-y="1.986694689826303" x="431.32530120481925" y="227.76977687424633" fill="rgb(18,18,18)" font-size="6.975793994837911" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Movement: removed site to retained site</text><text data-type="text" data-label="step:3" data-x="4.706769230769231" data-y="1.9033200000000001" x="481.06271238801355" y="235.58266614846482" fill="rgb(190,92,12)" font-size="6.975793994837912" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:3</text><text data-type="text" data-label=" layer:all" data-x="4.983692307692308" data-y="1.9033200000000001" x="507.01266604881056" y="235.58266614846482" fill="rgb(120,58,175)" font-size="6.975793994837912" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":93.70816599732261,"c":0,"e":40,"b":0,"d":-93.70816599732261,"f":413.9392926544889};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>