z=[0,1]</text><text data-type="text" data-label="z1" data-x="0.3811200000000001" data-y="1.9850000000000003" x="144.79505604804064" y="481.85514991570466" fill="black" font-size="18.903176013487258" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z1</text><text data-type="text" data-label="TopologyMergeSolver" data-x="0.11317653239999936" data-y="9.408789288800001" x="128.8473780577795" y="40" fill="rgb(18,18,18)" font-size="32.453755847575636" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">TopologyMergeSolver</text><text data-type="text" data-label="step:1" data-x="0.28220987279999976" data-y="8.798088188000001" x="138.90804237052797" y="76.34820654928478" fill="rgb(190,92,12)" font-size="32.453755847575636" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:split" data-x="2.3106099576" data-y="8.798088188000001" x="259.6360141235093" y="76.34820654928478" fill="rgb(120,58,175)" font-size="32.453755847575636" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:split</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":59.51881616337297,"c":0,"e":122.11124483185591,"b":0,"d":-59.51881616337297,"f":600};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>