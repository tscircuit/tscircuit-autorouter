688" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="SOIC soic:u_soic_vertical:left-gap-2:z0" data-x="-1.7999999999999998" data-y="1.5" x="168.07017543859655" y="182.10526315789474" width="51.228070175438546" height="65.26315789473685" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="SOIC soic:u_soic_vertical:left-gap-2:z1" data-x="-1.7999999999999998" data-y="1.5" x="168.07017543859655" y="182.10526315789474" width="51.228070175438546" height="65.26315789473685" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="SOIC soic:u_soic_vertical:right-gap-0:z0" data-x="1.7999999999999998" data-y="-1.5" x="420.70175438596493" y="392.63157894736844" width="51.22807017543852" height="65.26315789473682" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="SOIC soic:u_soic_vertical:right-gap-0:z1" data-x="1.7999999999999998" data-y="-1.5" x="420.70175438596493" y="392.63157894736844" width="51.22807017543852" height="65.26315789473682" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="SOIC soic:u_soic_vertical:right-gap-1:z0" data-x="1.7999999999999998" data-y="0" x="420.70175438596493" y="287.36842105263156" width="51.22807017543852" height="65.26315789473688" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="SOIC soic:u_soic_vertical:right-gap-1:z1" data-x="1.7999999999999998" data-y="0" x="420.70175438596493" y="287.36842105263156" width="51.22807017543852" height="65.26315789473688" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="SOIC soic:u_soic_vertical:right-gap-2:z0" data-x="1.7999999999999998" data-y="1.5" x="420.70175438596493" y="182.10526315789474" width="51.22807017543852" height="65.26315789473685" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g><rect data-type="rect" data-label="SOIC soic:u_soic_vertical:right-gap-2:z1" data-x="1.7999999999999998" data-y="1.5" x="420.70175438596493" y="182.10526315789474" width="51.22807017543852" height="65.26315789473685" fill="rgba(0, 120, 255, 0.12)" stroke="rgba(0, 120, 255, 0.55)" stroke-width="0.014250000000000002"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":70.17543859649122,"c":0,"e":320,"b":0,"d":-70.17543859649122,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>