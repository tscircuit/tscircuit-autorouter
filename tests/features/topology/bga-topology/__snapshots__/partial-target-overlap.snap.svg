family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Same physical XY scale (mm)" data-x="3.9839999999999995" data-y="1.5450000000000004" x="470.37037037037027" y="274.8810202849397" fill="black" font-size="5.9413580246913575" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">Same physical XY scale (mm)</text><text data-type="text" data-label="Missing: no Ø0.33 z0/z5 region" data-x="3.9839999999999995" data-y="0.45500000000000007" x="470.37037037037027" y="392.6279338651867" fill="black" font-size="5.401234567901234" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">Missing: no Ø0.33 z0/z5 region</text><text data-type="text" data-label="Output: ordinary merged regions" data-x="2.784" data-y="2.254654318418314" x="340.7407407407407" y="198.22083156691207" fill="rgb(18,18,18)" font-size="13.489035341272592" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Output: ordinary merged regions</text><text data-type="text" data-label="step:1" data-x="3.3646451612903228" data-y="2.1148" x="403.4647550776583" y="213.32855114913735" fill="rgb(190,92,12)" font-size="13.489035341272592" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="3.8291612903225807" data-y="2.1148" x="453.64396654719235" y="213.32855114913735" fill="rgb(120,58,175)" font-size="13.489035341272592" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":108.02469135802468,"c":0,"e":40,"b":0,"d":-108.02469135802468,"f":441.77916843308793};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
