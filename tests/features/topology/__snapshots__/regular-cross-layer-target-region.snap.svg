99999999998" data-y="2.2947100000000002" x="65.9259259259259" y="151.62493827160495" fill="rgb(190,92,12)" font-size="20.908004778972522" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="0.6599999999999999" data-y="2.2947100000000002" x="143.7037037037037" y="151.62493827160495" fill="rgb(120,58,175)" font-size="20.908004778972522" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="z0" data-x="2.082" data-y="1.885" x="367.13804713804706" y="216.00136924803593" fill="black" font-size="20.42648709315376" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z0</text><text data-type="text" data-label="z1" data-x="2.082" data-y="1.185" x="367.13804713804706" y="325.9901459034793" fill="black" font-size="20.42648709315376" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z1</text><text data-type="text" data-label="z2" data-x="2.082" data-y="0.4850000000000001" x="367.13804713804706" y="435.97892255892253" fill="black" font-size="20.42648709315376" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z2</text><text data-type="text" data-label="Green = z0 free / z2 target" data-x="2.742" data-y="0.2450000000000001" x="470.8417508417508" y="473.68936026936024" fill="black" font-size="15.712682379349046" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">Green = z0 free / z2 target</text><text data-type="text" data-label="0.338 access ≥ 0.300 via" data-x="2.742" data-y="0.08499999999999996" x="470.8417508417508" y="498.8296520763187" fill="black" font-size="15.712682379349046" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">0.338 access ≥ 0.300 via</text><text data-type="text" data-label="Aligned via access" data-x="1.9840259999999998" data-y="2.4462460000000004" x="351.74370370370366" y="127.81456790123457" fill="rgb(18,18,18)" font-size="21.25925925925926" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Aligned via access</text><text data-type="text" data-label="step:1" data-x="2.0679119999999998" data-y="2.2947100000000002" x="364.92444444444436" y="151.62493827160495" fill="rgb(190,92,12)" font-size="21.25925925925926" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="2.5712279999999996" data-y="2.2947100000000002" x="444.0088888888888" y="151.62493827160495" fill="rgb(120,58,175)" font-size="21.25925925925926" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":157.12682379349044,"c":0,"e":40,"b":0,"d":-157.12682379349044,"f":512.1854320987654};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>