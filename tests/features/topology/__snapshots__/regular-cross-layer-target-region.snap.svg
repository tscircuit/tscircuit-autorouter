999999999998" data-y="2.2947100000000002" x="64.97972424979721" y="157.58048993189084" fill="rgb(190,92,12)" font-size="20.14493891112681" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="0.6599999999999999" data-y="2.2947100000000002" x="139.91889699918897" y="157.58048993189084" fill="rgb(120,58,175)" font-size="20.14493891112681" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="z0" data-x="2.0789999999999997" data-y="1.885" x="354.7445255474452" y="219.60741612816014" fill="black" font-size="19.680994863476617" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z0</text><text data-type="text" data-label="z1" data-x="2.0789999999999997" data-y="1.185" x="354.7445255474452" y="325.5820038545727" fill="black" font-size="19.680994863476617" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z1</text><text data-type="text" data-label="z2" data-x="2.0789999999999997" data-y="0.4850000000000001" x="354.7445255474452" y="431.5565915809852" fill="black" font-size="19.680994863476617" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z2</text><text data-type="text" data-label="Orange crosses target/free roles" data-x="2.739" data-y="0.2450000000000001" x="454.66342254663425" y="467.89073594432665" fill="black" font-size="15.139226818058937" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">Orange crosses target/free roles</text><text data-type="text" data-label="0.595 region; 0.252 overlap" data-x="2.739" data-y="0.08499999999999996" x="454.66342254663425" y="492.11349885322096" fill="black" font-size="15.139226818058937" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">0.595 region; 0.252 overlap</text><text data-type="text" data-label="Issue: access crosses XY roles" data-x="1.914" data-y="2.3940648387096775" x="329.76480129764803" y="142.53893554491617" fill="rgb(18,18,18)" font-size="13.429959274084538" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Issue: access crosses XY roles</text><text data-type="text" data-label="step:1" data-x="2.299" data-y="2.2947100000000002" x="388.0508245471749" y="157.58048993189084" fill="rgb(190,92,12)" font-size="13.429959274084538" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="2.629" data-y="2.2947100000000002" x="438.01027304676944" y="157.58048993189084" fill="rgb(120,58,175)" font-size="13.429959274084538" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":151.39226818058935,"c":0,"e":40,"b":0,"d":-151.39226818058935,"f":504.98184164857105};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>