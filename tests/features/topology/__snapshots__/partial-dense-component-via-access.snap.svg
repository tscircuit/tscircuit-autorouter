central">original z1 pair</text><text data-type="text" data-label="target-bottom" data-x="2.2885" data-y="-3.0153600000000003" x="291.74460387372983" y="542.8542550255213" fill="black" font-size="10.884903804662626" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">target-bottom</text><text data-type="text" data-label="availableZ: [0, 1]" data-x="2.2885" data-y="-3.19536" x="291.74460387372983" y="559.1816107325151" fill="black" font-size="8.163677853496969" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: [0, 1]</text><text data-type="text" data-label="via access: true" data-x="2.2885" data-y="-3.39536" x="291.74460387372983" y="577.3231170736195" fill="black" font-size="8.163677853496969" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">via access: true</text><text data-type="text" data-label="free-bottom" data-x="4.3885000000000005" data-y="-3.07536" x="482.2304204553259" y="548.2967069278525" fill="black" font-size="10.884903804662626" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">free-bottom</text><text data-type="text" data-label="availableZ: [1]" data-x="4.3885000000000005" data-y="-3.31536" x="482.2304204553259" y="570.0665145371777" fill="black" font-size="8.163677853496969" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: [1]</text><text data-type="text" data-label="CapacityMeshEdge" data-x="3.3385000000000002" data-y="-3.07536" x="386.98751216452786" y="548.2967069278525" fill="rgba(0,90,210,1)" font-size="9.070753170552189" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">CapacityMeshEdge</text><text data-type="text" data-label="Logical graph (not PCB distance): edge created" data-x="0.027495999999999743" data-y="-1.117032" x="86.65451185741804" y="370.66160777804123" fill="rgb(18,18,18)" font-size="16.36363871967615" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Logical graph (not PCB distance): edge created</text><text data-type="text" data-label="step:1" data-x="1.705216" data-y="-1.31908" x="238.83635195040625" y="388.9888831440785" fill="rgb(190,92,12)" font-size="16.36363871967615" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="2.376304" data-y="-1.31908" x="299.7090879876015" y="388.9888831440785" fill="rgb(120,58,175)" font-size="16.36363871967615" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":90.70753170552189,"c":0,"e":84.16041756564303,"b":0,"d":-90.70753170552189,"f":269.3383922219587};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>