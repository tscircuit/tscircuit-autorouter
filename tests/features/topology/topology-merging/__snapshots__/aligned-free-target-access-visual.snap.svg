text" data-label="z0" data-x="7.6434000000000015" data-y="1.76" x="346.51542493769875" y="301.9594695081779" fill="black" font-size="4.812236830798315" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z0</text><text data-type="text" data-label="z1" data-x="7.6434000000000015" data-y="0.52" x="346.51542493769875" y="351.6859167597605" fill="black" font-size="4.812236830798315" font-family="sans-serif" text-anchor="end" dominant-baseline="central">z1</text><text data-type="text" data-label="Issue: aligned free layers remain separate:frame" data-x="7.9499352000000005" data-y="2.6202672000000002" x="358.8080914324998" y="267.4610569734468" fill="rgb(18,18,18)" font-size="7.497464982383776" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Issue: aligned free layers remain separate:frame</text><text data-type="text" data-label="step:unknown" data-x="9.340917600000001" data-y="2.4108720000000003" x="414.5892309014351" y="275.8582177537166" fill="rgb(190,92,12)" font-size="7.497464982383776" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:split" data-x="10.731900000000001" data-y="2.4108720000000003" x="470.3703703703704" y="275.8582177537166" fill="rgb(120,58,175)" font-size="7.497464982383776" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:split</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":40.10197358998596,"c":0,"e":40,"b":0,"d":-40.10197358998596,"f":372.5389430265532};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>