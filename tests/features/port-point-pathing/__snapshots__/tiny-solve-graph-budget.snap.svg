2743309512,394.075033454994 171.94202910430784,394.075033454994 192.74253077552055,394.075033454994 213.5430324467333,394.075033454994 234.34353411794598,394.075033454994 255.14403578915872,394.075033454994 275.9445374603714,394.075033454994 296.7450391315841,394.075033454994 317.54554080279684,394.075033454994 338.3460424740096,394.075033454994 359.1465441452223,394.075033454994 379.94704581643504,394.075033454994 400.74754748764775,394.075033454994 421.54804915886047,394.075033454994 442.3485508300732,394.075033454994 463.14905250128595,394.075033454994 483.94955417249867,394.075033454994 504.7500558437114,394.075033454994 525.5505575149241,394.075033454994 546.3510591861368,394.075033454994" fill="none" stroke="rgba(37,99,235,0.95)" stroke-width="4.160100334242545"/></g><g><polyline data-points="5.0255,0.4749999999999999 5.0255,2.475" data-type="line" data-label="" points="480.20546387168037,560.4790468246958 480.20546387168037,394.075033454994" fill="none" stroke="rgba(100,116,139,0.75)" stroke-width="2.0800501671212723" stroke-dasharray="0.08 0.06"/></g><g><rect data-type="rect" data-label="Tiny solveGraph search budget step:1 layer:all" data-x="3.1" data-y="3" x="62.07377927696223" y="100.78795989089465" width="515.8524414460755" height="499.2120401091053" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.012018940886699506"/></g><circle data-type="circle" data-label="" data-x="5.0255" data-y="2.475" cx="480.20546387168037" cy="394.075033454994" r="8.32020066848509" fill="rgba(220,38,38,0.9)" stroke="rgba(153,27,27,1)" stroke-width="0.012018940886699506"/><text data-type="text" data-label="0" data-x="0.8205000000000002" data-y="0.2749999999999999" x="130.3410257618824" y="577.119448161666" fill="black" font-size="9.152220735333598" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">0</text><text data-type="text" data-label="1,000 routes" data-x="5.8205" data-y="0.2749999999999999" x="546.3510591861368" y="577.119448161666" fill="black" font-size="9.152220735333598" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">1,000 routes</text><text data-type="text" data-label="2M" data-x="0.7005000000000002" data-y="2.475" x="120.35678495970029" y="394.075033454994" fill="black" font-size="9.152220735333598" font-family="sans-serif" text-anchor="end" dominant-baseline="central">2M</text><text data-type="text" data-label="5M iterations" data-x="0.7005000000000002" data-y="5.475" x="120.35678495970029" y="144.46901340044144" fill="black" font-size="9.152220735333598" font-family="sans-serif" text-anchor="end" dominant-baseline="central">5M iterations</text><text data-type="text" data-label="sample 4 · 841 routes · 2.000M budget" data-x="5.0255" data-y="2.6550000000000002" x="480.20546387168037" y="379.09867225172087" fill="black" font-size="9.984240802182105" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">sample 4 · 841 routes · 2.000M budget</text><text data-type="text" data-label="Blue line = production solveGraph MAX_ITERATIONS at effort 1" data-x="0.9705000000000003" data-y="5.225" x="142.82132676461003" y="165.26951507165415" fill="black" font-size="9.984240802182105" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Blue line = production solveGraph MAX_ITERATIONS at effort 1</text><text data-type="text" data-label="Hosted reproduction: the fixed 2M budget ended at route 619 of 841" data-x="0.9705000000000003" data-y="4.925" x="142.82132676461003" y="190.2301170771094" fill="black" font-size="9.984240802182105" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Hosted reproduction: the fixed 2M budget ended at route 619 of 841</text><text data-type="text" data-label="Red sample point = budget does not scale with the graph" data-x="0.9705000000000003" data-y="4.625" x="142.82132676461003" y="215.19071908256467" fill="black" font-size="9.984240802182105" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Red sample point = budget does not scale with the graph</text><text data-type="text" data-label="Tiny solveGraph search budget" data-x="4.440892098500626e-16" data-y="6.730606896551724" x="62.07377927696226" y="40" fill="rgb(18,18,18)" font-size="28.6903471327072" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Tiny solveGraph search budget</text><text data-type="text" data-label="step:1" data-x="1.3896551724137933" data-y="6.3444" x="177.69587822177226" y="72.13318878863197" fill="rgb(190,92,12)" font-size="28.6903471327072" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="2.6724137931034484" data-y="6.3444" x="284.423969555443" y="72.13318878863197" fill="rgb(120,58,175)" font-size="28.6903471327072" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":83.20200668485089,"c":0,"e":62.07377927696223,"b":0,"d":-83.20200668485089,"f":600};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
