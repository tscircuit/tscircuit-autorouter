<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 5.7,0" data-type="line" data-label="" points="53.47811436381767,600 586.5218856361823,600" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.675822555020742"/></g><g><polyline data-points="5.7,0 5.7,5.4" data-type="line" data-label="" points="586.5218856361823,600 586.5218856361823,95.0111640577598" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.675822555020742"/></g><g><polyline data-points="5.7,5.4 0,5.4" data-type="line" data-label="" points="586.5218856361823,95.0111640577598 53.47811436381767,95.0111640577598" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.675822555020742"/></g><g><polyline data-points="0,5.4 0,0" data-type="line" data-label="" points="53.47811436381767,95.0111640577598 53.47811436381767,600" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.675822555020742"/></g><g><polyline data-points="1.2640000000000002,0.5650000000000002 5.564,0.5650000000000002" data-type="line" data-label="" points="171.68290855474203,547.1632051282656 573.8036482865258,547.1632051282656" fill="none" stroke="rgba(51,65,85,0.8)" stroke-width="2.337911277510371"/></g><g><polyline data-points="1.2640000000000002,0.5650000000000002 1.2640000000000002,4.565" data-type="line" data-label="" points="171.68290855474203,547.1632051282656 171.68290855474203,173.09740072660622" fill="none" stroke="rgba(51,65,85,0.8)" stroke-width="2.337911277510371"/></g><g><rect data-type="rect" data-label="Tiny solveGraph budget by route count step:1 layer:all" data-x="2.85" data-y="2.7" x="53.47811436381767" y="95.01116405775977" width="533.0437712723647" height="504.9888359422402" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.010693305704321835"/></g><g><rect data-type="rect" data-label="100 routes · 2,000,000 iterations" data-x="2.164" data-y="0.8983333333333334" x="195.06202132984578" y="484.81890439465565" width="121.57138643053926" height="62.34430073360994" fill="rgba(100,116,139,0.7)" stroke="rgba(71,85,105,0.95)" stroke-width="0.010693305704321835"/></g><g><rect data-type="rect" data-label="841 routes · 2,000,000 iterations" data-x="4.464" data-y="0.8983333333333334" x="410.14985886079984" y="484.81890439465565" width="121.5713864305394" height="62.34430073360994" fill="rgba(220,38,38,0.72)" stroke="rgba(153,27,27,0.98)" stroke-width="0.010693305704321835"/></g><text data-type="text" data-label="small graph · 100 routes" data-x="2.164" data-y="0.3850000000000002" x="255.8477145451154" y="563.9961663263402" fill="black" font-size="12.15713864305393" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">small graph · 100 routes</text><text data-type="text" data-label="2.000M iterations" data-x="2.164" data-y="1.3616666666666668" x="255.8477145451154" y="472.66176575160176" fill="black" font-size="13.09230315405808" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">2.000M iterations</text><text data-type="text" data-label="sample 4 · 841 routes" data-x="4.464" data-y="0.3850000000000002" x="470.93555207606954" y="563.9961663263402" fill="black" font-size="12.15713864305393" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">sample 4 · 841 routes</text><text data-type="text" data-label="2.000M iterations" data-x="4.464" data-y="1.3616666666666668" x="470.93555207606954" y="472.66176575160176" fill="black" font-size="13.09230315405808" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">2.000M iterations</text><text data-type="text" data-label="2M" data-x="1.1440000000000001" data-y="1.231666666666667" x="160.46093442269228" y="484.8189043946557" fill="black" font-size="11.22197413204978" font-family="sans-serif" text-anchor="end" dominant-baseline="central">2M</text><text data-type="text" data-label="6M" data-x="1.1440000000000001" data-y="2.5650000000000004" x="160.46093442269228" y="360.1303029274359" fill="black" font-size="11.22197413204978" font-family="sans-serif" text-anchor="end" dominant-baseline="central">6M</text><text data-type="text" data-label="12M iterations" data-x="1.1440000000000001" data-y="4.565" x="160.46093442269228" y="173.09740072660622" fill="black" font-size="11.22197413204978" font-family="sans-serif" text-anchor="end" dominant-baseline="central">12M iterations</text><text data-type="text" data-label="Production effort-1 solveGraph MAX_ITERATIONS" data-x="1.4140000000000001" data-y="5.015000000000001" x="185.71037621980426" y="131.0149977314195" fill="black" font-size="13.09230315405808" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Production effort-1 solveGraph MAX_ITERATIONS</text><text data-type="text" data-label="Red: both graphs stop at the same fixed 2M budget" data-x="1.4140000000000001" data-y="4.7250000000000005" x="185.71037621980426" y="158.13476855053983" fill="black" font-size="13.09230315405808" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Red: both graphs stop at the same fixed 2M budget</text><text data-type="text" data-label="Tiny solveGraph budget by route count" data-x="0" data-y="5.9882511944202275" x="53.47811436381767" y="40" fill="rgb(18,18,18)" font-size="23.236432923817112" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Tiny solveGraph budget by route count</text><text data-type="text" data-label="step:1" data-x="1.6175675675675678" data-y="5.709960000000001" x="204.7472926978671" y="66.02480487467517" fill="rgb(190,92,12)" font-size="23.236432923817112" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="2.541891891891892" data-y="5.709960000000001" x="291.1868231744668" y="66.02480487467517" fill="rgb(120,58,175)" font-size="23.236432923817112" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":93.51645110041484,"c":0,"e":53.47811436381767,"b":0,"d":-93.51645110041484,"f":600};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>