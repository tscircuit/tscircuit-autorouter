<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 4.6,0" data-type="line" data-label="" points="74.66666666666669,506.80138006393497 565.3333333333335,506.80138006393497" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.333333333333335"/></g><g><polyline data-points="4.6,0 4.6,3.1" data-type="line" data-label="" points="565.3333333333335,506.80138006393497 565.3333333333335,176.13471339726823" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.333333333333335"/></g><g><polyline data-points="4.6,3.1 0,3.1" data-type="line" data-label="" points="565.3333333333335,176.13471339726823 74.66666666666669,176.13471339726823" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.333333333333335"/></g><g><polyline data-points="0,3.1 0,0" data-type="line" data-label="" points="74.66666666666669,176.13471339726823 74.66666666666669,506.80138006393497" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="5.333333333333335"/></g><g><polyline data-points="0.6676666666666664,2.585 4.667666666666666,2.585" data-type="line" data-label="" points="145.88444444444445,231.06804673060157 572.5511111111111,231.06804673060157" fill="none" stroke="rgba(60,70,80,0.6)" stroke-width="2.6666666666666674"/></g><g><polyline data-points="4.0009999999999994,0.5850000000000002 4.0009999999999994,2.835" data-type="line" data-label="" points="501.44000000000005,444.40138006393494 501.44000000000005,204.40138006393494" fill="none" stroke="rgba(180,90,20,0.9)" stroke-width="3.7333333333333343" stroke-dasharray="0.08 0.06"/></g><g><rect data-type="rect" data-label="Duplicate-congested-port prepass gate step:1 layer:all" data-x="2.3" data-y="1.55" x="74.66666666666666" y="176.13471339726823" width="490.6666666666668" height="330.66666666666674" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.009374999999999998"/></g><circle data-type="circle" data-label="" data-x="1.0009999999999997" data-y="2.085" cx="181.44" cy="284.40138006393494" r="12.800000000000002" fill="rgba(40,170,95,0.8)" stroke="rgba(20,105,55,1)" stroke-width="0.009374999999999998"/><circle data-type="circle" data-label="" data-x="3.4709999999999996" data-y="0.9850000000000002" cx="444.9066666666667" cy="401.73471339726825" r="12.800000000000002" fill="rgba(40,170,95,0.8)" stroke="rgba(20,105,55,1)" stroke-width="0.009374999999999998"/><text data-type="text" data-label="0" data-x="0.6676666666666664" data-y="2.665" x="145.88444444444445" y="222.53471339726826" fill="black" font-size="11.733333333333336" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">0</text><text data-type="text" data-label="1,200 connections" data-x="4.667666666666666" data-y="2.665" x="572.5511111111111" y="222.53471339726826" fill="black" font-size="11.733333333333336" font-family="sans-serif" text-anchor="end" dominant-baseline="text-after-edge">1,200 connections</text><text data-type="text" data-label="current prepass cutoff: 1000" data-x="4.0009999999999994" data-y="2.865" x="501.44000000000005" y="201.2013800639349" fill="black" font-size="11.733333333333336" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">current prepass cutoff: 1000</text><text data-type="text" data-label="100-connection graph: prepass runs" data-x="1.0009999999999997" data-y="1.8850000000000002" x="181.44" y="305.73471339726825" fill="black" font-size="13.866666666666669" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">100-connection graph: prepass runs</text><text data-type="text" data-label="srj24 sample 4: prepass runs" data-x="3.4709999999999996" data-y="0.7850000000000001" x="444.9066666666667" y="423.0680467306016" fill="black" font-size="13.866666666666669" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">srj24 sample 4: prepass runs</text><text data-type="text" data-label="green = prepass runs · red = skipped by the production cutoff" data-x="0.6676666666666664" data-y="0.3350000000000002" x="145.88444444444445" y="471.0680467306016" fill="black" font-size="10.66666666666667" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">green = prepass runs · red = skipped by the production cutoff</text><text data-type="text" data-label="Duplicate-congested-port prepass gate" data-x="0" data-y="3.5025258761987796" x="74.66666666666669" y="133.19861993606509" fill="rgb(18,18,18)" font-size="21.389131066550423" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Duplicate-congested-port prepass gate</text><text data-type="text" data-label="step:1" data-x="1.3054054054054052" data-y="3.27794" x="213.90990990990994" y="157.1544467306016" fill="rgb(190,92,12)" font-size="21.389131066550423" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="2.051351351351351" data-y="3.27794" x="293.47747747747746" y="157.1544467306016" fill="rgb(120,58,175)" font-size="21.389131066550423" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":106.66666666666669,"c":0,"e":74.66666666666669,"b":0,"d":-106.66666666666669,"f":506.80138006393497};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>