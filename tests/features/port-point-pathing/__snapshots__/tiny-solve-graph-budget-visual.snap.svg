<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 6.2,0" data-type="line" data-label="" points="52.34659266111623,584.8775824853531 587.6534073388838,584.8775824853531" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.316990440949738"/></g><g><polyline data-points="6.2,0 6.2,5.5" data-type="line" data-label="" points="587.6534073388838,584.8775824853531 587.6534073388838,110.00863398088188" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.316990440949738"/></g><g><polyline data-points="6.2,5.5 0,5.5" data-type="line" data-label="" points="587.6534073388838,110.00863398088188 52.34659266111623,110.00863398088188" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.316990440949738"/></g><g><polyline data-points="0,5.5 0,0" data-type="line" data-label="" points="52.34659266111623,110.00863398088188 52.34659266111623,584.8775824853531" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.316990440949738"/></g><g><polyline data-points="0.9849999999999998,0.5800000000000003 5.585,0.5800000000000003" data-type="line" data-label="" points="137.39130434782606,534.8004933703361 534.5544249152019,534.8004933703361" fill="none" stroke="rgba(51,65,85,0.8)" stroke-width="2.158495220474869"/></g><g><polyline data-points="0.9849999999999998,0.5800000000000003 0.9849999999999998,4.58" data-type="line" data-label="" points="137.39130434782606,534.8004933703361 137.39130434782606,189.44125809435707" fill="none" stroke="rgba(51,65,85,0.8)" stroke-width="2.158495220474869"/></g><g><rect data-type="rect" data-label="Tiny solveGraph continuation budget step:1 layer:all" data-x="3.1" data-y="2.75" x="52.34659266111623" y="110.00863398088188" width="535.3068146777675" height="474.8689485044712" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.011582142857142857"/></g><g><rect data-type="rect" data-label="100 routes · 2,000,000 iterations" data-x="1.9849999999999999" data-y="0.7050000000000003" x="161.13475177304963" y="513.2155411655874" width="125.19272278754241" height="21.584952204748674" fill="rgba(100,116,139,0.72)" stroke="rgba(71,85,105,0.98)" stroke-width="0.011582142857142857"/></g><g><rect data-type="rect" data-label="841 routes · 2,000,000 iterations" data-x="4.485" data-y="0.7050000000000003" x="376.98427382053654" y="513.2155411655874" width="125.19272278754238" height="21.584952204748674" fill="rgba(220,38,38,0.72)" stroke="rgba(153,27,27,0.98)" stroke-width="0.011582142857142857"/></g><text data-type="text" data-label="ordinary graph · accepted by 2M" data-x="1.9849999999999999" data-y="0.4000000000000003" x="223.73111316682082" y="550.3416589577552" fill="black" font-size="11.22417514646932" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">ordinary graph · accepted by 2M</text><text data-type="text" data-label="2.000M iterations" data-x="1.9849999999999999" data-y="0.9600000000000003" x="223.73111316682082" y="501.99136601911806" fill="black" font-size="12.087573234659267" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">2.000M iterations</text><text data-type="text" data-label="sample 4 · still unresolved after 2M" data-x="4.485" data-y="0.4000000000000003" x="439.58063521430773" y="550.3416589577552" fill="black" font-size="11.22417514646932" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">sample 4 · still unresolved after 2M</text><text data-type="text" data-label="2.000M iterations" data-x="4.485" data-y="0.9600000000000003" x="439.58063521430773" y="501.99136601911806" fill="black" font-size="12.087573234659267" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">2.000M iterations</text><text data-type="text" data-label="2M" data-x="0.8649999999999998" data-y="0.8300000000000003" x="127.03052728954667" y="513.2155411655874" fill="black" font-size="10.36077705827937" font-family="sans-serif" text-anchor="end" dominant-baseline="central">2M</text><text data-type="text" data-label="16M" data-x="0.8649999999999998" data-y="2.58" x="127.03052728954667" y="362.1208757323466" fill="black" font-size="10.36077705827937" font-family="sans-serif" text-anchor="end" dominant-baseline="central">16M</text><text data-type="text" data-label="32M iterations" data-x="0.8649999999999998" data-y="4.58" x="127.03052728954667" y="189.44125809435707" fill="black" font-size="10.36077705827937" font-family="sans-serif" text-anchor="end" dominant-baseline="central">32M iterations</text><text data-type="text" data-label="Tiny solveGraph final search limit at effort 1" data-x="1.1349999999999998" data-y="5.1" x="150.34227567067526" y="144.54455750847984" fill="black" font-size="12.087573234659267" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Tiny solveGraph final search limit at effort 1</text><text data-type="text" data-label="Red: the unresolved search still fails at the initial 2M limit" data-x="1.1349999999999998" data-y="4.8100000000000005" x="150.34227567067526" y="169.58310206598827" fill="black" font-size="12.087573234659267" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Red: the unresolved search still fails at the initial 2M limit</text><text data-type="text" data-label="Tiny solveGraph continuation budget" data-x="0" data-y="6.1357" x="52.34659266111623" y="55.12241751464694" fill="rgb(18,18,18)" font-size="24.66851680542707" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Tiny solveGraph continuation budget</text><text data-type="text" data-label="step:1" data-x="1.6828571428571428" data-y="5.8157" x="197.6441566450817" y="82.75115633672527" fill="rgb(190,92,12)" font-size="24.668516805427075" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="2.7457142857142856" data-y="5.8157" x="289.4110391612704" y="82.75115633672527" fill="rgb(120,58,175)" font-size="24.668516805427075" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":86.33980881899475,"c":0,"e":52.34659266111623,"b":0,"d":-86.33980881899475,"f":584.8775824853531};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>