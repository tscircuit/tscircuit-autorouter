<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 6.2,0" data-type="line" data-label="" points="40,597.096129032258 600,597.096129032258" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.516129032258064"/></g><g><polyline data-points="6.2,0 6.2,5.5" data-type="line" data-label="" points="600,597.096129032258 600,100.3219354838709" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.516129032258064"/></g><g><polyline data-points="6.2,5.5 0,5.5" data-type="line" data-label="" points="600,100.3219354838709 40,100.3219354838709" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.516129032258064"/></g><g><polyline data-points="0,5.5 0,0" data-type="line" data-label="" points="40,100.3219354838709 40,597.096129032258" fill="none" stroke="rgba(25,25,25,0.62)" stroke-width="4.516129032258064"/></g><g><polyline data-points="1.2120000000000002,0.5800000000000003 5.812,0.5800000000000003" data-type="line" data-label="" points="149.4709677419355,544.7090322580644 564.9548387096773,544.7090322580644" fill="none" stroke="rgba(51,65,85,0.8)" stroke-width="2.258064516129032"/></g><g><polyline data-points="1.2120000000000002,0.5800000000000003 1.2120000000000002,4.58" data-type="line" data-label="" points="149.4709677419355,544.7090322580644 149.4709677419355,183.41870967741932" fill="none" stroke="rgba(51,65,85,0.8)" stroke-width="2.258064516129032"/></g><g><rect data-type="rect" data-label="Tiny solveGraph continuation budget step:1 layer:all" data-x="3.1" data-y="2.75" x="40" y="100.3219354838709" width="560" height="496.7741935483871" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.011071428571428572"/></g><g><rect data-type="rect" data-label="100 routes · 2,000,000 iterations" data-x="2.212" data-y="0.7050000000000003" x="174.30967741935484" y="522.1283870967741" width="130.96774193548384" height="22.580645161290363" fill="rgba(100,116,139,0.72)" stroke="rgba(71,85,105,0.98)" stroke-width="0.011071428571428572"/></g><g><rect data-type="rect" data-label="841 routes · 26,912,000 iterations" data-x="4.712000000000001" data-y="2.2620000000000005" x="400.11612903225813" y="240.86387096774178" width="130.9677419354838" height="303.8451612903226" fill="rgba(34,197,94,0.72)" stroke="rgba(21,128,61,0.98)" stroke-width="0.011071428571428572"/></g><text data-type="text" data-label="ordinary graph · accepted by 2M" data-x="2.212" data-y="0.4000000000000003" x="239.79354838709676" y="560.9670967741935" fill="black" font-size="11.741935483870966" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">ordinary graph · accepted by 2M</text><text data-type="text" data-label="2.000M iterations" data-x="2.212" data-y="0.9600000000000003" x="239.79354838709676" y="510.3864516129031" fill="black" font-size="12.64516129032258" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">2.000M iterations</text><text data-type="text" data-label="sample 4 · still unresolved after 2M" data-x="4.712000000000001" data-y="0.4000000000000003" x="465.6" y="560.9670967741935" fill="black" font-size="11.741935483870966" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-before-edge">sample 4 · still unresolved after 2M</text><text data-type="text" data-label="26.912M iterations" data-x="4.712000000000001" data-y="4.074" x="465.6" y="229.1219354838709" fill="black" font-size="12.64516129032258" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">26.912M iterations</text><text data-type="text" data-label="2M" data-x="1.092" data-y="0.8300000000000003" x="138.63225806451612" y="522.1283870967741" fill="black" font-size="10.838709677419354" font-family="sans-serif" text-anchor="end" dominant-baseline="central">2M</text><text data-type="text" data-label="16M" data-x="1.092" data-y="2.58" x="138.63225806451612" y="364.0638709677419" fill="black" font-size="10.838709677419354" font-family="sans-serif" text-anchor="end" dominant-baseline="central">16M</text><text data-type="text" data-label="32M iterations" data-x="1.092" data-y="4.58" x="138.63225806451612" y="183.41870967741932" fill="black" font-size="10.838709677419354" font-family="sans-serif" text-anchor="end" dominant-baseline="central">32M iterations</text><text data-type="text" data-label="Tiny solveGraph final search limit at effort 1" data-x="1.362" data-y="5.1" x="163.01935483870966" y="136.45096774193547" fill="black" font-size="12.64516129032258" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Tiny solveGraph final search limit at effort 1</text><text data-type="text" data-label="Green: only the unresolved search receives more time" data-x="1.362" data-y="4.8100000000000005" x="163.01935483870966" y="162.64451612903218" fill="black" font-size="12.64516129032258" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Green: only the unresolved search receives more time</text><text data-type="text" data-label="Tiny solveGraph continuation budget" data-x="0" data-y="6.1357" x="40" y="42.90387096774191" fill="rgb(18,18,18)" font-size="25.80645161290322" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Tiny solveGraph continuation budget</text><text data-type="text" data-label="step:1" data-x="1.6828571428571428" data-y="5.8157" x="191.99999999999997" y="71.8070967741935" fill="rgb(190,92,12)" font-size="25.806451612903228" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="2.7457142857142856" data-y="5.8157" x="288" y="71.8070967741935" fill="rgb(120,58,175)" font-size="25.806451612903228" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":90.32258064516128,"c":0,"e":40,"b":0,"d":-90.32258064516128,"f":597.096129032258};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>