ght="156.55382800916504" fill="#f1f5f9" stroke="#64748b" stroke-width="0.0075527057692308"/></g><g><rect data-type="rect" data-label="" data-x="-31.250065" data-y="-32.147597399999995" x="468.88756067298345" y="40" width="33.10233545950359" height="79.44156946300791" fill="#fecaca" stroke="#64748b" stroke-width="0.0075527057692308"/></g><g><rect data-type="rect" data-label="" data-x="-31.07747425" data-y="-33.273799499999996" x="501.3511051948517" y="198.88332429004686" width="13.878271337807746" height="59.89972518763625" fill="#f1f5f9" stroke="#64748b" stroke-width="0.0075527057692308"/></g><g><rect data-type="rect" data-label="" data-x="-31.07506195" data-y="-32.273937" x="501.98989613248705" y="73.42179712976167" width="13.239480400172397" height="46.053429145488735" fill="#f1f5f9" stroke="#64748b" stroke-width="0.0075527057692308"/></g><g><rect data-type="rect" data-label="" data-x="-30.827475" data-y="-32.800012499999994" x="515.2293765326592" y="73.42179712975985" width="52.322970346591774" height="185.36125234792326" fill="#f1f5f9" stroke="#64748b" stroke-width="0.0075527057692308"/></g><g><rect data-type="rect" data-label="" data-x="-29.867443" data-y="-34.137502500000004" x="567.552346879251" y="126.37990409448366" width="201.89903414644732" height="433.6200959055159" fill="#f1f5f9" stroke="#64748b" stroke-width="0.0075527057692308"/></g><g><rect data-type="rect" data-label="" data-x="-29.939942500000004" data-y="-32.3000115" x="567.552346879251" y="73.42179712975985" width="182.7007488655986" height="52.95810696472381" fill="#f1f5f9" stroke="#64748b" stroke-width="0.0075527057692308"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="-31.250065" data-y="-32.61759740000001" x="379.5164239407843" y="78.39675592573121" width="211.8446089239019" height="127.10676535434231" fill="none" stroke="none" stroke-width="0.0075527057692308"/></g><circle data-type="circle" data-label="" data-x="-31.250065" data-y="-32.4477239" cx="485.43872840273525" cy="119.45839786912984" r="3.310072014435974" fill="#15803d" stroke="#15803d" stroke-width="0.0075527057692308"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":132.40288057743896,"c":0,"e":4623.03735263494,"b":0,"d":-132.40288057743896,"f":-4176.713714672283};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>