data-type="rect" data-label="GND plane (inner1)" data-x="0" data-y="0.5" x="40" y="255.34166666666667" width="920" height="38.333333333333314" fill="rgba(22,163,74,0.16)" stroke="#86b99b" stroke-width="0.013043478260869565"/></g><g><rect data-type="rect" data-label="GND plane (inner1)" data-x="0" data-y="1" x="40" y="217.00833333333327" width="920" height="38.33333333333334" fill="rgba(22,163,74,0.16)" stroke="#86b99b" stroke-width="0.013043478260869565"/></g><g><rect data-type="rect" data-label="GND plane (inner1)" data-x="0" data-y="1.5" x="40" y="178.67499999999995" width="920" height="38.33333333333334" fill="rgba(22,163,74,0.16)" stroke="#86b99b" stroke-width="0.013043478260869565"/></g><g><rect data-type="rect" data-label="GND plane (inner1)" data-x="0" data-y="2" x="40" y="140.34166666666664" width="920" height="38.333333333333314" fill="rgba(22,163,74,0.16)" stroke="#86b99b" stroke-width="0.013043478260869565"/></g><g><rect data-type="rect" data-label="Pad (top)" data-x="-3" data-y="-1.3" x="250.83333333333334" y="393.3416666666667" width="38.333333333333314" height="38.333333333333314" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.013043478260869565"/></g><g><rect data-type="rect" data-label="Pad (top)" data-x="3" data-y="1.3" x="710.8333333333333" y="194.00833333333327" width="38.33333333333337" height="38.33333333333334" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.013043478260869565"/></g><circle data-type="circle" data-label="" data-x="-3" data-y="-0.75" cx="270" cy="370.34166666666664" r="15.333333333333336" fill="#93c5fd" stroke="#1d4ed8" stroke-width="0.013043478260869565"/><circle data-type="circle" data-label="" data-x="3" data-y="0.75" cx="730" cy="255.34166666666664" r="15.333333333333336" fill="#93c5fd" stroke="#1d4ed8" stroke-width="0.013043478260869565"/><text data-type="text" data-label="3 routing requests" data-x="0" data-y="3.1" x="500" y="75.17499999999995" fill="black" font-size="26.833333333333332" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">3 routing requests</text><text data-type="text" data-label="Same pads, vias and touching GND strips. Blue lines = pending routes." data-x="0" data-y="-2.85" x="500" y="531.3416666666667" fill="black" font-size="13.8" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Same pads, vias and touching GND strips. Blue lines = pending routes.</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":76.66666666666667,"c":0,"e":500,"b":0,"d":-76.66666666666667,"f":312.84166666666664};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>