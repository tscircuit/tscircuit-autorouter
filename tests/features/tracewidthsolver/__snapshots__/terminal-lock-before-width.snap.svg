35802469" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="Width calculated from displaced endpoint" data-x="2.9000000000000004" data-y="0.4" cx="290.6172839506173" cy="325.1589135802469" r="3" fill="#dc2626"/></g><g><circle data-type="point" data-label="candidate-start" data-x="4.255" data-y="0.4" cx="407.716049382716" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="4.3549999999999995" data-y="0.4" cx="416.35802469135797" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="4.455" data-y="0.4" cx="425" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="4.555" data-y="0.4" cx="433.6419753086419" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="4.655" data-y="0.4" cx="442.28395061728395" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="4.755" data-y="0.4" cx="450.92592592592587" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="4.805" data-y="0.4" cx="455.2469135802469" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="4.855" data-y="0.4" cx="459.5679012345679" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="4.955" data-y="0.4" cx="468.2098765432099" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="Terminal locked before taper calculation" data-x="5.055" data-y="0.4" cx="476.8518518518518" cy="325.1589135802469" r="3" fill="#16803c"/></g><g><circle data-type="point" data-label="candidate-end" data-x="6.255" data-y="0.4" cx="580.5555555555555" cy="325.1589135802469" r="3" fill="#16803c"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":86.41975308641975,"c":0,"e":40,"b":0,"d":-86.41975308641975,"f":359.7268148148148};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>