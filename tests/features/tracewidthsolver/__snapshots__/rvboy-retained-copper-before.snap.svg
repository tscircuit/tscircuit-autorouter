e" stroke="red" stroke-linejoin="round" stroke-width="4.1917955260299555"/></g><g><polyline data-points="-30.49,20.53 -30.49,20.5221875 -30.49,20.478749999999998 -30.49,20.4353125 -30.49,20.391875 -30.49,20.3484375 -30.49,20.305" data-type="line" data-label="" points="526.0950015514966,152.96414143804733 526.0950015514966,153.02349129379613 526.0950015514966,153.35347649175952 526.0950015514966,153.68346168972286 526.0950015514966,154.01344688768623 526.0950015514966,154.3434320856496 526.0950015514966,154.67341728361296" fill="none" stroke="red" stroke-linejoin="round" stroke-width="3.418551691131225"/></g><g><rect data-type="rect" data-label="top" data-x="-30.49" data-y="21" x="524.0438705368178" y="146.96268402472808" width="4.102262029357462" height="4.861940182942192" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.1316346923076923"/></g><g><rect data-type="rect" data-label="top
