921792904544,252.85582423710002 547.2040700547059,239.12800919209258 550.7467475486865,224.98484784239736 552.8860938515045,210.56254656324927 553.6015058887788,196.00000000000182" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.228571428571431"/></g><g><rect data-type="rect" data-label="shortcut-viewport" data-x="-5.595" data-y="6.415" x="236.28571428571377" y="40" width="520" height="520" fill="none" stroke="none" stroke-width="0.0006730769230769224"/></g><circle data-type="circle" data-label="" data-x="-5.515000000000001" data-y="6.343577936655909" cx="615.1428571428551" cy="406.11277982550746" r="74.28571428571436" fill="#dc2626" stroke="black" stroke-width="0.0006730769230769224"/><circle data-type="circle" data-label="" data-x="-5.656422063344091" data-y="6.484999999999999" cx="405.0300773173494" cy="196.00000000000182" r="74.28571428571436" fill="#2563eb" stroke="black" stroke-width="0.0006730769230769224"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":1485.7142857142871,"c":0,"e":8808.85714285715,"b":0,"d":-1485.7142857142871,"f":9830.857142857152};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>