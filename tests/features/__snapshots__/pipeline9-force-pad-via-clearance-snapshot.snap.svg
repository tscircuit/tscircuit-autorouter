7,1.349999999999983 13.539999999999996,1.4138297872340253 13.539999999999996,1.4648936170212594 13.539999999999996,1.5159574468084933 13.59333333333333,1.5159574468084933 13.646666666666665,1.5159574468084933 13.699999999999998,1.5159574468084933 13.699999999999998,1.5670212765957274 13.753333333333332,1.5670212765957274 13.806666666666665,1.5670212765957274 13.806666666666665,1.5159574468084933 13.806666666666665,1.4648936170212594 13.86,1.4648936170212594 13.86,1.4138297872340253 13.91333333333333,1.4138297872340253 13.91333333333333,1.3627659574467912 13.940000000000001,1.3499999999999828" data-type="line" data-label="" points="166.50970132984276,281.54349247874745 166.50970132984185,254.07455853499312 166.50970132984185,232.09941137998953 166.50970132984185,210.12426422498595 189.46152169173547,210.12426422498595 212.41334205362818,210.12426422498595 235.3651624155209,210.12426422498595 235.3651624155209,188.14911706998237 258.3169827774136,188.14911706998237 281.2688031393063,188.14911706998237 281.2688031393063,210.12426422498595 281.2688031393063,232.09941137998953 304.22062350119904,232.09941137998953 304.22062350119904,254.07455853499312 327.17244386309085,254.07455853499312 327.17244386309085,276.0497056899967 338.6483540440395,281.54349247874757" fill="none" stroke="red" stroke-linejoin="round" stroke-width="43.03466317854865"/></g><g><rect data-type="rect" data-label="top" data-x="14.06" data-y="0.89" x="312.82755613691006" y="402.04054937867625" width="154.9247874427747" height="154.9247874427752" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0023237082066868988"/></g><g><rect data-type="rect" data-label="0.10mm required pad clearance" data-x="14.06" data-y="0.89" x="269.79289295836134" y="359.00588620012763" width="240.99411379987214" height="240.99411379987242" fill="rgba(239, 68, 68, 0.08)" stroke="#dc2626" stroke-width="0.0023237082066868988"/></g><circle data-type="circle" data-label="" data-x="13.59333333333333" data-y="1.7712765957446635" cx="189.46152169173547" cy="100.24852844996815" r="60.24852844996811" fill="blue" stroke="none" stroke-width="0.0023237082066868988"/><circle data-type="circle" data-label="" data-x="13.59333333333333" data-y="0.9542553191489188" cx="189.46152169173547" cy="451.8508829300252" r="60.24852844996811" fill="blue" stroke="none" stroke-width="0.0023237082066868988"/><circle data-type="circle" data-label="" data-x="13.59333333333333" data-y="1.0053191489361528" cx="189.46152169173547" cy="429.87573577502167" r="60.24852844996811" fill="blue" stroke="none" stroke-width="0.0023237082066868988"/><circle data-type="circle" data-label="" data-x="13.68" data-y="0.89" cx="226.7582297798117" cy="479.5029431000639" r="60.24852844996811" fill="rgba(217, 70, 239, 0.22)" stroke="#a21caf" stroke-width="0.0023237082066868988"/><circle data-type="circle" data-label="" data-x="13.59333333333333" data-y="1.0053191489361528" cx="189.46152169173547" cy="429.87573577502167" r="60.24852844996811" fill="rgba(22, 163, 74, 0.18)" stroke="#15803d" stroke-width="0.0023237082066868988"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":430.34663178548647,"c":0,"e":-5660.383693045643,"b":0,"d":-430.34663178548647,"f":862.5114453891468};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>