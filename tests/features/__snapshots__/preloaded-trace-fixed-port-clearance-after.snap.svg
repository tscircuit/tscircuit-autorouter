3867661" width="9.013979496738102" height="15.507921714818252" fill="none" stroke="none" stroke-width="0.10317307692307694"/></g><circle data-type="circle" data-label="" data-x="1.6927999999999994" data-y="4.767499999999998" cx="633.0072622553588" cy="184.6356011183598" r="0.48462255358807077" fill="#e2e8f0" stroke="#64748b" stroke-width="0.10317307692307694"/><circle data-type="circle" data-label="" data-x="1.6927999999999994" data-y="5.127499999999999" cx="633.0072622553588" cy="181.14631873252569" r="0.48462255358807077" fill="#e2e8f0" stroke="#64748b" stroke-width="0.10317307692307694"/><circle data-type="circle" data-label="" data-x="1.6927999999999994" data-y="5.487499999999999" cx="633.0072622553588" cy="177.65703634669157" r="0.48462255358807077" fill="#e2e8f0" stroke="#64748b" stroke-width="0.10317307692307694"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":9.692451071761415,"c":0,"e":616.5998810810811,"b":0,"d":-9.692451071761415,"f":230.84436160298233};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>