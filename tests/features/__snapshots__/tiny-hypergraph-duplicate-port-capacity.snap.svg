ll="none" stroke="#059669" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="1.3,0.09999999999999998 1.8,0.09999999999999998 2.3,0.09999999999999998" data-type="line" data-label="" points="269.82078853046596,332.5448028673835 320,332.5448028673835 370.17921146953404,332.5448028673835" fill="none" stroke="#059669" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="3.6,-0.6 3.6,0.6" data-type="line" data-label="" points="500.64516129032256,402.79569892473114 500.64516129032256,282.36559139784947" fill="none" stroke="#475569" stroke-linejoin="round" stroke-width="1.5053763440860215"/></g><g><polyline data-points="3.1,-0.5 3.6,-0.5 4.1,-0.5" data-type="line" data-label="" points="450.4659498207885,392.75985663082434 500.64516129032256,392.75985663082434 550.8243727598566,392.75985663082434" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="3.1,-0.35 3.6,-0.35 4.1,-0.35" data-type="line" data-label="" points="450.4659498207885,377.7060931899641 500.64516129032256,377.7060931899641 550.8243727598566,377.7060931899641" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="3.1,-0.2 3.6,-0.2 4.1,-0.2" data-type="line" data-label="" points="450.4659498207885,362.65232974910396 500.64516129032256,362.65232974910396 550.8243727598566,362.65232974910396" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="3.1,-0.050000000000000044 3.6,-0.050000000000000044 4.1,-0.050000000000000044" data-type="line" data-label="" points="450.4659498207885,347.59856630824373 500.64516129032256,347.59856630824373 550.8243727598566,347.59856630824373" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="3.1,0.09999999999999998 3.6,0.09999999999999998 4.1,0.09999999999999998" data-type="line" data-label="" points="450.4659498207885,332.5448028673835 500.64516129032256,332.5448028673835 550.8243727598566,332.5448028673835" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="3.1,0.25 3.6,0.25 4.1,0.25" data-type="line" data-label="" points="450.4659498207885,317.4910394265233 500.64516129032256,317.4910394265233 550.8243727598566,317.4910394265233" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="3.1,0.3999999999999999 3.6,0.3999999999999999 4.1,0.3999999999999999" data-type="line" data-label="" points="450.4659498207885,302.43727598566306 500.64516129032256,302.43727598566306 550.8243727598566,302.43727598566306" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><g><polyline data-points="3.1,0.55 3.6,0.55 4.1,0.55" data-type="line" data-label="" points="450.4659498207885,287.38351254480284 500.64516129032256,287.38351254480284 550.8243727598566,287.38351254480284" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.5089605734767026"/></g><text data-type="text" data-label="1 distinct nets / 5 nominal slots" data-x="0" data-y="1" x="139.3548387096774" y="242.2222222222222" fill="black" font-size="10.03584229390681" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 distinct nets / 5 nominal slots</text><text data-type="text" data-label="No overflow preference" data-x="0" data-y="0.8" x="139.3548387096774" y="262.2939068100358" fill="black" font-size="9.03225806451613" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">No overflow preference</text><text data-type="text" data-label="5 distinct nets / 5 nominal slots" data-x="1.8" data-y="1" x="320" y="242.2222222222222" fill="black" font-size="10.03584229390681" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">5 distinct nets / 5 nominal slots</text><text data-type="text" data-label="No overflow preference" data-x="1.8" data-y="0.8" x="320" y="262.2939068100358" fill="black" font-size="9.03225806451613" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">No overflow preference</text><text data-type="text" data-label="8 distinct nets / 5 nominal slots" data-x="3.6" data-y="1" x="500.64516129032256" y="242.2222222222222" fill="black" font-size="10.03584229390681" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">8 distinct nets / 5 nominal slots</text><text data-type="text" data-label="Prefer an available detour" data-x="3.6" data-y="0.8" x="500.64516129032256" y="262.2939068100358" fill="black" font-size="9.03225806451613" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Prefer an available detour</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":100.3584229390681,"c":0,"e":139.3548387096774,"b":0,"d":-100.3584229390681,"f":342.5806451612903};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>