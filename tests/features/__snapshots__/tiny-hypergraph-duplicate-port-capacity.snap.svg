6 498.18181818181813,304.52762923351156 548.0926916221033,304.52762923351156" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.4955436720142603"/></g><g><polyline data-points="3.1,0.42000000000000004 3.6,0.42000000000000004 4.1,0.42000000000000004" data-type="line" data-label="" points="448.27094474153296,300.53475935828874 498.18181818181813,300.53475935828874 548.0926916221033,300.53475935828874" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.4955436720142603"/></g><g><polyline data-points="3.1,0.45999999999999996 3.6,0.45999999999999996 4.1,0.45999999999999996" data-type="line" data-label="" points="448.27094474153296,296.5418894830659 498.18181818181813,296.5418894830659 548.0926916221033,296.5418894830659" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.4955436720142603"/></g><text data-type="text" data-label="1 distinct nets / 5 nominal slots" data-x="0" data-y="1" x="138.8235294117647" y="242.63814616755792" fill="black" font-size="9.982174688057041" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 distinct nets / 5 nominal slots</text><text data-type="text" data-label="No overflow preference" data-x="0" data-y="0.8" x="138.8235294117647" y="262.602495543672" fill="black" font-size="8.983957219251336" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">No overflow preference</text><text data-type="text" data-label="5 distinct nets / 5 nominal slots" data-x="1.8" data-y="1" x="318.50267379679144" y="242.63814616755792" fill="black" font-size="9.982174688057041" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">5 distinct nets / 5 nominal slots</text><text data-type="text" data-label="No overflow preference" data-x="1.8" data-y="0.8" x="318.50267379679144" y="262.602495543672" fill="black" font-size="8.983957219251336" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">No overflow preference</text><text data-type="text" data-label="25 distinct nets / 5 nominal slots" data-x="3.6" data-y="1" x="498.18181818181813" y="242.63814616755792" fill="black" font-size="9.982174688057041" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">25 distinct nets / 5 nominal slots</text><text data-type="text" data-label="Prefer an available detour" data-x="3.6" data-y="0.8" x="498.18181818181813" y="262.602495543672" fill="black" font-size="8.983957219251336" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Prefer an available detour</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":99.8217468805704,"c":0,"e":138.8235294117647,"b":0,"d":-99.8217468805704,"f":342.4598930481283};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>