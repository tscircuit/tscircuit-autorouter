l="" data-x="0" data-y="0.046875" cx="151.35842880523734" cy="340.9799509001637" r="5.728314238952539" fill="rgba(220,38,38,0.45)" stroke="black" stroke-width="0.008728571428571428"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0" cx="472.1440261865794" cy="346.3502454991817" r="5.728314238952539" fill="rgba(5,150,105,0.65)" stroke="black" stroke-width="0.008728571428571428"/><circle data-type="circle" data-label="" data-x="2.8" data-y="-0.5499999999999999" cx="472.1440261865794" cy="409.3617021276596" r="5.728314238952539" fill="rgba(5,150,105,0.65)" stroke="black" stroke-width="0.008728571428571428"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.25" cx="472.1440261865794" cy="317.708674304419" r="5.728314238952539" fill="rgba(5,150,105,0.65)" stroke="black" stroke-width="0.008728571428571428"/><circle data-type="circle" data-label="" data-x="2.8" data-y="-0.29999999999999993" cx="472.1440261865794" cy="380.72013093289695" r="5.728314238952539" fill="rgba(5,150,105,0.65)" stroke="black" stroke-width="0.008728571428571428"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.5" cx="472.1440261865794" cy="289.06710310965633" r="5.728314238952539" fill="rgba(5,150,105,0.65)" stroke="black" stroke-width="0.008728571428571428"/><text data-type="text" data-label="Before: 16 ports in 0.05 mm" data-x="0" data-y="1" x="151.35842880523734" y="231.78396072013095" fill="black" font-size="13.747954173486091" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Before: 16 ports in 0.05 mm</text><text data-type="text" data-label="After: 5 ports, &gt;=0.25 mm pitch" data-x="2.8" data-y="1" x="472.1440261865794" y="231.78396072013095" fill="black" font-size="13.747954173486091" font-family="sans-serif" text-anchor="middle" dominant-baseline="central"><![CDATA[After: 5 ports, >=0.25 mm pitch]]></text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":114.56628477905076,"c":0,"e":151.35842880523734,"b":0,"d":-114.56628477905076,"f":346.3502454991817};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>