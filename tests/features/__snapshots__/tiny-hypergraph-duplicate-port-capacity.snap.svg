ata-y="0.025" cx="442.50000000000006" cy="341.875" r="5.335365853658537" fill="rgba(217,119,6,0.25)" stroke="black" stroke-width="0.00937142857142857"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.028125" cx="442.50000000000006" cy="341.5415396341464" r="5.335365853658537" fill="rgba(217,119,6,0.25)" stroke="black" stroke-width="0.00937142857142857"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.03125" cx="442.50000000000006" cy="341.2080792682927" r="5.335365853658537" fill="rgba(217,119,6,0.25)" stroke="black" stroke-width="0.00937142857142857"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.034375" cx="442.50000000000006" cy="340.87461890243907" r="5.335365853658537" fill="rgba(217,119,6,0.25)" stroke="black" stroke-width="0.00937142857142857"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.037500000000000006" cx="442.50000000000006" cy="340.5411585365854" r="5.335365853658537" fill="rgba(217,119,6,0.25)" stroke="black" stroke-width="0.00937142857142857"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.040625" cx="442.50000000000006" cy="340.2076981707317" r="5.335365853658537" fill="rgba(217,119,6,0.25)" stroke="black" stroke-width="0.00937142857142857"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.043750000000000004" cx="442.50000000000006" cy="339.8742378048781" r="5.335365853658537" fill="rgba(217,119,6,0.25)" stroke="black" stroke-width="0.00937142857142857"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.046875" cx="442.50000000000006" cy="339.5407774390244" r="5.335365853658537" fill="rgba(217,119,6,0.25)" stroke="black" stroke-width="0.00937142857142857"/><text data-type="text" data-label="Before: 16 ports in 0.05 mm" data-x="0" data-y="1" x="143.71951219512198" y="237.83536585365854" fill="black" font-size="12.80487804878049" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Before: 16 ports in 0.05 mm</text><text data-type="text" data-label="After: 5 spaced + 11 costly virtual slots" data-x="2.8" data-y="1" x="442.50000000000006" y="237.83536585365854" fill="black" font-size="12.80487804878049" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">After: 5 spaced + 11 costly virtual slots</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":106.70731707317074,"c":0,"e":143.71951219512198,"b":0,"d":-106.70731707317074,"f":344.5426829268293};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>