<svg width="1132" height="496" viewBox="0 0 1132 496" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(0, 0) scale(1, 1) translate(0, 0)">
    <rect width="100%" height="100%" fill="white"/><text x="16" y="22" font-family="monospace" font-size="15" font-weight="700" fill="#111">BEFORE • UNSIMPLIFIED EDITABLE ROUTE</text><text x="16" y="43" font-family="monospace" font-size="12" fill="#444">9 orange points are eligible for simplification.</text><text x="16" y="61" font-family="monospace" font-size="12" fill="#444">Gray dashed copper is pre-routed and read-only.</text><g transform="translate(0 76)"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-2,0 -1.5,0.2" data-type="line" data-label="" points="46.423357664233606,277.15328467153284 104.81751824817519,253.7956204379562" fill="none" stroke="#d97706" stroke-width="14.014598540145982"/></g><g><polyline data-points="-1.5,0.2 -1.2,1.2" data-type="line" data-label="" points="104.81751824817519,253.7956204379562 139.85401459854018,137.00729927007302" fill="none" stroke="#d97706" stroke-width="14.014598540145982"/></g><g><polyline data-points="-1.2,1.2 -0.6,1.6" data-type="line" data-label="" points="139.85401459854018,137.00729927007302 209.9270072992701,90.2919708029197" fill="none" stroke="#d97706" stroke-width="14.014598540145982"/></g><g><polyline data-points="-0.6,1.6 0,1.8" data-type="line" data-label="" points="209.9270072992701,90.2919708029197 280,66.93430656934308" fill="none" stroke="#d97706" stroke-width="14.014598540145982"/></g><g><polyline data-points="0,1.8 0.6,1.6" data-type="line" data-label="" points="280,66.93430656934308 350.0729927007299,90.2919708029197" fill="none" stroke="#d97706" stroke-width="14.014598540145982"/></g><g><polyline data-points="0.6,1.6 1.2,1.2" data-type="line" data-label="" points="350.0729927007299,90.2919708029197 420.1459854014598,137.00729927007302" fill="none" stroke="#d97706" stroke-width="14.014598540145982"/></g><g><polyline data-points="1.2,1.2 1.5,0.2" data-type="line" data-label="" points="420.1459854014598,137.00729927007302 455.1824817518248,253.7956204379562" fill="none" stroke="#d97706" stroke-width="14.014598540145982"/></g><g><polyline data-points="1.5,0.2 2,0" data-type="line" data-label="" points="455.1824817518248,253.7956204379562 513.5766423357663,277.15328467153284" fill="none" stroke="#d97706" stroke-width="14.014598540145982"/></g><g><polyline data-points="0,-0.65 0,0.65" data-type="line" data-label="" points="280,353.0656934306569 280,201.24087591240877" fill="none" stroke="#3f3f46" stroke-width="18.686131386861312" stroke-dasharray="0.06 0.06"/></g><circle data-type="circle" data-label="" data-x="-2" data-y="0" cx="46.423357664233606" cy="277.15328467153284" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="0.2" cx="104.81751824817519" cy="253.7956204379562" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="-1.2" data-y="1.2" cx="139.85401459854018" cy="137.00729927007302" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="-0.6" data-y="1.6" cx="209.9270072992701" cy="90.2919708029197" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="0" data-y="1.8" cx="280" cy="66.93430656934308" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="0.6" data-y="1.6" cx="350.0729927007299" cy="90.2919708029197" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="1.2" data-y="1.2" cx="420.1459854014598" cy="137.00729927007302" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="1.5" data-y="0.2" cx="455.1824817518248" cy="253.7956204379562" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="2" data-y="0" cx="513.5766423357663" cy="277.15328467153284" r="6.423357664233576" fill="#ffedd5" stroke="#d97706" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="0" data-y="-0.65" cx="280" cy="353.0656934306569" r="6.423357664233576" fill="#d4d4d8" stroke="#3f3f46" stroke-width="0.0085625"/><circle data-type="circle" data-label="" data-x="0" data-y="0.65" cx="280" cy="201.24087591240877" r="6.423357664233576" fill="#d4d4d8" stroke="#3f3f46" stroke-width="0.0085625"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="420" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="560" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '560');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '420');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":116.7883211678832,"c":0,"e":280,"b":0,"d":-116.7883211678832,"f":277.15328467153284};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></g>
  </g>
