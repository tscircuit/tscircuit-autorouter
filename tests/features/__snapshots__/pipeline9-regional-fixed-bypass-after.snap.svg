<svg width="1000" height="680" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-family="sans-serif" font-size="22">RVboy: preserve the short bypass</text><text x="24" y="59" font-family="sans-serif" font-size="16">After: signals change layers; bypass copper stays unchanged</text><svg x="0" y="80" width="1000" height="600" viewBox="270.0000000000001 40 459.9999999999998 520" overflow="hidden" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="7.02,14.825001 6.89375,14.89875 6.80625,15.01125 6.65625,15.37375" data-type="line" data-label="" points="534,234.9997999999996 508.75,220.25 491.2500000000002,197.75 461.2500000000002,125.25" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><polyline data-points="6.65625,15.37375 6.70625,14.19875" data-type="line" data-label="" points="461.2500000000002,125.25 471.25,360.24999999999955" fill="none" stroke="rgba(255,255,0,0.5)" stroke-linejoin="round" stroke-width="19.99999999999999" stroke-dasharray="0.2 0.2"/></g><g><polyline data-points="6.70625,14.19875 7.02,14.085333333333333" data-type="line" data-label="" points="471.25,360.24999999999955 534,382.9333333333334" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><polyline data-points="7.02,15.0625 7.13125,15.06125 7.16875,15.17375" data-type="line" data-label="" points="534,187.5 556.25,187.75 563.7500000000002,165.25" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><polyline data-points="7.16875,15.17375 7.04375,13.69875" data-type="line" data-label="" points="563.7500000000002,165.25 538.7500000000002,460.24999999999955" fill="none" stroke="rgba(0,0,255,0.5)" stroke-linejoin="round" stroke-width="19.99999999999999" stroke-dasharray="0.2 0.2"/></g><g><polyline data-points="7.04375,13.69875 7.02,13.544" data-type="line" data-label="" points="538.7500000000002,460.24999999999955 534,491.1999999999998" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><polyline data-points="6,14.625 7.69,14.625" data-type="line" data-label="" points="330.0000000000002,275 668,275" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="6.85" data-y="14.5" x="270.0000000000001" y="40" width="459.9999999999998" height="520" fill="none" stroke="none" stroke-width="0.005000000000000003"/></g><circle data-type="circle" data-label="" data-x="6.65625" data-y="15.37375" cx="461.2500000000002" cy="125.25" r="44.99999999999998" fill="blue" stroke="none" stroke-width="0.005000000000000003"/><circle data-type="circle" data-label="" data-x="6.70625" data-y="14.19875" cx="471.25" cy="360.24999999999955" r="44.99999999999998" fill="blue" stroke="none" stroke-width="0.005000000000000003"/><circle data-type="circle" data-label="" data-x="7.16875" data-y="15.17375" cx="563.7500000000002" cy="165.25" r="44.99999999999998" fill="blue" stroke="none" stroke-width="0.005000000000000003"/><circle data-type="circle" data-label="" data-x="7.04375" data-y="13.69875" cx="538.7500000000002" cy="460.24999999999955" r="44.99999999999998" fill="blue" stroke="none" stroke-width="0.005000000000000003"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":199.9999999999999,"c":0,"e":-869.9999999999991,"b":0,"d":-199.9999999999999,"f":3199.999999999998};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>
