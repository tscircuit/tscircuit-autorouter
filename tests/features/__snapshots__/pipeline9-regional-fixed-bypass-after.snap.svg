<svg width="1000" height="680" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-family="sans-serif" font-size="22">RVboy: preserve the short bypass</text><text x="24" y="59" font-family="sans-serif" font-size="16">After: signals change layers; bypass copper stays unchanged</text><svg x="0" y="80" width="1000" height="600" viewBox="247.5000000000001 40 459.9999999999998 520" overflow="hidden" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="7.02,14.825 6.925,14.873333333333335 6.7749999999999995,15.023333333333333 6.675,15.223333333333334" data-type="line" data-label="" points="511.5,235 492.5,225.33333333333303 462.5,195.33333333333303 442.5000000000002,155.33333333333303" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><polyline data-points="6.675,15.223333333333334 7.0249999999999995,14.223333333333334" data-type="line" data-label="" points="442.5000000000002,155.33333333333303 512.5,355.33333333333303" fill="none" stroke="rgba(255,255,0,0.5)" stroke-linejoin="round" stroke-width="19.99999999999999" stroke-dasharray="0.2 0.2"/></g><g><polyline data-points="7.0249999999999995,14.223333333333334 7.02,14.085" data-type="line" data-label="" points="512.5,355.33333333333303 511.5,382.99999999999955" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><polyline data-points="7.02,15.063 7.175,15.073333333333334 7.225,15.073333333333334 7.2749999999999995,15.073333333333334 7.324999999999999,15.073333333333334 7.375,15.123333333333335 7.425,15.173333333333334 7.475,15.223333333333334 7.525,15.273333333333333 7.574999999999999,15.323333333333334 7.625,15.323333333333334 7.675,15.323333333333334 7.725,15.323333333333334 7.775,15.323333333333334 7.824999999999999,15.323333333333334 7.875,15.323333333333334 8.125,15.273333333333333 8.175,15.223333333333334 8.225,15.173333333333334 8.225,15.123333333333335 8.225,15.073333333333334 8.225,15.023333333333333 8.225,14.173333333333334 8.225,14.123333333333335 8.175,14.073333333333334 8.125,14.023333333333333 8.075,13.973333333333334 8.025,13.923333333333334 7.975,13.873333333333335 7.925,13.823333333333334 7.875,13.773333333333333 7.824999999999999,13.723333333333334 7.775,13.673333333333334 7.725,13.623333333333335 7.675,13.573333333333334 7.625,13.523333333333333 7.574999999999999,13.473333333333334 7.525,13.473333333333334 7.475,13.473333333333334 7.425,13.473333333333334 7.324999999999999,13.523333333333333 7.2749999999999995,13.523333333333333 7.225,13.523333333333333 7.175,13.523333333333333 7.125,13.523333333333333 7.02,13.544" data-type="line" data-label="" points="511.5,187.39999999999964 542.5,185.33333333333303 552.5,185.33333333333303 562.5,185.33333333333303 572.5,185.33333333333303 582.5,175.33333333333303 592.5,165.33333333333303 602.5,155.33333333333303 612.5000000000002,145.33333333333303 622.5,135.33333333333303 632.5,135.33333333333303 642.5,135.33333333333303 652.5,135.33333333333303 662.5,135.33333333333303 672.4999999999998,135.33333333333303 682.5,135.33333333333303 732.5,145.33333333333303 742.5000000000002,155.33333333333303 752.5,165.33333333333303 752.5,175.33333333333303 752.5,185.33333333333303 752.5,195.33333333333303 752.5,365.33333333333303 752.5,375.33333333333303 742.5000000000002,385.33333333333303 732.5,395.33333333333303 722.4999999999998,405.33333333333303 712.5,415.33333333333303 702.5,425.3333333333326 692.5,435.33333333333303 682.5,445.33333333333303 672.4999999999998,455.33333333333303 662.5,465.33333333333303 652.5,475.3333333333326 642.5,485.33333333333303 632.5,495.33333333333303 622.5,505.33333333333303 612.5000000000002,505.33333333333303 602.5,505.33333333333303 592.5,505.33333333333303 572.5,495.33333333333303 562.5,495.33333333333303 552.5,495.33333333333303 542.5,495.33333333333303 532.5,495.33333333333303 511.5,491.1999999999998" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><polyline data-points="6,14.625 7.69,14.625" data-type="line" data-label="" points="307.5000000000002,275 645.5,275" fill="none" stroke="red" stroke-linejoin="round" stroke-width="19.99999999999999"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="6.85" data-y="14.5" x="247.5000000000001" y="40" width="459.9999999999998" height="520" fill="none" stroke="none" stroke-width="0.005000000000000003"/></g><circle data-type="circle" data-label="" data-x="6.675" data-y="15.223333333333334" cx="442.5000000000002" cy="155.33333333333303" r="44.99999999999998" fill="blue" stroke="none" stroke-width="0.005000000000000003"/><circle data-type="circle" data-label="" data-x="7.0249999999999995" data-y="14.223333333333334" cx="512.5" cy="355.33333333333303" r="44.99999999999998" fill="blue" stroke="none" stroke-width="0.005000000000000003"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":199.9999999999999,"c":0,"e":-892.4999999999991,"b":0,"d":-199.9999999999999,"f":3199.999999999998};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>