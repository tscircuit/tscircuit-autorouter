<svg width="1000" height="680" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-family="sans-serif" font-size="22">RVboy: A-button signal beside a retained through-via</text><text x="24" y="59" font-family="sans-serif" font-size="16">After: 100.0 µm copper gap; 100 µm required</text><svg x="0" y="80" width="1000" height="600" viewBox="141.62162162162122 40 716.7567567567576 520" overflow="hidden" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-21.975,20.168694268210984 -21.975,20.206256500000002" data-type="line" data-label="" points="247.02702702702663,329.8805300163722 247.02702702702663,319.32249729729665" fill="none" stroke="#0284c7" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.975,20.206256500000002 -21.768689000000002,20.206256500000002" data-type="line" data-label="" points="247.02702702702663,319.32249729729665 305.01714594594523,319.32249729729665" fill="none" stroke="#0284c7" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.768689000000002,20.206256500000002 -20.049897100000003,19.74625" data-type="line" data-label="" points="305.01714594594523,319.32249729729665 788.1370313513517,448.62162162162167" fill="none" stroke="#0284c7" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.975,20.81 -21.975,20.8" data-type="line" data-label="" points="247.02702702702663,149.62162162162167 247.02702702702663,152.4324324324316" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.975,20.8 -21.792,20.799" data-type="line" data-label="" points="247.02702702702663,152.4324324324316 298.46486486486447,152.71351351351313" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.792,20.799 -21.598,20.797" data-type="line" data-label="" points="298.46486486486447,152.71351351351313 352.9945945945947,153.2756756756753" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.598,20.797 -21.4,20.794" data-type="line" data-label="" points="352.9945945945947,153.2756756756753 408.6486486486492,154.1189189189181" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.4,20.794 -21.201,20.786" data-type="line" data-label="" points="408.6486486486492,154.1189189189181 464.5837837837835,156.36756756756677" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.201,20.786 -21.005,20.77" data-type="line" data-label="" points="464.5837837837835,156.36756756756677 519.6756756756768,160.8648648648641" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-21.005,20.77 -20.812,20.741" data-type="line" data-label="" points="519.6756756756768,160.8648648648641 573.9243243243245,169.01621621621598" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-20.812,20.741 -20.62,20.684" data-type="line" data-label="" points="573.9243243243245,169.01621621621598 627.8918918918926,185.0378378378373" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-20.62,20.684 -20.413,20.556" data-type="line" data-label="" points="627.8918918918926,185.0378378378373 686.0756756756764,221.01621621621598" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-20.413,20.556 -20.2,20.4" data-type="line" data-label="" points="686.0756756756764,221.01621621621598 745.9459459459476,264.864864864865" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><polyline data-points="-20.2,20.4 -20.049897100000003,20.23875" data-type="line" data-label="" points="745.9459459459476,264.864864864865 788.1370313513517,310.18918918918916" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="28.108108108108198"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="-21.075000000000003" data-y="20.275" x="141.62162162162122" y="40" width="716.7567567567576" height="520" fill="none" stroke="none" stroke-width="0.003557692307692297"/></g><circle data-type="circle" data-label="" data-x="-21.825" data-y="19.825" cx="289.18918918918916" cy="426.4864864864867" r="63.24324324324344" fill="#fb923c" stroke="black" stroke-width="0.003557692307692297"/><circle data-type="circle" data-label="" data-x="-21.825" data-y="19.825" cx="289.18918918918916" cy="426.4864864864867" r="28.108108108108198" fill="white" stroke="black" stroke-width="0.003557692307692297"/><circle data-type="circle" data-label="" data-x="-21.975" data-y="20.168694268210984" cx="247.02702702702663" cy="329.8805300163722" r="14.054054054054099" fill="#0369a1" stroke="black" stroke-width="0.003557692307692297"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":281.08108108108195,"c":0,"e":6423.783783783802,"b":0,"d":-281.08108108108195,"f":5998.9189189189365};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>
