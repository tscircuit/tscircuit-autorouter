bottom" data-x="-31.250065" data-y="-32.8225968" x="489.4428850371278" y="69.33542042147928" width="135.2599592370425" height="135.2599592370425" fill="rgba(255,0,0,0.9375)" stroke="black" stroke-width="0.003326926923076921"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="-31.5" data-y="-33.25" x="256.5147150118901" y="40.00000000000091" width="450.8665307901392" height="450.8665307901374" fill="none" stroke="none" stroke-width="0.003326926923076921"/></g><circle data-type="circle" data-label="" data-x="-31.728134020381983" data-y="-33.480262114451065" cx="413.3759841904048" cy="334.6449192050386" r="67.62997961852072" fill="blue" stroke="none" stroke-width="0.003326926923076921"/><circle data-type="circle" data-label="" data-x="-31.701" data-y="-33.274" cx="421.531865281082" cy="272.64712988771134" r="67.62997961852072" fill="blue" stroke="none" stroke-width="0.003326926923076921"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":300.5776871934254,"c":0,"e":9950.14512699986,"b":0,"d":-300.5776871934254,"f":-9728.774833786325};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>