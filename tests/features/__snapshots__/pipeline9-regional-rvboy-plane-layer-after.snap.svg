3,105.9259259259261 559.9382716049383,105.43209876543187 559.9382716049383,105.9259259259261 559.567901234568,105.9259259259261 560.1851851851852,105.43209876543187 560.6790123456791,105.06172839506189 560.4320987654321,104.44444444444434 560.8024691358025,104.69135802469145 560.3086419753088,104.81481481481478 560.6790123456791,104.44444444444434 560.5555555555557,104.44444444444434 560.4320987654321,104.44444444444434 560.5555555555557,104.19753086419769 560.925925925926,103.5802469135806 561.1728395061729,103.08641975308637 561.5432098765433,102.3456790123455 561.9135802469136,101.4814814814813 562.4074074074074,100.61728395061755 562.6543209876544,99.75308641975289 562.9012345679013,99.25925925925958 563.7654320987655,99.01234567901201 564.7530864197531,98.64197530864158 565.8641975308643,98.14814814814827 567.643603212967,96.4950939361297 575.8641975308642,91.7283950617284 576.3888888888889,89.38271604938245" fill="none" stroke="rgba(0,0,255,0.5)" stroke-linejoin="round" stroke-width="12.345679012345691" stroke-dasharray="0.2 0.2"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="6.672499999999999" data-y="16.062" x="462.6543209876541" y="40" width="184.56790123456824" height="520" fill="none" stroke="none" stroke-width="0.008099999999999993"/></g><circle data-type="circle" data-label="" data-x="5.385" data-y="14.385000000000002" cx="395.98765432098753" cy="507.0370370370372" r="27.777777777777803" fill="blue" stroke="none" stroke-width="0.008099999999999993"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":123.4567901234569,"c":0,"e":-268.8271604938278,"b":0,"d":-123.4567901234569,"f":2282.962962962965};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>
