03011343,191.10779776037998 551.2921211152128,120.08580782499257 540.9876543209876,121.11111111111131 539.3827160493827,118.02469135802448 541.3580246913581,118.76543209876536 540.1234567901234,115.30864197530855 546.9135802469136,114.56790123456813 543.9506172839506,112.71604938271594 555.9573206024547,106.26575830988577 555.7199932386842,107.00238675929313 555.925925925926,105.9259259259261 555.925925925926,105.43209876543187 555.925925925926,105.9259259259261 555.5555555555557,105.9259259259261 556.0493827160495,105.30864197530855 556.5432098765433,104.93827160493856 556.4197530864197,104.44444444444434 556.7901234567902,104.69135802469145 556.2962962962964,104.81481481481478 556.6666666666667,104.44444444444434 556.5432098765433,104.44444444444434 556.4197530864197,104.44444444444434 556.5432098765433,104.19753086419769 556.9135802469136,103.5802469135806 557.1604938271605,103.08641975308637 557.530864197531,102.3456790123455 557.9012345679013,101.4814814814813 558.395061728395,100.61728395061755 558.641975308642,99.75308641975289 558.8888888888889,99.25925925925958 559.7530864197531,99.01234567901201 560.7407407407408,98.64197530864158 561.8388079914197,98.13451229782322 563.6034505991664,96.4548666880105 571.8518518518518,91.7283950617284 572.3765432098766,89.38271604938245" fill="none" stroke="rgba(0,0,255,0.5)" stroke-linejoin="round" stroke-width="12.345679012345691" stroke-dasharray="0.2 0.2"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="6.672499999999999" data-y="16.062" x="458.64197530864175" y="40" width="184.56790123456824" height="520" fill="none" stroke="none" stroke-width="0.008099999999999993"/></g><circle data-type="circle" data-label="" data-x="5.375" data-y="14.384999999999998" cx="390.74074074074065" cy="507.03703703703763" r="27.777777777777803" fill="blue" stroke="none" stroke-width="0.008099999999999993"/><circle data-type="circle" data-label="" data-x="5.325" data-y="15.634999999999998" cx="384.5679012345678" cy="352.7160493827166" r="27.777777777777803" fill="blue" stroke="none" stroke-width="0.008099999999999993"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":123.4567901234569,"c":0,"e":-272.8395061728402,"b":0,"d":-123.4567901234569,"f":2282.962962962965};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>