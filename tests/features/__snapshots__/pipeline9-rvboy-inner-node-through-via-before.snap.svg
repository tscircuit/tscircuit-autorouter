bottom" data-x="0" data-y="8.125" x="485.1898734177215" y="510.632911392405" width="29.62025316455697" height="29.620253164556857" fill="rgba(255,0,0,0.9375)" stroke="black" stroke-width="0.01519230769230769"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="0.7499999999999999" data-y="9.8" x="447.3417721518988" y="270.3797468354429" width="204.05063291139237" height="289.62025316455697" fill="none" stroke="none" stroke-width="0.01519230769230769"/></g><circle data-type="circle" data-label="" data-x="1.2813072941046715" data-y="10.77976738105889" cx="584.3392142954974" cy="350.69885593030074" r="14.810126582278484" fill="blue" stroke="none" stroke-width="0.01519230769230769"/><circle data-type="circle" data-label="" data-x="0.3907686054247952" data-y="10.990874837459094" cx="525.7214778254296" cy="336.803175255857" r="14.810126582278484" fill="blue" stroke="none" stroke-width="0.01519230769230769"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":65.82278481012659,"c":0,"e":500,"b":0,"d":-65.82278481012659,"f":1060.253164556962};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>