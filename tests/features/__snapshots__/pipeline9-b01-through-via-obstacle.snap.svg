 x="106.77890011223344" y="190.02567973643244" fill="rgb(190,92,12)" font-size="12.671518047862135" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:1</text><text data-type="text" data-label=" layer:all" data-x="1.7575757575757576" data-y="4.2296" x="153.91694725028057" y="190.02567973643244" fill="rgb(120,58,175)" font-size="12.671518047862135" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Through via: routed on bottom:end" data-x="4.64" data-y="4.448563831867057" x="340.7407407407407" y="175.83357952282682" fill="rgb(18,18,18)" font-size="12.671518047862135" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Through via: routed on bottom:end</text><text data-type="text" data-label="step:41" data-x="5.609696969696969" data-y="4.2296" x="403.5914702581369" y="190.02567973643244" fill="rgb(190,92,12)" font-size="12.671518047862135" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:41</text><text data-type="text" data-label=" layer:all" data-x="6.458181818181818" data-y="4.2296" x="458.58585858585855" y="190.02567973643244" fill="rgb(120,58,175)" font-size="12.671518047862135" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="bottom-trace" data-x="0" data-y="2" cx="40" cy="334.5367908475435" r="3" fill="green"/></g><g><circle data-type="point" data-label="bottom-trace" data-x="4" data-y="2" cx="299.25925925925924" cy="334.5367908475435" r="3" fill="green"/></g><g><circle data-type="point" data-label="bottom-trace" data-x="4.64" data-y="2" cx="340.7407407407407" cy="334.5367908475435" r="3" fill="green"/></g><g><circle data-type="point" data-label="bottom-trace" data-x="8.64" data-y="2" cx="600" cy="334.5367908475435" r="3" fill="green"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":64.81481481481481,"c":0,"e":40,"b":0,"d":-64.81481481481481,"f":464.1664204771731};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>