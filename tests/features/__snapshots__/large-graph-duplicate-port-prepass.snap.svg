2455981182795697"/><circle data-type="circle" data-label="" data-x="16.34" data-y="5.1784375" cx="305.4430926110765" cy="257.03930507971614" r="4.014135800803907" fill="rgba(52, 152, 219, 0.55)" stroke="black" stroke-width="0.012455981182795697"/><circle data-type="circle" data-label="" data-x="16.345" data-y="5.1834375" cx="305.8445061911568" cy="256.6378914996357" r="4.014135800803907" fill="rgba(52, 152, 219, 0.55)" stroke="black" stroke-width="0.012455981182795697"/><circle data-type="circle" data-label="" data-x="16.349999999999998" data-y="5.188437500000001" cx="306.24591977123714" cy="256.2364779195553" r="4.014135800803907" fill="rgba(52, 152, 219, 0.55)" stroke="black" stroke-width="0.012455981182795697"/><circle data-type="circle" data-label="" data-x="16.5825" data-y="5.163437500000001" cx="324.9116512449755" cy="258.24354581995726" r="4.014135800803907" fill="rgba(128, 128, 128, 0.5)" stroke="black" stroke-width="0.012455981182795697"/><circle data-type="circle" data-label="" data-x="16.5875" data-y="5.1684375000000005" cx="325.3130648250558" cy="257.8421322398769" r="4.014135800803907" fill="rgba(52, 152, 219, 0.55)" stroke="black" stroke-width="0.012455981182795697"/><circle data-type="circle" data-label="" data-x="16.5925" data-y="5.1734375" cx="325.71447840513633" cy="257.4407186597965" r="4.014135800803907" fill="rgba(52, 152, 219, 0.55)" stroke="black" stroke-width="0.012455981182795697"/><circle data-type="circle" data-label="" data-x="16.5975" data-y="5.1784375" cx="326.11589198521665" cy="257.03930507971614" r="4.014135800803907" fill="rgba(52, 152, 219, 0.55)" stroke="black" stroke-width="0.012455981182795697"/><circle data-type="circle" data-label="" data-x="16.6025" data-y="5.1834375" cx="326.51730556529697" cy="256.6378914996357" r="4.014135800803907" fill="rgba(52, 152, 219, 0.55)" stroke="black" stroke-width="0.012455981182795697"/><circle data-type="circle" data-label="" data-x="16.607499999999998" data-y="5.188437500000001" cx="326.9187191453773" cy="256.2364779195553" r="4.014135800803907" fill="rgba(52, 152, 219, 0.55)" stroke="black" stroke-width="0.012455981182795697"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="700" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '700');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":80.28271601607814,"c":0,"e":-1006.3764870916402,"b":0,"d":-80.28271601607814,"f":672.7783322992258};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>