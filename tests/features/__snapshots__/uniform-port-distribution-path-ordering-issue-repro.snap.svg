"#fff822c9" stroke-width="1px"/></g><g><polyline data-points="8,-4 12,0" data-type="line" data-label="" points="460,320 600,180" fill="none" stroke="#fff822c9" stroke-width="1px"/></g><g><polyline data-points="8,-4 8,-12" data-type="line" data-label="" points="460,320 460,600" fill="none" stroke="#fff822c9" stroke-width="1px"/></g><g><polyline data-points="8,-12 8,-4" data-type="line" data-label="" points="460,600 460,320" fill="none" stroke="#fff822c9" stroke-width="1px"/></g><g><polyline data-points="4,-4 12,-4" data-type="line" data-label="" points="320,320 600,320" fill="none" stroke="red" stroke-width="1.05"/></g><g><polyline data-points="4,-4 4,4" data-type="line" data-label="" points="320,320 320,40" fill="none" stroke="#33b5ff80" stroke-width="0.21"/></g><g><polyline data-points="4,-4 12,-4" data-type="line" data-label="" points="320,320 600,320" fill="none" stroke="#33b5ff80" stroke-width="0.21"/></g><g><rect data-type="rect" data-label="node_a" data-x="0" data-y="0" x="40" y="40" width="280" height="280" fill="#00000030" stroke="black" stroke-width="0.02857142857142857"/></g><g><rect data-type="rect" data-label="node_b" data-x="8" data-y="0" x="320" y="40" width="280" height="280" fill="#00000030" stroke="black" stroke-width="0.02857142857142857"/></g><g><rect data-type="rect" data-label="node_c" data-x="8" data-y="-8" x="320" y="320" width="280" height="280" fill="#00000030" stroke="black" stroke-width="0.02857142857142857"/></g><g><circle data-type="point" data-label="z:0
o:node_a&amp;node_a" data-x="-4" data-y="0" cx="40" cy="180" r="3" fill="black"/></g><g><circle data-type="point" data-label="z:0
o:node_a&amp;node_b" data-x="4" data-y="0" cx="320" cy="180" r="3" fill="black"/></g><g><circle data-type="point" data-label="z:0
o:node_a&amp;node_b" data-x="4" data-y="0" cx="320" cy="180" r="3" fill="black"/></g><g><circle data-type="point" data-label="z:0
o:node_b&amp;node_b" data-x="8" data-y="4" cx="460" cy="40" r="3" fill="black"/></g><g><circle data-type="point" data-label="z:0
o:node_b&amp;node_b" data-x="12" data-y="0" cx="600" cy="180" r="3" fill="black"/></g><g><circle data-type="point" data-label="z:0
o:node_b&amp;node_c" data-x="8" data-y="-4" cx="460" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="z:0
o:node_b&amp;node_c" data-x="8" data-y="-4" cx="460" cy="320" r="3" fill="black"/></g><g><circle data-type="point" data-label="z:0
o:node_c&amp;node_c" data-x="8" data-y="-12" cx="460" cy="600" r="3" fill="black"/></g><g><circle data-type="point" data-label="node_b|node_c" data-x="8" data-y="-4" cx="460" cy="320" r="3" fill="black"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":35,"c":0,"e":180,"b":0,"d":-35,"f":180};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>