cx="83.01204819277109" cy="321.51038072289157" r="0.7590361445783133" fill="none" stroke="red" stroke-width="0.11857142857142856"/><text data-type="text" data-label="Required 0.18mm cannot fit the 0.34mm corridor:frame" data-x="6.827584" data-y="2.758176" x="97.58203373493976" y="308.3691373493976" fill="rgb(18,18,18)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Required 0.18mm cannot fit the 0.34mm corridor:frame</text><text data-type="text" data-label="step:unknown" data-x="8.657824" data-y="2.53776" x="113.01779277108433" y="310.22806746987953" fill="rgb(190,92,12)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="10.122016" data-y="2.53776" x="125.3664" y="310.22806746987953" fill="rgb(120,58,175)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Nominal 0.50mm narrows to required 0.18mm:frame" data-x="30.332624000000003" data-y="2.758176" x="295.81731084337355" y="308.3691373493976" fill="rgb(18,18,18)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Nominal 0.50mm narrows to required 0.18mm:frame</text><text data-type="text" data-label="step:unknown" data-x="31.857824000000004" data-y="2.53776" x="308.68044337349403" y="310.22806746987953" fill="rgb(190,92,12)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="33.322016000000005" data-y="2.53776" x="321.02905060240965" y="310.22806746987953" fill="rgb(120,58,175)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Legacy nominal 0.05mm remains preferred:frame" data-x="53.65464" data-y="2.758176" x="492.5090120481928" y="308.3691373493976" fill="rgb(18,18,18)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Legacy nominal 0.05mm remains preferred:frame</text><text data-type="text" data-label="step:unknown" data-x="55.057824" data-y="2.53776" x="504.34309397590357" y="310.22806746987953" fill="rgb(190,92,12)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:unknown</text><text data-type="text" data-label=" layer:all" data-x="56.522015999999994" data-y="2.53776" x="516.6917012048193" y="310.22806746987953" fill="rgb(120,58,175)" font-size="1.6597590361445784" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="Cursor" data-x="5.1" data-y="1.2" cx="83.01204819277109" cy="321.51038072289157" r="3" fill="orange"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":8.433734939759036,"c":0,"e":40,"b":0,"d":-8.433734939759036,"f":331.6308626506024};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>