<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 0,0" data-type="line" data-label="conn1 (z=0)" points="40,464.20000000000005 40,464.20000000000005" fill="none" stroke="red" stroke-width="5.6000000000000005"/></g><g><polyline data-points="0,0 0.17677543261497533,0.17677543261497533" data-type="line" data-label="conn1 (z=0)" points="40,464.20000000000005 44.949712113219306,459.2502878867807" fill="none" stroke="red" stroke-width="5.6000000000000005"/></g><g><polyline data-points="0.17677543261497533,0.17677543261497533 0.17677543261497597,0.17677543261497533" data-type="line" data-label="conn1 (z=0)" points="44.949712113219306,459.2502878867807 44.94971211321933,459.2502878867807" fill="none" stroke="red" stroke-width="5.6000000000000005"/></g><g><polyline data-points="0.17677543261497597,0.17677543261497533 9.899424226438619,9.899424226438619" data-type="line" data-label="conn1 (z=0)" points="44.94971211321933,459.2502878867807 317.18387834028135,187.0161216597187" fill="none" stroke="red" stroke-width="5.6000000000000005"/></g><g><polyline data-points="9.899424226438619,9.899424226438619 10,10" data-type="line" data-label="conn1 (z=0)" points="317.18387834028135,187.0161216597187 320,184.20000000000005" fill="none" stroke="red" stroke-width="5.6000000000000005"/></g><g><polyline data-points="10,10 20,10" data-type="line" data-label="conn1 (z=1)" points="320,184.20000000000005 600,184.20000000000005" fill="none" stroke="blue" stroke-width="5.6000000000000005"/></g><g><polyline data-points="20,10 20,10" data-type="line" data-label="conn1 (z=1)" points="600,184.20000000000005 600,184.20000000000005" fill="none" stroke="blue" stroke-width="5.6000000000000005"/></g><g><polyline data-points="0,0.1 0.09999999999999964,0.1" data-type="line" data-label="conn2 (z=0)" points="40,461.40000000000003 42.79999999999999,461.40000000000003" fill="none" stroke="red" stroke-width="5.6000000000000005"/></g><g><polyline data-points="0.09999999999999964,0.1 10.094354610183965,10.094354610183965" data-type="line" data-label="conn2 (z=0)" points="42.79999999999999,461.40000000000003 322.641929085151,181.55807091484905" fill="none" stroke="red" stroke-width="5.6000000000000005"/></g><g><polyline data-points="10.094354610183965,10.094354610183965 10,10" data-type="line" data-label="conn2 (z=0)" points="322.641929085151,181.55807091484905 320,184.20000000000005" fill="none" stroke="red" stroke-width="5.6000000000000005"/></g><g><polyline data-points="10,10 19.9,10" data-type="line" data-label="conn2 (z=1)" points="320,184.20000000000005 597.1999999999999,184.20000000000005" fill="none" stroke="blue" stroke-width="5.6000000000000005"/></g><g><polyline data-points="19.9,10 20,10.1" data-type="line" data-label="conn2 (z=1)" points="597.1999999999999,184.20000000000005 600,181.40000000000003" fill="none" stroke="blue" stroke-width="5.6000000000000005"/></g><circle data-type="circle" data-label="" data-x="10" data-y="10" cx="320" cy="184.20000000000005" r="8.4" fill="rgba(255, 0, 255, 0.5)" stroke="black" stroke-width="0.03571428571428571"/><circle data-type="circle" data-label="" data-x="10" data-y="10" cx="320" cy="184.20000000000005" r="8.4" fill="rgba(255, 0, 255, 0.5)" stroke="black" stroke-width="0.03571428571428571"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":28,"c":0,"e":40,"b":0,"d":-28,"f":464.20000000000005};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>