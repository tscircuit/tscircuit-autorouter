99,330.4458136382868 600,333.76965029545676" fill="none" stroke="green" stroke-linejoin="round" stroke-width="6.481481481481481"/></g><g><rect data-type="rect" data-label="Physical through barrel: before:start step:0 layer:all" data-x="2" data-y="2" x="40" y="204.14002066582714" width="259.25925925925924" height="259.25925925925924" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.01542857142857143"/></g><g><rect data-type="rect" data-label="" data-x="2" data-y="2" x="40" y="204.14002066582714" width="259.25925925925924" height="259.25925925925924" fill="none" stroke="gray" stroke-width="0.01542857142857143"/></g><g><rect data-type="rect" data-label="Successful bottom route around barrel:end step:41 layer:all" data-x="6.64" data-y="2" x="340.74074074074065" y="204.14002066582714" width="259.2592592592593" height="259.25925925925924" fill="rgba(255,255,255,0)" stroke="rgba(25,25,25,0.42)" stroke-width="0.01542857142857143"/></g><g><rect data-type="rect" data-label="" data-x="6.64" data-y="2" x="340.74074074074065" y="204.14002066582714" width="259.2592592592593" height="259.25925925925924" fill="none" stroke="gray" stroke-width="0.01542857142857143"/></g><circle data-type="circle" data-label="" data-x="2" data-y="2" cx="169.62962962962962" cy="333.76965029545676" r="16.203703703703702" fill="rgba(128,0,128,0.25)" stroke="purple" stroke-width="0.01542857142857143"/><circle data-type="circle" data-label="" data-x="6.64" data-y="2" cx="470.3703703703703" cy="333.76965029545676" r="16.203703703703702" fill="rgba(128,0,128,0.25)" stroke="purple" stroke-width="0.01542857142857143"/><text data-type="text" data-label="Physical through barrel: before:start" data-x="0" data-y="4.424892066259808" x="40" y="176.60072007491362" fill="rgb(18,18,18)" font-size="11.301624204850011" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Physical through barrel: before:start</text><text data-type="text" data-label="step:0" data-x="1.135135135135135" data-y="4.2296" x="113.57357357357357" y="189.2585391843457" fill="rgb(190,92,12)" font-size="11.301624204850011" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:0</text><text data-type="text" data-label=" layer:all" data-x="1.7837837837837838" data-y="4.2296" x="155.6156156156156" y="189.2585391843457" fill="rgb(120,58,175)" font-size="11.301624204850011" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><text data-type="text" data-label="Successful bottom route around barrel:end" data-x="4.64" data-y="4.405839181746655" x="340.7407407407407" y="177.83562925632168" fill="rgb(18,18,18)" font-size="10.19902672145001" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Successful bottom route around barrel:end</text><text data-type="text" data-label="step:41" data-x="5.810731707317073" data-y="4.2296" x="416.62149954832876" y="189.2585391843457" fill="rgb(190,92,12)" font-size="10.19902672145001" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">step:41</text><text data-type="text" data-label=" layer:all" data-x="6.493658536585365" data-y="4.2296" x="460.8852755194218" y="189.2585391843457" fill="rgb(120,58,175)" font-size="10.19902672145001" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge"> layer:all</text><g><circle data-type="point" data-label="new-bottom" data-x="0" data-y="2" cx="40" cy="333.76965029545676" r="3" fill="green"/></g><g><circle data-type="point" data-label="new-bottom" data-x="4" data-y="2" cx="299.25925925925924" cy="333.76965029545676" r="3" fill="green"/></g><g><circle data-type="point" data-label="new-bottom" data-x="4.64" data-y="2" cx="340.7407407407407" cy="333.76965029545676" r="3" fill="green"/></g><g><circle data-type="point" data-label="new-bottom" data-x="8.64" data-y="2" cx="600" cy="333.76965029545676" r="3" fill="green"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":64.81481481481481,"c":0,"e":40,"b":0,"d":-64.81481481481481,"f":463.3992799250864};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>