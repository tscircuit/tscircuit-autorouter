7273 541.6395816187012,134.93360993970464 541.6395816187012,134.86088768784884 541.6395816187012,134.92261608291074 541.6395816187012,134.87463308363294 541.6395816187012,134.88697386879312 541.6395816187012,134.77873330283455 542.7689380008436,135.17497938408133 534.5567975936596,135.2449553976071 534.5567975936596,135.30668379267127 524.467222575018,135.7627248084509 524.467222575018,135.70099641338948 524.467222575018,135.67013221570141 524.467222575018,135.6595226478048 507.5387902638354,89.43751703981661 507.5288784341551,89.43751703981661 507.50761604660784,89.43751703981661 507.4735446040452,89.43751703981661 509.3715819768727,89.38283950617279 509.82827123045433,89.38283950617279 509.8690730315665,89.38283950617279 509.79032122409546,89.38283950617279 510.67724764210425,89.38283950617279 511.6977544972706,89.38283950617279 524.135802469136,89.38271604938245 521.4197530864199,89.38271604938245" fill="none" stroke="rgba(0,0,255,0.5)" stroke-linejoin="round" stroke-width="12.345679012345691" stroke-dasharray="0.2 0.2"/></g><g><rect data-type="rect" data-label="rvboy-viewport" data-x="6.672499999999999" data-y="16.062" x="407.7160493827159" y="40" width="184.56790123456824" height="520" fill="none" stroke="none" stroke-width="0.008099999999999993"/></g><circle data-type="circle" data-label="" data-x="6.562482808456671" data-y="14.572769409050897" cx="486.4176306736631" cy="483.85562851223517" r="27.777777777777803" fill="blue" stroke="none" stroke-width="0.008099999999999993"/><circle data-type="circle" data-label="" data-x="6.5131082593112" data-y="15.491021562545916" cx="480.3220073223705" cy="370.49116511778834" r="27.777777777777803" fill="blue" stroke="none" stroke-width="0.008099999999999993"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":123.4567901234569,"c":0,"e":-323.76543209876604,"b":0,"d":-123.4567901234569,"f":2282.962962962965};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg></svg>