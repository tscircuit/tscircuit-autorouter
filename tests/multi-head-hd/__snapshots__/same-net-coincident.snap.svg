<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="4,4 6,4 6,6 4,6 4,4" data-type="line" data-label="" points="40,600 600,600 600,40 40,40 40,600" fill="none" stroke="gray" stroke-linejoin="round" stroke-width="1px"/></g><g><polyline data-points="4,4 4.5,4.125" data-type="line" data-label="A segment (z=0)" points="40,600 180,565" fill="none" stroke="hsl(90, 100%, 50%)" stroke-linejoin="round" stroke-width="42"/></g><g><polyline data-points="4.5,4.125 5,4.125" data-type="line" data-label="A segment (z=0)" points="180,565 320,565" fill="none" stroke="hsl(90, 100%, 50%)" stroke-linejoin="round" stroke-width="42"/></g><g><polyline data-points="5,4.125 5.5,4.125" data-type="line" data-label="A segment (z=0)" points="320,565 460,565" fill="none" stroke="hsl(90, 100%, 50%)" stroke-linejoin="round" stroke-width="42"/></g><g><polyline data-points="5.5,4.125 6,4" data-type="line" data-label="A segment (z=0)" points="460,565 600,600" fill="none" stroke="hsl(90, 100%, 50%)" stroke-linejoin="round" stroke-width="42"/></g><g><polyline data-points="4,4 4.5,4.125" data-type="line" data-label="B segment (z=0)" points="40,600 180,565" fill="none" stroke="hsl(270, 100%, 50%)" stroke-linejoin="round" stroke-width="42"/></g><g><polyline data-points="4.5,4.125 5,4.125" data-type="line" data-label="B segment (z=0)" points="180,565 320,565" fill="none" stroke="hsl(270, 100%, 50%)" stroke-linejoin="round" stroke-width="42"/></g><g><polyline data-points="5,4.125 5.5,4.125" data-type="line" data-label="B segment (z=0)" points="320,565 460,565" fill="none" stroke="hsl(270, 100%, 50%)" stroke-linejoin="round" stroke-width="42"/></g><g><polyline data-points="5.5,4.125 6,4" data-type="line" data-label="B segment (z=0)" points="460,565 600,600" fill="none" stroke="hsl(270, 100%, 50%)" stroke-linejoin="round" stroke-width="42"/></g><circle data-type="circle" data-label="" data-x="4.5" data-y="4.125" cx="180" cy="565" r="0.068359375" fill="hsl(90, 100%, 50%)" stroke="black" stroke-width="0.0035714285714285713"/><circle data-type="circle" data-label="" data-x="5" data-y="4.125" cx="320" cy="565" r="0.068359375" fill="hsl(90, 100%, 50%)" stroke="black" stroke-width="0.0035714285714285713"/><circle data-type="circle" data-label="" data-x="5.5" data-y="4.125" cx="460" cy="565" r="0.068359375" fill="hsl(90, 100%, 50%)" stroke="black" stroke-width="0.0035714285714285713"/><circle data-type="circle" data-label="" data-x="4.5" data-y="4.125" cx="180" cy="565" r="0.068359375" fill="hsl(270, 100%, 50%)" stroke="black" stroke-width="0.0035714285714285713"/><circle data-type="circle" data-label="" data-x="5" data-y="4.125" cx="320" cy="565" r="0.068359375" fill="hsl(270, 100%, 50%)" stroke="black" stroke-width="0.0035714285714285713"/><circle data-type="circle" data-label="" data-x="5.5" data-y="4.125" cx="460" cy="565" r="0.068359375" fill="hsl(270, 100%, 50%)" stroke="black" stroke-width="0.0035714285714285713"/><g><circle data-type="point" data-label="A (Port z=0)" data-x="4" data-y="4" cx="40" cy="600" r="3" fill="hsl(90, 100%, 50%)"/></g><g><circle data-type="point" data-label="A (Port z=0)" data-x="6" data-y="4" cx="600" cy="600" r="3" fill="hsl(90, 100%, 50%)"/></g><g><circle data-type="point" data-label="B (Port z=0)" data-x="4" data-y="4" cx="40" cy="600" r="3" fill="hsl(270, 100%, 50%)"/></g><g><circle data-type="point" data-label="B (Port z=0)" data-x="6" data-y="4" cx="600" cy="600" r="3" fill="hsl(270, 100%, 50%)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":280,"c":0,"e":-1080,"b":0,"d":-280,"f":1720};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>