name: Validate endpoint copper-layer connectivity on all six boards and dataset18
on:
  push:
    branches: [codex/drc-endpoint-check]
permissions:
  contents: read
jobs:
  boards:
    strategy:
      fail-fast: false
      matrix:
        board: [orangecrab, h616, butterstick, glider, imx6, icepi]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c38befed91f3ee10f9103d32fbe460f830e60026
          path: router
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/core
          ref: 0ce5c61dbe004e8ce368cf491efd856870ba5aa4
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pinned sources and build the selected runtime
        run: |
          for folder in router core; do (cd "$folder" && bun install --ignore-scripts); done
          (cd router && bun build lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts --target bun --packages external --outfile benchmark-runtime/pipeline9.js)
          cd experiments/full-board-priority-analysis
          bun install --frozen-lockfile --ignore-scripts
          bun build-core.ts ../../core
      - name: Reroute the original DDR control and both full-board modes
        env:
          BOARD_ID: ${{ matrix.board }}
          FULL_BOARD_CASE_IDS: ${{ matrix.board }}
          FULL_BOARD_CAPTURE_STAGE_INPUTS: "1"
        working-directory: experiments/full-board-priority-analysis
        run: |
          export FULL_BOARD_CORE_SOURCE="$GITHUB_WORKSPACE/core"
          export FULL_BOARD_ROUTER_MODULE="$GITHUB_WORKSPACE/router/benchmark-runtime/pipeline9.js"
          export FULL_BOARD_ROUTER_COMMIT="$(git -C ../../router rev-parse HEAD)"
          BUN_OPTIONS="--preload=$PWD/select-ddr-router.mjs" bun "$GITHUB_WORKSPACE/core/node_modules/@tscircuit/core-ddr-benchmark/scripts/run.ts" \
            --core "$GITHUB_WORKSPACE/core" --circuit "$BOARD_ID" \
            --out "$GITHUB_WORKSPACE/results/final/ddr" --timeout 600 || { cat "$GITHUB_WORKSPACE/results/final/ddr/$BOARD_ID/"*.log; exit 1; }
          FULL_BOARD_VARIANT=final bun plane-suite.ts ../../results/final/full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-layers-${{ matrix.board }}
          path: results
          retention-days: 14
      - name: Export native results and phase inputs for analysis
        if: always()
        run: |
          python3 - <<'PY'
          import base64,io,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          names={'environment.json','summary.json','progress.json','assessment.json','diagnostics.json','process.json','results.json','pcb.svg'}
          with zipfile.ZipFile(stream,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in Path('results').rglob('*'):
                  if path.is_file() and (path.name in names or path.name.endswith('.srj.json') or path.name.endswith('.capture.json.gz')):
                      archive.writestr(str(path.relative_to('results')),path.read_bytes())
          print('ENDPOINT_LAYERS_BOARD_EVIDENCE_BEGIN')
          encoded=base64.b64encode(stream.getvalue()).decode()
          for offset in range(0,len(encoded),8000): print(encoded[offset:offset+8000])
          print('ENDPOINT_LAYERS_BOARD_EVIDENCE_END')
          PY
  dataset18:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5059c7e768ed23ba29eea7271423a778d7f1027
          path: base
      - uses: actions/checkout@v4
        with:
          ref: c38befed91f3ee10f9103d32fbe460f830e60026
          path: fixed
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install identical dependencies for the paired comparison
        run: |
          (cd base && bun install --ignore-scripts)
          cmp base/package.json fixed/package.json
          ln -s ../base/node_modules fixed/node_modules
      - name: Compare the complete dataset18 on the same runner
        env:
          BENCHMARK_TASK_TIMEOUT_PER_EFFORT_MS: '240000'
        run: |
          for variant in base fixed; do
            (cd "$variant" && bash benchmark.sh --pipeline 9 --dataset 18 --concurrency 2 --sample-timeout 240s)
            mkdir -p "results/$variant"
            cp "$variant/benchmark-result.json" "$variant/benchmark-result.txt" "$variant/benchmark-snapshots.html" "results/$variant/"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-layers-paired-dataset18
          path: results
          retention-days: 14
      - name: Export the complete measured reports
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('results').rglob('benchmark-result.json'):
              print('ENDPOINT_PAIRED_DATASET18_RESULT',path.parent.name,json.dumps(json.loads(path.read_text()),separators=(',',':')))
          PY
      - name: Compare all native PCB SVGs
        if: always()
        run: |
          python3 - <<'PYSVG'
          import hashlib,json,re
          from pathlib import Path
          hashes={}
          for variant in ['base','fixed']:
              html=Path(f'results/{variant}/benchmark-snapshots.html').read_text()
              hashes[variant]={}
              for card in re.findall(r'<section class="snapshot">(.*?)</section>',html,re.S):
                  sample=int(re.search(r'<dt>Sample</dt><dd>(\d+)</dd>',card).group(1))
                  svg=re.search(r'<svg\b.*?</svg>',card,re.S).group(0)
                  hashes[variant][sample]=hashlib.sha256(svg.encode()).hexdigest()
              assert len(hashes[variant])==16
          print('ENDPOINT_PAIRED_SVG_EQUIVALENCE',json.dumps({'hashes':hashes,'equal':{s:hashes['base'][s]==hashes['fixed'][s] for s in hashes['base']}},sort_keys=True))
          PYSVG
